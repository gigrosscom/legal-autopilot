# Production stack for a single Linux server (Yandex Cloud / PS Cloud / any Ubuntu VM).
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d --build
# Caddy terminates HTTPS (Let's Encrypt) for SITE_DOMAIN, www.SITE_DOMAIN and API_DOMAIN.
name: konsilier

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    # The directory (not the single file) is mounted so `git reset` updates are visible; update.sh reloads Caddy.
    command: caddy run --config /etc/caddy/conf/Caddyfile --adapter caddyfile
    volumes:
      - ./:/etc/caddy/conf:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api, api2]

  # Two copies of the API behind Caddy, so a deploy or an .env change never cuts a chat answer (owner saw «Вы име…»):
  # deploy/update.sh restarts them one at a time and waits until the restarted one is healthy before the next.
  # Caddy (Caddyfile) sends requests to `api` and switches to `api2` while `api` is down. A stopped copy gets SIGTERM,
  # stops accepting connections and finishes the answers it is streaming (up to UVICORN_GRACE seconds; Docker waits
  # stop_grace_period before a SIGKILL). Only `api` runs the scheduler (reminders, crawls, corpus jobs).
  api: &api
    build: {context: .., dockerfile: apps/api/Dockerfile}
    restart: unless-stopped
    env_file: ../.env
    environment: &api_env
      PACKS_DIR: /app/packs
      STORAGE_LOCAL_DIR: /data/files
      CORS_ORIGINS: https://${SITE_DOMAIN},https://www.${SITE_DOMAIN}
      PUBLIC_API_URL: https://${API_DOMAIN}
      PUBLIC_SITE_URL: https://${SITE_DOMAIN}
      NCANODE_URL: http://ncanode:14579
      UVICORN_GRACE: "50"
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s  # alembic upgrade and the first imports
    volumes: [api_data:/data]

  api2:
    <<: *api
    environment:
      <<: *api_env
      # the scheduler tick runs in `api` only (it also holds a PostgreSQL lock: konsilier/core/deadlines.py)
      SCHEDULER_INTERVAL_SECONDS: "0"
    # on a first start both would run `alembic upgrade` at once: api2 waits until api has migrated and is healthy
    depends_on:
      api: {condition: service_healthy}

  # ЭЦП verification (certificate chain to the national root CAs + OCSP). Internal only, no public port.
  ncanode:
    image: malikzh/ncanode:3.5.0
    restart: unless-stopped
    mem_limit: 1g

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
        NEXT_PUBLIC_TELEGRAM_BOT: ${TELEGRAM_BOT_USERNAME:-}
    restart: unless-stopped
    environment:
      # /.well-known/assetlinks.json for the Google Play app (docs/app-stores.md); empty → nothing is claimed
      ANDROID_PACKAGE: ${ANDROID_PACKAGE:-com.konsilier.app}
      ANDROID_CERT_SHA256: ${ANDROID_CERT_SHA256:-}

  bot:
    build: {context: .., dockerfile: apps/bot/Dockerfile}
    restart: unless-stopped
    env_file: ../.env
    environment:
      API_URL: http://api:8000
    depends_on: [api]

  # Only when there is no managed PostgreSQL: COMPOSE_PROFILES=localdb and
  # DATABASE_URL=postgresql+psycopg://konsilier:<password>@postgres:5432/konsilier
  postgres:
    image: postgres:16-alpine
    profiles: [localdb]
    restart: unless-stopped
    environment:
      POSTGRES_USER: konsilier
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-change-me}
      POSTGRES_DB: konsilier
    volumes: [pgdata:/var/lib/postgresql/data]

volumes:
  caddy_data:
  caddy_config:
  api_data:
  pgdata:
