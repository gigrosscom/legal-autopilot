# Production stack for a single Linux server (Yandex Cloud / PS Cloud / any Ubuntu VM).
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d --build
# Caddy terminates HTTPS (Let's Encrypt) for SITE_DOMAIN, www.SITE_DOMAIN and API_DOMAIN.
name: konsilier

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    # The directory (not the single file) is mounted so `git reset` updates are visible; update.sh reloads Caddy.
    command: caddy run --config /etc/caddy/conf/Caddyfile --adapter caddyfile
    volumes:
      - ./:/etc/caddy/conf:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]

  api:
    build: {context: .., dockerfile: apps/api/Dockerfile}
    restart: unless-stopped
    env_file: ../.env
    environment:
      PACKS_DIR: /app/packs
      STORAGE_LOCAL_DIR: /data/files
      CORS_ORIGINS: https://${SITE_DOMAIN},https://www.${SITE_DOMAIN}
      PUBLIC_API_URL: https://${API_DOMAIN}
      PUBLIC_SITE_URL: https://${SITE_DOMAIN}
      NCANODE_URL: http://ncanode:14579
      # Court practice through a real browser (court-browser below, owner 02–03.10.2026); empty → plain HTTP
      ZANN_COURT_BROWSER_URL: http://court-browser:8090
    volumes: [api_data:/data]

  # A real Chromium for the court-practice collector (konsilier/zann/court.py): opens the open pages of sud.kz /
  # sud.gov.kz one at a time (5–10 s apart, never faster than robots.txt Crawl-delay), never solves a captcha or a
  # challenge (reports blocked(captcha) and stops). Not disguised: Chromium's own User-Agent + our name and contact.
  # Internal only, no public port.
  court-browser:
    build: {context: court-browser}
    restart: unless-stopped
    mem_limit: 1g
    shm_size: 256m
    environment:
      COURT_BROWSER_HOSTS: sud.kz,www.sud.kz,sud.gov.kz

  # ЭЦП verification (certificate chain to the national root CAs + OCSP). Internal only, no public port.
  ncanode:
    image: malikzh/ncanode:3.5.0
    restart: unless-stopped
    # The CRL of «НУЦ РК (ГОСТ) 2022» is ~20 MB; NCANode parses it on every check. With 1g the JVM got a 256 MB heap
    # (25% by default) and failed with OutOfMemoryError → HTTP 500 → «verifier_unavailable» on ЭЦП sign-in (02.10).
    # 2g and 75% for the heap (~1.5 GB) fit it; it settles at ~1.3 GB. The VM has 8 GB, ~2 GB in use.
    mem_limit: 2g
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      # The CAs NCANode trusts (downloaded at start). Its built-in list lacks «ҰЛТТЫҚ КУӘЛАНДЫРУШЫ ОРТАЛЫҚ (RSA) 2022»,
      # the CA of every RSA key issued since 2022 — such keys failed with «Подпись не прошла проверку» (01.10).
      # This is the current list from pki.gov.kz/cert («Корневые сертификаты»); the old nca_rsa/nca_gost
      # intermediates expired on 25.06.2025 and are dropped (a dead link here would stop NCANode at start).
      NCANODE_CA_URL: >-
        http://pki.gov.kz/cert/nca_rsa_2022.cer http://pki.gov.kz/cert/nca_gost_2022.cer
        http://pki.gov.kz/cert/root_gost_2022.cer http://root.gov.kz/cert/root_rsa_2020.cer
        http://root.gov.kz/cert/root_gost_2020.cer

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
        NEXT_PUBLIC_TELEGRAM_BOT: ${TELEGRAM_BOT_USERNAME:-}
    restart: unless-stopped
    environment:
      # /.well-known/assetlinks.json for the Google Play app (docs/app-stores.md); empty → nothing is claimed
      ANDROID_PACKAGE: ${ANDROID_PACKAGE:-com.konsilier.app}
      ANDROID_CERT_SHA256: ${ANDROID_CERT_SHA256:-}

  bot:
    build: {context: .., dockerfile: apps/bot/Dockerfile}
    restart: unless-stopped
    env_file: ../.env
    environment:
      API_URL: http://api:8000
    depends_on: [api]

  # Only when there is no managed PostgreSQL: COMPOSE_PROFILES=localdb and
  # DATABASE_URL=postgresql+psycopg://konsilier:<password>@postgres:5432/konsilier
  postgres:
    image: postgres:16-alpine
    profiles: [localdb]
    restart: unless-stopped
    environment:
      POSTGRES_USER: konsilier
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-change-me}
      POSTGRES_DB: konsilier
    volumes: [pgdata:/var/lib/postgresql/data]

volumes:
  caddy_data:
  caddy_config:
  api_data:
  pgdata:
