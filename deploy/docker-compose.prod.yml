# Production stack for a single Linux server (Yandex Cloud / PS Cloud / any Ubuntu VM).
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d --build
# Caddy terminates HTTPS (Let's Encrypt) for SITE_DOMAIN, www.SITE_DOMAIN and API_DOMAIN.
name: konsilier

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    # The directory (not the single file) is mounted so `git reset` updates are visible; update.sh reloads Caddy.
    command: caddy run --config /etc/caddy/conf/Caddyfile --adapter caddyfile
    volumes:
      - ./:/etc/caddy/conf:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]

  api:
    build: {context: .., dockerfile: apps/api/Dockerfile}
    restart: unless-stopped
    env_file: ../.env
    environment:
      PACKS_DIR: /app/packs
      STORAGE_LOCAL_DIR: /data/files
      CORS_ORIGINS: https://${SITE_DOMAIN},https://www.${SITE_DOMAIN}
      PUBLIC_API_URL: https://${API_DOMAIN}
      PUBLIC_SITE_URL: https://${SITE_DOMAIN}
      NCANODE_URL: http://ncanode:14579
    volumes: [api_data:/data]

  # ЭЦП verification (certificate chain to the national root CAs + OCSP). Internal only, no public port.
  ncanode:
    image: malikzh/ncanode:3.5.0
    restart: unless-stopped
    mem_limit: 1g

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
        NEXT_PUBLIC_TELEGRAM_BOT: ${TELEGRAM_BOT_USERNAME:-}
    restart: unless-stopped
    environment:
      # /.well-known/assetlinks.json for the Google Play app (docs/app-stores.md); empty → nothing is claimed
      ANDROID_PACKAGE: ${ANDROID_PACKAGE:-com.konsilier.app}
      ANDROID_CERT_SHA256: ${ANDROID_CERT_SHA256:-}

  bot:
    build: {context: .., dockerfile: apps/bot/Dockerfile}
    restart: unless-stopped
    env_file: ../.env
    environment:
      API_URL: http://api:8000
    depends_on: [api]

  # WhatsApp bot (team/integrations/whatsapp.md): the bot image, its webhook server on :8080. Caddy passes only
  # https://API_DOMAIN/whatsapp/webhook to it; /whatsapp/notify is for the API inside this network. Off (404) until
  # WHATSAPP_TOKEN, WHATSAPP_PHONE_ID, WHATSAPP_APP_SECRET and WHATSAPP_VERIFY_TOKEN are all set in .env.
  whatsapp:
    build: {context: .., dockerfile: apps/bot/Dockerfile}
    restart: unless-stopped
    env_file: ../.env
    command: ["python", "-m", "konsilier_bot.whatsapp"]
    environment:
      API_URL: http://api:8000
      PUBLIC_SITE_URL: https://${SITE_DOMAIN}
    depends_on: [api]

  # Only when there is no managed PostgreSQL: COMPOSE_PROFILES=localdb and
  # DATABASE_URL=postgresql+psycopg://konsilier:<password>@postgres:5432/konsilier
  postgres:
    image: postgres:16-alpine
    profiles: [localdb]
    restart: unless-stopped
    environment:
      POSTGRES_USER: konsilier
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-change-me}
      POSTGRES_DB: konsilier
    volumes: [pgdata:/var/lib/postgresql/data]

volumes:
  caddy_data:
  caddy_config:
  api_data:
  pgdata:
