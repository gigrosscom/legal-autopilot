[project]
name = "konsilier-bot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["aiogram>=3.10", "aiohttp>=3.9", "httpx>=0.27", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["konsilier_bot*"]

[tool.setuptools.package-data]
konsilier_bot = ["locales/*.yaml"]
