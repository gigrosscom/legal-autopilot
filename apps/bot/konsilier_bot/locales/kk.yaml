start: |
  Сәлеметсіз бе! Мен Konsiliér AI-мын — құқықтық мәселені дайын құжатқа айналдыруға көмектесемін, оны қайда беру керегін айтамын және мерзімдерді қадағалаймын.

  Қазақстандағы 21 типтік жағдайды талдаймын: тауар мен қызмет үшін ақшаны қайтару, несие және алаяқтық, жұмыс және жалақы, тұрғын үй, алимент, айыппұл. Жағдайыңыз тізімде болмаса да, сипаттап беріңіз — не істеу керегін айтамын.

  Не болғанын бір хабарламамен сипаттаңыз: не болды, кіммен, қашан және қанша сомаға.

  Konsiliér AI — құқықтық мәселелер бойынша ЖИ-көмекші. Сипаттаманы жіберу арқылы сіз пайдаланушы келісімін қабылдайсыз: https://konsilier.com/terms
  Сұрақтар мен шағымдар: https://konsilier.com/support · барлық командалар — /help
help: |
  Мен не істей аламын:
  — жағдайыңызды талдап, нақтылау сұрақтарын қоямын;
  — Қазақстан заңдары бойынша құжат дайындаймын: наразылық, шағым немесе өтініш;
  — оны қайда және қалай беру керегін айтамын, жауап мерзімін еске саламын;
  — қажет болса, келесі қадамға немесе заңгерге өтуге көмектесемін.

  Қазір 21 типтік жағдайға дайын жол бар: тауар мен қызмет үшін ақшаны қайтару, несие және алаяқтық, жұмыс және жалақы, тұрғын үй, алимент, айыппұл. Басқа жағдайларды да сипаттаңыз — не істеу керегін айтамын.

  Командалар:
  /new — жаңа іс бастау
  /status — ағымдағы істің күйі
  /invite — досты шақыру (екеуіне бір құжаттан тегін)
  /help — осы анықтама

  Бізге жазу (сұрақ, шағым, ұсыныс): https://konsilier.com/support немесе info@konsilier.com

  Konsiliér AI — құқықтық мәселелер бойынша ЖИ-көмекші, адвокат немесе заң фирмасы емес.
