  short: "Юридическая проблема → готовый документ, куда подать и контроль сроков. Казахстан."
  description: |
    Konsilier.AI превращает юридическую проблему в готовый документ: претензию, заявление или жалобу. Подскажет, куда подать, напомнит о сроках ответа и поможет с эскалацией.

    Сейчас: возврат денег за товар или услугу и кредит/займ, оформленный мошенниками (Казахстан).

    Нажмите «Старт» и опишите, что случилось.
