start: |
  Здравствуйте! Я Konsilier — помогаю превратить юридическую проблему в готовый документ, подсказываю, куда его подать, и слежу за сроками.

  Сейчас умею: возврат денег за товар или услугу и кредит/займ, оформленный мошенниками.

  Опишите одним сообщением, что случилось: что, у кого, когда и на какую сумму.
