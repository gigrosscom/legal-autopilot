start: |
  Здравствуйте! Я Konsiliér AI — помогаю превратить юридическую проблему в готовый документ, подсказываю, куда его подать, и слежу за сроками.

  Разбираю 20 типовых ситуаций в Казахстане: возвраты за товары и услуги, кредиты и мошенничество, работа и зарплата, жильё, алименты, штрафы. Если вашей ситуации нет в списке — всё равно опишите её, подскажу, что делать.

  Опишите одним сообщением, что случилось: что, у кого, когда и на какую сумму.

  Konsiliér AI — ИИ-помощник по юридическим вопросам. Отправляя описание, вы принимаете пользовательское соглашение: https://konsilier.com/terms
  Вопросы и жалобы: https://konsilier.com/support · все команды — /help
help: |
  Что я умею:
  — разбираю вашу ситуацию и задаю уточняющие вопросы;
  — готовлю документ: претензию, жалобу или заявление по законам Казахстана;
  — подсказываю, куда и как его подать, и напоминаю о сроке ответа;
  — если нужно, помогаю перейти к следующему шагу или к юристу.

  Сейчас есть готовые пути для 20 типовых ситуаций: возвраты за товары и услуги, кредиты и мошенничество, работа и зарплата, жильё, алименты, штрафы. Другие ситуации тоже опишите — подскажу, что делать.

  Команды:
  /new — начать новое дело
  /status — статус текущего дела
  /help — эта справка

  Написать нам (вопрос, жалоба, предложение): https://konsilier.com/support или info@konsilier.com

  Konsiliér AI — ИИ-помощник по юридическим вопросам, не адвокат и не юридическая фирма.
