[project]
name = "konsilier-api"
version = "0.1.0"
description = "Konsilier: global case engine + jurisdiction packs"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "docxtpl>=0.18",
  "python-docx>=1.1",
  "pypdf>=4.2",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "anthropic>=0.60",
  "apscheduler>=3.10,<4",
  "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["konsilier*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
