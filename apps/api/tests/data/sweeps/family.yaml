# Матрица прогона «семейное право» (пилот системы качества, ПМ 03.10). Каждая ветка — реальный диалог клиента.
# Юридические критерии и ожидания — ZANN; формулировки — редактор-лингвист. Прогонщик: scripts/scenario_sweep.py
domain: family
title: Семейное право — развод и раздел имущества
cases:
  - id: F1
    branch: Развод, имущество нажито в браке
    turns:
      - "Хочу развестись с мужем, мы в браке 8 лет, есть квартира, купленная в браке, и машина"
      - "Детей нет, муж против развода, квартира оформлена на него"
      - "Документов кроме свидетельства о браке нет. Составьте иск"
  - id: F2
    branch: Развод, квартира куплена до брака
    turns:
      - "Разводимся с женой, она требует половину квартиры, но квартиру я купил за два года до свадьбы"
      - "Брак зарегистрирован в 2019 году, квартира куплена в 2017, договор купли-продажи есть"
      - "Достаточно, дайте решение"
  - id: F3
    branch: Развод при брачном договоре
    turns:
      - "Разводимся, у нас брачный договор, по нему дом остаётся мне, а муж теперь оспаривает договор"
      - "Договор заверен у нотариуса в 2020 году, двое детей 5 и 9 лет живут со мной"
      - "Нет, больше документов нет. Что делать?"
  - id: F4
    branch: Развод, имущество получено в дар или по наследству
    turns:
      - "При разводе бывший муж хочет поделить дачу, которую мне подарили родители, и квартиру, которую я унаследовала"
      - "Дарение было в 2021 году, наследство в 2022, мы в браке с 2018"
      - "Составьте исковое заявление"
