# Матрица классификации «ЖКХ и аренда» (ZANN 04.10). Текст клиента → ожидаемый спор / сценарий.
# Нормы: Закон о жилищных отношениях ст. 24, 25, 51-1–51-6, 10-9; ГК ст. 277 п. 2; ЗоЗПП ст. 42-4, 42-5; ГК ОЧ ст. 917, 924.
cases:
  - {text: "Съехал с арендованной квартиры месяц назад, хозяин не возвращает депозит 150 000 тенге", expect: kz.housing.deposit_return}
  - {text: "Арендодатель удерживает залог за квартиру, говорит что за износ мебели", expect: kz.housing.deposit_return}
  - {text: "Хозяин квартиры сменил замки и выкинул мои вещи, договор аренды ещё действует", expect: housing.tenancy}
  - {text: "Арендодатель требует съехать за 3 дня, договор без срока, я плачу вовремя", expect: housing.tenancy}
  - {text: "Квартирант полгода не платит за аренду и не съезжает", expect: housing.tenancy}
  - {text: "Начислили коммуналку за трёх человек, а живу один, прошу перерасчёт", expect: kz.housing.utility_billing}
  - {text: "Счёт за отопление вырос вдвое, батареи холодные", expect: kz.housing.utility_billing}
  - {text: "КСК не отчитывается за взносы и не делает ремонт подъезда", expect: kz.housing.management_company}
  - {text: "ОСИ собирает деньги, председатель не показывает смету", expect: kz.housing.management_company}
  - {text: "Сосед сверху затопил мою квартиру, ущерб 450 000 тенге", expect: civil.damages}
  # границы
  - {text: "Управляющая компания не убирает подъезд, а сосед сверху затопил", expect: null, note: "два дела: залив (виновник) и КСК — слова не решают, модель/вопрос"}
  - {text: "Заказал ремонт квартиры у ИП, работы не сделаны", expect: null, never: [housing.tenancy, kz.housing.management_company, civil.work_payment], note: "потребитель — решает модель, но не ЖКХ и не подряд"}
