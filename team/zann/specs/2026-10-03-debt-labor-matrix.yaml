# Матрица классификации «долг / подряд / труд / потребитель» (ZANN 03.10, баг владельца «субподрядчик RAMS»).
# Для теста-классификатора (Разработчик): текст клиента → ожидаемый спор (taxonomy dispute id).
# `ask`: true — по одним словам решать нельзя, бот задаёт один вопрос (ИП/физлицо; объём работ или должность).
# Нормы: ГК ст. 152, 153; ГК ОЧ ст. 616, 621, 623, 715, 716, 722; ТК ст. 26 п. 1-1, 27, 113, 159, 160; ГПК ст. 27 ч. 1.
cases:
  # --- подряд, клиент — ИП / ТОО → экономический суд
  - {text: "Я ИП, субподрядчик. ТОО RAMS не заплатило 900 000 тенге за работы на объекте, договора нет", expect: commercial.b2b_debt}
  - {text: "Наше ТОО выполнило работы по смете, акт подписан, генподрядчик не платит третий месяц", expect: commercial.b2b_debt}
  - {text: "Как ИП сделал ремонт офиса для компании, акт выполненных работ есть, оплату не получил", expect: commercial.b2b_debt}
  # --- подряд, клиент — физлицо → районный суд
  - {text: "Работал субподрядчиком у RAMS, долг 900 000 тенге, договора нет", expect: civil.work_payment, ask: true}
  - {text: "Сделал соседу ремонт ванной, он не заплатил 300 000 тенге, договорились устно", expect: civil.work_payment}
  - {text: "Бригадой построили баню частнику, он отдал только половину денег, переписка в вотсапе есть", expect: civil.work_payment}
  - {text: "Я физлицо, сделал сайт для ТОО по договору оказания услуг, не оплатили", expect: civil.work_payment}
  # --- труд
  - {text: "Работодатель второй месяц не платит зарплату, я по трудовому договору", expect: labor.unpaid_wages}
  - {text: "Работал на стройке разнорабочим по графику, мастер давал задания, обещали 300 тысяч в месяц и не заплатили, договора нет", expect: labor.unpaid_wages, note: "должность + распорядок + ежемесячная плата — ТК ст. 27"}
  - {text: "Со мной заключили договор ГПХ, но я каждый день с 9 до 18 в офисе как менеджер, зарплату задерживают", expect: labor.unpaid_wages, note: "ТК ст. 26 п. 1-1 — договор признаётся трудовым"}
  - {text: "Меня уволили без приказа и не выплатили расчёт", expect: labor.dismissal}
  # --- личный заём
  - {text: "Дал другу в долг 500 000 тенге по расписке, не возвращает", expect: civil.debt}
  - {text: "Знакомый занял у меня деньги на карту и пропал, расписки нет, есть перевод", expect: civil.debt}
  - {text: "Одолжила сестре мужа 200 тысяч, обещала вернуть через месяц", expect: civil.debt}
  # --- потребитель (клиент — заказчик, а не исполнитель)
  - {text: "Заказал ремонт квартиры у ИП, оплатил аванс, работы не сделаны", expect: consumer.poor_service}
  - {text: "Купил холодильник, сломался через неделю, магазин отказывает", expect: consumer.refund}
  # --- границы: никогда не смешивать
  - {text: "Я субподрядчик, ТОО не платит за выполненные работы", expect: civil.work_payment, ask: true, never: [labor.unpaid_wages, civil.debt]}
  - {text: "Не платят за работу на объекте, договора нет", expect: null, ask: true, note: "ни подряд, ни труд по словам не решить — один вопрос"}
