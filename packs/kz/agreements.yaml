# Документы «клиент ↔ юрист» по делу, подписываются обеими сторонами ЭЦП (сначала клиент, затем юрист).
# TODO(lawyer): текст — шаблон платформы, юристом не проверен. Пока reviewed_at: null, в документе печатается
# пометка, что условия проверяет юрист-исполнитель перед подписанием. Ссылок на статьи нет намеренно.
# Это НЕ доверенность для суда: для представительства в суде, как правило, нужна нотариальная или иная
# удостоверенная доверенность либо ордер адвоката — порядок уточнит юрист.
reviewed_at: null
owner: lawyer:kz-01
lawyer_kinds:
  advocate: {ru: адвокат, kk: адвокат}
  legal_consultant: {ru: юридический консультант, kk: заң консультанты}
  human_rights: {ru: правозащитник, kk: құқық қорғаушы}
  other: {ru: юрист, kk: заңгер}
templates:
  consent:
    title:
      ru: Согласие на обработку персональных данных и передачу материалов дела юристу
      kk: Дербес деректерді өңдеуге және іс материалдарын заңгерге беруге келісім
    body:
      ru:
        - "Я, {customer_name} ({customer_id}), даю согласие Konsiliér AI и юристу {lawyer_name} ({lawyer_kind}) на обработку моих персональных данных и передачу юристу материалов дела № {case_ref}: описания ситуации, собранных данных, загруженных документов и подготовленных проектов."
        - "Данные используются только для оказания мне юридической помощи по этому делу и хранятся в соответствии с законодательством о персональных данных."
        - "Я могу отозвать согласие, написав об этом на платформе. Отзыв не отменяет действий, совершённых до него."
      kk:
        - "Мен, {customer_name} ({customer_id}), Konsiliér AI-ге және {lawyer_name} ({lawyer_kind}) заңгерге дербес деректерімді өңдеуге және № {case_ref} іс материалдарын: жағдай сипаттамасын, жиналған деректерді, жүктелген құжаттарды және дайындалған жобаларды заңгерге беруге келісім беремін."
        - "Деректер тек осы іс бойынша маған заң көмегін көрсету үшін пайдаланылады және дербес деректер туралы заңнамаға сәйкес сақталады."
        - "Платформада жазып, келісімді кері қайтарып ала аламын. Келісімді кері қайтарып алу одан бұрын жасалған әрекеттерді жоймайды."
  engagement:
    title:
      ru: Поручение юристу на ведение дела
      kk: Заңгерге істі жүргізуге тапсырма
    body:
      ru:
        - "Клиент {customer_name} ({customer_id}) поручает юристу {lawyer_name} ({lawyer_kind}) оказать юридическую помощь по делу № {case_ref}: {case_title}."
        - "Юрист изучает материалы дела, консультирует клиента, готовит и проверяет документы. Документы от имени клиента подаёт сам клиент либо юрист — при наличии надлежаще оформленных полномочий."
        - "Объём работ, стоимость и сроки стороны согласуют на платформе до начала работы. Оплата — только по согласованию и только за оказанную помощь."
        - "Этот документ не является доверенностью на представительство в суде или в государственных органах. Если понадобится представительство, юрист сообщит, как оформить полномочия."
        - "Юрист сохраняет конфиденциальность сведений, полученных от клиента."
      kk:
        - "Клиент {customer_name} ({customer_id}) {lawyer_name} ({lawyer_kind}) заңгерге № {case_ref} іс бойынша заң көмегін көрсетуді тапсырады: {case_title}."
        - "Заңгер іс материалдарын зерттейді, клиентке кеңес береді, құжаттарды дайындайды және тексереді. Клиент атынан құжаттарды клиенттің өзі немесе тиісті түрде ресімделген өкілеттігі болған кезде заңгер береді."
        - "Жұмыс көлемін, құнын және мерзімдерін тараптар жұмыс басталғанға дейін платформада келіседі. Төлем — тек келісім бойынша және тек көрсетілген көмек үшін."
        - "Бұл құжат сотта немесе мемлекеттік органдарда өкілдік етуге сенімхат болып табылмайды. Өкілдік қажет болса, заңгер өкілеттікті қалай ресімдеу керектігін айтады."
        - "Заңгер клиенттен алынған мәліметтердің құпиялылығын сақтайды."
footer:
  unreviewed:
    ru: "Шаблон платформы Konsiliér AI. Юристом платформы не проверен: условия проверяет юрист-исполнитель перед подписанием."
    kk: "Konsiliér AI платформасының үлгісі. Платформа заңгері тексермеген: шарттарды орындаушы заңгер қол қоймас бұрын тексереді."
  signed_with:
    ru: "Документ подписывается сторонами электронной цифровой подписью на платформе Konsiliér AI. Подписи — в файлах .cms к этому документу."
    kk: "Құжатқа тараптар Konsiliér AI платформасында электрондық цифрлық қолтаңбамен қол қояды. Қолтаңбалар — осы құжатқа қоса берілген .cms файлдарында."
