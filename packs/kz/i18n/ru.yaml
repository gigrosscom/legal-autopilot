    in_person_party: "Вручите претензию лично ({addressee}): второй экземпляр оставьте себе с отметкой о принятии — дата, ФИО и подпись сотрудника."
    whatsapp: "Отправьте PDF документа в официальный WhatsApp органа ({addressee}): {url}. Напишите, что это обращение, и сохраните переписку и ответ о регистрации."
