language_name: русский

interview:
  intro: "Понял: «{scenario}». Что дальше:\n1. Отвечаете на несколько коротких вопросов.\n2. Мы готовим документ «{first_action}» и объясняем, как и куда его подать.\n3. Следим за сроком ответа и подсказываем следующий шаг.\n\nНачнём."
  no_scenario: "Чтобы подсказать, что делать, не хватает деталей. Напишите своими словами одной-двумя фразами:\n• что купили или оформили и где (магазин, маркетплейс, банк);\n• когда и за сколько;\n• что случилось и чего хотите — вернуть деньги, обменять, отменить кредит.\n\nНапример: «Купил ноутбук в Технодоме 10 сентября за 650 000 тг, не понравился, хочу вернуть деньги».\nЕсли вопрос не про покупку или кредит — тоже опишите: подскажем, куда обращаться, или передадим юристу."
  required: "Без этого ответа документ не собрать."
  upload_or_skip: "Загрузите файл (фото или PDF) или напишите «пропустить»."
  done: "Спасибо, этого достаточно. Проверьте данные:\n{summary}\n\nМожно готовить документ."
  skip_words: [пропустить, пропуск, нет, не знаю, нету, skip]

errors:
  empty: "Ответ пустой."
  date: "Не понял дату. Напишите в формате ДД.ММ.ГГГГ, например 15.03.2026."
  date_future: "Дата не может быть в будущем."
  money: "Не понял сумму. Напишите число в тенге, например 45000."
  number: "Нужно число."
  email: "Похоже, e-mail с ошибкой."
  phone: "Нужен номер телефона, например +7 701 123 45 67."
  pattern: "Формат не подходит. БИН и ИИН — это 12 цифр."
  generic: "Не удалось разобрать ответ."

fields:
  seller_name:
    label: Продавец
    question: "Как называется продавец, магазин или маркетплейс?"
  seller_bin:
    label: БИН продавца
    question: "Знаете БИН продавца (12 цифр, обычно есть в чеке)? Если нет — напишите «пропустить»."
  seller_email:
    label: E-mail продавца
    question: "E-mail продавца для претензии, если знаете. Или «пропустить»."
  goods_description:
    label: Товар или услуга
    question: "Что именно купили или заказали?"
  purchase_date:
    label: Дата покупки
    question: "Когда была покупка или оплата? (ДД.ММ.ГГГГ)"
  amount:
    label: Сумма
    question: "Сколько вы заплатили, в тенге?"
  problem_description:
    label: Что случилось
    question: "Коротко: что пошло не так и что вы уже предпринимали?"
  applicant_name:
    label: ФИО заявителя
    question: "Ваши фамилия, имя и отчество — как в удостоверении?"
  applicant_phone:
    label: Телефон
    question: "Ваш телефон для ответа?"
  applicant_iin:
    label: ИИН
    question: "Ваш ИИН (12 цифр)."
  lender_name:
    label: Банк или МФО
    question: "В каком банке или МФО оформлен кредит/займ?"
  lender_bin:
    label: БИН кредитора
    question: "БИН банка/МФО, если знаете. Или «пропустить»."
  lender_email:
    label: E-mail кредитора
    question: "Официальный e-mail банка/МФО для обращений, если знаете. Или «пропустить»."
  contract_number:
    label: Номер договора
    question: "Номер договора займа, если известен. Или «пропустить»."
  loan_date:
    label: Дата оформления
    question: "Когда оформили займ? (ДД.ММ.ГГГГ)"
  police_report_number:
    label: Обращение в полицию
    question: "Вы уже обращались в полицию? Если да — номер или дата талона. Если нет — «пропустить»."
  respondent_name:
    label: Ответчик
    question: "Кто нарушил ваши права? Название организации или ФИО человека, должность — если это госорган."
  applicant_address:
    label: Адрес заявителя
    question: "Ваш адрес для ответа (город, улица, дом, квартира)?"
  event_date:
    label: Дата события
    question: "Когда это произошло? (ДД.ММ.ГГГГ) Если не помните точно — «пропустить»."
  desired_outcome:
    label: Чего вы хотите добиться
    question: "Чего вы хотите добиться? Например: вернуть деньги, восстановить на работе, отменить штраф."
  evidence:
    label: Доказательства
    question: "Загрузите подтверждения: фото или PDF. Можно несколько. Когда закончите или если их нет — напишите «пропустить»."

evidence:
  employment_contract: Трудовой договор или приказ о приёме
  pay_slip: Расчётный лист или выписка о зарплате
  fine_decision: Постановление о штрафе
  birth_certificate: Свидетельство о рождении ребёнка
  receipt: Чек или квитанция об оплате
  order_screenshot: Скриншот заказа
  correspondence: Переписка
  credit_report: Выписка из кредитного бюро
  loan_notice: SMS/уведомление о займе
  police_report: Талон/постановление полиции
  response: Ответ контрагента
  other: Другой документ

statuses:
  intake: Сбор информации
  qualified: Данные собраны
  action_ready: Документ готов
  submitted: Отправлено
  awaiting_response: Ждём ответ
  escalated: Эскалация
  handed_to_lawyer: У юриста
  resolved: Закрыто

responses:
  full: Требования удовлетворены полностью
  partial: Удовлетворены частично
  refusal: Отказ
  none: Нет ответа
  unclear: Непонятный ответ

proposal:
  prepare: "Следующий шаг: подготовить «{action}»."
  wait: "Ждём ответ. Когда он придёт — перешлите его сюда или отметьте, что ответа нет."
  clarify: "Не удалось однозначно понять ответ. Выберите: удовлетворили полностью, частично, отказ или ответа нет."
  close_won: "Похоже, требования удовлетворены. Закройте дело и укажите, сколько удалось вернуть."
  no_more_steps: "По сценарию дальнейших шагов нет. Можно закрыть дело с результатом."
  handoff: "Досудебные шаги исчерпаны. Предлагаем передать дело юристу."
  escalate: "Предлагаем следующий шаг: «{action}»."

notifications:
  handoff: "Дело передано юристу. Он свяжется с вами."
  approved: "Документ проверен юристом и готов к скачиванию."
  rejected: "Юрист вернул документ на доработку. Мы свяжемся с вами."

reminders:
  before: "Напоминание: срок ответа на «{action}» истекает {date} (осталось {days} дн.)."
  due_today: "Сегодня ({date}) последний день срока ответа на «{action}». Если ответа нет — отметьте это, и мы предложим следующий шаг."
  expired: "Срок ответа на «{action}» истёк {date}. Если ответа нет — отметьте «Нет ответа», и мы подготовим следующий шаг."

email:
  body: "Здравствуйте! Во вложении — обращение заявителя. Ответ просим направить заявителю по контактам, указанным в документе. Документ подготовлен с помощью ИИ-сервиса Konsilier по поручению заявителя."

llm_hints:
  response:
    full: [вернули, вернем, возврат произведен, возврат осуществлен, удовлетворить, удовлетворена, одобрен, аннулирован, списан, закрыт, признан]
    partial: [частично, часть суммы, половину]
    refusal: [отказ, отказать, отказано, не подлежит, не можем, оснований нет, отсутствуют основания, не является]

roadmap:
  intake: Сбор информации и доказательств
  intake_detail: "Отвечаете на вопросы и загружаете чеки, скриншоты, переписку."
  approval_detail: "Документ готов и проходит проверку юристом."
  ready_detail: "Документ готов — подайте его по инструкции и отметьте «Отправил»."
  waiting_detail: "Документ подан. Ждём ответ до {date}; напомним за 2 дня."
  response_detail: "Получен ответ: {response}."
  next_detail: "Следующий шаг."
  if_needed: "Понадобится, только если предыдущий шаг не даст результата."
  handoff_detail: "Если досудебные шаги исчерпаны — дело переходит к юристу, сроки по договорённости с ним."
  resolution: Решение
  resolution_detail: "Лучший вариант — если требования удовлетворят на текущем шаге."

outcomes:
  won: Требования удовлетворены
  partial: Удовлетворены частично
  lost: Не удовлетворены
  settled: Мировое соглашение
  abandoned: Дело прекращено

categories:
  consumer: Защита прав потребителей
  credit_fraud: Мошеннические кредиты
  debt_collectors: Коллекторы и долги
  labor: Трудовые споры

generic:
  action_title: "{document}: {forum}"
  handoff_title: Передача дела юристу
  instructions:
    portal: "Подайте документ через {url} (вход по ЭЦП или SMS-коду), получатель — {addressee}. Сохраните регистрационный номер."
    email: "Отправьте документ на {email} и сохраните письмо с датой отправки."
    post: "Отправьте документ заказным письмом с уведомлением о вручении ({addressee}) и сохраните квитанцию."
    in_person: "Можно подать лично ({addressee}): возьмите два экземпляра и попросите отметку о принятии на втором."
    mark_submitted: "После подачи нажмите «Я отправил(а)». Если срок ответа в данных не указан, его уточнит юрист."

routing:
  choose_forum: "Готового проверенного сценария для «{dispute}» пока нет, но мы можем подготовить документ по универсальному пути. Выберите, куда обратиться — ниже различия. Документ проверит юрист до подачи."
  choose_forum_first: "Сначала выберите, куда обратиться: варианты ниже."
  universal_intro: "Готовим документ в «{forum}» по универсальному пути: юрист проверит его до подачи. Нормы и сроки, которых нет в проверенных данных, уточнит юрист."
  handed_to_lawyer: "Этому делу нужен юрист ({reasons}). Мы сохранили ваше описание и передаём дело проверенному юристу платформы — он свяжется с вами. Если есть срок, который истекает, напишите об этом сразу."
  reasons:
    defence: "вы сторона защиты — документы защиты готовит только адвокат"
    lawyer_only: "такие дела ведут только юристы"
    children: "затронуты интересы детей"
    low_confidence: "ситуацию нужно уточнить"
    high_amount: "крупная сумма"
    no_forum: "в наших данных нет подходящего органа"
    urgent_deadline: "срок скоро истекает"

safety:
  facts_not_labels: "Пожалуйста, опишите факты, а не оценки: что именно произошло, где и когда, кто это видел. Слова вроде «вор» или «мошенник» оценку оставьте следствию — так заявление сильнее и безопаснее для вас."
  emergency: "Если сейчас есть угроза жизни или здоровью — сначала позвоните в экстренные службы. Мы поможем с документами потом."
  hold: "Дело передано на ручную проверку: так мы защищаем людей от преследования и ложных обвинений. Мы свяжемся с вами."
  ack:
    special_category: "В этом деле могут быть особые личные данные (здоровье, религия, судимость). Мы храним минимум и используем их только для вашего документа. Подтвердите согласие на обработку, чтобы продолжить."
