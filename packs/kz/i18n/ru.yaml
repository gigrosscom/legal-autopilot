language_name: русский

interview:
  intro: "Похоже, это сценарий «{scenario}». Задам несколько коротких вопросов — по одному."
  no_scenario: "Пока не понял, что случилось. Опишите ситуацию подробнее: что купили или оформили, у кого, когда и на какую сумму. Если это не про возврат денег за товар/услугу и не про кредит, оформленный мошенниками, — мы передадим обращение на проверку."
  required: "Без этого ответа документ не собрать."
  upload_or_skip: "Загрузите файл (фото или PDF) или напишите «пропустить»."
  done: "Спасибо, этого достаточно. Проверьте данные:\n{summary}\n\nМожно готовить документ."
  skip_words: [пропустить, пропуск, нет, не знаю, нету, skip]

errors:
  empty: "Ответ пустой."
  date: "Не понял дату. Напишите в формате ДД.ММ.ГГГГ, например 15.03.2026."
  date_future: "Дата не может быть в будущем."
  money: "Не понял сумму. Напишите число в тенге, например 45000."
  number: "Нужно число."
  email: "Похоже, e-mail с ошибкой."
  phone: "Нужен номер телефона, например +7 701 123 45 67."
  pattern: "Формат не подходит. БИН и ИИН — это 12 цифр."
  generic: "Не удалось разобрать ответ."

fields:
  seller_name:
    label: Продавец
    question: "Как называется продавец, магазин или маркетплейс?"
  seller_bin:
    label: БИН продавца
    question: "Знаете БИН продавца (12 цифр, обычно есть в чеке)? Если нет — напишите «пропустить»."
  seller_email:
    label: E-mail продавца
    question: "E-mail продавца для претензии, если знаете. Или «пропустить»."
  goods_description:
    label: Товар или услуга
    question: "Что именно купили или заказали?"
  purchase_date:
    label: Дата покупки
    question: "Когда была покупка или оплата? (ДД.ММ.ГГГГ)"
  amount:
    label: Сумма
    question: "Сколько вы заплатили, в тенге?"
  problem_description:
    label: Что случилось
    question: "Коротко: что пошло не так и что вы уже предпринимали?"
  applicant_name:
    label: ФИО заявителя
    question: "Ваши фамилия, имя и отчество — как в удостоверении?"
  applicant_phone:
    label: Телефон
    question: "Ваш телефон для ответа?"
  applicant_iin:
    label: ИИН
    question: "Ваш ИИН (12 цифр)."
  lender_name:
    label: Банк или МФО
    question: "В каком банке или МФО оформлен кредит/займ?"
  lender_bin:
    label: БИН кредитора
    question: "БИН банка/МФО, если знаете. Или «пропустить»."
  lender_email:
    label: E-mail кредитора
    question: "Официальный e-mail банка/МФО для обращений, если знаете. Или «пропустить»."
  contract_number:
    label: Номер договора
    question: "Номер договора займа, если известен. Или «пропустить»."
  loan_date:
    label: Дата оформления
    question: "Когда оформили займ? (ДД.ММ.ГГГГ)"
  police_report_number:
    label: Обращение в полицию
    question: "Вы уже обращались в полицию? Если да — номер или дата талона. Если нет — «пропустить»."
  evidence:
    label: Доказательства
    question: "Загрузите подтверждения: фото или PDF. Можно несколько. Когда закончите или если их нет — напишите «пропустить»."

evidence:
  receipt: Чек или квитанция об оплате
  order_screenshot: Скриншот заказа
  correspondence: Переписка
  credit_report: Выписка из кредитного бюро
  loan_notice: SMS/уведомление о займе
  police_report: Талон/постановление полиции
  response: Ответ контрагента
  other: Другой документ

statuses:
  intake: Сбор информации
  qualified: Данные собраны
  action_ready: Документ готов
  submitted: Отправлено
  awaiting_response: Ждём ответ
  escalated: Эскалация
  handed_to_lawyer: У юриста
  resolved: Закрыто

responses:
  full: Требования удовлетворены полностью
  partial: Удовлетворены частично
  refusal: Отказ
  none: Нет ответа
  unclear: Непонятный ответ

proposal:
  prepare: "Следующий шаг: подготовить «{action}»."
  wait: "Ждём ответ. Когда он придёт — перешлите его сюда или отметьте, что ответа нет."
  clarify: "Не удалось однозначно понять ответ. Выберите: удовлетворили полностью, частично, отказ или ответа нет."
  close_won: "Похоже, требования удовлетворены. Закройте дело и укажите, сколько удалось вернуть."
  no_more_steps: "По сценарию дальнейших шагов нет. Можно закрыть дело с результатом."
  handoff: "Досудебные шаги исчерпаны. Предлагаем передать дело юристу."
  escalate: "Предлагаем следующий шаг: «{action}»."

notifications:
  handoff: "Дело передано юристу. Он свяжется с вами."
  approved: "Документ проверен юристом и готов к скачиванию."
  rejected: "Юрист вернул документ на доработку. Мы свяжемся с вами."

reminders:
  before: "Напоминание: срок ответа на «{action}» истекает {date} (осталось {days} дн.)."
  due_today: "Сегодня ({date}) последний день срока ответа на «{action}». Если ответа нет — отметьте это, и мы предложим следующий шаг."
  expired: "Срок ответа на «{action}» истёк {date}. Если ответа нет — отметьте «Нет ответа», и мы подготовим следующий шаг."

email:
  body: "Здравствуйте! Во вложении — обращение заявителя. Ответ просим направить заявителю по контактам, указанным в документе. Документ подготовлен с помощью ИИ-сервиса Konsilier по поручению заявителя."

llm_hints:
  response:
    full: [вернули, вернем, возврат произведен, возврат осуществлен, удовлетворить, удовлетворена, одобрен, аннулирован, списан, закрыт, признан]
    partial: [частично, часть суммы, половину]
    refusal: [отказ, отказать, отказано, не подлежит, не можем, оснований нет, отсутствуют основания, не является]
