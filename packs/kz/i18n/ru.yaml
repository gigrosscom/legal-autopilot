  # PM 03.10 (quality pilot): a case not about money (a divorce, a child's residence) — no receipts, no sums
  ask_neutral: "Пришлите фото или скан документов, которые есть: {docs} — я сам возьму из них нужные сведения."
  any_neutral: "документы по вашему делу — свидетельства, решения, договоры, письма или переписку"
  remind_neutral: "Пока не вижу документов. Пришлите фото документов по вашему делу — так решение будет точнее. Если документов нет — напишите «нет», и я дам решение по вашим словам."
  remind_named: "Вижу, у вас есть {docs} — приложите фото, так решение будет точнее. Если прислать не можете — напишите «нет», и я дам решение по вашим словам."
