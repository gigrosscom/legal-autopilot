language_name: русский

currency_word:
  KZT: тенге
currency_symbol:
  KZT: "₸"

interview:
  intro: "Понял: «{scenario}». Как будем действовать:\n1. Попрошу документы — {documents}. Прочитаю их сам: что в них есть, спрашивать не буду.\n2. Уточню только то, чего в документах нет.\n3. Попрошу копию удостоверения личности или ваши данные — они нужны для документа.\n4. Составлю документ «{first_action}» и дам пошаговую инструкцию: куда подать и что приложить.\n5. Буду следить за сроком ответа и подскажу следующий шаг, а если делу нужен адвокат — скажу об этом прямо.\n\nНачнём."
  intro_service: "Понял: «{scenario}». Как будем действовать:\n1. Задам несколько вопросов — только то, что нужно для документов.\n2. Попрошу ваши данные — они нужны для документов.\n3. Составлю «{first_action}» и чек-лист: что приложить, где и как подать.\n\nНачнём."
  documents_any: "договор, акты, чеки, фото, скриншоты переписки"
  evidence_named: "Загрузите документы: {docs} — и всё, что подтверждает ваши слова. Можно выбрать сразу несколько файлов или сфотографировать. Я прочитаю их сам и не буду спрашивать то, что в них уже есть. Когда закончите — «Продолжить»; если документов нет — «Пропустить»."
  intro_draft: "Понял: «{scenario}». Собрал черновик документа «{first_action}» из вашего рассказа и файлов. Проверьте его ниже и допишите пустые поля — больше ничего спрашивать не буду."
  no_scenario: "Чтобы подсказать, что делать, не хватает деталей. Напишите своими словами одной-двумя фразами:\n• что купили или оформили и где (магазин, маркетплейс, банк);\n• когда и за сколько;\n• что случилось и чего хотите — вернуть деньги, обменять, отменить кредит.\n\nНапример: «Купил ноутбук в Технодоме 10 сентября за 650 000 тг, не понравился, хочу вернуть деньги».\nЕсли вопрос не про покупку или кредит — тоже опишите: подскажем, куда обращаться, или скажем прямо, если нужен адвокат."
  required: "Без этого ответа документ не собрать."
  left_blank: "Хорошо, оставлю это поле пустым — его можно заполнить в черновике документа перед оплатой."
  done_blanks: "Готово — черновик документа собран. Пустые поля ({blanks}) можно заполнить прямо в черновике."
  upload_or_skip: "Загрузите файлы (фото, PDF или Word) или напишите «пропустить»."
  done: "Спасибо, этого достаточно. Проверьте данные:\n{summary}\n\nНажмите «Подготовить документ» — откроется оплата, и сразу после её подтверждения я составлю текст и пошаговую инструкцию по подаче."
  skip_words: [пропустить, пропуск, нет, не знаю, нету, skip, не помню, точно не помню, иностранная компания, иностранный продавец, нет бин, заполню позже]
  evidence_read: "Прочитал документ «{name}». Взял из него:"
  evidence_differs_head: "Расходится с тем, что уже записано (оставил записанное; если в документе верно — напишите об этом):"
  evidence_differs: "• {label}: в документе {doc}, записано {case}"
  evidence_added: "Файл добавлен (всего: {n}). Загрузите ещё или нажмите «Продолжить»."
  done_words: [готово, продолжить, всё, все, дальше, далее, done]

errors:
  empty: "Ответ пустой."
  date: "Не понял дату. Напишите в формате ДД.ММ.ГГГГ, например 15.03.2026."
  date_future: "Дата не может быть в будущем."
  money: "Не понял сумму. Напишите число в тенге, например 45000."
  number: "Нужно число."
  email: "Похоже, e-mail с ошибкой."
  phone: "Нужен номер телефона, например +7 701 123 45 67."
  pattern: "Формат не подходит. БИН и ИИН — это 12 цифр."
  address: "Похоже, это не почтовый адрес. Напишите город, улицу и номер дома, например: г. Алматы, пр. Достык, 10."
  generic: "Не удалось разобрать ответ."

fields:
  seller_name:
    label: Продавец
    question: "Как называется продавец, магазин или маркетплейс?"
  seller_bin:
    label: БИН продавца
    question: "Знаете БИН продавца (12 цифр, обычно есть в чеке)? Если нет — напишите «пропустить»."
  seller_email:
    label: E-mail продавца
    question: "E-mail продавца для претензии, если знаете. Или «пропустить»."
  goods_description:
    label: Товар или услуга
    question: "Что именно купили или заказали?"
  purchase_date:
    label: Дата покупки
    question: "Когда была покупка или оплата? (ДД.ММ.ГГГГ)"
  amount:
    label: Сумма
    question: "Сколько вы заплатили, в тенге?"
  claim_amount:
    label: Сумма требования
    question: "Сколько вам должны — какую сумму вы требуете, в тенге? Если столько же, сколько заплатили, — «Пропустить»."
  problem_description:
    label: Что случилось
    question: "Коротко: что пошло не так и что вы уже предпринимали?"
  applicant_name:
    label: ФИО заявителя
    question: "Ваши фамилия, имя и отчество — как в удостоверении?"
  applicant_phone:
    label: Телефон
    question: "Ваш телефон для ответа?"
  applicant_iin:
    label: ИИН
    question: "Ваш ИИН (12 цифр)."
  lender_name:
    label: Банк или МФО
    question: "В каком банке или МФО оформлен кредит/займ?"
  lender_bin:
    label: БИН кредитора
    question: "БИН банка/МФО, если знаете. Или «пропустить»."
  lender_email:
    label: E-mail кредитора
    question: "Официальный e-mail банка/МФО для обращений, если знаете. Или «пропустить»."
  contract_number:
    label: Номер договора
    question: "Номер договора займа, если известен. Или «пропустить»."
  loan_date:
    label: Дата оформления
    question: "Когда оформили займ? (ДД.ММ.ГГГГ)"
  police_report_number:
    label: Обращение в полицию
    question: "Вы уже обращались в полицию? Если да — номер или дата талона. Если нет — «пропустить»."
  respondent_name:
    label: Ответчик
    question: "Кто нарушил ваши права? Название организации или ФИО человека, должность — если это госорган."
  applicant_address:
    label: Адрес заявителя
    question: "Ваш адрес для ответа (город, улица, дом, квартира)?"
  event_date:
    label: Дата события
    question: "Когда это произошло? (ДД.ММ.ГГГГ) Если не помните точно — «пропустить»."
  desired_outcome:
    label: Чего вы хотите добиться
    question: "Чего вы хотите добиться? Например: вернуть деньги, восстановить на работе, отменить штраф."
  identity_document:
    label: Удостоверение личности
    question: "Загрузите копию удостоверения личности (фото или PDF) — приложим её к документу. ИИН из PDF подставлю сам; фото удостоверения в ИИ не отправляется. Не хотите загружать — нажмите «Пропустить» и введите данные вручную."
  seller_address:
    label: Адрес продавца
    question: "Почтовый адрес продавца (юридический адрес или адрес магазина) — он обязателен в жалобе в госорган. Обычно есть в чеке, договоре-оферте или внизу сайта."
  lender_address:
    label: Адрес банка/МФО
    question: "Адрес банка/МФО (отделения или головного офиса), если знаете. Или «пропустить»."
  respondent_bin:
    label: БИН
    question: "БИН организации (12 цифр; есть в чеке, договоре или на сайте), если знаете. Или «пропустить»."
  respondent_address:
    label: Адрес
    question: "Почтовый адрес организации или человека, с кем спор (юридический адрес, адрес офиса или магазина). Если не знаете и вопрос необязательный — «пропустить»."
  respondent_iin:
    label: ИИН ответчика
    question: "ИИН второй стороны (12 цифр), если знаете. Или «пропустить»."
  applicant_birth_date:
    label: Дата рождения
    question: "Ваша дата рождения (ДД.ММ.ГГГГ) — обязательна в исковом заявлении."
  applicant_email:
    label: E-mail
    question: "Ваш e-mail для извещений суда, если есть. Или «пропустить»."
  children_info:
    label: Дети
    question: "ФИО и дата рождения ребёнка (детей), на которых взыскиваются алименты."
  decision_number:
    label: Постановление
    question: "Номер и дата постановления о штрафе (есть в самом постановлении или в уведомлении)."
  case_number:
    label: Номер дела
    question: "Номер дела или КУИ, если он у вас есть (есть в талоне-уведомлении или определении суда). Если нет — «пропустить»."
  evidence:
    label: Доказательства
    question: "Загрузите документы: договор, акт сверки, счёт-фактуру, чек, фото, скриншоты переписки — всё, что подтверждает ваши слова. Можно выбрать сразу несколько файлов или сфотографировать. Я прочитаю их сам и не буду спрашивать то, что в них уже есть. Когда закончите — «Продолжить»; если документов нет — «Пропустить»."

# «Мастер отправки»: labels before a company registration number in documents (konsilier/contacts.py)
contacts:
  id_labels: "ИИН/БИН|БИН/ИИН|БИН|BIN|БСН|ЖСН/БСН"
evidence:
  gov_certificate: Справка с egov.kz
  business_contract: Договор с контрагентом (поставки, услуг, аренды)
  invoice_act: Счёт, счёт-фактура, накладная или акт выполненных работ
  audit_notice: Уведомление о результатах проверки или акт проверки
  procurement_protocol: Протокол об итогах госзакупки
  benefit_decision: Решение (уведомление) об отказе в назначении пособия или выплаты
  id_document: Копия удостоверения личности
  employment_contract: Трудовой договор или приказ о приёме
  pay_slip: Расчётный лист или выписка о зарплате
  fine_decision: Постановление о штрафе
  birth_certificate: Свидетельство о рождении ребёнка
  marriage_certificate: Свидетельство о заключении брака
  divorce_certificate: Свидетельство о расторжении брака или решение суда
  title_documents: Договор купли-продажи, дарения или свидетельство о наследстве на имущество
  property_rights_extract: Выписка о зарегистрированных правах на недвижимость (egov.kz)
  vehicle_registration: Свидетельство о регистрации транспортного средства
  marriage_contract: Брачный договор или соглашение о разделе имущества (если есть)
  valuation: Оценка стоимости имущества (если есть)
  housing_documents: Документы о жилье, где будет жить ребёнок
  child_references: Справки и характеристики из школы или детского сада
  receipt: Чек или квитанция об оплате
  order_screenshot: Скриншот заказа
  correspondence: Переписка
  credit_report: Выписка из кредитного бюро
  loan_notice: SMS/уведомление о займе
  police_report: Талон/постановление полиции
  response: Ответ контрагента
  service_contract: Договор (оферта) на услугу или обучение
  rental_contract: Договор найма (аренды) жилья
  air_ticket: Авиабилет (маршрутная квитанция)
  insurance_policy: Страховой полис или договор страхования
  accident_docs: "Документы о ДТП: схема, протокол, фото"
  dismissal_order: Приказ об увольнении
  utility_bill: Квитанция (счёт) за коммунальные услуги
  bank_statement: Выписка по счёту или карте
  medical_documents: "Медицинские документы: заключение, выписка"
  collector_messages: Записи звонков, SMS и сообщения коллекторов
  loan_contract: Договор банковского займа (кредита)
  photo: Фото или видео
  other: Другой документ

statuses:
  intake: Сбор информации
  qualified: Данные собраны
