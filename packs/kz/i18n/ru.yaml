generic:
  action_title: "{document}: {forum}"
  handoff_title: Передача дела юристу
  instructions:
    prepare: "Скачайте «{document}» (PDF или DOCX) и проверьте: ФИО, даты, суммы, требования. Если нужна бумажная подача — распечатайте два экземпляра и подпишите."
    portal: "Подайте документ через {url} (вход по ЭЦП, eGov Mobile или SMS-коду), получатель — {addressee}. Сохраните регистрационный номер."
    email: "Отправьте документ на {email} и сохраните письмо с датой отправки."
    email_party: "Отправьте претензию на официальный e-mail получателя ({addressee}) — он указан в договоре, чеке или на сайте. Сохраните письмо с датой отправки."
    post: "Отправьте документ заказным письмом с уведомлением о вручении ({addressee}) и сохраните квитанцию и уведомление."
    in_person: "Можно подать лично ({addressee}): возьмите два экземпляра и попросите на втором отметку о принятии — дата, ФИО, подпись."
    in_person_party: "Вручите претензию лично ({addressee}): второй экземпляр оставьте себе с отметкой о принятии — дата, ФИО и подпись сотрудника."
    whatsapp: "Отправьте PDF документа в официальный WhatsApp органа ({addressee}): {url}. Напишите, что это обращение, и сохраните переписку и ответ о регистрации."
    telegram: "Отправьте PDF документа в официальный Telegram органа ({addressee}): {url}. Напишите, что это обращение, и сохраните переписку и ответ о регистрации."
    alternative: "Другой способ: {step}"
    attach: "Что приложить: {items}. Прикладывайте копии, оригиналы оставьте у себя."
    mark_submitted: "После подачи нажмите «Документ подан» — начнём отсчёт срока ответа и напомним заранее. Если срок в данных не указан, его уточнит юрист."
  # Подробные шаги по порталам: ключ — адрес сайта. Интерфейс порталов меняется — шаги сверит юрист (REVIEW.md).
  portals:
    eotinish.kz:
      - "Откройте {url} — единая платформа обращений в госорганы. Войдите: ЭЦП (через NCALayer), eGov Mobile по QR-коду или по SMS-коду."
      - "Нажмите «Подать обращение» и выберите вид обращения, подходящий к документу «{document}» (жалоба или заявление)."
      - "Выберите получателя: {addressee}. Если в списке нет точного совпадения — ищите по названию органа и вашему региону."
      - "В поле текста вставьте описание и требования из документа, а сам документ приложите файлом PDF."
      - "Подпишите обращение ЭЦП или подтвердите SMS-кодом и отправьте."
      - "Сохраните регистрационный номер обращения: по нему статус и ответ видны в личном кабинете eOtinish и в eGov."
    office.sud.kz:
      - "Откройте {url} — «Судебный кабинет». Войдите с помощью ЭЦП (нужна программа NCALayer)."
      - "Выберите подачу документа в суд, вид производства и вид документа «{document}»."
      - "Укажите суд: {addressee}. Подсудность (какой именно суд) проверит юрист до подачи."
      - "Загрузите PDF документа и приложения, включая квитанцию об оплате госпошлины, если она нужна."
      - "Подпишите ЭЦП и отправьте. Сохраните номер и следите за статусом в кабинете."

routing:
  choose_forum: "Разберём «{dispute}» по шагам. Выберите, с чего начать: обычно сначала досудебная претензия самой организации или человеку, затем жалоба в госорган, и только потом суд. Претензию, жалобу и заявление вы подаёте сами — подготовим текст и дадим пошаговую инструкцию. Иск в суд юрист проверит до подачи."
  choose_forum_first: "Сначала выберите, куда обратиться: варианты ниже."
  universal_intro: "Готовим документ: {forum}. Как будем действовать: уточню детали, попрошу доказательства (чеки, договор, фото, переписку), затем копию удостоверения или ваши данные, составлю документ и дам пошаговую инструкцию по подаче. Нормы и сроки, которых нет в проверенных данных, в документе помечены — их уточнит юрист."
  handed_to_lawyer: "Этому делу нужен юрист ({reasons}). Мы сохранили ваше описание и передаём дело проверенному юристу платформы — он свяжется с вами. Если есть срок, который истекает, напишите об этом сразу."
  reasons:
    defence: "вы сторона защиты — документы защиты готовит только адвокат"
    lawyer_only: "такие дела ведут только юристы"
    children: "затронуты интересы детей"
    low_confidence: "ситуацию нужно уточнить"
    high_amount: "крупная сумма"
    no_forum: "в наших данных нет подходящего органа"
    urgent_deadline: "срок скоро истекает"

safety:
  facts_not_labels: "Пожалуйста, опишите факты, а не оценки: что именно произошло, где и когда, кто это видел. Слова вроде «вор» или «мошенник» оценку оставьте следствию — так заявление сильнее и безопаснее для вас."
  emergency: "Если сейчас есть угроза жизни или здоровью — сначала позвоните в экстренные службы. Мы поможем с документами потом."
  hold: "Дело передано на ручную проверку: так мы защищаем людей от преследования и ложных обвинений. Мы свяжемся с вами."
  ack:
    special_category: "В этом деле могут быть особые личные данные (здоровье, религия, судимость). Мы храним минимум и используем их только для вашего документа. Подтвердите согласие на обработку, чтобы продолжить."
