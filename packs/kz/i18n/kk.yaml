      - "ЭЦҚ-мен қол қойып, жіберіңіз. Нөмірін сақтап, кабинетте мәртебесін бақылаңыз."

routing:
  choose_forum: "«{dispute}» мәселесін қадам бойынша шешейік. Неден бастайтынын таңдаңыз: әдетте алдымен ұйымның не адамның өзіне сотқа дейінгі талап-арыз, содан кейін мемлекеттік органға шағым, тек содан соң сот. Талап-арызды, шағымды және арызды өзіңіз бересіз — мәтінін дайындап, қадамдық нұсқаулық береміз. Сотқа талап қоюды заңгер беру алдында тексереді."
  choose_forum_first: "Алдымен қайда жүгінетініңізді таңдаңыз: нұсқалар төменде."
