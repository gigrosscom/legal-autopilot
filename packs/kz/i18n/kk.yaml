language_name: қазақ тілі

interview:
  intro: "Бұл «{scenario}» сценарийіне ұқсайды. Бірнеше қысқа сұрақ қоямын — бір-бірден."
  no_scenario: "Не болғанын әлі түсінбедім. Толығырақ жазыңыз: нені сатып алдыңыз не рәсімдедіңіз, кімнен, қашан, қанша сомаға. Егер бұл тауар/қызмет үшін ақша қайтару немесе алаяқтар рәсімдеген несие болмаса — өтінішті тексеруге жібереміз."
  required: "Бұл жауапсыз құжат жасалмайды."
  upload_or_skip: "Файл жүктеңіз (фото не PDF) немесе «өткізу» деп жазыңыз."
  done: "Рақмет, жеткілікті. Деректерді тексеріңіз:\n{summary}\n\nҚұжат дайындауға болады."
  skip_words: [өткізу, өткіз, жоқ, білмеймін, пропустить, нет, skip]

errors:
  empty: "Жауап бос."
  date: "Күнді түсінбедім. КК.АА.ЖЖЖЖ түрінде жазыңыз, мысалы 15.03.2026."
  date_future: "Күн болашақта болмауы керек."
  money: "Соманы түсінбедім. Теңгемен сан жазыңыз, мысалы 45000."
  number: "Сан керек."
  email: "E-mail қате сияқты."
  phone: "Телефон нөмірі керек, мысалы +7 701 123 45 67."
  pattern: "Формат сәйкес емес. БСН мен ЖСН — 12 сан."
  generic: "Жауапты түсіну мүмкін болмады."

fields:
  seller_name:
    label: Сатушы
    question: "Сатушының, дүкеннің не маркетплейстің атауы қандай?"
  seller_bin:
    label: Сатушының БСН-і
    question: "Сатушының БСН-ін білесіз бе (12 сан, әдетте чекте болады)? Білмесеңіз — «өткізу» деп жазыңыз."
  seller_email:
    label: Сатушының e-mail-і
    question: "Талап-арыз үшін сатушының e-mail-і, білсеңіз. Әйтпесе «өткізу»."
  goods_description:
    label: Тауар не қызмет
    question: "Нақты не сатып алдыңыз не тапсырыс бердіңіз?"
  purchase_date:
    label: Сатып алу күні
    question: "Сатып алу не төлем қашан болды? (КК.АА.ЖЖЖЖ)"
  amount:
    label: Сома
    question: "Қанша төледіңіз, теңгемен?"
  problem_description:
    label: Не болды
    question: "Қысқаша: не дұрыс болмады және не істеп үлгердіңіз?"
  applicant_name:
    label: Өтініш берушінің аты-жөні
    question: "Тегіңіз, атыңыз, әкеңіздің аты — куәліктегідей?"
  applicant_phone:
    label: Телефон
    question: "Жауап үшін телефоныңыз?"
  applicant_iin:
    label: ЖСН
    question: "ЖСН-іңіз (12 сан)."
  lender_name:
    label: Банк не МҚҰ
    question: "Несие/қарыз қай банкте не МҚҰ-да рәсімделген?"
  lender_bin:
    label: Кредитордың БСН-і
    question: "Банк/МҚҰ БСН-і, білсеңіз. Әйтпесе «өткізу»."
  lender_email:
    label: Кредитордың e-mail-і
    question: "Банктің/МҚҰ-ның өтініштерге арналған ресми e-mail-і, білсеңіз. Әйтпесе «өткізу»."
  contract_number:
    label: Шарт нөмірі
    question: "Қарыз шартының нөмірі, белгілі болса. Әйтпесе «өткізу»."
  loan_date:
    label: Рәсімделген күні
    question: "Қарыз қашан рәсімделді? (КК.АА.ЖЖЖЖ)"
  police_report_number:
    label: Полицияға өтініш
    question: "Полицияға жүгіндіңіз бе? Иә болса — талонның нөмірі не күні. Жоқ болса — «өткізу»."
  respondent_name:
    label: Жауапкер
    question: "Құқығыңызды кім бұзды? Ұйымның атауы не адамның аты-жөні, мемлекеттік орган болса — лауазымы."
  applicant_address:
    label: Өтініш берушінің мекенжайы
    question: "Жауап үшін мекенжайыңыз (қала, көше, үй, пәтер)?"
  event_date:
    label: Оқиға күні
    question: "Бұл қашан болды? (КК.АА.ЖЖЖЖ) Нақты есіңізде болмаса — «өткізу»."
  desired_outcome:
    label: Неге қол жеткізгіңіз келеді
    question: "Неге қол жеткізгіңіз келеді? Мысалы: ақшаны қайтару, жұмысқа қайта алу, айыппұлды жою."
  evidence:
    label: Дәлелдер
    question: "Растайтын құжаттарды жүктеңіз: фото не PDF. Бірнешеуі болады. Біткенде не жоқ болса — «өткізу» деп жазыңыз."

