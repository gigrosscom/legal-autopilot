  generic: "Жауапты түсіну мүмкін болмады."

fields:
  seller_name:
    label: Сатушы
    question: "Сатушының, дүкеннің не маркетплейстің атауы қандай?"
  seller_bin:
    label: Сатушының БСН-і
    question: "Сатушының БСН-ін білесіз бе (12 сан, әдетте чекте болады)? Білмесеңіз — «өткізу» деп жазыңыз."
  seller_email:
    label: Сатушының e-mail-і
    question: "Талап-арыз үшін сатушының e-mail-і, білсеңіз. Әйтпесе «өткізу»."
  goods_description:
    label: Тауар не қызмет
    question: "Нақты не сатып алдыңыз не тапсырыс бердіңіз?"
  purchase_date:
    label: Сатып алу күні
    question: "Сатып алу не төлем қашан болды? (КК.АА.ЖЖЖЖ)"
  amount:
    label: Сома
    question: "Қанша төледіңіз, теңгемен?"
  claim_amount:
    label: Талап сомасы
    question: "Сізге қанша қарыз — қандай соманы талап етесіз, теңгемен? Төлеген сомаңызбен бірдей болса — «Өткізу»."
  problem_description:
    label: Не болды
    question: "Қысқаша: не дұрыс болмады және не істеп үлгердіңіз?"
  applicant_name:
    label: Өтініш берушінің аты-жөні
    question: "Тегіңіз, атыңыз, әкеңіздің аты — куәліктегідей?"
  applicant_phone:
    label: Телефон
    question: "Жауап үшін телефоныңыз?"
  applicant_iin:
    label: ЖСН
    question: "ЖСН-іңіз (12 сан)."
  lender_name:
    label: Банк не МҚҰ
    question: "Несие/қарыз қай банкте не МҚҰ-да рәсімделген?"
  lender_bin:
    label: Кредитордың БСН-і
    question: "Банк/МҚҰ БСН-і, білсеңіз. Әйтпесе «өткізу»."
  lender_email:
    label: Кредитордың e-mail-і
    question: "Банктің/МҚҰ-ның өтініштерге арналған ресми e-mail-і, білсеңіз. Әйтпесе «өткізу»."
  contract_number:
    label: Шарт нөмірі
    question: "Қарыз шартының нөмірі, белгілі болса. Әйтпесе «өткізу»."
  loan_date:
    label: Рәсімделген күні
    question: "Қарыз қашан рәсімделді? (КК.АА.ЖЖЖЖ)"
  police_report_number:
    label: Полицияға өтініш
    question: "Полицияға жүгіндіңіз бе? Иә болса — талонның нөмірі не күні. Жоқ болса — «өткізу»."
  respondent_name:
    label: Жауапкер
    question: "Құқығыңызды кім бұзды? Ұйымның атауы не адамның аты-жөні, мемлекеттік орган болса — лауазымы."
  applicant_address:
    label: Өтініш берушінің мекенжайы
    question: "Жауап үшін мекенжайыңыз (қала, көше, үй, пәтер)?"
  event_date:
    label: Оқиға күні
    question: "Бұл қашан болды? (КК.АА.ЖЖЖЖ) Нақты есіңізде болмаса — «өткізу»."
  desired_outcome:
    label: Неге қол жеткізгіңіз келеді
    question: "Неге қол жеткізгіңіз келеді? Мысалы: ақшаны қайтару, жұмысқа қайта алу, айыппұлды жою."
  identity_document:
    label: Жеке куәлік
    question: "Жеке куәліктің көшірмесін жүктеңіз (фото не PDF) — оны құжатқа тіркейміз. PDF-тен ЖСН-ді өзім қоямын; куәліктің фотосы ЖИ-ге жіберілмейді. Жүктегіңіз келмесе — «Өткізу» басып, деректерді қолмен енгізіңіз."
  seller_address:
    label: Сатушының мекенжайы
    question: "Сатушының пошталық мекенжайы (заңды мекенжайы не дүкен мекенжайы) — мемлекеттік органға шағымда міндетті. Әдетте чекте, шарт-офертада не сайттың төменгі жағында болады."
  lender_address:
    label: Банктің/МҚҰ-ның мекенжайы
    question: "Банктің/МҚҰ-ның мекенжайы (бөлімшенің не бас кеңсенің), білсеңіз. Не «өткізу»."
  respondent_bin:
    label: БСН
    question: "Ұйымның БСН-і (12 сан; чекте, шартта не сайтта болады), білсеңіз. Не «өткізу»."
  respondent_address:
    label: Мекенжайы
    question: "Дау туындаған ұйымның не адамның пошталық мекенжайы (заңды мекенжайы, кеңсе не дүкен мекенжайы). Білмесеңіз және сұрақ міндетті емес болса — «өткізу»."
  respondent_iin:
    label: Жауапкердің ЖСН-і
    question: "Екінші тараптың ЖСН-і (12 сан), білсеңіз. Не «өткізу»."
  applicant_birth_date:
    label: Туған күні
    question: "Туған күніңіз (КК.АА.ЖЖЖЖ) — талап қою арызында міндетті."
  applicant_email:
    label: E-mail
    question: "Сот хабарламалары үшін e-mail мекенжайыңыз, болса. Не «өткізу»."
  children_info:
    label: Балалар
    question: "Алимент өндірілетін баланың (балалардың) аты-жөні және туған күні."
  decision_number:
    label: Қаулы
    question: "Айыппұл туралы қаулының нөмірі мен күні (қаулының өзінде не хабарламада болады)."
  case_number:
    label: Іс нөмірі
    question: "Іс нөмірі не АЕК (ақпаратты есепке алу кітабы) нөмірі, болса (талон-хабарламада не сот ұйғарымында бар). Болмаса — «өткізу»."
  evidence:
    label: Дәлелдер
    question: "Құжаттарды жүктеңіз: шарт, салыстыру акті, шот-фактура, чек, фото, хат алмасу скриншоттары — сөзіңізді растайтынның бәрі. Бірден бірнеше файл таңдауға не суретке түсіруге болады. Оларды өзім оқып, ондағыны сұрамаймын. Біткенде — «Жалғастыру»; құжат болмаса — «Өткізу»."

