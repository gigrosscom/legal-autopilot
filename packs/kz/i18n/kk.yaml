language_name: қазақ тілі

interview:
  intro: "Түсіндім: «{scenario}». Былай әрекет етеміз:\n1. Құжаттарды сұраймын — шарт, актілер, чектер, фото, хат алмасу скриншоттары. Оларды өзім оқимын: ондағыны сұрамаймын.\n2. Құжаттарда жоқты ғана нақтылаймын.\n3. Жеке куәлік көшірмесін не деректеріңізді сұраймын — олар құжатқа керек.\n4. «{first_action}» құжатын жасап, қадамдық нұсқаулық беремін: қайда беру және не тіркеу керек.\n5. Жауап мерзімін бақылап, келесі қадамды айтамын, ал іске адвокат қажет болса — бұл туралы тура айтамын.\n\nБастайық."
  no_scenario: "Не істеу керегін айту үшін мәлімет жетпейді. Өз сөзіңізбен бір-екі сөйлеммен жазыңыз:\n• не сатып алдыңыз не рәсімдедіңіз және қайдан (дүкен, маркетплейс, банк);\n• қашан және қанша сомаға;\n• не болды және не қалайсыз — ақшаны қайтару, ауыстыру, несиені жою.\n\nМысалы: «10 қыркүйекте Технодомнан 650 000 теңгеге ноутбук алдым, ұнамады, ақшамды қайтарғым келеді».\nМәселе сатып алу не несие туралы болмаса да — сипаттаңыз: қайда жүгіну керегін айтамыз немесе адвокат қажет болса, тура айтамыз."
  required: "Бұл жауапсыз құжат жасалмайды."
  left_blank: "Жақсы, бұл өрісті бос қалдырамын — оны төлем алдында құжат жобасында толтыруға болады."
  done_blanks: "Дайын — құжат жобасы жиналды. Бос өрістерді ({blanks}) тікелей жобада толтыруға болады."
  upload_or_skip: "Файлдарды жүктеңіз (фото, PDF не Word) немесе «өткізу» деп жазыңыз."
  done: "Рақмет, жеткілікті. Деректерді тексеріңіз:\n{summary}\n\n«Құжат дайындау» түймесін басыңыз — төлем терезесі ашылады, ал төлем расталған бойда мәтінді және беру бойынша қадамдық нұсқаулықты жасаймын."
  skip_words: [өткізу, өткіз, жоқ, білмеймін, пропустить, нет, skip, есімде жоқ, шетелдік компания, шетелдік сатушы, бсн жоқ, кейін толтырамын]
  evidence_read: "«{name}» құжатын оқыдым. Одан алдым:"
  evidence_differs_head: "Жазылғанмен сәйкес келмейді (жазылғанын қалдырдым; құжаттағы дұрыс болса — жазыңыз):"
  evidence_differs: "• {label}: құжатта {doc}, жазылғаны {case}"
  evidence_added: "Файл қосылды (барлығы: {n}). Тағы жүктеңіз не «Жалғастыру» түймесін басыңыз."
  done_words: [дайын, болды, бітті, әрі қарай, жалғастыру, готово, done]

