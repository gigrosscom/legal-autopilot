generic:
  action_title: "{document}: {forum}"
  handoff_title: Істі заңгерге беру
  instructions:
    portal: "Құжатты {url} арқылы беріңіз (ЭЦҚ не SMS-код арқылы кіру), алушы — {addressee}. Тіркеу нөмірін сақтаңыз."
    email: "Құжатты {email} мекенжайына жіберіп, жіберу күні көрсетілген хатты сақтаңыз."
    post: "Құжатты хабарламасы бар тапсырыс хатпен жіберіңіз ({addressee}) және түбіртекті сақтаңыз."
    in_person: "Өзіңіз апаруға болады ({addressee}): екі дана алып, екіншісіне қабылдау белгісін сұраңыз."
    mark_submitted: "Бергеннен кейін «Жібердім» басыңыз. Деректерде жауап мерзімі көрсетілмесе, оны заңгер нақтылайды."

routing:
  choose_forum: "«{dispute}» бойынша тексерілген сценарий әзірге жоқ, бірақ құжатты әмбебап жолмен дайындай аламыз. Қайда жүгінетініңізді таңдаңыз — айырмашылықтары төменде. Беру алдында құжатты заңгер тексереді."
  choose_forum_first: "Алдымен қайда жүгінетініңізді таңдаңыз: нұсқалар төменде."
  universal_intro: "«{forum}» органына құжатты әмбебап жолмен дайындаймыз: беру алдында оны заңгер тексереді. Тексерілген деректерде жоқ нормалар мен мерзімдерді заңгер нақтылайды."
  handed_to_lawyer: "Бұл іске заңгер керек ({reasons}). Сипаттамаңызды сақтадық және істі платформаның тексерілген заңгеріне береміз — ол сізбен хабарласады. Мерзімі өтіп бара жатса, бірден жазыңыз."
  reasons:
    defence: "сіз қорғау тарапысыз — қорғау құжаттарын тек адвокат дайындайды"
    lawyer_only: "мұндай істерді тек заңгерлер жүргізеді"
    children: "балалардың мүддесі қозғалады"
    low_confidence: "жағдайды нақтылау керек"
    high_amount: "ірі сома"
    no_forum: "деректерімізде лайықты орган жоқ"
    urgent_deadline: "мерзімі жақында өтеді"
