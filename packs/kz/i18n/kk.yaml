  prepare: "Келесі қадам: «{action}» дайындау."
  wait: "Жауап күтеміз. Келгенде осында жіберіңіз немесе жауап жоқ деп белгілеңіз."
  clarify: "Жауапты анық түсіну мүмкін болмады. Таңдаңыз: толық, ішінара, бас тарту немесе жауап жоқ."
  close_won: "Талап қанағаттандырылған сияқты. Істі жауып, қанша қайтарылғанын көрсетіңіз."
  no_more_steps: "Сценарий бойынша келесі қадам жоқ. Істі нәтижемен жабуға болады."
  handoff: "Сотқа дейінгі қадамдар таусылды. Істі заңгерге беруді ұсынамыз."
  escalate: "Келесі қадамды ұсынамыз: «{action}»."

