  universal_intro: "Құжат дайындаймыз: {forum}. Былай әрекет етеміз: құжаттарды (шарт, актілер, чектер, фото, хат алмасу) сұрап, өзім оқимын, оларда жоқты ғана нақтылаймын, содан кейін куәлік көшірмесін не деректеріңізді сұраймын, құжатты жасап, беру бойынша қадамдық нұсқаулық беремін. Тексерілген деректерде жоқ нормалар мен мерзімдер құжатта белгіленген — оларды заңгер нақтылайды."
  handed_to_lawyer: "Бұл іске заңгер керек ({reasons}). Сипаттамаңызды сақтадық және істі платформа каталогындағы заңгерге береміз — ол сізбен хабарласады. Мерзімі өтіп бара жатса, бірден жазыңыз."
