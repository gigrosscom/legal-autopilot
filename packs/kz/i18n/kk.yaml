    question: "Дәлелдерді жүктеңіз: чек не түбіртек, шарт, фото, хат алмасу скриншоттары — сөзіңізді растайтынның бәрі. Файлдарды бір-бірден қосуға болады; біткенде «Дайын» басыңыз. Дәлел болмаса — «Өткізу»."

