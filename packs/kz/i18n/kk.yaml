language_name: қазақ тілі

interview:
  intro: "Түсіндім: «{scenario}». Былай әрекет етеміз:\n1. Не болғанын қысқаша нақтылаймын.\n2. Дәлелдерді сұраймын — чектер, шарт, фото, хат алмасу скриншоттары.\n3. Жеке куәлік көшірмесін не деректеріңізді сұраймын — олар құжатқа керек.\n4. «{first_action}» құжатын жасап, қадамдық нұсқаулық беремін: қайда беру және не тіркеу керек.\n5. Жауап мерзімін бақылап, келесі қадамды айтамын, қажет болса — заңгерді қосамын.\n\nБастайық."
  no_scenario: "Не істеу керегін айту үшін мәлімет жетпейді. Өз сөзіңізбен бір-екі сөйлеммен жазыңыз:\n• не сатып алдыңыз не рәсімдедіңіз және қайдан (дүкен, маркетплейс, банк);\n• қашан және қанша сомаға;\n• не болды және не қалайсыз — ақшаны қайтару, ауыстыру, несиені жою.\n\nМысалы: «10 қыркүйекте Технодомнан 650 000 теңгеге ноутбук алдым, ұнамады, ақшамды қайтарғым келеді».\nМәселе сатып алу не несие туралы болмаса да — сипаттаңыз: қайда жүгіну керегін айтамыз немесе заңгерге береміз."
  required: "Бұл жауапсыз құжат жасалмайды."
  upload_or_skip: "Файл жүктеңіз (фото не PDF) немесе «өткізу» деп жазыңыз."
  done: "Рақмет, жеткілікті. Деректерді тексеріңіз:\n{summary}\n\n«Құжат дайындау» басыңыз — мәтінді және беру бойынша қадамдық нұсқаулықты жасаймын."
  skip_words: [өткізу, өткіз, жоқ, білмеймін, пропустить, нет, skip]
  evidence_added: "Файл қосылды (барлығы: {n}). Тағы жүктеңіз не «Дайын» басыңыз."
  done_words: [дайын, болды, бітті, әрі қарай, готово, done]

