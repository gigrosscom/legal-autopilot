# Правила маршрута адресата (решение владельца 02.10): адресата документа выбирает система, а не клиент.
# Ключ — тип спора (универсальный путь: первый шаг выбирается сам, вместо списка «Куда обратиться») или id сценария
# (шаги уже заданы в сценарии; здесь — «кому и почему» для экрана).
# Шаг: ровно одно из forum (реестр forums/registry.yaml), authority (pack.yaml → authorities), party (вторая сторона).
# label — кому, простыми словами; when — условие перехода к шагу; why — почему, одной строкой; norm — норма.
# Нормы — по правилам разбора ZANN (team/zann/lawyer/triage-rules.md; тексты открыты на old.adilet.zan.kz
# 01–02.10.2026). Где норма не открыта — «не подтверждено». verified_by: — (юрист пилота не подписывал).

routes:
  # ================================================================ универсальный путь (типы споров)
  civil.debt:
    steps:
      - forum: kz.counterparty.claim
        label: {ru: "Должник — письменное требование вернуть долг", kk: "Борышкер — қарызды қайтару туралы жазбаша талап"}
        why:
          ru: "Если срок возврата не указан, должник обязан вернуть деньги в 30 дней со дня требования; от требования считаются сроки."
          kk: "Қайтару мерзімі көрсетілмесе, борышкер ақшаны талаптан кейін 30 күн ішінде қайтаруға міндетті; мерзімдер талаптан есептеледі."
        norm: "ГК РК (Особенная часть), ст. 722 п. 1; ГК РК, ст. 180 п. 3"
      - forum: kz.court.district
        label: {ru: "Районный (городской) суд по месту жительства должника — иск", kk: "Борышкердің тұрғылықты жеріндегі аудандық (қалалық) сот — талап арыз"}
        when: {ru: "если за 30 дней не вернул", kk: "30 күн ішінде қайтармаса"}
        why:
          ru: "Иск подают по месту жительства ответчика; срок исковой давности — 3 года. Судебный приказ по расписке ГПК не предусматривает."
          kk: "Талап арыз жауапкердің тұрғылықты жері бойынша беріледі; талап қою мерзімі — 3 жыл. Қолхат бойынша сот бұйрығын АПК көздемейді."
        norm: "ГПК РК, ст. 29 ч. 1, ст. 135; ГК РК, ст. 178 п. 1"

  civil.honor:
    steps:
      - forum: kz.counterparty.claim
        label: {ru: "Тот, кто распространил сведения (редакция СМИ), — требование опровержения", kk: "Мәліметті таратқан адам (БАҚ редакциясы) — теріске шығару талабы"}
        why:
          ru: "Если сведения вышли в СМИ, сначала требуют опровержения у редакции: суд — если она отказала или месяц не публикует. Опровержение в СМИ — бесплатно."
          kk: "Мәлімет БАҚ-та шықса, алдымен редакциядан теріске шығаруды талап етеді: сот — ол бас тартса немесе бір ай жарияламаса. БАҚ-тағы теріске шығару — тегін."
        norm: "ГК РК, ст. 143 п. 2, 4"
      - forum: kz.court.district
        label: {ru: "Районный (городской) суд — иск об опровержении", kk: "Аудандық (қалалық) сот — теріске шығару туралы талап арыз"}
        when: {ru: "если не опровергли", kk: "теріске шығармаса"}
        why:
          ru: "Опровержения требуют в суде; вместе с ним — возмещения убытков и морального вреда. Если автора не установить — заявление о признании сведений не соответствующими действительности."
          kk: "Теріске шығаруды сотта талап етеді; онымен бірге — шығын мен моральдық зиянды өтеуді. Авторды анықтау мүмкін болмаса — мәліметті шындыққа сәйкес емес деп тану туралы арыз."
        norm: "ГК РК, ст. 143 п. 1, 6, 7; ГПК РК, ст. 29 ч. 1"

  civil.damages:
    steps:
      - forum: kz.counterparty.claim
        label: {ru: "Тот, кто причинил ущерб, — претензия", kk: "Зиян келтірген адам — наразылық"}
        why:
          ru: "Требование возместить ущерб добровольно; закон не требует его перед судом, но оно фиксирует сумму и дату."
          kk: "Зиянды ерікті түрде өтеу талабы; сотқа дейін заң талап етпейді, бірақ ол соманы және күнді бекітеді."
        norm: "ГПК РК, ст. 152 ч. 1 пп. 1 (претензия не обязательна)"
      - forum: kz.court.district
        label: {ru: "Районный (городской) суд — иск", kk: "Аудандық (қалалық) сот — талап арыз"}
        when: {ru: "если не возместил", kk: "өтемесе"}
        why:
          ru: "По месту жительства ответчика; при вреде здоровью — можно по своему месту жительства или месту причинения вреда."
          kk: "Жауапкердің тұрғылықты жері бойынша; денсаулыққа зиян келсе — өз тұрғылықты жеріңіз немесе зиян келтірілген жер бойынша."
        norm: "ГПК РК, ст. 29 ч. 1, ст. 30 ч. 5"

  consumer.refund:
    steps:
      - forum: kz.counterparty.claim
        label: {ru: "Продавец — претензия", kk: "Сатушы — наразылық"}
        why:
          ru: "Претензию вручают продавцу лично, заказным письмом или на его e-mail; ответ — 10 календарных дней. Без неё нельзя жаловаться в госорган."
          kk: "Наразылық сатушыға қолма-қол, тапсырыс хатпен немесе оның e-mail-іне беріледі; жауап — 10 күнтізбелік күн. Онсыз мемлекеттік органға шағымдануға болмайды."
        norm: "Закон РК «О защите прав потребителей», ст. 42-4 п. 1–3"
      - forum: kz.regulator.consumer
        label: {ru: "Департамент защиты прав потребителей — жалоба", kk: "Тұтынушылардың құқықтарын қорғау департаменті — шағым"}
        when: {ru: "если отказали или не ответили за 10 дней (не позднее 2 месяцев с претензии)", kk: "бас тартса немесе 10 күнде жауап бермесе (наразылықтан кейін 2 айдан кешіктірмей)"}
        why:
          ru: "Орган по защите прав потребителей рассматривает жалобу за 15 рабочих дней."
          kk: "Тұтынушылардың құқықтарын қорғау органы шағымды 15 жұмыс күнінде қарайды."
        norm: "Закон РК «О защите прав потребителей», ст. 42-5; АППК РК, ст. 76"
      - forum: kz.court.district
        label: {ru: "Районный (городской) суд по вашему месту жительства — иск", kk: "Тұрғылықты жеріңіздегі аудандық (қалалық) сот — талап арыз"}
        when: {ru: "если вопрос не решён", kk: "мәселе шешілмесе"}
        why:
          ru: "Потребитель вправе подать иск по своему месту жительства или по месту заключения или исполнения договора."
          kk: "Тұтынушы талап арызды өз тұрғылықты жері немесе шарт жасалған не орындалған жер бойынша бере алады."
        norm: "ГПК РК, ст. 30 ч. 9"

  consumer.poor_service:
    steps:
      - forum: kz.counterparty.claim
        label: {ru: "Исполнитель — претензия", kk: "Орындаушы — наразылық"}
        why:
          ru: "Претензию вручают исполнителю; ответ — 10 календарных дней. Без неё нельзя жаловаться в госорган."
          kk: "Наразылық орындаушыға беріледі; жауап — 10 күнтізбелік күн. Онсыз мемлекеттік органға шағымдануға болмайды."
        norm: "Закон РК «О защите прав потребителей», ст. 42-4 п. 1–3"
      - forum: kz.regulator.consumer
        label: {ru: "Департамент защиты прав потребителей — жалоба", kk: "Тұтынушылардың құқықтарын қорғау департаменті — шағым"}
        when: {ru: "если отказали или не ответили за 10 дней", kk: "бас тартса немесе 10 күнде жауап бермесе"}
        why:
          ru: "Жалобу подают не позднее 2 месяцев с претензии; рассмотрение — 15 рабочих дней."
          kk: "Шағым наразылықтан кейін 2 айдан кешіктірілмей беріледі; қарау — 15 жұмыс күні."
        norm: "Закон РК «О защите прав потребителей», ст. 42-5; АППК РК, ст. 76"
      - forum: kz.court.district
        label: {ru: "Районный (городской) суд по вашему месту жительства — иск", kk: "Тұрғылықты жеріңіздегі аудандық (қалалық) сот — талап арыз"}
        when: {ru: "если вопрос не решён", kk: "мәселе шешілмесе"}
        why:
          ru: "Потребитель вправе подать иск по своему месту жительства."
          kk: "Тұтынушы талап арызды өз тұрғылықты жері бойынша бере алады."
        norm: "ГПК РК, ст. 30 ч. 9"

  housing.utilities:
    steps:
      - forum: kz.counterparty.claim
        label: {ru: "Поставщик услуги или расчётный центр — заявление о перерасчёте", kk: "Қызмет жеткізуші немесе есеп айырысу орталығы — қайта есептеу туралы өтініш"}
        why:
          ru: "Сначала поставщик: он обязан рассмотреть перерасчёт; без претензии нельзя жаловаться в госорган."
          kk: "Алдымен жеткізуші: ол қайта есептеуді қарауға міндетті; наразылықсыз мемлекеттік органға шағымдануға болмайды."
        norm: "Закон РК «О защите прав потребителей», ст. 42-4; Типовые правила № 249, п. 21 пп. 7"
      - forum: kz.regulator.consumer
        label: {ru: "Департамент защиты прав потребителей — жалоба", kk: "Тұтынушылардың құқықтарын қорғау департаменті — шағым"}
        when: {ru: "если отказали или не ответили", kk: "бас тартса немесе жауап бермесе"}
        why:
          ru: "Орган по защите прав потребителей рассматривает жалобу за 15 рабочих дней."
          kk: "Тұтынушылардың құқықтарын қорғау органы шағымды 15 жұмыс күнінде қарайды."
        norm: "Закон РК «О защите прав потребителей», ст. 42-5; АППК РК, ст. 76"

  housing.tenancy:
    steps:
      - forum: kz.counterparty.claim
        label: {ru: "Арендодатель (наймодатель) — претензия", kk: "Жалға беруші — наразылық"}
        why:
          ru: "Требование исполнить обязательство: без срока его исполняют в 7 дней со дня требования. Перед судом закон претензию не требует."
          kk: "Міндеттемені орындау талабы: мерзімі жоқ болса, талаптан кейін 7 күнде орындалады. Сотқа дейін заң наразылықты талап етпейді."
        norm: "ГК РК, ст. 277 п. 2; ГПК РК, ст. 152 ч. 1 пп. 1"
      - forum: kz.court.district
        label: {ru: "Районный (городской) суд по месту жительства ответчика — иск", kk: "Жауапкердің тұрғылықты жеріндегі аудандық (қалалық) сот — талап арыз"}
        when: {ru: "если за 7 дней не исполнил", kk: "7 күнде орындамаса"}
        why:
          ru: "Иск подают по месту жительства ответчика."
          kk: "Талап арыз жауапкердің тұрғылықты жері бойынша беріледі."
        norm: "ГПК РК, ст. 29 ч. 1"

  finance.bank_dispute:
    steps:
      - forum: kz.counterparty.claim
        label: {ru: "Банк или МФО — заявление", kk: "Банк немесе МҚҰ — өтініш"}
        why:
          ru: "Сначала сам банк: срок ответа — 15 рабочих дней. Без этого АРРФР обычно не рассматривает жалобу."
          kk: "Алдымен банктің өзі: жауап мерзімі — 15 жұмыс күні. Онсыз ҚНРДА шағымды әдетте қарамайды."
        norm: "Закон РК «О банках и банковской деятельности» 2026, ст. 64; Закон о микрофинансовой деятельности, ст. 17"
      - forum: kz.regulator.financial
        label: {ru: "АРРФР — жалоба", kk: "ҚНРДА — шағым"}
        when: {ru: "если банк отказал или не ответил за 15 рабочих дней", kk: "банк бас тартса немесе 15 жұмыс күнінде жауап бермесе"}
        why:
          ru: "Регулятор финансового рынка рассматривает обращение за 15 рабочих дней."
          kk: "Қаржы нарығының реттеушісі өтінішті 15 жұмыс күнінде қарайды."
        norm: "АППК РК, ст. 76"

  finance.debt_collectors:
    steps:
      - forum: kz.counterparty.claim
        label: {ru: "Коллекторское агентство — заявление", kk: "Коллекторлық агенттік — өтініш"}
        why:
          ru: "Сначала требование к коллектору прекратить нарушения; затем — жалоба регулятору."
          kk: "Алдымен коллекторға бұзушылықты тоқтату талабы; содан кейін — реттеушіге шағым."
        norm: "Закон РК «О коллекторской деятельности», ст. 1 пп. 7, ст. 17 п. 2 пп. 4"
      - forum: kz.regulator.financial
        label: {ru: "АРРФР — жалоба", kk: "ҚНРДА — шағым"}
        when: {ru: "если нарушения продолжаются", kk: "бұзушылықтар жалғасса"}
        why:
          ru: "АРРФР контролирует коллекторов; срок рассмотрения — 15 рабочих дней. При угрозах жизни — сразу 102."
          kk: "ҚНРДА коллекторларды бақылайды; қарау мерзімі — 15 жұмыс күні. Өмірге қауіп төнсе — бірден 102."
        norm: "АППК РК, ст. 76"

  finance.fraudulent_loan:
    steps:
      - forum: kz.counterparty.claim
        label: {ru: "Банк или МФО, выдавшие кредит, — заявление", kk: "Несие берген банк немесе МҚҰ — өтініш"}
        why:
          ru: "Сначала кредитор: заявить, что кредит оформлен без вас, и попросить проверку; ответ — 15 рабочих дней."
          kk: "Алдымен кредитор: несие сізсіз рәсімделгенін мәлімдеп, тексеру сұрау; жауап — 15 жұмыс күні."
        norm: "Закон РК «О банках и банковской деятельности» 2026, ст. 64; Закон о микрофинансовой деятельности, ст. 17"
      - forum: kz.police
        label: {ru: "Полиция — заявление о мошенничестве", kk: "Полиция — алаяқтық туралы арыз"}
        when: {ru: "параллельно с заявлением в банк", kk: "банкке өтінішпен қатар"}
        why:
          ru: "Заявление о преступлении подаёт сам потерпевший письменно с подписью или электронным документом."
          kk: "Қылмыс туралы арызды жәбірленушінің өзі қолы қойылған жазбаша немесе электрондық құжатпен береді."
        norm: "УПК РК, ст. 180–181"

  labor.unpaid_wages:
    steps:
      - forum: kz.counterparty.claim
        label: {ru: "Руководитель работодателя — требование (в согласительную комиссию, а если её нет — руководителю)", kk: "Жұмыс беруші басшысы — талап (келісім комиссиясына, ол болмаса — басшыға)"}
        why:
          ru: "Требование адресуют руководителю: рассмотреть в согласительной комиссии, а если её нет — решить самому; знать, есть ли комиссия, не нужно. Комиссия — 15 рабочих дней; пока её нет, срок обращения в суд не идёт."
          kk: "Талап басшыға жолданады: келісім комиссиясында қарау, ол болмаса — өзі шешу; комиссияның бар-жоғын білу қажет емес. Комиссия — 15 жұмыс күні; ол жоқ кезде сотқа жүгіну мерзімі жүрмейді."
        norm: "ТК РК, ст. 159 п. 1, ст. 160; ГПК РК, ст. 152 ч. 1 пп. 1"
      - forum: kz.labor_inspection
        label: {ru: "Государственная инспекция труда — жалоба", kk: "Мемлекеттік еңбек инспекциясы — шағым"}
        when: {ru: "если не выплатили — можно параллельно", kk: "төлемесе — қатар беруге болады"}
        why:
          ru: "Инспекция проверяет работодателя; срок ответа — 15 рабочих дней."
          kk: "Инспекция жұмыс берушіні тексереді; жауап мерзімі — 15 жұмыс күні."
        norm: "ТК РК, ст. 191, 195; АППК РК, ст. 76"

  labor.dismissal:
    steps:
      - forum: kz.counterparty.claim
        label: {ru: "Руководитель работодателя — требование (в согласительную комиссию, а если её нет — руководителю)", kk: "Жұмыс беруші басшысы — талап (келісім комиссиясына, ол болмаса — басшыға)"}
        why:
          ru: "Требование адресуют руководителю: рассмотреть в согласительной комиссии, а если её нет — решить самому; знать, есть ли комиссия, не нужно. Комиссия — 15 рабочих дней; пока её нет, срок обращения в суд не идёт."
          kk: "Талап басшыға жолданады: келісім комиссиясында қарау, ол болмаса — өзі шешу; комиссияның бар-жоғын білу қажет емес. Комиссия — 15 жұмыс күні; ол жоқ кезде сотқа жүгіну мерзімі жүрмейді."
        norm: "ТК РК, ст. 159 п. 1, ст. 160; ГПК РК, ст. 152 ч. 1 пп. 1"
      - forum: kz.labor_inspection
        label: {ru: "Государственная инспекция труда — жалоба", kk: "Мемлекеттік еңбек инспекциясы — шағым"}
        when: {ru: "можно параллельно", kk: "қатар беруге болады"}
        why:
          ru: "Инспекция проверяет законность увольнения; срок ответа — 15 рабочих дней."
          kk: "Инспекция жұмыстан шығарудың заңдылығын тексереді; жауап мерзімі — 15 жұмыс күні."
        norm: "ТК РК, ст. 191, 195; АППК РК, ст. 76"

  labor.discrimination:
    steps:
      - forum: kz.counterparty.claim
        label: {ru: "Руководитель работодателя — требование (в согласительную комиссию, а если её нет — руководителю)", kk: "Жұмыс беруші басшысы — талап (келісім комиссиясына, ол болмаса — басшыға)"}
        why:
          ru: "Требование адресуют руководителю: рассмотреть в согласительной комиссии, а если её нет — решить самому; знать, есть ли комиссия, не нужно. Комиссия — 15 рабочих дней; пока её нет, срок обращения в суд не идёт."
          kk: "Талап басшыға жолданады: келісім комиссиясында қарау, ол болмаса — өзі шешу; комиссияның бар-жоғын білу қажет емес. Комиссия — 15 жұмыс күні; ол жоқ кезде сотқа жүгіну мерзімі жүрмейді."
        norm: "ТК РК, ст. 159 п. 1, ст. 160"
      - forum: kz.court.district
        label: {ru: "Районный (городской) суд — иск", kk: "Аудандық (қалалық) сот — талап арыз"}
        when: {ru: "если комиссия не решила вопрос", kk: "комиссия мәселені шешпесе"}
        why:
          ru: "Иск к работодателю — по месту его нахождения."
          kk: "Жұмыс берушіге талап арыз — оның орналасқан жері бойынша."
        norm: "ГПК РК, ст. 29 ч. 2"

  administrative.state_body_inaction:
    steps:
      - forum: kz.gov.superior
        label: {ru: "Вышестоящий орган — жалоба через орган, который не ответил", kk: "Жоғары тұрған орган — жауап бермеген орган арқылы шағым"}
        why:
          ru: "Жалобу подают через сам орган; досудебное обжалование обязательно, если закон не говорит иное. Рассмотрение — 20 рабочих дней."
          kk: "Шағым органның өзі арқылы беріледі; заңда өзгеше көзделмесе, сотқа дейінгі шағымдану міндетті. Қарау — 20 жұмыс күні."
        norm: "АППК РК, ст. 91 ч. 5, ст. 92–93"
      - forum: kz.prosecutor
        label: {ru: "Прокуратура — жалоба", kk: "Прокуратура — шағым"}
        when: {ru: "если вышестоящий орган не исправил нарушение", kk: "жоғары тұрған орган бұзушылықты түзетпесе"}
        why:
          ru: "Прокуратура надзирает за законностью действий госорганов."
          kk: "Прокуратура мемлекеттік органдар әрекеттерінің заңдылығын қадағалайды."
        norm: "Конституционный закон РК «О прокуратуре» от 05.11.2022 № 155-VII, ст. 24"
      - forum: kz.court.district
        label: {ru: "Суд — административный иск", kk: "Сот — әкімшілік талап"}
        when: {ru: "если жалобу не удовлетворили или не ответили за 20 рабочих дней", kk: "шағым қанағаттандырылмаса немесе 20 жұмыс күнінде жауап берілмесе"}
        why: {ru: "Иск об оспаривании или о принуждении — в течение месяца со дня вручения решения по жалобе.", kk: "Дау айту немесе мәжбүрлеу туралы талап — шағым бойынша шешім тапсырылған күннен бастап бір ай ішінде."}
        norm: "АППК РК, ст. 136 п. 1"

  social.benefit_refusal:
    steps:
      - forum: kz.gov.superior
        label: {ru: "Вышестоящий орган — жалоба на отказ в выплате", kk: "Жоғары тұрған орган — төлемнен бас тартуға шағым"}
        why:
          ru: "Отказ обжалуют вышестоящему органу через орган, который отказал."
          kk: "Бас тартуға шешім қабылдаған орган арқылы жоғары тұрған органға шағымданады."
        norm: "Социальный кодекс РК, ст. 123 п. 7; АППК РК, ст. 91 (применимость — спорно)"
      - forum: kz.prosecutor
        label: {ru: "Прокуратура — жалоба", kk: "Прокуратура — шағым"}
        when: {ru: "если отказ оставили в силе", kk: "бас тарту күшінде қалса"}
        why:
          ru: "Прокуратура надзирает за законностью решений госорганов."
          kk: "Прокуратура мемлекеттік органдар шешімдерінің заңдылығын қадағалайды."
        norm: "Конституционный закон РК «О прокуратуре» № 155-VII, ст. 24"

  commercial.b2b_debt:
    steps:
      - forum: kz.counterparty.claim
        label: {ru: "Контрагент — претензия", kk: "Контрагент — наразылық"}
        why:
          ru: "Претензия обязательна, только если её требует договор; без неё суд вернёт иск лишь в этом случае."
          kk: "Наразылық шартта талап етілсе ғана міндетті; онсыз сот талап арызды тек сол жағдайда қайтарады."
        norm: "ГПК РК, ст. 152 ч. 1 пп. 1"
      - forum: kz.court.economic
        label: {ru: "Специализированный межрайонный экономический суд — иск", kk: "Мамандандырылған ауданаралық экономикалық сот — талап арыз"}
        when: {ru: "если не оплатил", kk: "төлемесе"}
        why:
          ru: "Споры между ИП и юрлицами рассматривает экономический суд, по месту нахождения ответчика."
          kk: "ЖК мен заңды тұлғалар арасындағы дауларды жауапкердің орналасқан жеріндегі экономикалық сот қарайды."
        norm: "ГПК РК, ст. 27 ч. 1, ст. 29 ч. 2"

  commercial.contract_breach:
    steps:
      - forum: kz.counterparty.claim
        label: {ru: "Контрагент — претензия", kk: "Контрагент — наразылық"}
        why:
          ru: "Претензия обязательна, только если её требует договор; без неё суд вернёт иск лишь в этом случае."
          kk: "Наразылық шартта талап етілсе ғана міндетті; онсыз сот талап арызды тек сол жағдайда қайтарады."
        norm: "ГПК РК, ст. 152 ч. 1 пп. 1"
      - forum: kz.court.economic
        label: {ru: "Специализированный межрайонный экономический суд — иск", kk: "Мамандандырылған ауданаралық экономикалық сот — талап арыз"}
        when: {ru: "если не исполнил договор", kk: "шартты орындамаса"}
        why:
          ru: "Споры между ИП и юрлицами рассматривает экономический суд, по месту нахождения ответчика."
          kk: "ЖК мен заңды тұлғалар арасындағы дауларды жауапкердің орналасқан жеріндегі экономикалық сот қарайды."
        norm: "ГПК РК, ст. 27 ч. 1, ст. 29 ч. 2"

  administrative.fine_appeal:
    # ZANN 03.10, old.adilet.zan.kz: КоАП ст. 826-1, 826-2 ч. 1, 829-2, 829-3 ч. 3, 829-4
    steps:
      - forum: kz.gov.superior
        label: {ru: "Вышестоящий орган (должностное лицо) — жалоба на постановление", kk: "Жоғары тұрған орган (лауазымды адам) — қаулыға шағым"}
        why:
          ru: "Подаётся через орган, вынесший постановление (он передаёт её за 3 суток), или прямо вышестоящему; срок — 10 суток со дня вручения копии."
          kk: "Қаулы шығарған орган арқылы (ол 3 тәулікте жібереді) немесе тікелей жоғары тұрғанға беріледі; мерзімі — көшірме тапсырылған күннен 10 тәулік."
        norm: "КоАП РК, ст. 826-1, 826-2 ч. 1, 829-4"
      - forum: kz.court.district
        label: {ru: "Суд — жалоба", kk: "Сот — шағым"}
        when: {ru: "если вышестоящий оставил постановление в силе", kk: "жоғары тұрған орган қаулыны күшінде қалдырса"}
        why:
          ru: "Решение вышестоящего органа обжалуют в суд по месту жительства; срок — 10 суток."
          kk: "Жоғары тұрған органның шешіміне тұрғылықты жер бойынша сотқа шағымданады; мерзімі — 10 тәулік."
        norm: "КоАП РК, ст. 829-2, 829-3 ч. 3, 829-4"

  criminal.crime_report:
    # ZANN 03.10: УПК ст. 180 ч. 1 п. 1, ст. 105 ч. 1
    steps:
      - forum: kz.police
        label: {ru: "Полиция — заявление об уголовном правонарушении", kk: "Полиция — қылмыстық құқық бұзушылық туралы арыз"}
        why:
          ru: "Заявление человека — повод к началу досудебного расследования."
          kk: "Адамның арызы — сотқа дейінгі тергеуді бастауға себеп."
        norm: "УПК РК, ст. 180 ч. 1 п. 1"
      - forum: kz.prosecutor
        label: {ru: "Прокурор — жалоба", kk: "Прокурор — шағым"}
        when: {ru: "если по заявлению бездействуют или отказали", kk: "арыз бойынша әрекетсіздік болса немесе бас тартса"}
        why:
          ru: "Жалобу на действия и бездействие органа расследования подают начальнику органа, прокурору или в суд."
          kk: "Тергеу органының әрекетіне және әрекетсіздігіне шағым орган басшысына, прокурорға немесе сотқа беріледі."
        norm: "УПК РК, ст. 105 ч. 1"

  criminal.police_inaction:
    steps:
      - forum: kz.prosecutor
        label: {ru: "Прокурор — жалоба на бездействие органа расследования", kk: "Прокурор — тергеу органының әрекетсіздігіне шағым"}
        why:
          ru: "Жалобы на действия и бездействие тех, кто ведёт расследование, подают начальнику органа, прокурору или в суд."
          kk: "Тергеуді жүргізетіндердің әрекетіне және әрекетсіздігіне шағым орган басшысына, прокурорға немесе сотқа беріледі."
        norm: "УПК РК, ст. 105 ч. 1"

  family.divorce:
    document_title: {ru: "Исковое заявление о расторжении брака", kk: "Некені бұзу туралы талап арыз"}   # ZANN 03.10, § 1.4; kk сверено ZANN 03.10
    # ZANN 03.10 (сверено old.adilet.zan.kz, К1100000518): КоБС ст. 17 п. 1 — ЗАГС при согласии, без общих
    # несовершеннолетних детей и без претензий; ст. 19 п. 2 пп. 1–4 — суд (дети, нет согласия, уклонение, претензии);
    # ГПК ст. 27 ч. 3 — с детьми специализированный суд по делам несовершеннолетних; ст. 29 — по месту жительства
    # ответчика, ст. 30 ч. 7 — по своему, если с вами несовершеннолетние дети, кроме судов столицы, городов
    # республиканского значения и областных центров
    # документы (ZANN 03.10, ГПК ст. 149 п. 4): брак — всегда; свидетельства о рождении — только в суде по делам
    # несовершеннолетних, т. е. когда общие дети есть (documents_children); без детей и пока неизвестно — не просим
    documents: [marriage_certificate]
    documents_children: [birth_certificate]
    # иск о расторжении брака (ZANN 03.10): требование — расторгнуть брак (КоБС ст. 19 п. 1–2); иск неимущественный —
    # цена не указывается (ГПК ст. 148 ч. 2 пп. 7); раздел имущества — отдельное требование (family.property_division)
    claim_demands:
      ru: "1. Расторгнуть брак (супружество), зарегистрированный между истцом и ответчиком."
      kk: "1. Талапкер мен жауапкер арасында тіркелген некені (ерлі-зайыптылықты) бұзу."
    claim_norms: ["КоБС РК, ст. 19 п. 1, 2"]
    claim_unpriced: true
    steps:
      - forum: kz.court.juvenile
        children: "yes"
        label: {ru: "Суд по делам несовершеннолетних — иск о расторжении брака", kk: "Кәмелетке толмағандар істері жөніндегі сот — некені бұзу туралы талап арыз"}
        why:
          ru: "При общих несовершеннолетних детях брак расторгает только суд — специализированный суд по делам несовершеннолетних (где его нет — районный); иск — по месту жительства ответчика; по своему — если дети живут с вами и вы живёте не в столице, не в городе республиканского значения и не в областном центре."
          kk: "Ортақ кәмелетке толмаған балалар болса, некені тек сот бұзады — кәмелетке толмағандар істері жөніндегі мамандандырылған сот (ол жоқ жерде — аудандық сот); талап арыз жауапкердің тұрғылықты жері бойынша беріледі; балалар сізбен тұрса және сіз астанада, республикалық маңызы бар қалада не облыс орталығында тұрмасаңыз — өз тұрғылықты жеріңіз бойынша."
        norm: "КоБС РК, ст. 19 п. 2 пп. 1; ГПК РК, ст. 27 ч. 3, ст. 29, ст. 30 ч. 7"
      - forum: kz.court.district
        children: "no"
        label: {ru: "Районный суд — иск о расторжении брака (при согласии и без претензий — ЗАГС)", kk: "Аудандық сот — некені бұзу туралы талап арыз (келісім болып, талап болмаса — АХАЖ)"}
        why:
          ru: "Без общих несовершеннолетних детей, при согласии обоих и без имущественных претензий брак расторгает ЗАГС по заявлению — суд не нужен. Если супруг не согласен, уклоняется или есть спор об имуществе — иск в районный суд по месту жительства ответчика."
          kk: "Ортақ кәмелетке толмаған балалар болмаса, екеуіңіз келісіп, мүліктік талаптар болмаса, некені АХАЖ өтініш бойынша бұзады — сот қажет емес. Жұбайыңыз келіспесе, жалтарса немесе мүлік туралы дау болса — жауапкердің тұрғылықты жеріндегі аудандық сотқа талап арыз."
        norm: "КоБС РК, ст. 17 п. 1, ст. 19 п. 2 пп. 2–4; ГПК РК, ст. 29"
      - forum: kz.court.district
        children: "unknown"
        label: {ru: "Районный суд — иск о расторжении брака (если есть общие дети до 18 лет — суд по делам несовершеннолетних)", kk: "Аудандық сот — некені бұзу туралы талап арыз (18 жасқа дейінгі ортақ балалар болса — кәмелетке толмағандар істері жөніндегі сот)"}
        why:
          ru: "Суд по делам несовершеннолетних рассматривает развод, только если у супругов есть общие несовершеннолетние дети; без них — районный суд по месту жительства ответчика. Если детей нет, вы оба согласны и нет имущественных претензий — брак расторгает ЗАГС, суд не нужен. Напишите, есть ли общие дети до 18 лет, — суд определится точно."
          kk: "Кәмелетке толмағандар істері жөніндегі сот ажырасуды ерлі-зайыптылардың ортақ кәмелетке толмаған балалары болса ғана қарайды; олар болмаса — жауапкердің тұрғылықты жеріндегі аудандық сот. Балалар болмаса, екеуіңіз келіссеңіз және мүліктік талаптар болмаса — некені АХАЖ бұзады, сот қажет емес. 18 жасқа дейінгі ортақ балалар бар-жоғын жазыңыз — сот нақты анықталады."
        norm: "КоБС РК, ст. 17 п. 1, ст. 19 п. 2; ГПК РК, ст. 27 ч. 3, ст. 29"

  family.child_residence:
    document_title: {ru: "Исковое заявление об определении места жительства ребёнка", kk: "Баланың тұрғылықты жерін анықтау туралы талап арыз"}   # ZANN 03.10, § 1.4; kk — черновик, сверяет ZANN
    # ZANN 03.10: ГПК ст. 27 ч. 3 — определение места жительства ребёнка
    # ZANN 03.10: рождение и родство — свидетельство о рождении; где ребёнок будет жить — документы о жилье;
    # привязанность и условия — справки и характеристики из школы / сада (ГПК ст. 149 п. 4)
    documents: [birth_certificate, housing_documents, child_references]
    steps:
      - forum: kz.court.juvenile
        label: {ru: "Суд по делам несовершеннолетних — иск об определении места жительства ребёнка", kk: "Кәмелетке толмағандар істері жөніндегі сот — баланың тұрғылықты жерін анықтау туралы талап арыз"}
        why:
          ru: "Споры о месте жительства ребёнка и порядке общения с ним рассматривает специализированный суд по делам несовершеннолетних (где его нет — районный суд)."
          kk: "Баланың тұрғылықты жері және онымен қарым-қатынас тәртібі туралы дауларды кәмелетке толмағандар істері жөніндегі мамандандырылған сот қарайды (ол жоқ жерде — аудандық сот)."
        norm: "ГПК РК, ст. 27 ч. 3"

  tax.assessment_dispute:
    # ZANN 03.10: Налоговый кодекс РК от 18.07.2025 № 214-VIII, ст. 191 п. 1–3, ст. 192 п. 1
    steps:
      - forum: kz.gov.superior
        label: {ru: "Уполномоченный орган по налогам — жалоба на уведомление о результатах проверки", kk: "Салық жөніндегі уәкілетті орган — салықтық тексеру нәтижелері туралы хабарламаға шағым"}
        why:
          ru: "Подаётся в течение 30 рабочих дней со дня вручения уведомления, копия — в налоговый орган, проводивший проверку; пока жалобу рассматривают, уведомление в обжалуемой части не исполняется."
          kk: "Хабарлама тапсырылған күннен бастап 30 жұмыс күні ішінде беріледі, көшірмесі — тексеру жүргізген салық органына; шағым қаралып жатқанда хабарлама шағымданған бөлігінде орындалмайды."
        norm: "Налоговый кодекс РК 2025, ст. 191 п. 2–3, ст. 192 п. 1"
      - forum: kz.court.district
        label: {ru: "Суд — административный иск", kk: "Сот — әкімшілік талап"}
        when: {ru: "если жалобу не удовлетворили", kk: "шағым қанағаттандырылмаса"}
        why:
          ru: "Уведомление о результатах налоговой проверки обжалуют в суд по правилам АППК."
          kk: "Салықтық тексеру нәтижелері туралы хабарламаға сотқа ӘРПК қағидалары бойынша шағымданады."
        norm: "Налоговый кодекс РК 2025, ст. 191 п. 1; АППК РК"

  inheritance.acceptance:
    # ZANN 03.10: ГК ОЧ ст. 1072-1 п. 1, 1072-2 п. 1, 1073 п. 1–2
    steps:
      - forum: kz.notary
        label: {ru: "Нотариус по месту открытия наследства — заявление о принятии наследства", kk: "Мұра ашылған жердегі нотариус — мұраны қабылдау туралы өтініш"}
        why:
          ru: "Наследство принимают заявлением нотариусу в течение 6 месяцев со дня открытия наследства; свидетельство выдают по истечении 6 месяцев."
          kk: "Мұра ашылған күннен бастап 6 ай ішінде нотариусқа өтініш беріп қабылданады; мұраға құқық туралы куәлік 6 ай өткен соң беріледі."
        norm: "ГК РК (Особенная часть), ст. 1072-1 п. 1, ст. 1072-2 п. 1, ст. 1073"

  inheritance.dispute:
    # ZANN 03.10: ГПК ст. 31 ч. 1, 3
    steps:
      - forum: kz.court.district
        label: {ru: "Районный (городской) суд — иск по наследству", kk: "Аудандық (қалалық) сот — мұра бойынша талап арыз"}
        why:
          ru: "Иски о восстановлении срока для принятия наследства, о признании недостойным наследником, об отказе от наследства — по месту открытия наследства; о правах на наследственную недвижимость — по месту её нахождения."
          kk: "Мұраны қабылдау мерзімін қалпына келтіру, лайықсыз мұрагер деп тану, мұрадан бас тарту туралы талаптар — мұра ашылған жер бойынша; мұраға қалған жылжымайтын мүлікке құқықтар туралы — оның орналасқан жері бойынша."
        norm: "ГПК РК, ст. 31 ч. 1, 3"

  family.personal_property:
    # ZANN 03.10 (решение ПМ; сверено old.adilet.zan.kz): КоБС ст. 35 п. 1 (личное: до брака; дар, наследство, иные
    # безвозмездные сделки; вещи личного пользования), п. 2 (нажитое при раздельном проживании после фактического
    # прекращения брака); ст. 36 (вложения, значительно увеличившие стоимость, делают общим — контраргумент);
    # ст. 38 п. 1, ст. 39, 40 п. 2 (брачный договор — нотариальный). Иск ещё не подан — иск о признании личной
    # собственностью и исключении из раздела (ГПК ст. 27 ч. 3 / ст. 29, 31 ч. 1); иск уже подан — отзыв на иск
    # (ГПК ст. 166, 10 рабочих дней со дня получения копии иска); встречный иск — ст. 153, 154 (по желанию).
    documents: [title_documents, property_rights_extract, marriage_certificate, marriage_contract]
    documents_children: [birth_certificate]
    document_title: {ru: "Исковое заявление о признании имущества личной собственностью супруга и исключении его из раздела", kk: "Мүлікті жұбайдың жеке меншігі деп тану және оны бөлуден шығару туралы талап арыз"}
    claim_demands:
      ru: "1. Признать имущество, указанное в иске, личной собственностью истца как приобретённое до брака либо полученное в браке в дар, в порядке наследования или по иной безвозмездной сделке (либо отнесённое к собственности истца брачным договором).\n2. Исключить это имущество из состава общего имущества супругов, подлежащего разделу."
      kk: "1. Талап арызда көрсетілген мүлікті некеге дейін сатып алынған не некеде сыйға, мұрагерлік тәртібімен немесе өзге де өтеусіз мәміле бойынша алынған (не неке шартымен талапкердің меншігіне жатқызылған) ретінде талапкердің жеке меншігі деп тану.\n2. Бұл мүлікті ерлі-зайыптылардың бөлінуге жататын ортақ мүлкінің құрамынан шығару."
    claim_norms: ["КоБС РК, ст. 35 п. 1, ст. 38 п. 1, ст. 39, 40"]
    steps:
      - forum: kz.court.pending
        document: response
        document_title: {ru: "Отзыв на исковое заявление о разделе имущества", kk: "Мүлікті бөлу туралы талап арызға пікір"}
        demands:
          ru: "1. Отказать в иске в части раздела имущества, указанного в отзыве: оно является личной собственностью ответчика (приобретено до брака либо получено в дар, по наследству или по иной безвозмездной сделке, либо отнесено к собственности ответчика брачным договором).\n2. Исключить это имущество из состава общего имущества супругов, подлежащего разделу."
          kk: "1. Пікірде көрсетілген мүлікті бөлу бөлігінде талапты қанағаттандырудан бас тарту: ол жауапкердің жеке меншігі (некеге дейін сатып алынған не сыйға, мұрагерлік тәртібімен немесе өзге де өтеусіз мәміле бойынша алынған, не неке шартымен жауапкердің меншігіне жатқызылған).\n2. Бұл мүлікті ерлі-зайыптылардың бөлінуге жататын ортақ мүлкінің құрамынан шығару."
        norms: ["КоБС РК, ст. 35 п. 1, ст. 38 п. 1, ст. 39, 40", "ГПК РК, ст. 166"]
        label: {ru: "Суд, где идёт дело о разделе, — отзыв на иск", kk: "Бөлу туралы іс қаралып жатқан сот — талап арызға пікір"}
        why:
          ru: "Иск о разделе уже подан — ваше имущество защищает отзыв на иск: подаётся в тот же суд не позднее 10 рабочих дней со дня получения копии иска, с документами (покупка до брака, дарение, наследство, брачный договор). Если хотите заявить свои требования к супругу — можно встречный иск до окончания подготовки дела."
          kk: "Бөлу туралы талап арыз берілген — мүлкіңізді талап арызға пікір қорғайды: талап арыздың көшірмесін алған күннен бастап 10 жұмыс күнінен кешіктірмей сол сотқа құжаттармен (некеге дейін сатып алу, сыйға тарту, мұра, неке шарты) беріледі. Жұбайыңызға өз талаптарыңызды қойғыңыз келсе — істі дайындау аяқталғанға дейін қарсы талап қоюға болады."
        norm: "ГПК РК, ст. 166 ч. 1, 2, ст. 153, 154; КоБС РК, ст. 35 п. 1"
      - forum: kz.court.juvenile
        children: "yes"
        label: {ru: "Суд по делам несовершеннолетних — иск о признании имущества личным и исключении из раздела", kk: "Кәмелетке толмағандар істері жөніндегі сот — мүлікті жеке деп тану және бөлуден шығару туралы талап арыз"}
        why:
          ru: "Имущество, купленное до брака или полученное в браке в дар или по наследству, — ваша личная собственность и разделу не подлежит. При общих несовершеннолетних детях имущественный спор супругов рассматривает суд по делам несовершеннолетних. Учтите: если в это имущество в браке вкладывались общие деньги и это значительно увеличило его стоимость, суд может признать его общим."
          kk: "Некеге дейін сатып алынған не некеде сыйға немесе мұраға алынған мүлік — сіздің жеке меншігіңіз, ол бөлінбейді. Ортақ кәмелетке толмаған балалар болса, ерлі-зайыптылардың мүліктік дауын кәмелетке толмағандар істері жөніндегі сот қарайды. Ескеріңіз: некеде бұл мүлікке ортақ қаражат салынып, құны едәуір артса, сот оны ортақ деп тануы мүмкін."
        norm: "КоБС РК, ст. 35 п. 1, ст. 36; ГПК РК, ст. 27 ч. 3"
      - forum: kz.court.district
        label: {ru: "Районный суд — иск о признании имущества личным и исключении из раздела", kk: "Аудандық сот — мүлікті жеке деп тану және бөлуден шығару туралы талап арыз"}
        why:
          ru: "Имущество, купленное до брака или полученное в браке в дар или по наследству, — ваша личная собственность и разделу не подлежит; брачный договор, удостоверенный нотариусом, тоже защищает. Иск — в районный суд по месту жительства ответчика (спор о правах на недвижимость — по месту её нахождения). Учтите: если в это имущество в браке вкладывались общие деньги и это значительно увеличило его стоимость, суд может признать его общим."
          kk: "Некеге дейін сатып алынған не некеде сыйға немесе мұраға алынған мүлік — сіздің жеке меншігіңіз, ол бөлінбейді; нотариус куәландырған неке шарты да қорғайды. Талап арыз — жауапкердің тұрғылықты жеріндегі аудандық сотқа (жылжымайтын мүлікке құқық туралы дау — оның орналасқан жері бойынша). Ескеріңіз: некеде бұл мүлікке ортақ қаражат салынып, құны едәуір артса, сот оны ортақ деп тануы мүмкін."
        norm: "КоБС РК, ст. 35 п. 1, ст. 36, ст. 39, 40; ГПК РК, ст. 29, 31 ч. 1"

  family.property_division:
    # ZANN 03.10 (сверено old.adilet.zan.kz): КоБС ст. 33 п. 1–3 (общее — независимо от того, на кого оформлено),
    # ст. 35 (личное), ст. 36 (вложения), ст. 37 п. 1–3, 6, ст. 38 п. 1, 3 (равные доли, долги), ст. 39–40 (брачный
    # договор); ГПК ст. 27 ч. 3 (при несовершеннолетних детях — суд по делам несовершеннолетних), ст. 29; ст. 31 ч. 1 —
    # спор о правах на недвижимость по месту её нахождения (к разделу — без разъяснения ВС, см. скил zann-family-kz)
    documents: [marriage_certificate, divorce_certificate, title_documents, property_rights_extract,
                vehicle_registration, marriage_contract, loan_contract, valuation]
    documents_children: [birth_certificate]
    document_title: {ru: "Исковое заявление о разделе общего имущества супругов", kk: "Ерлі-зайыптылардың ортақ мүлкін бөлу туралы талап арыз"}
    claim_demands:
      ru: "1. Признать имущество, нажитое в браке и перечисленное в иске, общей совместной собственностью истца и ответчика.\n2. Произвести раздел этого имущества, определив доли истца и ответчика равными — по 1/2, и передать каждому имущество согласно его доле.\n3. Если стоимость имущества, переданного одному из супругов, превышает его долю, — взыскать с него в пользу другого денежную компенсацию.\n4. Распределить общие долги супругов пропорционально присуждённым долям."
      kk: "1. Некеде жинақталған және талап арызда көрсетілген мүлікті талапкер мен жауапкердің ортақ бірлескен меншігі деп тану.\n2. Осы мүлікті бөліп, талапкер мен жауапкердің үлестерін тең — 1/2-ден деп айқындау және әрқайсысына үлесіне сәйкес мүлік беру.\n3. Ерлі-зайыптылардың біріне берілген мүліктің құны оның үлесінен асса — одан екіншісінің пайдасына ақшалай өтемақы өндіру.\n4. Ерлі-зайыптылардың ортақ борыштарын берілген үлестерге пропорционалды бөлу."
    claim_norms: ["КоБС РК, ст. 33 п. 1, 2, ст. 37 п. 1, 3, ст. 38 п. 1, 3"]
    steps:
      - forum: kz.court.juvenile
        children: "yes"
        label: {ru: "Суд по делам несовершеннолетних — иск о разделе общего имущества супругов", kk: "Кәмелетке толмағандар істері жөніндегі сот — ерлі-зайыптылардың ортақ мүлкін бөлу туралы талап арыз"}
        why:
          ru: "Раздел имущества при несовершеннолетних детях рассматривает специализированный суд по делам несовершеннолетних (где его нет — районный). По согласию раздел можно оформить нотариальным соглашением, при споре — медиация или суд. Доли равные, если брачный договор не говорит иное."
          kk: "Кәмелетке толмаған балалар болса, мүлікті бөлуді кәмелетке толмағандар істері жөніндегі мамандандырылған сот қарайды (ол жоқ жерде — аудандық сот). Келісім болса, бөлу нотариаттық келісіммен ресімделеді, дау болса — медиация немесе сот. Неке шартында өзгеше көзделмесе, үлестер тең."
        norm: "КоБС РК, ст. 37 п. 2, 3, ст. 38 п. 1; ГПК РК, ст. 27 ч. 3"
      - forum: kz.court.district
        children: "no"
        label: {ru: "Районный суд — иск о разделе общего имущества супругов", kk: "Аудандық сот — ерлі-зайыптылардың ортақ мүлкін бөлу туралы талап арыз"}
        why:
          ru: "Без общих несовершеннолетних детей — районный суд по месту жительства ответчика; спор о правах на недвижимость — по месту её нахождения. По согласию раздел можно оформить нотариальным соглашением, при споре — медиация или суд. Доли равные, если брачный договор не говорит иное. После развода — 3 года со дня, когда вы узнали о нарушении своего права."
          kk: "Ортақ кәмелетке толмаған балалар болмаса — жауапкердің тұрғылықты жеріндегі аудандық сот; жылжымайтын мүлікке құқық туралы дау — оның орналасқан жері бойынша. Келісім болса, бөлу нотариаттық келісіммен ресімделеді, дау болса — медиация немесе сот. Неке шартында өзгеше көзделмесе, үлестер тең. Ажырасқаннан кейін — құқығыңыздың бұзылғанын білген күннен бастап 3 жыл."
        norm: "КоБС РК, ст. 37 п. 2, 3, 6, ст. 38 п. 1; ГПК РК, ст. 29, ст. 31 ч. 1"
      - forum: kz.court.district
        children: "unknown"
        label: {ru: "Районный суд — иск о разделе общего имущества супругов (если есть общие дети до 18 лет — суд по делам несовершеннолетних)", kk: "Аудандық сот — ерлі-зайыптылардың ортақ мүлкін бөлу туралы талап арыз (18 жасқа дейінгі ортақ балалар болса — кәмелетке толмағандар істері жөніндегі сот)"}
        why:
          ru: "Если у вас есть общие несовершеннолетние дети, раздел рассматривает суд по делам несовершеннолетних; без них — районный суд по месту жительства ответчика. Напишите, есть ли общие дети до 18 лет, — суд определится точно. Доли равные, если брачный договор не говорит иное."
          kk: "Ортақ кәмелетке толмаған балаларыңыз болса, бөлуді кәмелетке толмағандар істері жөніндегі сот қарайды; олар болмаса — жауапкердің тұрғылықты жеріндегі аудандық сот. 18 жасқа дейінгі ортақ балалар бар-жоғын жазыңыз — сот нақты анықталады. Неке шартында өзгеше көзделмесе, үлестер тең."
        norm: "КоБС РК, ст. 37 п. 3, ст. 38 п. 1; ГПК РК, ст. 27 ч. 3, ст. 29"

  family.alimony:
    document_title: {ru: "Исковое заявление о взыскании алиментов на содержание несовершеннолетних детей", kk: "Кәмелетке толмаған балаларды асырауға алимент өндіріп алу туралы талап арыз"}   # ZANN 03.10, § 1.4; kk — черновик, сверяет ZANN
    # ZANN 03.10: родство — свидетельство о рождении; брак / развод — свидетельство; доход ответчика (КоБС ст. 139)
    documents: [birth_certificate, marriage_certificate, divorce_certificate, pay_slip]
    steps:
      - forum: kz.court.juvenile
