        norm: "Закон РК «О жилищных отношениях», ст. 51-1, 51-5, 51-6"
      - authority: housing_inspection
        label: {ru: "Жилищная инспекция — жалоба", kk: "Тұрғын үй инспекциясы — шағым"}
        when: {ru: "если не ответили или отказали", kk: "жауап бермесе немесе бас тартса"}
        why: {ru: "Жилищная инспекция местного исполнительного органа контролирует управление домом.", kk: "Жергілікті атқарушы органның тұрғын үй инспекциясы үйді басқаруды бақылайды."}
        norm: "Закон РК «О жилищных отношениях», ст. 10-9"
  kz.housing.utility_billing:
    steps:
      - party: true
        label: {ru: "Поставщик или расчётный центр — заявление о перерасчёте", kk: "Жеткізуші немесе есеп айырысу орталығы — қайта есептеу туралы өтініш"}
        why: {ru: "Сначала поставщик; без претензии нельзя жаловаться в госорган.", kk: "Алдымен жеткізуші; наразылықсыз мемлекеттік органға шағымдануға болмайды."}
        norm: "Закон РК «О защите прав потребителей», ст. 42-4; Типовые правила № 249, п. 21 пп. 7"
      - forum: kz.regulator.consumer
        label: {ru: "Департамент защиты прав потребителей — жалоба", kk: "Тұтынушылардың құқықтарын қорғау департаменті — шағым"}
        when: {ru: "если отказали или не ответили", kk: "бас тартса немесе жауап бермесе"}
        why: {ru: "Рассмотрение — 15 рабочих дней.", kk: "Қарау — 15 жұмыс күні."}
        norm: "Закон РК «О защите прав потребителей», ст. 42-5; АППК РК, ст. 76"
  kz.administrative.fine_appeal:
    steps:
      - party: true
        label: {ru: "Вышестоящий орган (должностное лицо) — жалоба на постановление", kk: "Жоғары тұрған орган (лауазымды адам) — қаулыға шағым"}
        why: {ru: "Жалобу подают в вышестоящий орган или сразу в суд — на выбор; срок — 10 суток.", kk: "Шағым жоғары тұрған органға немесе бірден сотқа — таңдау бойынша; мерзімі — 10 тәулік."}
        norm: "КоАП РК, ст. 826-1–826-4"
  kz.gov.inaction_complaint:
    steps:
      - party: true
        label: {ru: "Вышестоящий орган — жалоба через орган, который не ответил", kk: "Жоғары тұрған орган — жауап бермеген орган арқылы шағым"}
        why: {ru: "Досудебное обжалование обязательно, если закон не говорит иное; рассмотрение — 20 рабочих дней.", kk: "Заңда өзгеше көзделмесе, сотқа дейінгі шағымдану міндетті; қарау — 20 жұмыс күні."}
        norm: "АППК РК, ст. 91 ч. 5, ст. 92–93"
      - forum: kz.court.district
        label: {ru: "Суд — административный иск", kk: "Сот — әкімшілік талап"}
        when: {ru: "если жалобу не удовлетворили или не ответили за 20 рабочих дней", kk: "шағым қанағаттандырылмаса немесе 20 жұмыс күнінде жауап берілмесе"}
        why: {ru: "Иск об оспаривании или о принуждении — в течение месяца со дня вручения решения по жалобе.", kk: "Дау айту немесе мәжбүрлеу туралы талап — шағым бойынша шешім тапсырылған күннен бастап бір ай ішінде."}
        norm: "АППК РК, ст. 136 п. 1"
  kz.social.benefit_refusal_appeal:
    steps:
      - party: true
        label: {ru: "Вышестоящий орган — жалоба на отказ в выплате", kk: "Жоғары тұрған орган — төлемнен бас тартуға шағым"}
        why: {ru: "Отказ обжалуют вышестоящему органу через орган, который отказал.", kk: "Бас тартуға шешім қабылдаған орган арқылы жоғары тұрған органға шағымданады."}
        norm: "Социальный кодекс РК, ст. 123 п. 7"
  kz.family.alimony:
    steps:
      - forum: kz.court.juvenile
        label: {ru: "Суд по делам несовершеннолетних (где его нет — районный суд) — иск", kk: "Кәмелетке толмағандар істері жөніндегі сот (ол жоқ жерде — аудандық сот) — талап арыз"}
        why: {ru: "Алименты на детей — специализированный суд; подать можно по своему месту жительства.", kk: "Балаларға алимент — мамандандырылған сот; өз тұрғылықты жеріңіз бойынша беруге болады."}
        norm: "ГПК РК, ст. 27 ч. 3, ст. 30 ч. 4"
  kz.civil.road_accident:
    steps:
      - party: true
        label: {ru: "Страховая компания виновника — заявление о выплате", kk: "Кінәлінің сақтандыру компаниясы — төлем туралы өтініш"}
        why: {ru: "Сначала страховщик по ОГПО.", kk: "Алдымен ОГПО бойынша сақтандырушы."}
        norm: "Закон РК об ОГПО владельцев транспортных средств, ст. 26, 29-1"
      - authority: arrf
        label: {ru: "АРРФР — жалоба на страховщика", kk: "ҚНРДА — сақтандырушыға шағым"}
        when: {ru: "если отказал или занизил выплату", kk: "бас тартса немесе төлемді азайтса"}
        why: {ru: "Регулятор страхового рынка; срок — 15 рабочих дней. Иск к страховщику — по своему месту жительства.", kk: "Сақтандыру нарығының реттеушісі; мерзім — 15 жұмыс күні. Сақтандырушыға талап арыз — өз тұрғылықты жеріңіз бойынша."}
        norm: "АППК РК, ст. 76; ГПК РК, ст. 30 ч. 11"
  kz.business.debt_claim:
    steps:
      - party: true
        label: {ru: "Должник (ИП или ТОО) — претензия", kk: "Борышкер (ЖК немесе ЖШС) — наразылық"}
        why: {ru: "Обязательна, только если её требует договор.", kk: "Шартта талап етілсе ғана міндетті."}
        norm: "ГПК РК, ст. 152 ч. 1 пп. 1"
      - forum: kz.court.economic
        label: {ru: "Специализированный межрайонный экономический суд — иск", kk: "Мамандандырылған ауданаралық экономикалық сот — талап арыз"}
        when: {ru: "если не оплатил", kk: "төлемесе"}
        why: {ru: "Споры между ИП и юрлицами; по месту нахождения ответчика.", kk: "ЖК мен заңды тұлғалар арасындағы даулар; жауапкердің орналасқан жері бойынша."}
        norm: "ГПК РК, ст. 27 ч. 1, ст. 29 ч. 2"
  kz.business.supply_claim:
    steps:
      - party: true
        label: {ru: "Поставщик — претензия", kk: "Жеткізуші — наразылық"}
        why: {ru: "Обязательна, только если её требует договор.", kk: "Шартта талап етілсе ғана міндетті."}
        norm: "ГПК РК, ст. 152 ч. 1 пп. 1"
      - forum: kz.court.economic
        label: {ru: "Специализированный межрайонный экономический суд — иск", kk: "Мамандандырылған ауданаралық экономикалық сот — талап арыз"}
        when: {ru: "если не исполнил", kk: "орындамаса"}
        why: {ru: "Споры между ИП и юрлицами; по месту нахождения ответчика.", kk: "ЖК мен заңды тұлғалар арасындағы даулар; жауапкердің орналасқан жері бойынша."}
        norm: "ГПК РК, ст. 27 ч. 1, ст. 29 ч. 2"
  kz.business.lease_termination:
    steps:
      - party: true
        label: {ru: "Арендодатель или арендатор — уведомление о расторжении", kk: "Жалға беруші немесе жалға алушы — бұзу туралы хабарлама"}
        why: {ru: "Порядок и срок уведомления — по договору аренды (норма не подтверждена).", kk: "Хабарлау тәртібі мен мерзімі — жалға алу шарты бойынша (норма расталмаған)."}
        norm: "не подтверждено"
  kz.business.inspection_complaint:
    steps:
      - party: true
        label: {ru: "Вышестоящий орган — жалоба на проверку", kk: "Жоғары тұрған орган — тексеруге шағым"}
        why: {ru: "Жалоба через орган, который проводил проверку.", kk: "Тексеру жүргізген орган арқылы шағым."}
        norm: "АППК РК, ст. 91–93 (для проверок бизнеса — не подтверждено)"
  kz.business.tax_audit_appeal:
    steps:
      - party: true
        label: {ru: "Министерство финансов (уполномоченный орган) — жалоба на уведомление", kk: "Қаржы министрлігі (уәкілетті орган) — хабарламаға шағым"}
        why: {ru: "Налоговый спор сначала обжалуют в уполномоченный орган (порядок НК 2025 — не подтверждено).", kk: "Салық дауына алдымен уәкілетті органға шағымданады (2025 СК тәртібі — расталмаған)."}
        norm: "не подтверждено"
  kz.business.procurement_complaint:
    steps:
      - party: true
        label: {ru: "Заказчик — жалоба", kk: "Тапсырыс беруші — шағым"}
        why: {ru: "Сначала заказчик закупки (норма не подтверждена).", kk: "Алдымен сатып алуды тапсырыс беруші (норма расталмаған)."}
        norm: "не подтверждено"
