# Jurisdiction pack: Kazakhstan. Pure data — the core never branches on country.
country: KZ
name: {ru: Казахстан, kk: Қазақстан}
currency: KZT
timezone: Asia/Almaty
languages: [ru, kk]
default_language: ru
status: live
# Non-working days for business_days deadlines. TODO(lawyer): confirm the 2026-2027 list
# (movable dates such as Kurban ait and transfer days are set by government decree).
holidays:
  - 2026-01-01
  - 2026-01-02
  - 2026-01-07
  - 2026-03-08
  - 2026-03-09
  - 2026-03-21
  - 2026-03-23
  - 2026-03-24
  - 2026-05-01
  - 2026-05-07
  - 2026-05-09
  - 2026-05-27
  - 2026-07-06
  - 2026-08-30
  - 2026-08-31
  - 2026-10-25
  - 2026-10-26
  - 2026-12-16
reminder_before_days: [2, 0]
# ИИН: 7-я цифра — век рождения и пол (1, 3, 5 — мужской; 2, 4, 6 — женский). Только для грамматики документа
# («приобрёл» / «приобрела»), когда в ФИО нет отчества.
id_number_sex: {position: 7, male: "135", female: "246"}
# Официальное оформление документов — правила юриста team/legal-drafts/document-rules.md D-23…D-31
# (Правила документирования, приказ МКС от 25.08.2023 № 236): поля 25/15/20/20 мм, TNR 14 (приложения 12),
# интервал 1,0, отступ 1,25 см (ориентир), дата словами, подпись «И. Фамилия», номера страниц со 2-й сверху.
document_style:
  font: Times New Roman
  size: 14
  small_size: 12
  line_spacing: 1.0
  first_line_cm: 1.25
  margin_left_mm: 25
  margin_right_mm: 15
  margin_top_mm: 20
  margin_bottom_mm: 20
  header_indent_cm: 8.0
  page_numbers_from: 2
  date_in_words: true
  signature: initial_surname
authorities:
  # Наименование — приказ Заместителя Премьер-Министра — Министра торговли и интеграции РК от 29.12.2022 № 508-НҚ
  # «О некоторых вопросах структурных подразделений…» (https://adilet.zan.kz/rus/docs/G22TI000508; каз. текст —
  # /kaz/docs/G22TI000508), открыт 28.09.2026: РГУ «Департамент торговли и защиты прав потребителей Министерства торговли
  # и интеграции Республики Казахстан по <городу/области>», функция — рассмотрение обращений. Обращение потребителя —
  # Закон о ЗПП, ст. 42-5 (https://adilet.zan.kz/rus/docs/Z100000274_). Канал eotinish.kz — портал обращений в
  # госорганы (заголовок страницы «Подавайте официальные обращения в госорганы | eOtinish», проверен 28.09.2026);
  # на странице Комитета по защите прав потребителей на gov.kz (entities/mti-kzpp) ссылка «Написать обращение» ведёт
  # на egov.kz (раздел обращений). Адрес Единой информационной системы защиты прав потребителей (ст. 42-5) — TODO(lawyer).
  consumer_protection:
    name:
      ru: "Департамент торговли и защиты прав потребителей Министерства торговли и интеграции Республики Казахстан по области (городу) по месту нахождения продавца (исполнителя)"
      kk: "Қазақстан Республикасы Сауда және интеграция министрлігінің сатушы (орындаушы) орналасқан облыс (қала) бойынша сауда және тұтынушылардың құқықтарын қорғау департаменті"
    submit_url: https://eotinish.kz
    norm_ref: "Закон Республики Казахстан «О защите прав потребителей», статья 42-5"
  arrf:
    name:
      ru: "Агентство Республики Казахстан по регулированию и развитию финансового рынка (АРРФР)"
      kk: "Қазақстан Республикасының Қаржы нарығын реттеу және дамыту агенттігі (ҚНРДА)"
    # Адрес и канал — страница «Онлайн-приемная» АРРФР на gov.kz (https://www.gov.kz/memleket/entities/ardfm/activities/population,
    # открыта 28.09.2026): «г. Алматы, мкр. „Коктем-3“, д. 21»; «Для подачи обращений: https://eotinish.kz»;
    # info@finreg.kz — «не для подачи обращений». Рассмотрение обращений — АППК РК (ст. 63 — реквизиты, ст. 76 — срок),
    # https://adilet.zan.kz/rus/docs/K2000000350.
    address: {ru: "г. Алматы, мкр. «Коктем-3», д. 21", kk: "Алматы қ., «Көктем-3» ш.а., 21-үй"}
    submit_url: https://eotinish.kz
    norm_ref: "Административный процедурно-процессуальный кодекс Республики Казахстан, статья 63"
  # Жилищная инспекция названа в Законе РК «О жилищных отношениях», статья 10-9
  # (https://adilet.zan.kz/rus/docs/Z970000094_, проверено 28.09.2026). Точное наименование подразделения
  # местного исполнительного органа и канал подачи — TODO(lawyer).
  housing_inspection:
    name:
      ru: "Жилищная инспекция местного исполнительного органа по месту нахождения дома (наименование уточнит юрист)"
      kk: "Үй орналасқан жердегі жергілікті атқарушы органның тұрғын үй инспекциясы (атауын заңгер нақтылайды)"
    norm_ref: "Закон Республики Казахстан «О жилищных отношениях», статья 10-9"
  # Банковский омбудсман — Закон РК «О банках и банковской деятельности в Республике Казахстан», статья 36,
  # пункт 1-3 (https://adilet.zan.kz/rus/docs/Z950002444_, проверено 28.09.2026). Адрес и канал — TODO(lawyer).
  bank_ombudsman:
    name:
      ru: "Банковский омбудсман (адрес и способ подачи уточнит юрист)"
      kk: "Банк омбудсманы (мекенжайы мен беру тәсілін заңгер нақтылайды)"
    norm_ref: "Закон Республики Казахстан «О банках и банковской деятельности в Республике Казахстан», статья 36"
compliance:
  ai_label:
    ru: "Подготовлено с помощью ИИ (Konsiliér AI). Проверьте данные перед подачей."
    kk: "ЖИ көмегімен дайындалған (Konsiliér AI). Тапсырар алдында деректерді тексеріңіз."
  draft_disclaimer:
    ru: "Документ подготовлен IT-сервисом Konsiliér AI по вашим данным. Проверьте сведения перед подачей."
    kk: "Құжатты Konsiliér AI IT-сервисі сіздің деректеріңіз бойынша дайындады. Тапсырар алдында мәліметтерді тексеріңіз."
  service_disclaimer:
    ru: "Konsiliér AI помогает подготовить и подать документы и следит за сроками. Если нужно довести дело до результата — подключим профессионального юриста платформы. Документы подаются от вашего имени."
    kk: "Konsiliér AI құжаттарды дайындауға және беруге көмектеседі, мерзімдерді бақылайды. Істі нәтижеге жеткізу керек болса — платформаның кәсіби заңгерін қосамыз. Құжаттар сіздің атыңыздан беріледі."
