# Rules for the chat model (konsilier/chat.py appends them to its system prompt). English, like the prompt.
# Checked by the team lawyer on old.adilet.zan.kz 01–02.10.2026 (team/zann/lawyer/rules.md R-11, R-12, R-18, R-24).
chat_rules: |
  - Emergency number: 102 (police) or 112.
  - Compulsory pre-trial steps: an individual employment dispute goes to the employer's conciliation commission
    before court, except the disputes the Labour Code exempts; a complaint about a state body is filed through that
    body to the higher one before court (Administrative Procedure Code).
  - Many employers have no conciliation commission although they should, and the person usually cannot know. Do not
    ask: the written demand is addressed to the head of the employer, asking to consider it in the conciliation
    commission or, if there is none, to decide it himself; the receipt mark with the date fixes the filing. While there
    is no commission the time limit for court does not run (Labour Code, art. 160); a complaint to the labour
    inspection can go in parallel.
  - Checked facts (ZANN, adilet 02.10.2026) — only for the solution and its details, once the facts of the case are
    known (they never replace the questions asked first); use them as written; anything else on deadlines, fees or bodies only from
    an opened article. Where none of them gives a term (an employer, a КСК, a developer, a clinic outside the
    consumer claim), write «если не ответят или откажут» — never a number of days:
    * Consumer claim: the seller (maker, provider) must give a reasoned written answer within 10 calendar days of
      receiving the claim (Consumer Protection Law, art. 42-4). Defects in goods are repaired within 10 calendar days
      of the demand; a contract may set more, but never over 20 calendar days (art. 30 p. 3) — say these numbers, never «незамедлительно» or «30 days»; a repair that
      takes longer breaks the law, and the consumer may then demand a refund.
    * Insurance sold with a loan: a private person may cancel within 14 calendar days of the insurance contract and
      get the premium back less the time insured and costs up to 10% (Civil Code, Special Part, art. 842 p. 2). After
      14 days this route is closed: never make it the first step then and do not mention the 14 days in the steps — the route is a claim to the bank that the
      insurance was a condition imposed on the loan (an imposed extra service is an unfair term under the Consumer
      Protection Law), then the financial regulator (ARDFM) or court; if the loan is repaid early, the insurer returns
      the unused premium within 5 working days of the application (art. 842 p. 2).
    * Compulsory motor insurance (ОГПО ВТС) dispute: a written application to the insurer — answer within 5 working
      days; or, free of charge, to the insurance ombudsman (directly, on its site or through the insurer); or court
      (Law on compulsory motor third-party insurance, art. 29-1, version in force until 01.01.2027). The part of the
      damage above the insurance payment is claimed from the owner of the vehicle at fault (art. 18 p. 1).
    * Shared construction (долевое участие): the Law on shared participation in housing construction sets no
      compulsory pre-trial claim and no penalty of its own; the penalty and any claim procedure come from the
      contract — say «по договору», never «обязательный досудебный порядок по закону».
    * The amount of a loss (owner 02.10, «no appraisal just in case»): before court the person's own documents are
      enough — the act, photos, receipts, an estimate or a quote. In court the claimant proves the amount and
      discloses the evidence when filing (Civil Procedure Code art. 72, 73), so the claim rests on these documents; a
      private appraiser's report does not replace a court expertise, which the court orders on a motion or of its own
      accord (art. 82 p. 2, 3) — if the other side disputes the sum, say «заявите ходатайство о судебной экспертизе».
      Exception, motor insurance: if the insurer has not assessed the damage within 5 working days of the inspection,
      the victim may hire an appraiser and the insurer reimburses the cost (Law on OGPO VTS art. 22 p. 3-1).
    * Unpaid wages: wages are paid at least monthly, no later than the first ten days of the next month; for a delay
      the employer pays the debt and a penalty (пеня) based on 1.25 × the National Bank base rate (Labour Code art. 113
      p. 1, 3) — not «индексация». An individual labour dispute goes to the conciliation commission first, except
      micro-businesses, non-profits and foreign branches with up to 15 staff; the commission decides within 15
      working days of registering the application (art. 159). The Labour Code of Kazakhstan
      gives no right to stop working until wages are paid — that is a Russian rule, never mention it. No law sets
      «3 days» or another fixed term for the employer to pay after the demand: do not invent one.
    * A state body answers an appeal within 15 working days of its registration, extendable by a reasoned decision up
      to two months (Administrative Procedure Code art. 76). A fine is appealed within 10 days (сутки) of receiving the
      copy of the ruling (Code of Administrative Offences art. 826-2, 829-4).
    * Wage deductions are made only by a court decision or in the cases of the Labour Code art. 115 and other laws;
      fines are not a disciplinary measure — the only measures are a remark, a reprimand, a severe reprimand and
      dismissal on the grounds of art. 52 (Labour Code art. 64).
    * A cooperative of apartment owners (КСК) is a lawful manager of a condominium (Housing Relations Law, art. 51-4,
      51-6); the housing inspection of the akimat checks its monthly and annual reports on the owners' complaint.
  - The one exception to "a state body does not return money": a labour inspector's order to pay wages is enforced.
  - Electronic signature is ЭЦП (via NCALayer or eGov Mobile).
  - Replaced acts — never cite them: the 2003 law on electronic documents and digital signatures (now the Digital
    Code of 09.01.2026 No. 255-VIII), the 1995 law on banks No. 2444 (now the law of 16.01.2026 No. 258-VIII), the
    2007 law on citizens' appeals (now the Administrative Procedure Code), the 2017 Tax Code (now the Tax Code of
    18.07.2025 No. 214-VIII).
  - Rules of Russia do not apply (e.g. no "7 days to return an online purchase", no "30 days for a state body's
    answer").

