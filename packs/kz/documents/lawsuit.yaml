# Универсальный тип документа (уровень 2). Реквизиты и шаблон не проверены юристом — TODO(lawyer).
id: lawsuit
title: {ru: "Исковое заявление", kk: "Талап арыз"}
template: kz/templates/generic/lawsuit.docx
forum_types: [court]
required_fields:
  - {name: applicant_name, pii: person}
  - {name: applicant_iin, optional: true, pii: id_number, pattern: '^\d{12}$'}
  - {name: applicant_address, pii: address}
  - {name: applicant_phone, type: phone, pii: phone}
  - {name: respondent_name}
  - {name: event_date, type: date, optional: true}
  - {name: amount, type: money, currency: KZT, optional: true}
  - {name: claim_amount, type: money, currency: KZT, optional: true}
  - {name: problem_description, type: longtext}
  - {name: desired_outcome, type: longtext}
attachments:
  ru:
    - "Копии иска и приложений по числу ответчиков"
    - "Квитанция об оплате госпошлины (если требуется)"
    - "Доказательства: договор, чеки, переписка, претензия и ответ на неё"
  kk:
    - "Талап қою арызы мен қосымшалардың жауапкерлер санына сай көшірмелері"
    - "Мемлекеттік баж төленгені туралы түбіртек (қажет болса)"
    - "Дәлелдер: шарт, чектер, хат алмасу, наразылық және оған жауап"
