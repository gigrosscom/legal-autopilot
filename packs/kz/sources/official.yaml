# Библиотека официальных страниц (docs/official-library.md): что краулер забирает ночью и что ищет чат.
# Только эти домены (точное имя хоста; поддомены — отдельной записью). Страницы — только HTML; robots.txt
# соблюдается; не чаще 1 запроса в секунду на домен.
#
# Проверено 29.09.2026 из среды разработки (curl, User-Agent KonsilierBot/1.0):
# - www.gov.kz — страницы отдаются сервером (текст в HTML): «жизненные ситуации» (/situations/<n>/intro — вся
#   ситуация на одной странице), стандарты услуг (/services/<n>), страницы ведомств. robots.txt закрывает
#   /legalacts/, /page/, /uploads/, */search/.
# - gfss.kz — ГФСС: социальные выплаты и отчисления, HTML. robots.txt не опубликован (отдаётся HTML) — всё открыто.
# - enbek.kz — Электронная биржа труда: меры содействия занятости, HTML. robots.txt закрывает поиск, PDF.
# - damu.kz — Фонд «Даму»: страницы программ HTML; список программ подгружается скриптом, поэтому он берётся из
#   фрагмента load_programs.php (страница-«хаб»: из неё только ссылки, в поиск она не попадает).
# - old.goszakup.gov.kz — портал госзакупок (старый интерфейс, HTML); robots.txt: Crawl-delay 5.
# Не включены: egov.kz (новый сайт целиком рисуется скриптом — в HTML нет текста, старые /cms/ru/… ведут на главную),
# zakup.gov.kz (новая платформа закупок — только скрипт), adilet.zan.kz (новый сайт — только скрипт; нормы закона
# чат и так открывает живьём через инструменты юридического агента), www.gfss.kz (не открывается: 502).
country: KZ
max_pages_per_domain: 400
max_depth: 2

domains:
  - domain: www.gov.kz
    name: {ru: "gov.kz — единая платформа госорганов", kk: "gov.kz — мемлекеттік органдардың бірыңғай платформасы"}
    about:
      ru: "жизненные ситуации (рождение ребёнка, пособия, брак и развод, алименты, жильё, работа, пенсия, штрафы) и стандарты госуслуг: кто оказывает, документы, сроки"
      kk: "өмірлік жағдайлар (бала туу, жәрдемақы, неке, алимент, тұрғын үй, жұмыс, зейнетақы, айыппұл) және мемлекеттік қызмет стандарттары"
    lang: ru
    keep_query: [lang]
    default_query: {lang: ru}
    include:
      - '^/situations/\d+/intro'
      - '^/services/\d+'
      - '^/article/\d+'
      - '^/memleket/entities/[a-z0-9-]+\?'
      - '^/memleket/entities/[a-z0-9-]+/activities/\d+'
    exclude:
      - '[?&]lang=(en|kk)'
      - '^/legalacts/'
      - '^/uploads/'
      - '/search'
    # стандарты услуг вставлены в текст ситуаций как данные: {"id":…,"source_id":3042,"title":…}
    link_patterns:
      - match: '"source_id"\s*:\s*"?(\d+)'
        url: 'https://www.gov.kz/services/{1}?lang=ru'
  - domain: gfss.kz
    name: {ru: "ГФСС — Государственный фонд социального страхования", kk: "МӘСҚ — Мемлекеттік әлеуметтік сақтандыру қоры"}
    about:
      ru: "социальные выплаты из фонда: по беременности и родам, по уходу за ребёнком до 1 года, по потере работы, по утрате трудоспособности, по потере кормильца; социальные отчисления"
      kk: "қордан әлеуметтік төлемдер: жүктілік және босану, бала күтімі, жұмыстан айырылу, еңбек ету қабілетінен айырылу, асыраушысынан айырылу"
    lang: ru
    include:
      - '^/ru/(socpayments|socotchisleniya|топ-вопросов)/'
    exclude:
      - '/retrieve/'
      - '/списки-плательщиков'
  - domain: enbek.kz
    name: {ru: "Enbek.kz — электронная биржа труда", kk: "Enbek.kz — еңбектің электрондық биржасы"}
    about:
      ru: "меры содействия занятости: пособие по безработице, субсидируемые рабочие места, обучение, переселение, центры занятости"
      kk: "жұмыспен қамтуға жәрдемдесу шаралары"
    lang: ru
    include:
      - '^/ru/(how-to-get-state-employment-support|employment-services|czn-digital-services|resettlement|national-projects|page/)'
    exclude:
      - '/search/'
      - '/vacancy/'
  - domain: damu.kz
    name: {ru: "Фонд «Даму»", kk: "«Даму» қоры"}
    about:
      ru: "поддержка бизнеса: субсидирование ставки, гарантии по кредитам, льготные кредиты и лизинг, обучение предпринимателей"
      kk: "бизнесті қолдау: мөлшерлемені субсидиялау, кепілдіктер, жеңілдікті несиелер мен лизинг"
    lang: ru
    include:
      - '^/ru/programmi/[a-z_]+/[a-z0-9_-]+'
      - '^/ru/obratnaya-svyaz/faq'
      - '^/bitrix/templates/[A-Za-z_]+/ajax/load_programs\.php'
    keep_query: [TAB]
    hubs:
      - '/ajax/load_programs\.php'
    link_patterns:
      - match: 'href="/programmi/([a-z_]+/[a-z0-9_-]+)"'
        url: 'https://damu.kz/ru/programmi/{1}'
  - domain: old.goszakup.gov.kz
    name: {ru: "Портал государственных закупок", kk: "Мемлекеттік сатып алу порталы"}
    about:
      ru: "государственные закупки: объявления, реестры жалоб и недобросовестных поставщиков, национальный режим, как стать поставщиком"
      kk: "мемлекеттік сатып алу: хабарландырулар, шағымдар мен жосықсыз өнім берушілер тізілімдері"
    lang: ru
    include:
      - '^/ru/welcome/'
      - '^/ru/news/view/\d+'
    drop:  # шапка портала на каждой странице
      - '^Архив$'
      - '^Количество зарегистрированных пользователей'
      - '^KZ RU$'
      - '^Помощь по платным услугам$'
      - '^Внимание! Соединение с приложением прервано'
      - '^Подождите, идет загрузка данных'
    max_pages: 60

