# «Доставить курьером» — пилот «Курьер» (решение владельца 01.10.2026, team/strategy/courier-delivery.md):
# после оплаты документа клиент заказывает доставку: курьер забирает у клиента 2 экземпляра, подписанных клиентом,
# вручает ответчику под подпись на втором экземпляре и возвращает второй экземпляр клиенту.
# Читает konsilier/courier (ядро о стране не знает). Ключи служб — только в настройках сервера.
enabled: true
price: 3990            # ₸, туда и обратно (решение 01.10)
currency: KZT
# Пилот: только Алматы (20 доставок), затем Астана и Шымкент — новой строкой здесь.
cities:
  - id: almaty
    name: {ru: Алматы, kk: Алматы, en: Almaty}
    cdek_city_code: 4756      # код города в справочнике СДЭК (/v2/location/cities) — проверить на тестовом аккаунте
    alemtat_locality: ""      # TODO(договор Алем ТАТ): LocalityCode Алматы из Catalog/getCitiesByCountry
    alemtat_station: ""       # TODO(договор Алем ТАТ): код принимающей станции (ReceivingStation)
# Окна забора (местное время). Забор не раньше чем через lead_hours от заказа, не дальше max_days дней.
windows: ["10:00-14:00", "14:00-18:00"]
lead_hours: 2
max_days: 14
# Настройки служб (не секреты). Коды тарифов и услуг — уточнить у менеджера службы при договоре.
cdek:
  currency: 2                 # валюта расчёта СДЭК: 2 — тенге
  tariff_code: 480            # «Экспресс дверь-дверь» — уточнить для КЗ (или выбрать по /v2/calculator/tarifflist)
  services: [REVERSE]         # «Реверс»: подписанный экземпляр возвращается отправителю
  package: {weight: 300, length: 32, width: 23, height: 2}   # граммы и сантиметры: конверт А4
alemtat:
  service: "E"                # экспресс по РК (Calc/getAmountV2: E — экспресс, T — не срочные)
  country: "KZ"               # TODO(договор): локальный код страны из справочника Алем ТАТ
  weight: 0.3
