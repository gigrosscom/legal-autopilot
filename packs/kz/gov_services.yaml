    auth: ecp_or_egov_mobile
    evidence_for: [family]
    note: {ru: "Онлайн — если рождение зарегистрировано после 13.08.2007. Нужна госпошлина.", kk: "Онлайн — егер туу 13.08.2007-ден кейін тіркелсе. Мемлекеттік баж керек."}
