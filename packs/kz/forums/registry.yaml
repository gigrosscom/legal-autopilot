  - id: kz.prosecutor
    type: prosecutor
    instance: any
    name:
      ru: "Органы прокуратуры по месту (уточнит юрист)"
      kk: "Жергілікті прокуратура органдары (заңгер нақтылайды)"
    accepts:
      # social.benefit_refusal: a refusal of a benefit is a refusal by a state body — the same route as before the
      # social branch existed (TODO(lawyer): confirm; see docs/lawyer/new-topics.md)
      - dispute_types: [criminal.police_inaction, administrative.state_body_inaction, social.benefit_refusal]
        applicant_roles: [victim, complainant]
