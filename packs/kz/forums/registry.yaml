  - id: kz.labor_inspection
    type: local_authority
    instance: first
    name:
      ru: "Территориальное подразделение уполномоченного государственного органа по труду (государственная инспекция труда) по области, городу республиканского значения, столице — по месту работы"
      kk: "Еңбек жөніндегі уәкілетті мемлекеттік органның облыс, республикалық маңызы бар қала, астана бойынша аумақтық бөлімшесі (мемлекеттік еңбек инспекциясы) — жұмыс орны бойынша"
    accepts:
      - dispute_types: [labor.unpaid_wages, labor.dismissal]
        applicant_roles: [employee]
    document_types: [complaint]
    submission:
      - kind: portal
        url: https://eotinish.kz
    languages: [ru, kk]
    appeals_to: [kz.court.district]
