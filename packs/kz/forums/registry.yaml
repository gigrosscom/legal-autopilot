# Реестр органов и организаций (Казахстан) для универсального пути (уровень 2).
# ВСЕ записи не проверены юристом (verified_at: null): пользователь видит «уточнит юрист»
# вместо сроков и пошлин, документы уровня 2 выдаются только после одобрения юриста.
# Наименования — родовые категории органов; точные наименования, подсудность, пошлины и сроки — TODO(lawyer).
# Религиозные форумы в пакет KZ не добавляются (решение основателя, ADR 0001, раздел 6).
forums:
  # Досудебная претензия — самой организации или человеку, с которым спор (продавец, банк, работодатель,
  # арендодатель, должник). Не орган: решения не выносит, но это обязательный или полезный первый шаг.
  - id: kz.counterparty.claim
    type: private_org
    instance: first
    name:
      ru: "Организация или человек, с которым спор (досудебная претензия)"
      kk: "Дау туындаған ұйым немесе адам (сотқа дейінгі наразылық)"
    accepts:
      - branches: [consumer, finance, housing, labor, civil]
        applicant_roles: [consumer, borrower, tenant, landlord, employee, claimant]
      # споры ИП/ТОО с контрагентом: досудебная претензия по договору (ГК РК) — уточнит юрист
      - branches: [commercial]
        applicant_roles: [business]
    document_types: [claim_letter]
    submission:
      - kind: in_person
        note: {ru: "Вручите лично и попросите отметку о принятии на втором экземпляре", kk: "Өзіңіз тапсырып, екінші данаға қабылдау белгісін сұраңыз"}
      - kind: post
      - kind: email
    languages: [ru, kk]
    appeals_to: [kz.regulator.consumer, kz.regulator.financial, kz.labor_inspection, kz.court.district, kz.court.economic]
    legal_effect: none
    order: 10
    hints:
      civil.debt:
        ru: "Письменное требование вернуть долг. Если в расписке нет срока возврата, должник обязан вернуть деньги в течение 30 дней со дня вашего требования (ГК РК, Особенная часть, ст. 722 п. 1). Перед судом закон претензию не требует, но она фиксирует дату требования — от неё считаются сроки."
        kk: "Қарызды қайтару туралы жазбаша талап. Қолхатта қайтару мерзімі жоқ болса, борышкер ақшаны талабыңыз берілген күннен бастап 30 күн ішінде қайтаруға міндетті (ҚР АК Ерекше бөлім, 722-бап 1-тармақ). Сотқа дейін заң наразылықты талап етпейді, бірақ ол талап күнін бекітеді — мерзімдер содан есептеледі."
    # Потребительские споры: претензия вручается нарочно, заказным письмом с уведомлением или на e-mail, ранее указанный
    # продавцом; ответ — 10 календарных дней (Закон о ЗПП, ст. 42-4, https://adilet.zan.kz/rus/docs/Z100000274_,
    # проверено 28.09.2026). Для остальных споров — TODO(lawyer).
    source: "Закон РК «О защите прав потребителей», ст. 42-4 (потребительские споры); ГК РК, ТК РК — ссылки проставит юрист"

  # Жалоба на решение или бездействие госоргана — вышестоящему органу, подаётся через орган, который принял решение
  # (АППК РК ст. 91–93; досудебное обжалование обязательно, если закон не говорит иное — ст. 91 ч. 5; срок
  # рассмотрения жалобы — 20 рабочих дней). Нормы — по правилам разбора ZANN (old.adilet, 01–02.10.2026).
  - id: kz.gov.superior
    type: local_authority
    instance: first
    name:
      ru: "Вышестоящий орган — жалоба через орган, который принял решение или не ответил"
      kk: "Жоғары тұрған орган — шешім қабылдаған немесе жауап бермеген орган арқылы шағым"
    accepts:
      - dispute_types: [administrative.state_body_inaction, social.benefit_refusal]
        applicant_roles: [complainant]
      # ZANN 03.10 (old.adilet.zan.kz): a fine — to the higher body through the one that ruled (КоАП ст. 826-1, 826-2);
      # a tax audit notice — to the authorized tax body (Налоговый кодекс 2025, ст. 191, 192)
      - dispute_types: [administrative.fine_appeal]
        applicant_roles: [complainant]
      - dispute_types: [tax.assessment_dispute]
        applicant_roles: [taxpayer, business]
    document_types: [complaint]
    submission:
      - kind: portal
        url: https://eotinish.kz
        note: {ru: "Портал обращений (вход по ЭЦП или SMS)", kk: "Өтініштер порталы (ЭЦҚ не SMS арқылы)"}
      - kind: in_person
    languages: [ru, kk]
    appeals_to: [kz.prosecutor]
    legal_effect: binding
    order: 20
    mandatory_for: [administrative.state_body_inaction]
    source: "АППК РК, ст. 91–93 (жалоба через орган; ст. 91 ч. 5 — досудебное обжалование)"

  - id: kz.court.economic
    type: court
    instance: first
    name:
      ru: "Специализированный межрайонный экономический суд"
      kk: "Мамандандырылған ауданаралық экономикалық сот"
    jurisdiction:
      rule:
        ru: "Споры между ИП и юрлицами (ГПК, ст. 27 ч. 1); иск — по месту нахождения ответчика (ГПК, ст. 29 ч. 2)."
        kk: "ЖК мен заңды тұлғалар арасындағы даулар (АПК, 27-бап 1-бөлік); талап арыз — жауапкердің орналасқан жері бойынша (АПК, 29-бап 2-бөлік)."
    accepts:
      - branches: [commercial]
        applicant_roles: [business]
    document_types: [lawsuit]
    submission:
      - kind: portal
        url: https://office.sud.kz
        note: {ru: "Судебный кабинет (вход по ЭЦП)", kk: "Сот кабинеті (ЭЦҚ арқылы кіру)"}
      - kind: in_person
    languages: [ru, kk]
    fee: {note: {ru: "Размер госпошлины — по Налоговому кодексу РК", kk: "Мемлекеттік баж мөлшері — ҚР Салық кодексі бойынша"}}
    appeals_to: [kz.court.appeal]
    legal_effect: binding
    order: 70
    source: "ГПК РК, ст. 29 (подсудность); подсудность экономических судов — TODO(lawyer)"

  - id: kz.court.district
    type: court
    instance: first
    name:
      ru: "Районный (городской) суд по подсудности"
      kk: "Сотталуы бойынша аудандық (қалалық) сот"
    jurisdiction:
      rule:
        ru: "По месту жительства ответчика (ГПК, ст. 29); потребитель, алименты, страховая выплата — можно по своему месту жительства (ГПК, ст. 30)."
        kk: "Жауапкердің тұрғылықты жері бойынша (АПК, 29-бап); тұтынушы, алимент, сақтандыру төлемі — өз тұрғылықты жеріңіз бойынша да болады (АПК, 30-бап)."
    accepts:
      - branches: [civil, family, labor, housing, inheritance, consumer, finance]
        applicant_roles: [claimant, victim, consumer, borrower, employee, tenant, landlord, heir, spouse, parent]
    document_types: [lawsuit]
    submission:
      - kind: portal
        url: https://office.sud.kz
        note: {ru: "Судебный кабинет (вход по ЭЦП)", kk: "Сот кабинеті (ЭЦҚ арқылы кіру)"}
      - kind: in_person
    languages: [ru, kk]
    fee: {note: {ru: "Размер госпошлины — по Налоговому кодексу РК", kk: "Мемлекеттік баж мөлшері — ҚР Салық кодексі бойынша"}}
    appeals_to: [kz.court.appeal]
    legal_effect: binding
    order: 70
    hints:
      civil.debt:
        ru: "Иск подают в суд по месту жительства ответчика (ГПК РК, ст. 29 ч. 1). Срок исковой давности — 3 года (ГК РК, ст. 178 п. 1); если срок возврата не был установлен, он считается с окончания 30 дней после вашего требования (ГК РК, ст. 180 п. 3). Долг по расписке взыскивают иском: судебный приказ для такого требования ГПК не предусматривает (ст. 135)."
        kk: "Талап арыз жауапкердің тұрғылықты жеріндегі сотқа беріледі (ҚР АПК, 29-бап 1-бөлік). Талап қою мерзімі — 3 жыл (ҚР АК, 178-бап 1-тармақ); қайтару мерзімі белгіленбесе, ол талабыңыздан кейінгі 30 күн өткен соң есептеледі (ҚР АК, 180-бап 3-тармақ). Қолхат бойынша қарыз талап арызбен өндіріледі: мұндай талапқа АПК сот бұйрығын көздемейді (135-бап)."
    # ГПК РК (https://adilet.zan.kz/rus/docs/K1500000377, проверено 28.09.2026): ст. 29 (иск — по месту жительства
    # ответчика, к юрлицу — по месту нахождения), ст. 30 (подсудность по выбору истца: ч. 4 алименты, ч. 9 защита прав
    # потребителей, ч. 11 страховая выплата — по месту жительства истца), ст. 148 (форма и содержание иска: письменно
    # или электронным документом; ч. 4 — подписывается истцом или удостоверяется ЭЦП), ст. 149 (приложения).
    # Канал: office.sud.kz — «Сот кабинеті» (заголовок страницы проверен 28.09.2026). Госпошлина — TODO(lawyer).
    source: "ГПК РК, ст. 29, 30, 148, 149"

  # Споры, затрагивающие права и законные интересы несовершеннолетних (в т. ч. алименты на детей), рассматривают
  # специализированные межрайонные суды по делам несовершеннолетних — ГПК РК, ст. 27, ч. 3
  # (https://adilet.zan.kz/rus/docs/K1500000377, проверено 28.09.2026). Где такого суда нет — районный (городской) суд.
  # Иск о взыскании алиментов можно подать по месту жительства истца (ст. 30, ч. 4). Конкретный суд — TODO(lawyer).
  - id: kz.court.juvenile
    type: court
    instance: first
    name:
      ru: "Специализированный межрайонный суд по делам несовершеннолетних (где его нет — районный (городской) суд) по месту жительства истца или ответчика"
      kk: "Кәмелетке толмағандардың істері жөніндегі мамандандырылған ауданаралық сот (ол жоқ жерде — аудандық (қалалық) сот) талапкердің не жауапкердің тұрғылықты жері бойынша"
    jurisdiction:
      rule:
        ru: "Алименты на детей: по месту жительства истца или ответчика (ГПК РК, ст. 29, ст. 30 ч. 4); специализированный суд по делам несовершеннолетних — ГПК РК, ст. 27 ч. 3."
        kk: "Балаларға алимент: талапкердің не жауапкердің тұрғылықты жері бойынша (ҚР АПК, 29-бап, 30-бап 4-бөлік); кәмелетке толмағандардың істері жөніндегі мамандандырылған сот — ҚР АПК, 27-бап 3-бөлік."
    accepts:
      - branches: [family]
        applicant_roles: [parent]
    document_types: [lawsuit]
    submission:
      - kind: portal
        url: https://office.sud.kz
        note: {ru: "Судебный кабинет (вход по ЭЦП)", kk: "Сот кабинеті (ЭЦҚ арқылы кіру)"}
      - kind: in_person
    languages: [ru, kk]
    fee: {note: {ru: "Размер госпошлины и освобождение — по Налоговому кодексу РК", kk: "Мемлекеттік баж мөлшері мен босату — ҚР Салық кодексі бойынша"}}
    appeals_to: [kz.court.appeal]
    legal_effect: binding
    order: 70
    source: "ГПК РК, ст. 27, 29, 30, 148"

