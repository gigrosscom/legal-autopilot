      - kind: in_person
    languages: [ru, kk]
    legal_effect: binding
    source: "TODO: Закон о прокуратуре — ссылки проставит юрист"

  - id: kz.regulator.financial
    type: regulator
    instance: first
    name:
      ru: "Агентство Республики Казахстан по регулированию и развитию финансового рынка (АРРФР)"
      kk: "Қазақстан Республикасының Қаржы нарығын реттеу және дамыту агенттігі (ҚНРДА)"
    accepts:
      - dispute_types: [finance.bank_dispute, finance.debt_collectors]
        applicant_roles: [borrower, consumer]
    document_types: [complaint]
    submission:
      - kind: portal
        url: https://eotinish.kz
    languages: [ru, kk]
    appeals_to: [kz.court.district]
    legal_effect: binding
    # Канал: страница «Онлайн-приемная» АРРФР на gov.kz — «Для подачи обращений: https://eotinish.kz»; там же НПА о
    # рассмотрении обращений — АППК РК (https://www.gov.kz/memleket/entities/ardfm/activities/population, открыта
    # 28.09.2026). Срок — АППК, ст. 76, ч. 1: 15 рабочих дней (https://adilet.zan.kz/rus/docs/K2000000350).
    response_deadline: {business_days: 15, norm_ref: "Административный процедурно-процессуальный кодекс Республики Казахстан, статья 76"}
    source: "АППК РК, ст. 63, 76; gov.kz/memleket/entities/ardfm — подача обращений через eotinish.kz"

  - id: kz.regulator.consumer
    type: regulator
    instance: first
    name:
      ru: "Департамент торговли и защиты прав потребителей Министерства торговли и интеграции Республики Казахстан по области (городу) по месту нахождения продавца (исполнителя)"
      kk: "Қазақстан Республикасы Сауда және интеграция министрлігінің сатушы (орындаушы) орналасқан облыс (қала) бойынша сауда және тұтынушылардың құқықтарын қорғау департаменті"
    accepts:
      - dispute_types: [consumer.poor_service, housing.utilities]
        applicant_roles: [consumer]
    document_types: [complaint]
    submission:
      - kind: portal
        url: https://eotinish.kz
    languages: [ru, kk]
    appeals_to: [kz.court.district]
    legal_effect: binding
    # Наименование — приказ Заместителя Премьер-Министра — Министра торговли и интеграции РК от 29.12.2022 № 508-НҚ
    # (положения департаментов «торговли и защиты прав потребителей … по городу/области», функция — рассмотрение
    # обращений) — https://adilet.zan.kz/rus/docs/G22TI000508, открыт 28.09.2026. Обращение потребителя — Закон о ЗПП,
    # ст. 42-5 (письменно или через Единую информационную систему защиты прав потребителей; реквизиты — п. 4);
    # срок — АППК, ст. 76, ч. 1 (ЗПП, ст. 42-7 общего срока не устанавливает). Адрес ЕИС ЗПП — TODO(lawyer).
    response_deadline: {business_days: 15, norm_ref: "Административный процедурно-процессуальный кодекс Республики Казахстан, статья 76"}
    source: "Закон РК «О защите прав потребителей», ст. 42-5, 42-7; АППК РК, ст. 76; приказ МТИ РК от 29.12.2022 № 508-НҚ"

  - id: kz.labor_inspection
    type: local_authority
    instance: first
    name:
      ru: "Территориальное подразделение уполномоченного государственного органа по труду (государственная инспекция труда) по области, городу республиканского значения, столице — по месту работы (наименование уточнит юрист)"
      kk: "Еңбек жөніндегі уәкілетті мемлекеттік органның облыс, республикалық маңызы бар қала, астана бойынша аумақтық бөлімшесі (мемлекеттік еңбек инспекциясы) — жұмыс орны бойынша (атауын заңгер нақтылайды)"
    accepts:
      - dispute_types: [labor.unpaid_wages, labor.dismissal]
        applicant_roles: [employee]
    document_types: [complaint]
    submission:
      - kind: portal
        url: https://eotinish.kz
    languages: [ru, kk]
    appeals_to: [kz.court.district]
    legal_effect: binding
    # Трудовой кодекс РК (https://adilet.zan.kz/rus/docs/K1500000414, проверено 28.09.2026): ст. 1, п. 18-1
    # (территориальные подразделения уполномоченного органа по труду), ст. 191, п. 2 (государственные инспекторы труда —
    # должностные лица территориального подразделения; в редакции Закона от 11.06.2026 № 306-VIII, с 01.07.2026 — раньше
    # это был «местный орган по инспекции труда»). Срок — АППК, ст. 76, ч. 1. Точное наименование — TODO(lawyer).
    response_deadline: {business_days: 15, norm_ref: "Административный процедурно-процессуальный кодекс Республики Казахстан, статья 76"}
    source: "Трудовой кодекс РК, ст. 1 п. 18-1, ст. 191, 193; АППК РК, ст. 76"

