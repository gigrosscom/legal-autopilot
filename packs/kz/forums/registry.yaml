# Реестр органов и организаций (Казахстан) для универсального пути (уровень 2).
# ВСЕ записи не проверены юристом (verified_at: null): пользователь видит «уточнит юрист»
# вместо сроков и пошлин, документы уровня 2 выдаются только после одобрения юриста.
# Наименования — родовые категории органов; точные наименования, подсудность, пошлины и сроки — TODO(lawyer).
# Религиозные форумы в пакет KZ не добавляются (решение основателя, ADR 0001, раздел 6).
forums:
  # Досудебная претензия — самой организации или человеку, с которым спор (продавец, банк, работодатель,
  # арендодатель, должник). Не орган: решения не выносит, но это обязательный или полезный первый шаг.
  - id: kz.counterparty.claim
    type: private_org
    instance: first
    name:
      ru: "Организация или человек, с которым спор (досудебная претензия)"
      kk: "Дау туындаған ұйым немесе адам (сотқа дейінгі наразылық)"
    accepts:
      - branches: [consumer, finance, housing, labor, civil]
        applicant_roles: [consumer, borrower, tenant, landlord, employee, claimant]
      # споры ИП/ТОО с контрагентом: досудебная претензия по договору (ГК РК) — уточнит юрист
      - branches: [commercial]
        applicant_roles: [business]
    document_types: [claim_letter]
    submission:
      - kind: in_person
        note: {ru: "Вручите лично и попросите отметку о принятии на втором экземпляре", kk: "Өзіңіз тапсырып, екінші данаға қабылдау белгісін сұраңыз"}
      - kind: post
      - kind: email
    languages: [ru, kk]
    appeals_to: [kz.regulator.consumer, kz.regulator.financial, kz.labor_inspection, kz.court.district, kz.court.economic]
    legal_effect: none
    # Потребительские споры: претензия вручается нарочно, заказным письмом с уведомлением или на e-mail, ранее указанный
    # продавцом; ответ — 10 календарных дней (Закон о ЗПП, ст. 42-4, https://adilet.zan.kz/rus/docs/Z100000274_,
    # проверено 28.09.2026). Для остальных споров — TODO(lawyer).
    source: "Закон РК «О защите прав потребителей», ст. 42-4 (потребительские споры); ГК РК, ТК РК — ссылки проставит юрист"

  - id: kz.court.economic
    type: court
    instance: first
    name:
      ru: "Специализированный межрайонный экономический суд (конкретный суд уточнит юрист)"
      kk: "Мамандандырылған ауданаралық экономикалық сот (нақты сотты заңгер нақтылайды)"
    jurisdiction:
      rule:
        ru: "Споры между ИП и юрлицами; как правило, по месту нахождения ответчика — уточнит юрист."
        kk: "ЖК мен заңды тұлғалар арасындағы даулар; әдетте жауапкердің орналасқан жері бойынша — заңгер нақтылайды."
    accepts:
      - branches: [commercial]
        applicant_roles: [business]
    document_types: [lawsuit]
    submission:
      - kind: portal
        url: https://office.sud.kz
        note: {ru: "Судебный кабинет (вход по ЭЦП)", kk: "Сот кабинеті (ЭЦҚ арқылы кіру)"}
      - kind: in_person
    languages: [ru, kk]
    fee: {note: {ru: "Размер госпошлины уточнит юрист", kk: "Мемлекеттік баж мөлшерін заңгер нақтылайды"}}
    appeals_to: [kz.court.appeal]
    legal_effect: binding
    source: "ГПК РК, ст. 29 (подсудность); подсудность экономических судов — TODO(lawyer)"

  - id: kz.court.district
    type: court
    instance: first
    name:
      ru: "Районный (городской) суд по подсудности (конкретный суд уточнит юрист)"
      kk: "Сотталуы бойынша аудандық (қалалық) сот (нақты сотты заңгер нақтылайды)"
    jurisdiction:
      rule:
        ru: "Как правило, по месту жительства ответчика; есть исключения — уточнит юрист."
        kk: "Әдетте жауапкердің тұрғылықты жері бойынша; ерекшеліктер бар — заңгер нақтылайды."
    accepts:
      - branches: [civil, family, labor, housing, inheritance, consumer, finance]
        applicant_roles: [claimant, victim, consumer, borrower, employee, tenant, landlord, heir, spouse, parent]
    document_types: [lawsuit]
    submission:
      - kind: portal
        url: https://office.sud.kz
        note: {ru: "Судебный кабинет (вход по ЭЦП)", kk: "Сот кабинеті (ЭЦҚ арқылы кіру)"}
      - kind: in_person
    languages: [ru, kk]
    fee: {note: {ru: "Размер госпошлины уточнит юрист", kk: "Мемлекеттік баж мөлшерін заңгер нақтылайды"}}
    appeals_to: [kz.court.appeal]
    legal_effect: binding
    # ГПК РК (https://adilet.zan.kz/rus/docs/K1500000377, проверено 28.09.2026): ст. 29 (иск — по месту жительства
    # ответчика, к юрлицу — по месту нахождения), ст. 30 (подсудность по выбору истца: ч. 4 алименты, ч. 9 защита прав
    # потребителей, ч. 11 страховая выплата — по месту жительства истца), ст. 148 (форма и содержание иска: письменно
    # или электронным документом; ч. 4 — подписывается истцом или удостоверяется ЭЦП), ст. 149 (приложения).
    # Канал: office.sud.kz — «Сот кабинеті» (заголовок страницы проверен 28.09.2026). Госпошлина — TODO(lawyer).
    source: "ГПК РК, ст. 29, 30, 148, 149"

  # Споры, затрагивающие права и законные интересы несовершеннолетних (в т. ч. алименты на детей), рассматривают
  # специализированные межрайонные суды по делам несовершеннолетних — ГПК РК, ст. 27, ч. 3
  # (https://adilet.zan.kz/rus/docs/K1500000377, проверено 28.09.2026). Где такого суда нет — районный (городской) суд.
  # Иск о взыскании алиментов можно подать по месту жительства истца (ст. 30, ч. 4). Конкретный суд — TODO(lawyer).
  - id: kz.court.juvenile
    type: court
    instance: first
    name:
      ru: "Специализированный межрайонный суд по делам несовершеннолетних (где его нет — районный (городской) суд) по месту жительства истца или ответчика (конкретный суд уточнит юрист)"
      kk: "Кәмелетке толмағандардың істері жөніндегі мамандандырылған ауданаралық сот (ол жоқ жерде — аудандық (қалалық) сот) талапкердің не жауапкердің тұрғылықты жері бойынша (нақты сотты заңгер нақтылайды)"
    jurisdiction:
      rule:
        ru: "Алименты на детей: по месту жительства истца или ответчика (ГПК РК, ст. 29, ст. 30 ч. 4); специализированный суд по делам несовершеннолетних — ГПК РК, ст. 27 ч. 3."
        kk: "Балаларға алимент: талапкердің не жауапкердің тұрғылықты жері бойынша (ҚР АПК, 29-бап, 30-бап 4-бөлік); кәмелетке толмағандардың істері жөніндегі мамандандырылған сот — ҚР АПК, 27-бап 3-бөлік."
    accepts:
      - branches: [family]
        applicant_roles: [parent]
    document_types: [lawsuit]
    submission:
      - kind: portal
        url: https://office.sud.kz
        note: {ru: "Судебный кабинет (вход по ЭЦП)", kk: "Сот кабинеті (ЭЦҚ арқылы кіру)"}
      - kind: in_person
    languages: [ru, kk]
    fee: {note: {ru: "Размер госпошлины и основания освобождения уточнит юрист", kk: "Мемлекеттік баж мөлшерін және босату негіздерін заңгер нақтылайды"}}
    appeals_to: [kz.court.appeal]
    legal_effect: binding
    source: "ГПК РК, ст. 27, 29, 30, 148"

  - id: kz.court.appeal
    type: court
    instance: appeal
    name:
      ru: "Суд апелляционной инстанции (областной суд) (уточнит юрист)"
