# Правила маршрутизации дел (уровни покрытия), экстренные номера и обязательные уведомления.
# Всё, что не проверено юристом, помечено verified_at: null и показывается как «уточнит юрист».
lawyer_only:
  - criminal.defence      # сторона защиты: только досье и срочная передача адвокату
  - migration.removal     # возможное лишение свободы / выдворение
  - commercial            # бизнес-споры: пока только через юриста
high_amount_threshold: null   # TODO(lawyer): порог «высокой суммы» — решение основателя: уточнит юрист
urgent_deadline_days: 5
min_confidence: 0.6

emergency:
  # Номера показываются даже до проверки ссылки: не показать экстренный номер опаснее. TODO(lawyer): подтвердить источники.
  numbers:
    - {label: {ru: Единый номер экстренных служб, kk: Шұғыл қызметтердің бірыңғай нөмірі}, number: "112", source: "TODO: ссылка на официальный источник"}
    - {label: {ru: Полиция, kk: Полиция}, number: "102", source: "TODO: ссылка на официальный источник"}
    - {label: {ru: Скорая помощь, kk: Жедел жәрдем}, number: "103", source: "TODO: ссылка на официальный источник"}
    - {label: {ru: Телефон доверия для детей и подростков, kk: Балалар мен жасөспірімдерге арналған сенім телефоны}, number: "150", source: "TODO: ссылка на официальный источник"}
  keywords:
    ru: [убить, убьёт, убьет, угрожает убить, угроза жизни, избивает, бьёт меня, бьет меня, насилие, изнасил, похитил, похищ, покончить с собой, суицид, ребёнок в опасности, ребенок в опасности, нож, пистолет]
    kk: [өлтір, өмірге қауіп, ұрып-соғ, зорлық, ұрлап кетті, өзін-өзі өлтір, бала қауіпте]

upl_notice:
  text:
    ru: "Konsiliér AI — сервис подготовки документов для самостоятельной подачи и технологический посредник с юристами. Мы не представляем вас в суде и госорганах: представительство оказывают адвокаты и юридические консультанты платформы."
    kk: "Konsiliér AI — өз бетіңізше беруге арналған құжаттарды дайындау сервисі және заңгерлермен технологиялық делдал. Біз сотта және мемлекеттік органдарда сіздің атыңыздан өкілдік етпейміз: өкілдікті платформаның адвокаттары мен заң консультанттары жүзеге асырады."
  source: "TODO: Закон об адвокатской деятельности и юридической помощи — проверит юрист"

false_report_norm:
  text:
    ru: "За заведомо ложный донос предусмотрена уголовная ответственность (норма Уголовного кодекса — уточнит юрист). Описывайте только факты, которые вы знаете: что, где, когда произошло и кто это видел."
    kk: "Көрінеу жалған сөз арқыламу үшін қылмыстық жауаптылық көзделген (Қылмыстық кодекстің нормасын заңгер нақтылайды). Тек өзіңіз білетін фактілерді жазыңыз: не, қайда, қашан болды және кім көрді."
  source: "TODO: Уголовный кодекс РК — номер статьи проставит юрист"

abuse:
  window_days: 30
  max_cases_per_respondent: 3
  max_cases_per_applicant: 10

evaluative_words:
  ru: [вор, мошенник, преступник, бандит, аферист]
  kk: [ұры, алаяқ, қылмыскер]
