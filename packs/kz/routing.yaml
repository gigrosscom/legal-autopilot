# Адресата шага выбирает система (решение владельца 02.10): первый из этого списка среди органов, которые принимают
# спор. Сначала вторая сторона — досудебная претензия; где её нет — орган или суд по подсудности. Медиатор, суд или
# полиция, где дело уже идёт, системой не выбираются — только по ссылке «Другой адресат».
forum_order:
  - kz.counterparty.claim
  - kz.prosecutor
  - kz.court.juvenile
  - kz.court.economic
  - kz.court.district
  - kz.police
  - kz.regulator.financial
  - kz.regulator.consumer
  - kz.labor_inspection
  - kz.ombudsman
forum_why:
  kz.counterparty.claim:
    ru: "Первый шаг — письменная претензия второй стороне: так спор часто решается без суда, а копия пригодится, если дело дойдёт до суда."
    kk: "Алғашқы қадам — екінші тарапқа жазбаша талап-шағым: дау жиі сотсыз шешіледі, ал көшірмесі сотқа жеткенде керек болады."
  kz.prosecutor:
    ru: "Прокуратура проверяет законность решений и действий государственных органов и полиции — жалоба направляется туда."
    kk: "Прокуратура мемлекеттік органдар мен полицияның шешімдері мен әрекеттерінің заңдылығын тексереді — шағым соған жіберіледі."
  kz.court.juvenile:
    ru: "Алименты и споры о детях рассматривает суд по делам несовершеннолетних, а где его нет — районный суд."
    kk: "Алимент пен балаларға қатысты дауларды кәмелетке толмағандардың істері жөніндегі сот, ол жоқ жерде — аудандық сот қарайды."
  kz.court.economic:
    ru: "Спор между предпринимателями и компаниями рассматривает экономический суд."
    kk: "Кәсіпкерлер мен компаниялар арасындағы дауды экономикалық сот қарайды."
  kz.court.district:
    ru: "Этот спор решает суд: иск подаётся в районный (городской) суд по подсудности."
    kk: "Бұл дауды сот шешеді: талап қою арызы соттылығы бойынша аудандық (қалалық) сотқа беріледі."
  kz.police:
    ru: "О преступлении заявляют в полицию по месту события."
    kk: "Қылмыс туралы оқиға болған жердегі полицияға арыз беріледі."

# Чат и карточка называют один и тот же документ (PM 02.10, затопление: чат «исковое заявление», карточка «претензия»).
document_kinds:
  lawsuit: [исков, иск в суд, талап қою, сотқа талап]
  claim: [претензи, талап-шағым]
  complaint: [жалоб, шағым]
  statement: [заявлени, өтініш]
  motion: [ходатайств, өтінішхат]
# Проверка документа перед выдачей (PM 02.10, владелец: «грубые ошибки в документах»): эти слова в тексте документа
# останавливают выдачу — документ уходит юристу, а не клиенту. Квадратные скобки проверяются всегда.
document_markers:
  ru: [уточнит юрист, рассчитает юрист, Проверьте данные, Проверьте сведения, по сути обращения]
  kk: [заңгер нақтылайды, заңгер есептейді, Деректерді тексеріңіз]
  "*": [KZT, TODO]   # QA BUG-22: в тексте только «₸ (… тенге)»; TODO — несверенная заглушка данных
norm_words:
  ru: [стать, закон, кодекс]
  kk: [бап, заң, кодекс]
document_drop_empty:
  ru: [Правовое основание]
  kk: [Құқықтық негіз]
