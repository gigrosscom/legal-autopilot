    ru: "Konsiliér AI — сервис подготовки документов для самостоятельной подачи и технологический посредник с юристами. Мы не представляем вас в суде и госорганах: представительство оказывают адвокаты и юридические консультанты платформы."
    kk: "Konsiliér AI — өз бетіңізше беруге арналған құжаттарды дайындау сервисі және заңгерлермен технологиялық делдал. Біз сотта және мемлекеттік органдарда сіздің атыңыздан өкілдік етпейміз: өкілдікті платформаның адвокаттары мен заң консультанттары жүзеге асырады."
