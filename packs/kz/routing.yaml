# Правила маршрутизации дел (уровни покрытия), экстренные номера и обязательные уведомления.
# Всё, что не проверено юристом, помечено verified_at: null и показывается как «уточнит юрист».
lawyer_only:
  - criminal.defence      # сторона защиты: только досье и срочная передача адвокату
  - migration.removal     # возможное лишение свободы / выдворение
# бизнес-споры (ИП/ТОО): досудебная претензия контрагенту — самостоятельно; иск в экономический суд — после юриста
high_amount_threshold: null   # TODO(lawyer): порог «высокой суммы» — решение основателя: уточнит юрист
urgent_deadline_days: 5
min_confidence: 0.6
# человек пишет как предприниматель (ИП/ТОО) о споре с другим бизнесом: потребительские сценарии не применяются
business_markers:
  ru: [я ип, мы ип, как ип, у меня ип, наше ип, наш ип, индивидуальный предприниматель, как предприниматель, наше тоо, наша компания, наша фирма, мы тоо, у нас тоо, у меня тоо, контрагент, договор поставки, для перепродажи, наш магазин]
  kk: [мен жк, біз жк, жеке кәсіпкер, біздің жшс, біздің компания, контрагент, жеткізу шарты]
# дела, которые решают слова, без угадывания ИИ (QA BUG-24: «долг по расписке» → «возврат за товар» через раз).
# Признак — начало слова; «unless» — признаки банка, магазина, работы, бизнеса.
direct:
  # ZANN 03.10 (баг владельца «субподрядчик RAMS»): одно решение на дело — подряд, труд или заём, не всё сразу.
  # Труд — по признакам ТК ст. 27 (зарплата, оклад, работодатель, график, должность); первым, чтобы «на объекте по
  # графику за зарплату» не ушло в подряд.
  - dispute: labor.dismissal
    role: employee
    scenario: kz.labor.dismissal
    markers:
      ru: [уволили, уволил меня, уволила меня, увольнение, незаконно уволен, незаконно уволена, сократили]
      kk: [жұмыстан шығарды, жұмыстан шығару]
  - dispute: labor.unpaid_wages
    role: employee
    scenario: kz.labor.unpaid_wages
    markers:
      ru: [зарплат, заработн, оклад, работодател, трудовой договор, трудовому договору, по трудовому, по графику, табел, разнорабоч, на должности, договор ГПХ, договор гпх]
      kk: [жалақы, жұмыс беруші, еңбек шарты]
    unless:
      ru: [уволил, увольнен, расчёт при увольнении, расчет при увольнении, алимент]
      kk: [жұмыстан шығар, алимент]
  # подряд / услуги физлица (без ИП/ТОО): ГК ОЧ ст. 616, 621, 623; ИП/ТОО — бизнес-путь (commercial.b2b_debt)
  - dispute: civil.work_payment
    role: claimant
    markers:
      ru: [субподряд, подрядчик, сделал соседу, сделала соседу, сделал знакомому, сделала знакомому, договору оказания услуг, по договору услуг, за выполненные работы, выполнил работы, выполнили работы, выполнила работы, сделал ремонт, сделала ремонт, акт выполненных работ, по смете, бригадой, за работы на объекте, не заплатил за работу, не заплатили за работу, не оплатили работу, не оплатил работу, договор оказания услуг]
      kk: [қосалқы мердігер, орындалған жұмыс, жөндеу жасадым, жұмысқа ақы төлемеді]
    unless:
      ru: [заказал, заказала, заказали, оплатил аванс, оплатила аванс, работы не сделаны, работы не выполнены, я заказчик, кск, оси, управляющ, подъезд, крыш, гаранти, магазин, сервисн, автосервис, акимат, госорган, обращени, мастер не отвечает, после ремонта, некачествен, отвалил, сломал]
      kk: [тапсырыс бердім]
  # ZANN 03.10 (решение ПМ, прогон семьи F2–F4): супруг защищает своё имущество — куплено до брака, подарено,
  # унаследовано, брачный договор — не иск о разводе, а «исключить из раздела» (иск или отзыв на иск о разделе)
  - dispute: family.personal_property
    role: spouse
    markers:
      ru: [куплена до брака, куплен до брака, купил до брака, купила до брака, купил за два года до свадьбы, до свадьбы, подарили родители, подарили мне, подарил мне, по договору дарения, которую мне подарили, который мне подарили, унаследовал, унаследовала, получил в наследство, получила в наследство, по наследству, брачный договор, брачному договору, брачного договора]
      kk: [некеге дейін сатып, сыйға тартты, мұраға алдым, мұраға қалды, неке шарты]
    unless:
      ru: [алимент]
  # остаток ущерба после ДТП сверх страховой выплаты — с виновника, не заявление страховщику (QA run10 K9)
  - dispute: civil.damages
    role: claimant
    markers:
      ru: [остаток ущерба, страховки не хватило, страховой выплаты не хватило, сверх страховой выплаты, разницу между ущербом и страховой]
      kk: [сақтандыру жетпеді, залалдың қалған бөлігі]
  # залив квартиры соседом — возмещение ущерба, не «недостатки услуги» (QA run10 K1)
  - dispute: civil.damages
    role: claimant
    markers:
      ru: [затопил, затопила, затопили, залил квартиру, залила квартиру, залили квартиру, заливает сосед, протечка от соседей, сосед сверху]
      kk: [су басты, су басқан, жоғарыдағы көрші]
    unless:
      ru: [крыш, кровл, управляющ, ремонт трубы за, стиральн машин, магазин]
      kk: [шатыр]
  # тур — услуга туроператора/турагента, не авиаперевозка (QA run10 K7); отдельный сценарий о туризме — после сверки закона
  - dispute: consumer.refund
    role: consumer
    scenario: kz.consumer.service_refund
    markers:
      ru: [купил тур, купила тур, купили тур, турагент, туроператор, турпутёвк, турпутевк, путёвк, путевк, туристическ путёвк, тур отменили]
      kk: [турагент, туроператор, жолдама, турды болдырмады]
  # КСК / ОСИ / управляющая компания не ремонтирует, не отчитывается — жилищный спор с субъектом управления, не «услуга
  # исполнителя» (QA B8, 02.10). Закон о жилищных отношениях ст. 51-4, 51-6 (КСК — субъект управления), жилищная
  # инспекция проверяет отчёты по обращению собственников (сверено ZANN 02.10). Залив от соседа — правило выше.
  - dispute: housing.utilities
    role: consumer
    scenario: kz.housing.management_company
    markers:
      ru: [кск, кооператив собственников, оси, объединение собственников, управляющая компания, управляющей компании, управляющую компанию, председатель кск, председатель оси]
      kk: [пиқ, мүлік иелерінің бірлестігі, басқарушы компания]
    unless:
      ru: [затопил, залил квартиру, сосед сверху]
      kk: [су басты]
  # ZANN 04.10 (домен ЖКХ и аренда; Закон о жилищных отношениях ст. 24, 25; ГК ст. 277 п. 2): депозит, выселение,
  # квартирант, перерасчёт — по словам, без угадывания модели. КСК/ОСИ и залив — правила выше.
  - dispute: housing.tenancy
    role: tenant
    scenario: kz.housing.deposit_return
    markers:
      ru: [депозит, залог за квартир, залог за аренд, обеспечительный платёж, обеспечительный платеж, удерживает залог, не возвращает залог]
      kk: [депозит, кепілақы]
    unless:
      ru: [банк, кредит, ломбард, депозит в банке, вклад, офис, помещени, склад, коммерческ, магазин, тоо, ип]
      kk: [банк, несие]
  - dispute: housing.tenancy
    role: tenant
    markers:
      ru: [сменил замки, сменила замки, выкинул мои вещи, выкинула мои вещи, выгоняет из квартиры, выгоняют из квартиры, требует съехать, требует освободить квартиру, выселяет меня, выселить меня, хозяин квартиры, хозяйка квартиры, арендодатель требует]
      kk: [пәтер иесі, үйден қуып]
    unless:
      ru: [депозит, залог, офис, помещени, склад, коммерческ]
  - dispute: housing.tenancy
    role: landlord
    markers:
      ru: [квартирант, квартиранты, наниматель не платит, арендатор не платит, жилец не платит, не съезжает, не хочет съезжать, выселить квартиранта]
      kk: [пәтерге тұрушы]
  - dispute: housing.utilities
    role: consumer
    scenario: kz.housing.utility_billing
    markers:
      ru: [перерасчёт, перерасчет, коммуналк, начислили за, счёт за отопление, счет за отопление, счёт за свет, счет за свет, счёт за воду, счет за воду, квитанция за, переплата за отопление]
      kk: [коммуналдық, қайта есептеу]
    unless:
      ru: [кск, оси, управляющ, затопил, залил]
      kk: [пиқ]
  - dispute: civil.debt
    role: claimant
    markers:
      ru: [расписк, дал в долг, дала в долг, давал в долг, давала в долг, одолжил, одолжила, занял у меня, заняла у меня, взял в долг, взяла в долг, не возвращает долг, вернуть долг, долг по расписке, займ знакомому, заём знакомому, деньги в долг, в долг и не возвращает, в долг не возвращает, взял у меня деньги, взяла у меня деньги]
      kk: [қолхат, қарызға бердім, қарыз бердім, қарызды қайтармайды, қарызын қайтармайды]
    unless:
      ru: [банк, мфо, микрозайм, микрокредит, кредит, коллектор, магазин, товар, покупк, зарплат, работодател, контрагент, тоо, ип, поставк, аренд, депозит, алимент]
      kk: [банк, несие, микроқаржы, коллектор, дүкен, тауар, жалақы, жұмыс беруші, контрагент, жшс, жалдау, алимент]
# дело уже в суде или в полиции: только тогда предлагаем ходатайство «в суд, где уже рассматривается дело»
