# Правила маршрутизации дел (уровни покрытия), экстренные номера и обязательные уведомления.
# Всё, что не проверено юристом, помечено verified_at: null и показывается как «уточнит юрист».
lawyer_only:
  - criminal.defence      # сторона защиты: только досье и срочная передача адвокату
  - migration.removal     # возможное лишение свободы / выдворение
# бизнес-споры (ИП/ТОО): досудебная претензия контрагенту — самостоятельно; иск в экономический суд — после юриста
high_amount_threshold: null   # TODO(lawyer): порог «высокой суммы» — решение основателя: уточнит юрист
urgent_deadline_days: 5
min_confidence: 0.6
# человек пишет как предприниматель (ИП/ТОО) о споре с другим бизнесом: потребительские сценарии не применяются
business_markers:
  ru: [я ип, мы ип, как ип, у меня ип, наше ип, наш ип, индивидуальный предприниматель, как предприниматель, наше тоо, наша компания, наша фирма, мы тоо, у нас тоо, у меня тоо, контрагент, договор поставки, для перепродажи, наш магазин]
  kk: [мен жк, біз жк, жеке кәсіпкер, біздің жшс, біздің компания, контрагент, жеткізу шарты]
# дела, которые решают слова, без угадывания ИИ (QA BUG-24: «долг по расписке» → «возврат за товар» через раз).
# Признак — начало слова; «unless» — признаки банка, магазина, работы, бизнеса.
direct:
  # остаток ущерба после ДТП сверх страховой выплаты — с виновника, не заявление страховщику (QA run10 K9)
  - dispute: civil.damages
    role: claimant
    markers:
      ru: [остаток ущерба, страховки не хватило, страховой выплаты не хватило, сверх страховой выплаты, разницу между ущербом и страховой]
      kk: [сақтандыру жетпеді, залалдың қалған бөлігі]
  # залив квартиры соседом — возмещение ущерба, не «недостатки услуги» (QA run10 K1)
  - dispute: civil.damages
    role: claimant
    markers:
      ru: [затопил, затопила, затопили, залил квартиру, залила квартиру, залили квартиру, заливает сосед, протечка от соседей, сосед сверху]
      kk: [су басты, су басқан, жоғарыдағы көрші]
    unless:
      ru: [крыш, кровл, управляющ, ремонт трубы за, стиральн машин, магазин]
      kk: [шатыр]
  # тур — услуга туроператора/турагента, не авиаперевозка (QA run10 K7); отдельный сценарий о туризме — после сверки закона
  - dispute: consumer.refund
    role: consumer
    scenario: kz.consumer.service_refund
    markers:
      ru: [купил тур, купила тур, купили тур, турагент, туроператор, турпутёвк, турпутевк, путёвк, путевк, туристическ путёвк, тур отменили]
      kk: [турагент, туроператор, жолдама, турды болдырмады]
  - dispute: civil.debt
    role: claimant
    markers:
      ru: [расписк, дал в долг, дала в долг, давал в долг, давала в долг, одолжил, одолжила, занял у меня, заняла у меня, взял в долг, взяла в долг, не возвращает долг, вернуть долг, долг по расписке, займ знакомому, заём знакомому]
      kk: [қолхат, қарызға бердім, қарыз бердім, қарызды қайтармайды, қарызын қайтармайды]
    unless:
      ru: [банк, мфо, микрозайм, микрокредит, кредит, коллектор, магазин, товар, покупк, зарплат, работодател, контрагент, тоо, ип, поставк, аренд, депозит, алимент]
      kk: [банк, несие, микроқаржы, коллектор, дүкен, тауар, жалақы, жұмыс беруші, контрагент, жшс, жалдау, алимент]
# дело уже в суде или в полиции: только тогда предлагаем ходатайство «в суд, где уже рассматривается дело»
pending_markers:
  ru: [номер дела, дело в суде, суд уже, уже в суде, судебное заседание, заседание назначено, подал иск, подала иск, иск уже подан, судья, следователь, дознаватель, уголовное дело, КУИ]
  kk: [іс нөмірі, сотта қаралып, сот отырысы, талап арыз бердім, судья, тергеуші, қылмыстық іс]

emergency:
  # Номера показываются даже до проверки ссылки: не показать экстренный номер опаснее. TODO(lawyer): подтвердить источники.
  numbers:
    - {label: {ru: Единый номер экстренных служб, kk: Шұғыл қызметтердің бірыңғай нөмірі}, number: "112", source: "TODO: ссылка на официальный источник"}
    - {label: {ru: Полиция, kk: Полиция}, number: "102", source: "TODO: ссылка на официальный источник"}
    - {label: {ru: Скорая помощь, kk: Жедел жәрдем}, number: "103", source: "TODO: ссылка на официальный источник"}
    - {label: {ru: Телефон доверия для детей и подростков, kk: Балалар мен жасөспірімдерге арналған сенім телефоны}, number: "150", source: "TODO: ссылка на официальный источник"}
  keywords:
    ru: [убить, убьёт, убьет, угрожает убить, угроза жизни, избивает, бьёт меня, бьет меня, насилие, изнасил, похитил, похищ, покончить с собой, суицид, ребёнок в опасности, ребенок в опасности, нож, пистолет]
    kk: [өлтір, өмірге қауіп, ұрып-соғ, зорлық, ұрлап кетті, өзін-өзі өлтір, бала қауіпте]

upl_notice:
  text:
    ru: "Konsiliér AI — сервис подготовки документов для самостоятельной подачи и технологический посредник с юристами. Мы не представляем вас в суде и госорганах: представительство оказывают адвокаты и юридические консультанты платформы."
    kk: "Konsiliér AI — өз бетіңізше беруге арналған құжаттарды дайындау сервисі және заңгерлермен технологиялық делдал. Біз сотта және мемлекеттік органдарда сіздің атыңыздан өкілдік етпейміз: өкілдікті платформаның адвокаттары мен заң консультанттары жүзеге асырады."
  source: "TODO: Закон об адвокатской деятельности и юридической помощи — проверит юрист"

false_report_norm:
  text:
    ru: "За заведомо ложный донос предусмотрена уголовная ответственность (Уголовный кодекс РК, ст. 419). Описывайте только факты, которые вы знаете: что, где, когда произошло и кто это видел."
    kk: "Көрінеу жалған сөз арқыламу үшін қылмыстық жауаптылық көзделген (ҚР Қылмыстық кодексі, 419-бап). Тек өзіңіз білетін фактілерді жазыңыз: не, қайда, қашан болды және кім көрді."
  source: "TODO: Уголовный кодекс РК — номер статьи проставит юрист"

abuse:
  window_days: 30
  max_cases_per_respondent: 3
  max_cases_per_applicant: 10

evaluative_words:
  ru: [вор, мошенник, преступник, бандит, аферист]
  kk: [ұры, алаяқ, қылмыскер]

# Адресата шага выбирает система (решение владельца 02.10): первый из этого списка среди органов, которые принимают
# спор. Сначала вторая сторона — досудебная претензия; где её нет — орган или суд по подсудности. Медиатор, суд или
# полиция, где дело уже идёт, системой не выбираются — только по ссылке «Другой адресат».
forum_order:
  - kz.counterparty.claim
  - kz.prosecutor
  - kz.court.juvenile
  - kz.court.economic
  - kz.court.district
  - kz.police
  - kz.regulator.financial
  - kz.regulator.consumer
  - kz.labor_inspection
  - kz.ombudsman
forum_why:
  kz.counterparty.claim:
    ru: "Первый шаг — письменная претензия второй стороне: так спор часто решается без суда, а копия пригодится, если дело дойдёт до суда."
    kk: "Алғашқы қадам — екінші тарапқа жазбаша талап-шағым: дау жиі сотсыз шешіледі, ал көшірмесі сотқа жеткенде керек болады."
  kz.prosecutor:
    ru: "Прокуратура проверяет законность решений и действий государственных органов и полиции — жалоба направляется туда."
    kk: "Прокуратура мемлекеттік органдар мен полицияның шешімдері мен әрекеттерінің заңдылығын тексереді — шағым соған жіберіледі."
  kz.court.juvenile:
    ru: "Алименты и споры о детях рассматривает суд по делам несовершеннолетних, а где его нет — районный суд."
    kk: "Алимент пен балаларға қатысты дауларды кәмелетке толмағандардың істері жөніндегі сот, ол жоқ жерде — аудандық сот қарайды."
  kz.court.economic:
    ru: "Спор между предпринимателями и компаниями рассматривает экономический суд."
    kk: "Кәсіпкерлер мен компаниялар арасындағы дауды экономикалық сот қарайды."
  kz.court.district:
    ru: "Этот спор решает суд: иск подаётся в районный (городской) суд по подсудности."
    kk: "Бұл дауды сот шешеді: талап қою арызы соттылығы бойынша аудандық (қалалық) сотқа беріледі."
  kz.police:
    ru: "О преступлении заявляют в полицию по месту события."
    kk: "Қылмыс туралы оқиға болған жердегі полицияға арыз беріледі."

# Проверка документа перед выдачей (PM 02.10, владелец: «грубые ошибки в документах»): эти слова в тексте документа
# останавливают выдачу — документ уходит юристу, а не клиенту. Квадратные скобки проверяются всегда.
document_markers:
  ru: [уточнит юрист, рассчитает юрист, Проверьте данные, Проверьте сведения, по сути обращения]
  kk: [заңгер нақтылайды, заңгер есептейді, Деректерді тексеріңіз]
  "*": [KZT]   # QA BUG-22: в тексте только «₸ (… тенге)»
norm_words:
  ru: [стать, закон, кодекс]
  kk: [бап, заң, кодекс]
document_drop_empty:
  ru: [Правовое основание]
  kk: [Құқықтық негіз]
