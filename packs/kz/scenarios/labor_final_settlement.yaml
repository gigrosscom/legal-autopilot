# Нормы проверены 28.09.2026 по официальному тексту ИПС «Әділет» (страница акта открыта, номер статьи — как в тексте):
#   - Трудовой кодекс РК — https://adilet.zan.kz/rus/docs/K1500000414
#     ст. 113, п. 4 («При прекращении трудового договора выплата сумм, причитающихся работнику от работодателя,
#     производится не позднее трех рабочих дней после его прекращения»; при нарушении — задолженность и пеня);
#     ст. 191 (государственный контроль — государственные инспекторы труда), ст. 193 (права инспекторов, в т.ч.
#     выдавать обязательные для исполнения предписания); ст. 159 (согласительные комиссии), ст. 160 (сроки обращения:
#     по «другим трудовым спорам» — один год; см. нормативное постановление Конституционного Суда от 08.06.2026 № 81-НП
#     в тексте статьи).
# Срок ответа работодателя в законе не найден — deadline не задан. TODO(lawyer): расчёт пени (формула только в YAML).
id: kz.labor.final_settlement
version: 0.1.0
ontology: LABOR.WAGES.FINAL_SETTLEMENT
taxonomy: labor.unpaid_wages
jurisdiction: KZ
languages: [ru, kk]
owner: lawyer:kz-01
reviewed_at: null
published: true
title:
  ru: Не выплатили расчёт при увольнении
  kk: Жұмыстан шыққанда есеп айырысу төленбеді
summary:
  ru: Вы уволились или вас уволили, а работодатель не выплатил окончательный расчёт — зарплату, компенсацию за неиспользованный отпуск и другие суммы.
  kk: Сіз жұмыстан шықтыңыз не сізді шығарды, ал жұмыс беруші түпкілікті есеп айырысуды — жалақыны, пайдаланылмаған демалыс үшін өтемақыны және басқа сомаларды төлемеді.
classification:
  keywords:
    ru: [расчёт при увольнении, расчет при увольнении, окончательный расчёт, окончательный расчет, не выплатили расчёт, не выплатили расчет, компенсаци за отпуск, после увольнения не заплатили, уволился]
    kk: [есеп айырысу, жұмыстан шықтым, демалыс өтемақысы]
  examples:
    ru:
      - Уволился месяц назад, расчёт до сих пор не выплатили
      - Уволили без предупреждения и не выплатили расчёт
    kk:
      - Бір ай бұрын жұмыстан шықтым, есеп айырысу әлі төленбеді
claim:
  type: wages
  amount_field: amount
intake:
  - respondent_name: {label: {ru: Работодатель, kk: Жұмыс беруші}, question: {ru: "Как называется работодатель (организация или ИП)?", kk: "Жұмыс берушінің (ұйымның не ЖК-ның) атауы қандай?"}}
  - event_date: {type: date, label: {ru: Дата увольнения, kk: Жұмыстан шығу күні}, question: {ru: "Какого числа прекращён трудовой договор? (ДД.ММ.ГГГГ)", kk: "Еңбек шарты қай күні тоқтатылды? (КК.АА.ЖЖЖЖ)"}}
  - amount: {type: money, currency: KZT, question: {ru: "Какую сумму вам не выплатили, в тенге? Если не знаете точно — примерно.", kk: "Сізге қанша сома төленбеді, теңгемен? Нақты білмесеңіз — шамамен."}}
  - problem_description: {type: longtext}
  - applicant_name: {pii: person}
  - applicant_iin: {optional: true, pii: id_number, pattern: '^\d{12}$'}
  - applicant_address: {pii: address}
  - applicant_phone: {type: phone, pii: phone}
  - evidence: [employment_contract, dismissal_order, pay_slip, correspondence]
parties:
  applicant: {kind: person, name_field: applicant_name, id_field: applicant_iin, address_field: applicant_address}
  respondent: {kind: business, name_field: respondent_name}
actions:
  - id: statement_to_employer
    title: {ru: Письменное требование работодателю о выплате расчёта, kk: Жұмыс берушіге есеп айырысуды төлеу туралы жазбаша талап}
    template: kz/templates/generic/statement.docx
    channel: user_submits
    addressee: {party: respondent}
    norm_refs:
      - "Трудовой кодекс Республики Казахстан, статья 113"
    demands:
      ru: "выплатить мне все суммы, причитающиеся при прекращении трудового договора, в размере {amount} {currency}, а также пеню за период задержки платежа; выдать расчётный лист с указанием составных частей выплаты; о принятом решении сообщить мне письменно."
    instructions:
      ru:
        - "По закону расчёт выплачивается не позднее трёх рабочих дней после прекращения трудового договора."
        - "Распечатайте требование в двух экземплярах, вручите один работодателю ({addressee}) и попросите на втором отметку о принятии: дата, ФИО, подпись. Либо отправьте заказным письмом с уведомлением о вручении."
        - "Нажмите «Документ подан»."
      kk:
        - "Заң бойынша есеп айырысу еңбек шарты тоқтатылғаннан кейін үш жұмыс күнінен кешіктірілмей төленеді."
        - "Талапты екі данада басып шығарып, бірін жұмыс берушіге ({addressee}) беріңіз де, екіншісіне қабылдағаны туралы белгі сұраңыз: күні, аты-жөні, қолы. Не табыс етілгені туралы хабарламасы бар тапсырыс хатпен жіберіңіз."
        - "«Құжат тапсырылды» батырмасын басыңыз."
  - id: complaint_labor_inspection
    when: statement_to_employer.response in [none, refusal, partial]
    title: {ru: Жалоба в инспекцию труда, kk: Еңбек инспекциясына шағым}
    template: kz/templates/generic/complaint.docx
    channel: user_submits
    addressee: {forum: kz.labor_inspection}
    norm_refs:
      - "Трудовой кодекс Республики Казахстан, статья 113"
      - "Трудовой кодекс Республики Казахстан, статья 193"
    demands:
      ru: "провести проверку соблюдения работодателем трудового законодательства при выплате сумм, причитающихся мне при прекращении трудового договора, выдать работодателю предписание о выплате, о результатах сообщить мне."
    instructions:
      ru:
        - "Подайте жалобу через портал обращений или лично. Точный канал подачи уточнит юрист."
        - "Приложите требование работодателю с отметкой о принятии, приказ об увольнении и расчётные листы."
        - "Сохраните регистрационный номер и нажмите «Документ подан»."
      kk:
        - "Шағымды өтініштер порталы арқылы не өзіңіз беріңіз. Нақты беру арнасын заңгер нақтылайды."
        - "Жұмыс берушіге берілген, қабылданғаны туралы белгісі бар талапты, жұмыстан шығару туралы бұйрықты және есеп айырысу парақтарын тіркеңіз."
        - "Тіркеу нөмірін сақтап, «Құжат тапсырылды» батырмасын басыңыз."
  - id: handoff_lawyer
    kind: handoff
    when: complaint_labor_inspection.response in [none, refusal, partial]
    title: {ru: Передача дела юристу (согласительная комиссия или суд), kk: Істі заңгерге беру (келісім комиссиясы не сот)}
pricing: {model: fixed, amount: 1990, currency: KZT}
