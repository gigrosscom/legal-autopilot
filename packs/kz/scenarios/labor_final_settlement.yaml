# Нормы проверены 28.09.2026 по официальному тексту ИПС «Әділет» (страница акта открыта, номер статьи — как в тексте):
#   - Трудовой кодекс РК — https://adilet.zan.kz/rus/docs/K1500000414
#     ст. 113, п. 4 («При прекращении трудового договора выплата сумм, причитающихся работнику от работодателя,
#     производится не позднее трех рабочих дней после его прекращения»; при нарушении — задолженность и пеня);
#     ст. 191 (государственный контроль — государственные инспекторы труда), ст. 193 (права инспекторов, в т.ч.
#     выдавать обязательные для исполнения предписания); ст. 159 (согласительные комиссии), ст. 160 (сроки обращения:
#     по «другим трудовым спорам» — один год; см. нормативное постановление Конституционного Суда от 08.06.2026 № 81-НП
#     в тексте статьи).
# Срок ответа: согласительная комиссия — 15 рабочих дней (ТК ст. 159; ZANN, old.adilet 02.10.2026). TODO(lawyer): расчёт пени (формула только в YAML).
#   - АППК РК, ст. 63 (реквизиты обращения: ФИО, ИИН, почтовый адрес заявителя; наименование органа; суть; дата; подпись),
#     ст. 76, ч. 1 (обращение рассматривается 15 рабочих дней со дня регистрации, если иное не предусмотрено законами) —
#     https://adilet.zan.kz/rus/docs/K2000000350, открыт 28.09.2026 (срок жалобы в госорган — deadline по ст. 76).
id: kz.labor.final_settlement
version: 0.1.0
ontology: LABOR.WAGES.FINAL_SETTLEMENT
taxonomy: labor.unpaid_wages
jurisdiction: KZ
languages: [ru, kk]
owner: lawyer:kz-01
reviewed_at: null
published: true
title:
  ru: Не выплатили расчёт при увольнении
  kk: Жұмыстан шыққанда есеп айырысу төленбеді
summary:
  ru: Вы уволились или вас уволили, а работодатель не выплатил окончательный расчёт — зарплату, компенсацию за неиспользованный отпуск и другие суммы.
  kk: Сіз жұмыстан шықтыңыз не сізді шығарды, ал жұмыс беруші түпкілікті есеп айырысуды — жалақыны, пайдаланылмаған демалыс үшін өтемақыны және басқа сомаларды төлемеді.
classification:
  keywords:
    ru: [расчёт при увольнении, расчет при увольнении, окончательный расчёт, окончательный расчет, не выплатили расчёт, не выплатили расчет, компенсаци за отпуск, после увольнения не заплатили, уволился]
    kk: [есеп айырысу, жұмыстан шықтым, демалыс өтемақысы]
  examples:
    ru:
      - Уволился месяц назад, расчёт до сих пор не выплатили
      - Уволили без предупреждения и не выплатили расчёт
    kk:
      - Бір ай бұрын жұмыстан шықтым, есеп айырысу әлі төленбеді
claim:
  type: wages
  amount_field: amount
intake:
  - respondent_name: {label: {ru: Работодатель, kk: Жұмыс беруші}, question: {ru: "Как называется работодатель (организация или ИП)?", kk: "Жұмыс берушінің (ұйымның не ЖК-ның) атауы қандай?"}}
  - respondent_bin: {optional: true, pattern: '^\d{12}$'}
  - respondent_address: {optional: true}
  - event_date: {type: date, label: {ru: Дата увольнения, kk: Жұмыстан шығу күні}, question: {ru: "Какого числа прекращён трудовой договор? (ДД.ММ.ГГГГ)", kk: "Еңбек шарты қай күні тоқтатылды? (КК.АА.ЖЖЖЖ)"}}
  - amount: {type: money, currency: KZT, question: {ru: "Какую сумму вам не выплатили, в тенге? Если не знаете точно — примерно.", kk: "Сізге қанша сома төленбеді, теңгемен? Нақты білмесеңіз — шамамен."}}
  - problem_description: {type: longtext}
  - applicant_name: {pii: person}
  - applicant_iin: {optional: true, pii: id_number, pattern: '^\d{12}$'}
  - applicant_address: {pii: address}
  - applicant_phone: {type: phone, pii: phone}
  - evidence: [employment_contract, dismissal_order, pay_slip, correspondence]
parties:
  applicant: {kind: person, name_field: applicant_name, id_field: applicant_iin, address_field: applicant_address}
  respondent: {kind: business, name_field: respondent_name, id_field: respondent_bin, address_field: respondent_address}
actions:
  - id: statement_to_employer
    title: {ru: Письменное требование работодателю о выплате расчёта, kk: Жұмыс берушіге есеп айырысуды төлеу туралы жазбаша талап}
    template: kz/templates/generic/statement.docx
    channel: user_submits
    addressee: {party: respondent, heading: {ru: "Руководителю {name} — для рассмотрения в согласительной комиссии, а при её отсутствии — руководителем", kk: "{name} басшысына — келісім комиссиясында қарау үшін, ол болмаса — басшының өзі қарауы үшін"}}
    deadline: {business_days: 15, norm_ref: "Трудовой кодекс Республики Казахстан, статья 159"}
    filing:
      deadline: {calendar_days: 365, from_field: event_date, from_text: {ru: "со дня увольнения (зарплату суд взыщет и за 3 года)", kk: "жұмыстан шыққан күннен бастап (жалақыны сот 3 жыл үшін де өндіреді)"}, norm_ref: "Трудовой кодекс Республики Казахстан, статья 160", verified: true}
      signature: either
    norm_refs:
      - "Трудовой кодекс Республики Казахстан, статья 113"
      - "Трудовой кодекс Республики Казахстан, статья 159"
    demands:
      ru: "рассмотреть настоящее требование в согласительной комиссии, а при её отсутствии — рассмотреть его Вам как руководителю и выплатить мне все суммы, причитающиеся при прекращении трудового договора, в размере {amount} {currency}; выдать расчётный лист с указанием составных частей выплаты; о принятом решении сообщить мне письменно."
    instructions:
      ru:
        - "**Адресат — руководитель.** Требование адресовано руководителю с просьбой рассмотреть его в согласительной комиссии, а если комиссии нет — решить вопрос самому: так не нужно знать, есть ли комиссия. Комиссия рассматривает спор 15 рабочих дней (ТК, ст. 159); пока комиссии нет, срок обращения в суд не идёт (ТК, ст. 160)."
        - "**Распечатайте и подпишите.** Два экземпляра, подпись на обоих."
        - "**Вручите работодателю ({addressee}).** Один экземпляр отдайте, на втором попросите отметку о принятии: дата, ФИО, подпись. Или отправьте заказным письмом с уведомлением о вручении."
        - "**Нажмите «Документ подан».** Отсчитаем 15 рабочих дней и напомним. Не выплатят — следующий шаг: жалоба в инспекцию труда."
        - "**Что говорит закон.** Расчёт при увольнении выплачивается не позднее трёх рабочих дней после прекращения трудового договора."
      kk:
        - "**Алушы — басшы.** Талап басшыға келісім комиссиясында қарау, ал комиссия болмаса — мәселені өзі шешу өтінішімен жолданады: комиссияның бар-жоғын білу қажет емес. Комиссия дауды 15 жұмыс күнінде қарайды (ЕК, 159-бап); комиссия жоқ кезде сотқа жүгіну мерзімі жүрмейді (ЕК, 160-бап)."
        - "**Басып шығарып, қол қойыңыз.** Екі дана, екеуіне де қол қойыңыз."
        - "**Жұмыс берушіге ({addressee}) табыс етіңіз.** Бір данасын беріп, екіншісіне қабылдау белгісін сұраңыз: күні, аты-жөні, қолы. Не табыс етілгені туралы хабарламасы бар тапсырыс хатпен жіберіңіз."
        - "**«Құжат тапсырылды» батырмасын басыңыз.** 15 жұмыс күнін есептеп, еске саламыз. Төлемесе — келесі қадам: еңбек инспекциясына шағым."
        - "**Заң не дейді.** Жұмыстан шығарғандағы есеп айырысу еңбек шарты тоқтатылғаннан кейін үш жұмыс күнінен кешіктірілмей төленеді."
  - id: complaint_labor_inspection
    when: statement_to_employer.response in [none, refusal, partial]
    title: {ru: Жалоба в инспекцию труда, kk: Еңбек инспекциясына шағым}
    template: kz/templates/generic/complaint.docx
    channel: user_submits
    addressee: {forum: kz.labor_inspection}
    deadline: {business_days: 15, norm_ref: "Административный процедурно-процессуальный кодекс Республики Казахстан, статья 76"}
    norm_refs:
      - "Трудовой кодекс Республики Казахстан, статья 113"
      - "Трудовой кодекс Республики Казахстан, статья 193"
    demands:
      ru: "провести проверку соблюдения работодателем трудового законодательства при выплате сумм, причитающихся мне при прекращении трудового договора, выдать работодателю предписание о выплате, о результатах сообщить мне."
    instructions:
      ru:
        - "**Подайте жалобу в инспекцию труда.** Через портал обращений eotinish.kz (вход по ЭЦП или SMS) или лично в инспекции труда вашего города."
        - "**Приложите доказательства.** Требование работодателю с отметкой о принятии, трудовой договор, расчётные листы, переписку."
        - "**Сохраните номер и нажмите «Документ подан».** Инспекция отвечает за 15 рабочих дней (АППК, ст. 76) — мы напомним."
        - "**Если не поможет — иск в суд.** По искам о взыскании оплаты труда госпошлина не платится (НК 2025, ст. 668 пп. 1)); зарплату можно взыскать за три года (ТК, ст. 160; НП КС от 08.06.2026 № 81-НП)."
      kk:
        - "**Еңбек инспекциясына шағым беріңіз.** eotinish.kz өтініштер порталы арқылы (ЭЦҚ не SMS арқылы кіру) немесе қалаңыздағы еңбек инспекциясына өзіңіз."
        - "**Дәлелдерді тіркеңіз.** Қабылдау белгісі бар жұмыс берушіге талап, еңбек шарты, есеп парақтары, хат алмасу."
        - "**Нөмірді сақтап, «Құжат тапсырылды» батырмасын басыңыз.** Инспекция 15 жұмыс күнінде жауап береді (ӘРПК, 76-бап) — біз еске саламыз."
        - "**Көмектеспесе — сотқа талап арыз.** Еңбекақыны өндіріп алу туралы талаптар бойынша мемлекеттік баж төленбейді (2025 СК, 668-бап 1) тармақша); жалақыны үш жыл үшін өндіруге болады (ЕК, 160-бап; ҚС 08.06.2026 № 81-НҚ)."
  - id: handoff_lawyer
    kind: handoff
    when: complaint_labor_inspection.response in [none, refusal, partial]
    title: {ru: Передача дела юристу (согласительная комиссия или суд), kk: Істі заңгерге беру (келісім комиссиясы не сот)}
pricing: {model: fixed, amount: 2990, currency: KZT}
