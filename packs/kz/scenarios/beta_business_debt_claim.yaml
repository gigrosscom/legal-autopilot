# БЕТА (EXPERIMENTAL_SCENARIOS=true). Для бизнеса: претензия контрагенту о взыскании долга по договору (B2B).
# Нормы проверены 28.09.2026 по официальному тексту ИПС «Әділет» (old.adilet.zan.kz):
#   Гражданский кодекс РК (Общая часть) — https://adilet.zan.kz/rus/docs/K940001000_
#     ст. 272 (надлежащее исполнение), ст. 277 п. 2 (обязательство без срока / до востребования — семидневный срок со дня
#     требования), ст. 293 (неустойка — по закону или договору), ст. 349 (нарушение обязательства), ст. 353 (неустойка за
#     пользование чужими деньгами по базовой ставке НБ РК, если иной размер не установлен договором).
# Неустойка: сервис НЕ считает её сам — в претензию попадает только условие договора и сумма, которую человек рассчитал
# по формуле договора (поле penalty_clause); если поле пропущено, требование о неустойке не включается.
# TODO(lawyer): претензионный срок, если договор его устанавливает (сейчас напоминание — через 7 дней по ст. 277 п. 2).
id: kz.business.debt_claim
version: 0.1.0
ontology: BUSINESS.CONTRACT.DEBT_RECOVERY
jurisdiction: KZ
languages: [ru, kk]
owner: lawyer:kz-01
reviewed_at: null
published: true
beta: true
kind: dispute
title:
  ru: "Для бизнеса: долг контрагента по договору"
  kk: "Бизнес үшін: контрагенттің шарт бойынша қарызы"
summary:
  ru: Контрагент не оплатил поставку, работы или услуги по договору — претензия о погашении долга (и неустойки по условию договора), затем передача юристу для иска.
  kk: Контрагент шарт бойынша жеткізілім, жұмыс не қызмет ақысын төлемеді — қарызды (және шарт талабы бойынша тұрақсыздық айыбын) өтеу туралы талап-арыз, содан кейін талап қою үшін заңгерге беру.
disclaimer:
  ru: "Бета. Konsiliér AI — IT-сервис подготовки документов, не юридическая помощь. Результат не гарантируется."
  kk: "Бета. Konsiliér AI — құжаттарды дайындайтын IT-сервис, заң көмегі емес. Нәтижеге кепілдік берілмейді."
classification:
  keywords:
    ru: [контрагент, дебиторск, не оплатил счёт, не оплатил счет, не оплатили счёт, не оплатили счет, неоплаченн, должно нам, задолженность по договору, долг по договору, оплату по договору, акт выполненных работ, счёт-фактур, счет-фактур]
    kk: [контрагент, дебиторлық берешек, шарт бойынша қарыз]
  examples:
    ru:
      - Контрагент не оплатил счёт по договору поставки, ТОО должно нам 5 000 000 тенге
      - Заказчик подписал акт выполненных работ, но не платит по договору уже два месяца
    kk:
      - Контрагент шарт бойынша шотты төлемеді
claim:
  type: debt
  amount_field: amount
intake:
  - respondent_name: {label: {ru: "Контрагент (должник)", kk: "Контрагент (борышкер)"}, question: {ru: "Кто должен: полное наименование ТОО или ИП?", kk: "Кім қарыз: ЖШС немесе ЖК толық атауы?"}}
  - respondent_bin: {optional: true, pattern: '^\d{12}$', label: {ru: "БИН/ИИН контрагента", kk: "Контрагенттің БСН/ЖСН"}, question: {ru: "БИН или ИИН контрагента (12 цифр) — или «Пропустить».", kk: "Контрагенттің БСН не ЖСН (12 цифр) — немесе «Өткізу»."}}
  - contract_number: {label: {ru: "Номер договора", kk: "Шарт нөмірі"}, question: {ru: "Номер договора?", kk: "Шарт нөмірі?"}}
  - contract_date: {type: date, label: {ru: "Дата договора", kk: "Шарт күні"}, question: {ru: "Дата договора (ДД.ММ.ГГГГ)?", kk: "Шарт күні (КК.АА.ЖЖЖЖ)?"}}
  - event_date: {type: date, label: {ru: "Срок оплаты", kk: "Төлем мерзімі"}, question: {ru: "До какой даты контрагент должен был заплатить (ДД.ММ.ГГГГ)?", kk: "Контрагент қай күнге дейін төлеуі тиіс еді (КК.АА.ЖЖЖЖ)?"}}
  - amount: {type: money, currency: KZT, label: {ru: "Сумма долга", kk: "Қарыз сомасы"}, question: {ru: "Сумма основного долга, в тенге?", kk: "Негізгі қарыз сомасы, теңгемен?"}}
  - problem_description: {type: longtext}
  - penalty_clause: {type: longtext, optional: true, label: {ru: "Неустойка по договору", kk: "Шарт бойынша тұрақсыздық айыбы"}, question: {ru: "Если договор предусматривает неустойку — перепишите пункт договора и ваш расчёт по его формуле (сумма в тенге). Сервис неустойку не считает. Нет — «Пропустить».", kk: "Шартта тұрақсыздық айыбы көзделсе — шарт тармағын және оның формуласы бойынша өз есебіңізді (теңгемен сомасы) жазыңыз. Сервис айыпты есептемейді. Жоқ болса — «Өткізу»."}}
  - applicant_name: {pii: person, label: {ru: "Ваша компания (ТОО или ИП)", kk: "Сіздің компанияңыз (ЖШС немесе ЖК)"}, question: {ru: "Полное наименование вашей компании (ТОО или ИП)?", kk: "Компанияңыздың толық атауы (ЖШС немесе ЖК)?"}}
  - applicant_bin: {pii: id_number, pattern: '^\d{12}$', label: {ru: "БИН/ИИН", kk: "БСН/ЖСН"}, question: {ru: "БИН вашей компании (или ИИН для ИП) — 12 цифр?", kk: "Компанияңыздың БСН-і (ЖК үшін ЖСН) — 12 цифр?"}}
  - representative: {pii: person, label: {ru: "Кто подписывает", kk: "Кім қол қояды"}, question: {ru: "ФИО и должность того, кто подписывает претензию?", kk: "Талап-арызға қол қоятын адамның аты-жөні және лауазымы?"}}
  - applicant_address: {pii: address, label: {ru: "Юридический адрес", kk: "Заңды мекенжай"}, question: {ru: "Юридический адрес вашей компании?", kk: "Компанияңыздың заңды мекенжайы?"}}
  - applicant_phone: {type: phone, pii: phone}
  - evidence: [business_contract, invoice_act, correspondence, bank_statement]
parties:
  applicant: {kind: business, name_field: applicant_name, id_field: applicant_bin, address_field: applicant_address}
  respondent: {kind: business, name_field: respondent_name, id_field: respondent_bin}
actions:
  - id: claim_to_debtor
    title: {ru: Претензия о погашении задолженности по договору, kk: Шарт бойынша берешекті өтеу туралы талап-арыз}
    template: kz/templates/business/claim_b2b.docx
    channel: user_submits
    addressee: {party: respondent}
    deadline: {calendar_days: 7, norm_ref: "Гражданский кодекс Республики Казахстан (Общая часть), статья 277"}
    norm_refs:
      - "Гражданский кодекс Республики Казахстан (Общая часть), статья 272"
      - "Гражданский кодекс Республики Казахстан (Общая часть), статья 277"
      - "Гражданский кодекс Республики Казахстан (Общая часть), статья 349"
    demands:
      ru: "оплатить задолженность по договору № {contract_number} от {contract_date} в размере {amount} {currency} и сообщить о решении письменно."
      kk: "{contract_date} № {contract_number} шарт бойынша {amount} {currency} мөлшеріндегі берешекті төлеу және шешім туралы жазбаша хабарлау."
    package:
      - id: penalty
        title: {ru: Неустойка по договору, kk: Шарт бойынша тұрақсыздық айыбы}
        if: penalty_clause
        text:
          - ru: "Кроме того, требуем уплатить неустойку, предусмотренную договором (статья 293 Гражданского кодекса Республики Казахстан). Условие договора и расчёт: {penalty_clause}"
            kk: "Сонымен қатар, шартта көзделген тұрақсыздық айыбын төлеуді талап етеміз (Қазақстан Республикасы Азаматтық кодексінің 293-бабы). Шарт талабы және есеп: {penalty_clause}"
    instructions:
      ru:
        - "Подпишите претензию руководителем и отправьте контрагенту способом из договора (e-mail, ЭДО, курьер или заказное письмо с уведомлением) — сохраните подтверждение."
        - "Если договор устанавливает претензионный порядок и срок ответа — соблюдайте его; иначе срок исполнения по требованию — {deadline_days} дней (ст. 277 п. 2 ГК)."
        - "Нажмите «Документ подан». Если не заплатят — передадим дело юристу для иска."
      kk:
        - "Талап-арызға басшының қолын қойып, контрагентке шартта көрсетілген тәсілмен (e-mail, ЭҚА, курьер немесе хабарламасы бар тапсырыс хат) жіберіңіз — растауын сақтаңыз."
        - "Шартта талап-арыз тәртібі мен жауап мерзімі белгіленсе — соны сақтаңыз; әйтпесе талап бойынша орындау мерзімі — {deadline_days} күн (АК 277-бабының 2-тармағы)."
        - "«Құжат тапсырылды» батырмасын басыңыз. Төлемесе — талап қою үшін істі заңгерге береміз."
  - id: handoff_lawyer
    kind: handoff
    when: claim_to_debtor.response in [none, refusal, partial]
    title: {ru: Передача дела юристу (иск о взыскании), kk: Істі заңгерге беру (өндіріп алу туралы талап)}
pricing: {model: fixed, amount: 1990, currency: KZT}
