# Опубликован 28.09.2026 по решению владельца. reviewed_at: null → на каждом документе нейтральная пометка compliance.draft_disclaimer.
# Нормы проверены 28.09.2026 по официальному тексту ИПС «Әділет» (страница акта открыта, номер статьи — как в тексте):
#   - Кодекс РК об административных правонарушениях — https://adilet.zan.kz/rus/docs/K1400000235
#     ст. 826-1 (право обжаловать постановление в вышестоящий орган (должностному лицу));
#     ст. 826-2, п. 1 (жалоба направляется в орган, вынесший постановление, который в течение трёх суток направляет её
#       в вышестоящий орган; может быть подана непосредственно в вышестоящий орган), п. 2 (в течение десяти суток со дня
#       вручения копии постановления), п. 4 (подача в срок приостанавливает исполнение постановления);
#     ст. 826-3, п. 1 (жалоба рассматривается в течение десяти суток со дня поступления).
# deadline не задан: срок рассмотрения считается со дня поступления в вышестоящий орган (+ до трёх суток на пересылку).
# TODO(lawyer): постановления суда и налоговые (30 суток, п. 3 ст. 826-2) — другой порядок; скидка при оплате.
id: kz.administrative.fine_appeal
version: 0.1.0
ontology: ADMIN.FINE.APPEAL
taxonomy: administrative.fine_appeal
jurisdiction: KZ
languages: [ru, kk]
owner: lawyer:kz-01
reviewed_at: null
published: true
title:
  ru: Обжалование штрафа
  kk: Айыппұлға шағымдану
summary:
  ru: Вы не согласны с постановлением о штрафе и хотите его обжаловать.
  kk: Айыппұл туралы қаулымен келіспейсіз және оған шағымданғыңыз келеді.
classification:
  keywords:
    ru: [штраф, постановлени, оштрафовали, обжаловать штраф]
    kk: [айыппұл, қаулы, шағымдану]
  examples:
    ru:
      - Выписали штраф за парковку, но я стоял там, где разрешено
claim:
  type: annulment
  amount_field: amount
intake:
  - respondent_name
  - event_date: {type: date}
  - amount: {type: money, currency: KZT, optional: true, question: {ru: "Какая сумма штрафа, в тенге?", kk: "Айыппұл сомасы қанша, теңгемен?"}}
  - problem_description: {type: longtext}
  - applicant_name: {pii: person}
  - applicant_iin: {optional: true, pii: id_number, pattern: '^\d{12}$'}
  - applicant_address: {pii: address}
  - applicant_phone: {type: phone, pii: phone}
  - evidence: [fine_decision, correspondence, other]
parties:
  applicant: {kind: person, name_field: applicant_name, id_field: applicant_iin, address_field: applicant_address}
  respondent: {kind: authority, name_field: respondent_name}
actions:
  - id: complaint_superior
    title: {ru: Жалоба на постановление о штрафе, kk: Айыппұл туралы қаулыға шағым}
    template: kz/templates/generic/complaint.docx
    channel: user_submits
    # Адресат — орган, вынесший постановление (КоАП, ст. 826-2, п. 1): он пересылает жалобу в вышестоящий орган.
    addressee: {party: respondent}
    norm_refs:
      - "Кодекс Республики Казахстан об административных правонарушениях, статья 826-1"
      - "Кодекс Республики Казахстан об административных правонарушениях, статья 826-2"
    demands:
      ru: "отменить постановление о наложении административного штрафа и прекратить производство по делу, о принятом решении сообщить мне."
    instructions:
      ru:
        - "Жалоба подаётся в течение десяти суток со дня вручения копии постановления. Подача в срок приостанавливает исполнение постановления."
        - "Подайте жалобу в орган, который вынес постановление (он в течение трёх суток перешлёт её в вышестоящий орган), или сразу в вышестоящий орган."
        - "Приложите копию постановления и доказательства."
        - "Сохраните отметку о приёме или регистрационный номер и нажмите «Документ подан». Жалобу рассматривают в течение десяти суток со дня поступления."
      kk:
        - "Шағым қаулының көшірмесі табыс етілген күннен бастап он тәулік ішінде беріледі. Мерзімінде берілген шағым қаулының орындалуын тоқтата тұрады."
        - "Шағымды қаулы шығарған органға (ол үш тәулік ішінде жоғары тұрған органға жібереді) не бірден жоғары тұрған органға беріңіз."
        - "Қаулының көшірмесін және дәлелдерді тіркеңіз."
        - "Қабылдау белгісін не тіркеу нөмірін сақтап, «Құжат тапсырылды» батырмасын басыңыз. Шағым келіп түскен күннен бастап он тәулік ішінде қаралады."
  - id: handoff_lawyer
    kind: handoff
    when: complaint_superior.response in [none, refusal, partial]
    title: {ru: Передача дела юристу (обжалование в суде), kk: Істі заңгерге беру (сотта шағымдану)}
pricing: {model: fixed, amount: 1990, currency: KZT}
