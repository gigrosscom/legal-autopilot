# БЕТА (EXPERIMENTAL_SCENARIOS=true). Для бизнеса: претензия поставщику — недопоставка или товар ненадлежащего качества (B2B).
# Нормы проверены 28.09.2026 по официальному тексту ИПС «Әділет» (old.adilet.zan.kz):
#   Гражданский кодекс РК (Особенная часть) — https://adilet.zan.kz/rus/docs/K990000409_
#     ст. 428 (права покупателя при ненадлежащем качестве), ст. 464 (восполнение недопоставки; п. 4 — отказ от просроченной
#     поставки), ст. 471 (поставка ненадлежащего качества → требования ст. 428), ст. 473 (покупка у других лиц за счёт
#     поставщика; отказ от оплаты / возврат уплаченного), ст. 474 (неустойка за недопоставку — по закону или договору).
# Срок ответа закон не устанавливает — напоминания нет, срок ставит договор (TODO(lawyer): претензионный порядок договора).
id: kz.business.supply_claim
version: 0.1.0
ontology: BUSINESS.CONTRACT.SUPPLY_CLAIM
jurisdiction: KZ
languages: [ru, kk]
owner: lawyer:kz-01
reviewed_at: null
published: false  # beta: offered only with EXPERIMENTAL_SCENARIOS=true
beta: true
kind: dispute
title:
  ru: "Для бизнеса: недопоставка или некачественный товар"
  kk: "Бизнес үшін: толық жеткізбеу немесе сапасыз тауар"
summary:
  ru: Поставщик по договору поставки не довёз товар или поставил некачественный — претензия поставщику по ГК РК, затем передача юристу.
  kk: Жеткізуші жеткізу шарты бойынша тауарды толық әкелмеді немесе сапасыз тауар жеткізді — АК бойынша жеткізушіге талап-арыз, содан кейін заңгерге беру.
disclaimer:
  ru: "Бета. Konsiliér AI — IT-сервис подготовки документов, не юридическая помощь. Результат не гарантируется."
  kk: "Бета. Konsiliér AI — құжаттарды дайындайтын IT-сервис, заң көмегі емес. Нәтижеге кепілдік берілмейді."
classification:
  keywords:
    ru: [поставщик, недопостав, недопоставк, не допоставил, договор поставки, договору поставки, некачественный товар, некачественную партию, партия товара, партию товара, брак в партии, претензия поставщику]
    kk: [жеткізуші, толық жеткізбеді, жеткізу шарты, сапасыз тауар]
  examples:
    ru:
      - Поставщик недопоставил товар по договору поставки, не хватает половины партии
      - Поставщик привёз некачественную партию товара, претензия поставщику нужна
    kk:
      - Жеткізуші жеткізу шарты бойынша тауарды толық жеткізбеді
claim:
  type: supply
  amount_field: amount
intake:
  - respondent_name: {label: {ru: "Поставщик", kk: "Жеткізуші"}, question: {ru: "Поставщик: полное наименование ТОО или ИП?", kk: "Жеткізуші: ЖШС немесе ЖК толық атауы?"}}
  - respondent_bin: {optional: true, pattern: '^\d{12}$', label: {ru: "БИН/ИИН поставщика", kk: "Жеткізушінің БСН/ЖСН"}, question: {ru: "БИН или ИИН поставщика (12 цифр) — или «Пропустить».", kk: "Жеткізушінің БСН не ЖСН (12 цифр) — немесе «Өткізу»."}}
  - contract_number: {label: {ru: "Номер договора поставки", kk: "Жеткізу шартының нөмірі"}, question: {ru: "Номер договора поставки?", kk: "Жеткізу шартының нөмірі?"}}
  - contract_date: {type: date, label: {ru: "Дата договора", kk: "Шарт күні"}, question: {ru: "Дата договора (ДД.ММ.ГГГГ)?", kk: "Шарт күні (КК.АА.ЖЖЖЖ)?"}}
  - goods_description: {label: {ru: "Товар", kk: "Тауар"}, question: {ru: "Какой товар, сколько должны были поставить и сколько поставили (или в чём брак)?", kk: "Қандай тауар, қанша жеткізілуі тиіс еді және қанша жеткізілді (немесе ақауы неде)?"}}
  - event_date: {type: date, label: {ru: "Дата поставки (приёмки)", kk: "Жеткізу (қабылдау) күні"}, question: {ru: "Когда была поставка или приёмка (ДД.ММ.ГГГГ)?", kk: "Жеткізу не қабылдау қашан болды (КК.АА.ЖЖЖЖ)?"}}
  - amount: {type: money, currency: KZT, label: {ru: "Сумма требований", kk: "Талап сомасы"}, question: {ru: "Сумма требований в тенге (например, стоимость недопоставленного или бракованного товара)?", kk: "Талап сомасы теңгемен (мысалы, жеткізілмеген не ақаулы тауардың құны)?"}}
  - problem_description: {type: longtext}
  - desired_outcome: {label: {ru: "Чего требуете", kk: "Не талап етесіз"}, question: {ru: "Чего требуете: допоставить, заменить товар, устранить недостатки, уменьшить цену или вернуть оплату?", kk: "Не талап етесіз: толық жеткізу, тауарды ауыстыру, кемшіліктерді жою, бағаны төмендету немесе төлемді қайтару?"}}
  - penalty_clause: {type: longtext, optional: true, label: {ru: "Неустойка по договору", kk: "Шарт бойынша тұрақсыздық айыбы"}, question: {ru: "Если договор предусматривает неустойку за недопоставку или просрочку — перепишите пункт и ваш расчёт по нему. Сервис её не считает. Нет — «Пропустить».", kk: "Шартта толық жеткізбеу не мерзімін өткізу үшін айып көзделсе — тармақты және оның бойынша есебіңізді жазыңыз. Сервис оны есептемейді. Жоқ болса — «Өткізу»."}}
  - applicant_name: {pii: person, label: {ru: "Ваша компания (ТОО или ИП)", kk: "Сіздің компанияңыз (ЖШС немесе ЖК)"}, question: {ru: "Полное наименование вашей компании (ТОО или ИП)?", kk: "Компанияңыздың толық атауы (ЖШС немесе ЖК)?"}}
  - applicant_bin: {pii: id_number, pattern: '^\d{12}$', label: {ru: "БИН/ИИН", kk: "БСН/ЖСН"}, question: {ru: "БИН вашей компании (или ИИН для ИП) — 12 цифр?", kk: "Компанияңыздың БСН-і (ЖК үшін ЖСН) — 12 цифр?"}}
  - representative: {pii: person, label: {ru: "Кто подписывает", kk: "Кім қол қояды"}, question: {ru: "ФИО и должность того, кто подписывает претензию?", kk: "Талап-арызға қол қоятын адамның аты-жөні және лауазымы?"}}
  - applicant_address: {pii: address, label: {ru: "Юридический адрес", kk: "Заңды мекенжай"}, question: {ru: "Юридический адрес вашей компании?", kk: "Компанияңыздың заңды мекенжайы?"}}
  - applicant_phone: {type: phone, pii: phone}
  - evidence: [business_contract, invoice_act, photo, correspondence]
parties:
  applicant: {kind: business, name_field: applicant_name, id_field: applicant_bin, address_field: applicant_address}
  respondent: {kind: business, name_field: respondent_name, id_field: respondent_bin}
actions:
  - id: claim_to_supplier
    title: {ru: Претензия поставщику по договору поставки, kk: Жеткізу шарты бойынша жеткізушіге талап-арыз}
    template: kz/templates/business/claim_b2b.docx
    channel: user_submits
    addressee: {party: respondent}
    norm_refs:
      - "Гражданский кодекс Республики Казахстан (Особенная часть), статья 464"
      - "Гражданский кодекс Республики Казахстан (Особенная часть), статья 471"
      - "Гражданский кодекс Республики Казахстан (Особенная часть), статья 473"
    demands:
      ru: "по договору поставки № {contract_number} от {contract_date} (товар: {goods_description}): {desired_outcome}. Сумма требований — {amount} {currency}. Прошу сообщить о решении письменно."
      kk: "{contract_date} № {contract_number} жеткізу шарты бойынша (тауар: {goods_description}): {desired_outcome}. Талап сомасы — {amount} {currency}. Шешім туралы жазбаша хабарлауыңызды сұраймын."
    package:
      - id: penalty
        title: {ru: Неустойка по договору, kk: Шарт бойынша тұрақсыздық айыбы}
        if: penalty_clause
        text:
          - ru: "Кроме того, требуем уплатить неустойку за недопоставку (просрочку поставки), предусмотренную договором (статья 474 Гражданского кодекса Республики Казахстан (Особенная часть)). Условие договора и расчёт: {penalty_clause}"
            kk: "Сонымен қатар, шартта көзделген толық жеткізбеу (жеткізу мерзімін өткізу) үшін тұрақсыздық айыбын төлеуді талап етеміз (Қазақстан Республикасы Азаматтық кодексінің (Ерекше бөлім) 474-бабы). Шарт талабы және есеп: {penalty_clause}"
    instructions:
      ru:
        - "Отправьте претензию поставщику способом из договора и сохраните подтверждение; приложите договор, накладные или акт, фото брака."
        - "Недопоставленный товар можно купить у других лиц с отнесением разумных расходов на поставщика (ст. 473 ГК). Срок ответа — по договору."
        - "Нажмите «Документ подан». Если требование не выполнят — передадим дело юристу."
      kk:
        - "Талап-арызды жеткізушіге шартта көрсетілген тәсілмен жіберіп, растауын сақтаңыз; шартты, жүкқұжаттарды не актіні, ақаудың фотосын қоса беріңіз."
        - "Жеткізілмеген тауарды ақылға қонымды шығыстарды жеткізушіге жүктей отырып, басқа тұлғалардан сатып алуға болады (АК 473-бабы). Жауап мерзімі — шарт бойынша."
        - "«Құжат тапсырылды» батырмасын басыңыз. Талап орындалмаса — істі заңгерге береміз."
  - id: handoff_lawyer
    kind: handoff
    when: claim_to_supplier.response in [none, refusal, partial]
    title: {ru: Передача дела юристу (иск), kk: Істі заңгерге беру (талап қою)}
pricing: {model: fixed, amount: 1990, currency: KZT}
