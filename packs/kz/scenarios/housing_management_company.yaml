# Опубликован 28.09.2026 по решению владельца. reviewed_at: null → на каждом документе пометка «ЧЕРНОВИК».
# Нормы проверены 28.09.2026 по официальному тексту ИПС «Әділет» (страница акта открыта, номер статьи — как в тексте):
#   - Закон РК «О жилищных отношениях» — https://adilet.zan.kz/rus/docs/Z970000094_
#     ст. 51-5 (обязанности управляющей компании; п. 2 подп. 10) — копии финансовой документации, ежемесячного и
#     годового отчётов по письменному требованию собственника в течение одного месяца);
#     ст. 10-9 (государственный контроль жилищной инспекции за объединениями собственников имущества и субъектами
#     управления объектом кондоминиума; предписания об устранении нарушений).
# «В течение одного месяца» не переведён в deadline (календарные дни) — TODO(lawyer).
# TODO(lawyer): КСК, созданные до реформы, — какие нормы применяются; наименование жилищной инспекции и канал подачи.
id: kz.housing.management_company
version: 0.1.0
ontology: HOUSING.CONDOMINIUM.MANAGEMENT
taxonomy: housing.utilities
jurisdiction: KZ
languages: [ru, kk]
owner: lawyer:kz-01
reviewed_at: null
published: true
title:
  ru: Жалоба на управляющую компанию, ОСИ или КСК
  kk: Басқарушы компанияға, МИБ-ке не ПИК-ке шағым
summary:
  ru: Управляющая компания, объединение собственников имущества (ОСИ) или КСК плохо содержит дом, не отчитывается о расходах взносов или не выполняет решения жильцов.
  kk: Басқарушы компания, мүлік иелерінің бірлестігі (МИБ) не ПИК үйді нашар күтеді, жарналар шығысы туралы есеп бермейді не тұрғындардың шешімдерін орындамайды.
classification:
  keywords:
    ru: [управляющая компания, управляющей компании, кск, объединени собственник, объединение собственников, подъезд, крыша течёт, крыша течет, лифт, взносы на содержание, отчёт оси, отчет оси, председатель оси]
    kk: [басқарушы компания, мүлік иелерінің бірлестігі, подъезд, лифт, жарна]
  examples:
    ru:
      - ОСИ собирает взносы, но не показывает отчёт, в подъезде годами не убирают
      - Течёт крыша, управляющая компания полгода ничего не делает
    kk:
      - Басқарушы компания жарна жинайды, бірақ есеп бермейді
intake:
  - respondent_name: {label: {ru: Управляющая компания / ОСИ / КСК, kk: Басқарушы компания / МИБ / ПИК}, question: {ru: "Как называется управляющая компания, ОСИ или КСК вашего дома?", kk: "Үйіңіздің басқарушы компаниясының, МИБ-інің не ПИК-інің атауы қандай?"}}
  - event_date: {type: date, optional: true, label: {ru: Дата обращения или события, kk: Өтініш не оқиға күні}}
  - problem_description: {type: longtext}
  - applicant_name: {pii: person}
  - applicant_iin: {optional: true, pii: id_number, pattern: '^\d{12}$'}
  - applicant_address: {pii: address, question: {ru: "Адрес вашей квартиры в этом доме (город, улица, дом, квартира)?", kk: "Осы үйдегі пәтеріңіздің мекенжайы (қала, көше, үй, пәтер)?"}}
  - applicant_phone: {type: phone, pii: phone}
  - evidence: [photo, receipt, correspondence]
parties:
  applicant: {kind: person, name_field: applicant_name, id_field: applicant_iin, address_field: applicant_address}
  respondent: {kind: business, name_field: respondent_name}
actions:
  - id: claim_to_manager
    title: {ru: Письменное требование управляющей компании (ОСИ), kk: Басқарушы компанияға (МИБ-ке) жазбаша талап}
    template: kz/templates/generic/claim_letter.docx
    channel: user_submits
    addressee: {party: respondent}
    norm_refs:
      - "Закон Республики Казахстан «О жилищных отношениях», статья 51-5"
    demands:
      ru: "устранить изложенные нарушения в содержании общего имущества дома; представить мне копии ежемесячного и годового отчётов по управлению объектом кондоминиума и выписки по текущему и сберегательному счетам; о принятых мерах сообщить мне письменно."
    instructions:
      ru:
        - "По закону копии отчётов и выписок по письменному требованию собственника предоставляются в течение одного месяца."
        - "Распечатайте требование в двух экземплярах, вручите один председателю ОСИ или в офис управляющей компании ({addressee}) и попросите отметку о принятии на втором."
        - "Нажмите «Документ подан»."
      kk:
        - "Заң бойынша есептер мен үзінді көшірмелердің көшірмелері меншік иесінің жазбаша талабы бойынша бір ай ішінде беріледі."
        - "Талапты екі данада басып шығарып, бірін МИБ төрағасына не басқарушы компанияның кеңсесіне ({addressee}) беріңіз де, екіншісіне қабылдау белгісін сұраңыз."
        - "«Құжат тапсырылды» батырмасын басыңыз."
  - id: complaint_housing_inspection
    when: claim_to_manager.response in [none, refusal, partial]
    title: {ru: Жалоба в жилищную инспекцию, kk: Тұрғын үй инспекциясына шағым}
    template: kz/templates/generic/complaint.docx
    channel: user_submits
    addressee: {authority: housing_inspection}
    norm_refs:
      - "Закон Республики Казахстан «О жилищных отношениях», статья 10-9"
    demands:
      ru: "провести проверку деятельности субъекта управления объектом кондоминиума по изложенным фактам, вынести предписание об устранении нарушений, о результатах сообщить мне."
    instructions:
      ru:
        - "Подайте жалобу в жилищную инспекцию акимата лично или через портал обращений. Точное наименование и канал подачи уточнит юрист."
        - "Приложите требование с отметкой о принятии, ответ (если был) и фото."
        - "Сохраните регистрационный номер и нажмите «Документ подан»."
      kk:
        - "Шағымды әкімдіктің тұрғын үй инспекциясына өзіңіз не өтініштер порталы арқылы беріңіз. Нақты атауы мен беру арнасын заңгер нақтылайды."
        - "Қабылдау белгісі бар талапты, жауапты (болса) және фотоларды тіркеңіз."
        - "Тіркеу нөмірін сақтап, «Құжат тапсырылды» батырмасын басыңыз."
  - id: handoff_lawyer
    kind: handoff
    when: complaint_housing_inspection.response in [none, refusal, partial]
    title: {ru: Передача дела юристу, kk: Істі заңгерге беру}
pricing: {model: fixed, amount: 1990, currency: KZT}
