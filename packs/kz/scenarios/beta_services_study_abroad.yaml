# БЕТА (EXPERIMENTAL_SCENARIOS=true). Поступление в зарубежный вуз — общий вариант: мотивационное письмо, CV и
# чек-лист. Требования конкретного вуза и страны здесь НЕ заданы: вуз публикует их сам, человек сверяет их на
# официальном сайте вуза. Сборы, сроки, баллы языковых тестов не указываются — только «уточните на сайте вуза».
# Студенческая виза — отдельная процедура страны обучения (сценарии виз — только для туристических/гостевых поездок).
id: kz.services.study_abroad
version: 0.1.0
ontology: SERVICES.EDUCATION.STUDY_ABROAD
jurisdiction: KZ
languages: [ru, kk]
owner: lawyer:kz-01
reviewed_at: null
published: false  # beta: offered only with EXPERIMENTAL_SCENARIOS=true
beta: true
kind: service
title:
  ru: Поступление в зарубежный вуз
  kk: Шетелдік ЖОО-ға түсу
summary:
  ru: Мотивационное письмо, CV (резюме) и чек-лист документов для поступления за рубеж — без привязки к правилам конкретного вуза.
  kk: Шетелге оқуға түсуге арналған уәждемелік хат, CV (түйіндеме) және құжаттар тізімі — нақты ЖОО қағидаларына байланыстырылмаған.
disclaimer:
  ru: "Бета. Konsiliér AI — IT-сервис: помогаем подготовить документы по вашим данным. Это не юридическая помощь и не консультация по поступлению. Требования, сроки и сборы устанавливает сам вуз — проверьте их на его официальном сайте. Результат не гарантируется."
  kk: "Бета. Konsiliér AI — IT-сервис: сіздің деректеріңіз бойынша құжаттарды дайындауға көмектесеміз. Бұл заң көмегі де, оқуға түсу бойынша кеңес те емес. Талаптарды, мерзімдер мен алымдарды ЖОО-ның өзі белгілейді — оларды оның ресми сайтынан тексеріңіз. Нәтижеге кепілдік берілмейді."
classification:
  keywords:
    ru: [за границ, за рубеж, зарубежн, учёба за, учеба за, motivation letter, мотивационн, cv, резюме для вуза, study abroad, иностранный университет, иностранный вуз, учёбы за, учебы за]
    kk: [шетелде оқу, шетелге оқуға, шетелдік университет]
  examples:
    ru:
      - Хочу поступить в университет за границей, нужны мотивационное письмо и CV
      - Помогите с документами для учёбы за рубежом в магистратуре
    kk:
      - Шетелдегі университетке түскім келеді, уәждемелік хат керек
intake:
  - target_country: {label: {ru: "Страна обучения", kk: "Оқу елі"}, question: {ru: "В какой стране хотите учиться?", kk: "Қай елде оқығыңыз келеді?"}}
  - university_name: {label: {ru: "Вуз", kk: "ЖОО"}, question: {ru: "Название вуза (или нескольких)?", kk: "ЖОО атауы (немесе бірнешеуі)?"}}
  - program_name: {label: {ru: "Программа", kk: "Бағдарлама"}, question: {ru: "Программа и уровень: бакалавриат, магистратура, PhD?", kk: "Бағдарлама және деңгей: бакалавриат, магистратура, PhD?"}}
  - education_background: {type: longtext, label: {ru: "Образование", kk: "Білімі"}, question: {ru: "Где и когда учились (школа, колледж, вуз), специальность, средний балл — как в документах.", kk: "Қайда және қашан оқыдыңыз (мектеп, колледж, ЖОО), мамандық, орташа балл — құжаттағыдай."}}
  - work_experience: {type: longtext, optional: true, label: {ru: "Опыт работы", kk: "Жұмыс тәжірибесі"}, question: {ru: "Опыт работы или стажировок: где, кем, когда. Нет — «Пропустить».", kk: "Жұмыс не тағылымдама тәжірибесі: қайда, кім болып, қашан. Жоқ болса — «Өткізу»."}}
  - language_certificate: {optional: true, label: {ru: "Языковой сертификат", kk: "Тіл сертификаты"}, question: {ru: "Языковой сертификат и результат (например, IELTS 6.5). Нет — «Пропустить».", kk: "Тіл сертификаты және нәтижесі (мысалы, IELTS 6.5). Жоқ болса — «Өткізу»."}}
  - motivation: {type: longtext, label: {ru: "Мотивация", kk: "Уәждеме"}, question: {ru: "Почему эта программа и страна, какие цели после учёбы? Своими словами — это основа письма.", kk: "Неге осы бағдарлама мен ел, оқудан кейінгі мақсаттарыңыз қандай? Өз сөзіңізбен — бұл хаттың негізі."}}
  - skills: {optional: true, label: {ru: "Навыки", kk: "Дағдылар"}, question: {ru: "Навыки для CV: языки, программы, другое. Нет — «Пропустить».", kk: "CV үшін дағдылар: тілдер, бағдарламалар, басқасы. Жоқ болса — «Өткізу»."}}
  - applicant_name: {pii: person}
  - applicant_address: {pii: address}
  - applicant_phone: {type: phone, pii: phone}
  - applicant_email: {type: email, pii: email, label: {ru: "E-mail", kk: "E-mail"}, question: {ru: "E-mail для CV и переписки с вузом?", kk: "CV мен ЖОО-мен хат алмасуға арналған e-mail?"}}
parties:
  applicant: {kind: person, name_field: applicant_name, address_field: applicant_address, email_field: applicant_email}
  university: {kind: business, name_field: university_name}
actions:
  - id: abroad_package
    title: {ru: Пакет документов для поступления за рубеж, kk: Шетелге оқуға түсуге арналған құжаттар топтамасы}
    template: kz/templates/services/package.docx
    channel: user_submits
    addressee: {party: university}
    instructions:
      ru:
        - "Откройте раздел для поступающих на официальном сайте вуза и сверьте каждый пункт чек-листа: перечень, сроки и сборы задаёт вуз."
        - "Переведите мотивационное письмо и CV на язык обучения и проверьте факты: в них должно быть только то, что подтверждается документами."
        - "Нажмите «Документ подан», когда отправите заявку вузу. Зачисление не гарантируется."
      kk:
        - "ЖОО-ның ресми сайтындағы түсушілерге арналған бөлімді ашып, тізімнің әр тармағын салыстырыңыз: тізбені, мерзімдер мен алымдарды ЖОО белгілейді."
        - "Уәждемелік хат пен CV-ді оқу тіліне аударып, фактілерді тексеріңіз: оларда тек құжатпен расталатын мәліметтер болуы керек."
        - "Өтінімді ЖОО-ға жібергенде «Құжат тапсырылды» батырмасын басыңыз. Оқуға қабылдауға кепілдік берілмейді."
    package:
      - id: motivation_letter
        title: {ru: Мотивационное письмо, kk: Уәждемелік хат}
        signature: true
        text:
          - {ru: "Приёмной комиссии {university_name} ({target_country})", kk: "{university_name} қабылдау комиссиясына ({target_country})"}
          - {ru: "Прошу рассмотреть мою кандидатуру на программу «{program_name}».", kk: "Кандидатурамды «{program_name}» бағдарламасына қарауыңызды сұраймын."}
          - {ru: "{narrative}", kk: "{narrative}"}
          - {ru: "Образование: {education_background}", kk: "Білімі: {education_background}"}
          - {ru: "Опыт работы: {work_experience}", kk: "Жұмыс тәжірибесі: {work_experience}", if: work_experience}
          - {ru: "Благодарю за рассмотрение моей заявки.", kk: "Өтінімімді қарағаныңыз үшін алғыс білдіремін."}
      - id: cv
        title: {ru: CV (резюме), kk: CV (түйіндеме)}
        text:
          - {ru: "{applicant_name}", kk: "{applicant_name}"}
          - {ru: "Контакты: {applicant_phone}, {applicant_email}, {applicant_address}", kk: "Байланыс: {applicant_phone}, {applicant_email}, {applicant_address}"}
          - {ru: "Цель: программа «{program_name}», {university_name}.", kk: "Мақсаты: «{program_name}» бағдарламасы, {university_name}."}
          - {ru: "Образование: {education_background}", kk: "Білімі: {education_background}"}
          - {ru: "Опыт работы: {work_experience}", kk: "Жұмыс тәжірибесі: {work_experience}", if: work_experience}
          - {ru: "Языки: {language_certificate}", kk: "Тілдер: {language_certificate}", if: language_certificate}
          - {ru: "Навыки: {skills}", kk: "Дағдылар: {skills}", if: skills}
      - id: checklist
        title: {ru: Чек-лист документов, kk: Құжаттар тізімі}
        text:
          - ru: "Это общий перечень того, что вузы обычно запрашивают. Точный список, формы, сроки и сборы — только на официальном сайте {university_name}."
            kk: "Бұл ЖОО-лар әдетте сұрайтын жалпы тізбе. Нақты тізім, нысандар, мерзімдер мен алымдар — тек {university_name} ресми сайтында."
        check:
          - {ru: "Онлайн-анкета (application form) на сайте вуза — проверьте, есть ли сбор за рассмотрение.", kk: "ЖОО сайтындағы онлайн-сауалнама (application form) — қарау алымы бар-жоғын тексеріңіз."}
          - {ru: "Мотивационное письмо (personal statement) — на языке обучения.", kk: "Уәждемелік хат (personal statement) — оқу тілінде."}
          - {ru: "CV (резюме) — на языке обучения.", kk: "CV (түйіндеме) — оқу тілінде."}
          - {ru: "Аттестат или диплом с приложением (транскрипт) и перевод, если вуз его требует (форму заверения уточните у вуза).", kk: "Аттестат немесе қосымшасы бар диплом (транскрипт) және ЖОО талап етсе — аудармасы (куәландыру нысанын ЖОО-дан нақтылаңыз)."}
          - {ru: "Языковой сертификат: {language_certificate} — сверьте минимальный балл с требованиями программы.", kk: "Тіл сертификаты: {language_certificate} — ең төменгі балды бағдарлама талаптарымен салыстырыңыз.", if: language_certificate}
          - {ru: "Языковой сертификат — узнайте на сайте вуза, какой тест и балл нужны.", kk: "Тіл сертификаты — қандай тест пен балл керек екенін ЖОО сайтынан біліңіз.", unless: language_certificate}
          - {ru: "Рекомендательные письма — если их требует программа.", kk: "Ұсыным хаттар — бағдарлама талап етсе."}
          - {ru: "Загранпаспорт (копия).", kk: "Шетелдік паспорт (көшірмесі)."}
          - {ru: "После зачисления — студенческая виза по правилам страны обучения (официальный сайт посольства этой страны).", kk: "Оқуға қабылданғаннан кейін — оқу елінің қағидалары бойынша студенттік виза (сол елдің елшілігінің ресми сайты)."}
      - id: how_to_submit
        title: {ru: Как подать, kk: Қалай тапсыру керек}
        check:
          - {ru: "Подача — через официальный сайт вуза или систему, которую вуз указывает сам. Сторонние агентства необязательны.", kk: "Тапсыру — ЖОО-ның ресми сайты немесе ЖОО өзі көрсететін жүйе арқылы. Бөгде агенттіктер міндетті емес."}
          - {ru: "Сроки подачи и зачисления — уточните на официальном сайте вуза.", kk: "Тапсыру және қабылдау мерзімдерін ЖОО-ның ресми сайтынан нақтылаңыз."}
pricing: {model: fixed, amount: 1990, currency: KZT}
