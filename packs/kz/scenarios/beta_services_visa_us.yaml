# БЕТА (EXPERIMENTAL_SCENARIOS=true). Гостевая виза США (B1/B2) для заявителей из Казахстана — подготовка к подаче.
# Источники (открыты 28.09.2026; travel.state.gov из среды разработки недоступен — использованы официальные страницы
# Посольства США в Казахстане и официальный сервис записи Госдепартамента для Казахстана):
#   - Сборы: «U.S. visa application (MRV) fees … $185 USD (B) Visitor», невозвратный, действует 365 дней —
#     https://ais.usvisa-info.com/en-kz/niv/information/fee
#   - Документы: действующий паспорт (не менее 6 месяцев сверх срока пребывания), паспорт с последней визой США,
#     страница подтверждения DS-160, страница подтверждения записи, фото 5 × 5 см не старше 6 месяцев; доказательства цели
#     поездки, намерения выехать и возможности оплатить поездку — https://ais.usvisa-info.com/en-kz/niv/information/required_docs
#   - DS-160: штрих-код AA00 должен совпадать с записью; анкета завершается не позднее чем за три рабочих дня до
#     собеседования — https://kz.usembassy.gov/important-information-about-your-upcoming-non-immigrant-visa-appointment/
#   - Объявления (Presidential Proclamation 10998 и др., подача в стране проживания/гражданства) —
#     https://ais.usvisa-info.com/en-kz/niv/information/announcements
# Дополнительные сборы (reciprocity и иные) — «уточните на официальном сайте».
id: kz.services.visa_us
version: 0.1.0
ontology: SERVICES.VISA.US_B1B2
jurisdiction: KZ
languages: [ru, kk]
owner: lawyer:kz-01
reviewed_at: null
published: false  # beta: offered only with EXPERIMENTAL_SCENARIOS=true
beta: true
kind: service
title:
  ru: "Виза в США (B1/B2)"
  kk: "АҚШ визасы (B1/B2)"
summary:
  ru: Памятка к собеседованию, план поездки, письмо о финансировании (если платит другой человек) и чек-лист документов по официальным страницам для заявителей из Казахстана.
  kk: Сұхбатқа арналған жадынама, сапар жоспары, қаржыландыру туралы хат (басқа адам төлесе) және Қазақстаннан өтініш берушілерге арналған ресми беттер бойынша құжаттар тізімі.
disclaimer:
  ru: "Бета. Konsiliér AI — IT-сервис: помогаем подготовиться по вашим данным и официальным требованиям. Это не юридическая помощь. Решение принимает консульский отдел США после собеседования; гарантии выдачи визы нет. Перед подачей проверьте объявления на ais.usvisa-info.com и kz.usembassy.gov."
  kk: "Бета. Konsiliér AI — IT-сервис: сіздің деректеріңіз бен ресми талаптар бойынша дайындалуға көмектесеміз. Бұл заң көмегі емес. Шешімді сұхбаттан кейін АҚШ консулдық бөлімі қабылдайды; виза берілетініне кепілдік жоқ. Тапсыру алдында ais.usvisa-info.com және kz.usembassy.gov сайттарындағы хабарландыруларды тексеріңіз."
sources:
  - {title: {ru: "Сборы за неиммиграционные визы США (Казахстан)", kk: "АҚШ-тың иммиграциялық емес визаларына алымдар (Қазақстан)"}, url: "https://ais.usvisa-info.com/en-kz/niv/information/fee", checked_on: 2026-09-28}
  - {title: {ru: "Необходимые документы (Казахстан)", kk: "Қажетті құжаттар (Қазақстан)"}, url: "https://ais.usvisa-info.com/en-kz/niv/information/required_docs", checked_on: 2026-09-28}
  - {title: {ru: "Посольство США в Казахстане: DS-160 и запись", kk: "АҚШ-тың Қазақстандағы елшілігі: DS-160 және жазылу"}, url: "https://kz.usembassy.gov/important-information-about-your-upcoming-non-immigrant-visa-appointment/", checked_on: 2026-09-28}
  - {title: {ru: "Объявления визового сервиса США для Казахстана", kk: "АҚШ-тың Қазақстанға арналған виза сервисінің хабарландырулары"}, url: "https://ais.usvisa-info.com/en-kz/niv/information/announcements", checked_on: 2026-09-28}
classification:
  keywords:
    ru: [виза в сша, визу в сша, визы в сша, американская виза, американскую визу, ds-160, ds160, b1/b2, в америку, в сша, штаты, виза, визу, визы]
    kk: [ақш визасы, америкаға виза, ақш-қа]
  examples:
    ru:
      - Хочу получить визу в США B1/B2, помогите подготовиться к собеседованию и DS-160
      - Еду в Америку в гости, какие документы нужны на визу
    kk:
      - АҚШ визасын алғым келеді, сұхбатқа дайындалу керек
intake:
  - trip_dates: {label: {ru: "Даты поездки", kk: "Сапар күндері"}, question: {ru: "Планируемые даты поездки (например, 01.12.2026 — 15.12.2026)?", kk: "Жоспарланған сапар күндері (мысалы, 01.12.2026 — 15.12.2026)?"}}
  - us_address: {label: {ru: "Где остановитесь в США", kk: "АҚШ-та қайда тоқтайсыз"}, question: {ru: "Город и адрес проживания в США (отель или у кого)?", kk: "АҚШ-тағы қала және тұру мекенжайы (қонақүй немесе кімде)?"}}
  - trip_purpose: {type: longtext, label: {ru: "Цель поездки и связь с Казахстаном", kk: "Сапар мақсаты және Қазақстанмен байланыс"}, question: {ru: "Цель поездки, чем занимаетесь в Казахстане (работа, учёба, семья, имущество) и почему вернётесь. Только правда.", kk: "Сапар мақсаты, Қазақстанда немен айналысасыз (жұмыс, оқу, отбасы, мүлік) және неге қайтасыз. Тек шындық."}}
  - employer_name: {optional: true, label: {ru: "Работодатель", kk: "Жұмыс беруші"}, question: {ru: "Где работаете (название, должность)? Нет — «Пропустить».", kk: "Қайда жұмыс істейсіз (атауы, лауазымы)? Жоқ болса — «Өткізу»."}}
  - sponsor_name: {optional: true, label: {ru: "Кто оплачивает поездку (если не вы)", kk: "Сапарды кім төлейді (сіз болмасаңыз)"}, question: {ru: "Поездку оплачивает другой человек? ФИО и кем приходится. Платите сами — «Пропустить».", kk: "Сапарды басқа адам төлей ме? Аты-жөні және кім болатыны. Өзіңіз төлесеңіз — «Өткізу»."}}
  - previous_us_visa: {optional: true, label: {ru: "Прежние визы США", kk: "Бұрынғы АҚШ визалары"}, question: {ru: "Были визы США раньше? Какие и когда. Нет — «Пропустить».", kk: "Бұрын АҚШ визалары болды ма? Қандай және қашан. Жоқ болса — «Өткізу»."}}
  - applicant_name: {pii: person}
  - passport_number: {pii: id_number, label: {ru: "Номер загранпаспорта", kk: "Шетелдік паспорт нөмірі"}, question: {ru: "Номер загранпаспорта?", kk: "Шетелдік паспорт нөмірі?"}}
  - applicant_address: {pii: address}
  - applicant_phone: {type: phone, pii: phone}
  - applicant_email: {type: email, pii: email, label: {ru: "E-mail", kk: "E-mail"}, question: {ru: "E-mail (нужен для DS-160 и записи)?", kk: "E-mail (DS-160 және жазылу үшін керек)?"}}
parties:
  applicant: {kind: person, name_field: applicant_name, id_field: passport_number, address_field: applicant_address, email_field: applicant_email}
actions:
  - id: visa_package
    title: {ru: Пакет документов на визу США, kk: АҚШ визасына арналған құжаттар топтамасы}
    template: kz/templates/services/package.docx
    channel: user_submits
    addressee:
      name: {ru: "Консульский отдел Посольства США в Астане / Генерального консульства США в Алматы", kk: "АҚШ-тың Астанадағы елшілігінің / Алматыдағы бас консулдығының консулдық бөлімі"}
      url: "https://ais.usvisa-info.com/en-kz/niv"
    instructions:
      ru:
        - "Заполните DS-160 на ceac.state.gov, оплатите сбор и запишитесь на ais.usvisa-info.com/en-kz/niv; номер DS-160 (AA00…) в записи должен совпадать."
        - "Завершите DS-160 не позднее чем за три рабочих дня до собеседования. Возьмите оригиналы по чек-листу."
        - "Нажмите «Документ подан» после собеседования. Гарантии выдачи визы нет."
      kk:
        - "ceac.state.gov сайтында DS-160 толтырып, алымды төлеп, ais.usvisa-info.com/en-kz/niv сайтында жазылыңыз; жазылудағы DS-160 нөмірі (AA00…) сәйкес келуі керек."
        - "DS-160-ты сұхбатқа дейін кемінде үш жұмыс күні бұрын аяқтаңыз. Тізім бойынша түпнұсқаларды алыңыз."
        - "Сұхбаттан кейін «Құжат тапсырылды» батырмасын басыңыз. Виза берілетініне кепілдік жоқ."
    package:
      - id: interview_notes
        title: {ru: Памятка к собеседованию (для себя), kk: Сұхбатқа арналған жадынама (өзіңізге)}
        text:
          - {ru: "Консульство оценивает цель поездки, намерение вернуться и возможность оплатить поездку. Отвечайте кратко и только правду — так же, как в DS-160.", kk: "Консулдық сапар мақсатын, қайту ниетін және сапарды төлеу мүмкіндігін бағалайды. Қысқа және тек шындықты айтыңыз — DS-160-тағыдай."}
          - {ru: "{narrative}", kk: "{narrative}"}
          - {ru: "Даты: {trip_dates}. Где остановлюсь: {us_address}.", kk: "Күндері: {trip_dates}. Қайда тоқтаймын: {us_address}."}
          - {ru: "Работа: {employer_name}.", kk: "Жұмыс: {employer_name}.", if: employer_name}
          - {ru: "Поездку оплачивает {sponsor_name}.", kk: "Сапарды {sponsor_name} төлейді.", if: sponsor_name}
          - {ru: "Прежние визы США: {previous_us_visa}.", kk: "Бұрынғы АҚШ визалары: {previous_us_visa}.", if: previous_us_visa}
      - id: trip_plan
        title: {ru: План поездки, kk: Сапар жоспары}
        text:
          - {ru: "Путешественник: {applicant_name}, паспорт № {passport_number}.", kk: "Саяхатшы: {applicant_name}, паспорт № {passport_number}."}
          - {ru: "Даты: {trip_dates}. Адрес в США: {us_address}.", kk: "Күндері: {trip_dates}. АҚШ-тағы мекенжай: {us_address}."}
          - {ru: "Цель и программа: {trip_purpose}", kk: "Мақсаты мен бағдарламасы: {trip_purpose}"}
      - id: sponsor_letter
        title: {ru: Письмо о финансировании поездки, kk: Сапарды қаржыландыру туралы хат}
        if: sponsor_name
        signature: true
        text:
          - {ru: "Я, {sponsor_name}, подтверждаю, что оплачиваю расходы {applicant_name} (паспорт № {passport_number}) на поездку в США ({trip_dates}).", kk: "Мен, {sponsor_name}, {applicant_name} (паспорт № {passport_number}) АҚШ-қа сапарының ({trip_dates}) шығыстарын төлейтінімді растаймын."}
          - {ru: "Прилагаю подтверждение моих доходов (накоплений) и документ о нашем родстве или отношениях.", kk: "Менің табысымды (жинақтарымды) растайтын құжатты және туыстығымызды не қарым-қатынасымызды растайтын құжатты қоса беремін."}
          - {ru: "Подпись: ______________ / {sponsor_name}", kk: "Қолы: ______________ / {sponsor_name}"}
      - id: checklist
        title: {ru: Чек-лист документов, kk: Құжаттар тізімі}
        check:
          - {ru: "Действующий паспорт — срок не менее 6 месяцев после окончания пребывания в США.", kk: "Қолданыстағы паспорт — АҚШ-та болу аяқталғаннан кейін кемінде 6 ай мерзім."}
          - {ru: "Паспорт с последней выданной визой США: {previous_us_visa}.", kk: "Соңғы берілген АҚШ визасы бар паспорт: {previous_us_visa}.", if: previous_us_visa}
          - {ru: "Страница подтверждения DS-160 (штрих-код AA00…).", kk: "DS-160 растау беті (AA00… штрих-коды)."}
          - {ru: "Страница подтверждения записи с ais.usvisa-info.com.", kk: "ais.usvisa-info.com сайтынан жазылуды растау беті."}
          - {ru: "Цветное фото 5 × 5 см, не старше 6 месяцев.", kk: "5 × 5 см түрлі түсті фото, 6 айдан ескі емес."}
          - {ru: "Подтверждение цели поездки (бронь, приглашение, программа).", kk: "Сапар мақсатын растау (бронь, шақыру, бағдарлама)."}
          - {ru: "Подтверждение связи с Казахстаном: справка с работы ({employer_name}), семья, имущество.", kk: "Қазақстанмен байланысты растау: жұмыс орнынан анықтама ({employer_name}), отбасы, мүлік.", if: employer_name}
          - {ru: "Подтверждение связи с Казахстаном: учёба, семья, имущество.", kk: "Қазақстанмен байланысты растау: оқу, отбасы, мүлік.", unless: employer_name}
          - {ru: "Подтверждение возможности оплатить поездку: выписки, справки о доходах.", kk: "Сапарды төлеу мүмкіндігін растау: үзінділер, табыс туралы анықтамалар.", unless: sponsor_name}
          - {ru: "Письмо спонсора ({sponsor_name}) и подтверждение его доходов.", kk: "Демеушінің ({sponsor_name}) хаты және оның табысын растау.", if: sponsor_name}
          - {ru: "Консульство может запросить другие документы.", kk: "Консулдық басқа құжаттарды сұрауы мүмкін."}
      - id: how_to_submit
        title: {ru: Где и как подать, kk: Қайда және қалай тапсыру керек}
        check:
          - {ru: "Анкета DS-160 — ceac.state.gov/genniv.", kk: "DS-160 сауалнамасы — ceac.state.gov/genniv."}
          - {ru: "Сбор за визу B (MRV): 185 долларов США; не возвращается и не передаётся другому человеку, действует 365 дней с оплаты (ais.usvisa-info.com, проверено 28.09.2026). О дополнительных сборах — уточните на официальном сайте.", kk: "B визасына алым (MRV): 185 АҚШ доллары; қайтарылмайды және басқа адамға берілмейді, төлегеннен бастап 365 күн жарамды (ais.usvisa-info.com, 28.09.2026 тексерілді). Қосымша алымдар туралы — ресми сайттан нақтылаңыз."}
          - {ru: "Запись на собеседование — ais.usvisa-info.com/en-kz/niv (Астана или Алматы). Собеседование — в стране проживания или гражданства.", kk: "Сұхбатқа жазылу — ais.usvisa-info.com/en-kz/niv (Астана немесе Алматы). Сұхбат — тұратын немесе азаматтығы бар елде."}
          - {ru: "Перед записью прочитайте раздел Announcements: там ограничения и изменения правил (например, Presidential Proclamation 10998).", kk: "Жазылмас бұрын Announcements бөлімін оқыңыз: онда шектеулер мен қағидалардың өзгерістері бар (мысалы, Presidential Proclamation 10998)."}
pricing: {model: fixed, amount: 1990, currency: KZT}
