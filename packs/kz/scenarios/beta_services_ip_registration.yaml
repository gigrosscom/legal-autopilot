# БЕТА (EXPERIMENTAL_SCENARIOS=true). Регистрация ИП — пакет: данные для уведомления, чек-лист, инструкция egov.kz.
# Источники, открытые 28.09.2026 в ИПС «Әділет» (old.adilet.zan.kz):
#   - Предпринимательский кодекс РК — https://adilet.zan.kz/rus/docs/K1500000375
#       ст. 35 п. 1–2 (регистрация — постановка на учёт в органе госдоходов; когда регистрация обязательна: наёмные работники
#       на постоянной основе или доход свыше 360 МРП в год), ст. 36 п. 1 (уведомление; для несовершеннолетних — согласие
#       законных представителей и др.; «Истребование иных документов запрещается»), п. 3 (регистрация в течение одного
#       рабочего дня), п. 5 (электронная форма через веб-портал «цифрового правительства» или иные цифровые объекты).
#   - Налоговый кодекс РК от 18 июля 2025 года № 214-VIII — https://adilet.zan.kz/rus/docs/K2500000214, ст. 97 (учёт ИП
#     по уведомлению; изменения — не позднее 10 рабочих дней).
#   - Услуга «Уведомление о начале деятельности в качестве индивидуального предпринимателя» —
#     https://egov.kz/cms/ru/services/business_registration/reg_ip (адрес подтверждён поиском по домену egov.kz 28.09.2026;
#     страница отдаёт текст только через JavaScript — перепроверять).
# TODO(lawyer): выбор налогового режима и ОКЭД — не советуем, только отмечаем, что их нужно указать.
id: kz.services.ip_registration
version: 0.1.0
ontology: SERVICES.BUSINESS.IP_REGISTRATION
jurisdiction: KZ
languages: [ru, kk]
owner: lawyer:kz-01
reviewed_at: null
published: false  # beta: offered only with EXPERIMENTAL_SCENARIOS=true
beta: true
kind: service
title:
  ru: Регистрация ИП
  kk: ЖК тіркеу
summary:
  ru: Данные для уведомления о начале деятельности ИП, чек-лист и пошаговая инструкция подачи через egov.kz по Предпринимательскому кодексу.
  kk: ЖК қызметін бастағаны туралы хабарламаға арналған деректер, тізім және Кәсіпкерлік кодекс бойынша egov.kz арқылы тапсырудың қадамдық нұсқаулығы.
disclaimer:
  ru: "Бета. Konsiliér AI — IT-сервис: помогаем подготовить данные и порядок действий по официальным требованиям. Это не юридическая и не налоговая консультация: налоговый режим и вид деятельности выбираете вы. Регистрацию проводит орган государственных доходов; результат не гарантируется."
  kk: "Бета. Konsiliér AI — IT-сервис: ресми талаптар бойынша деректер мен әрекеттер тәртібін дайындауға көмектесеміз. Бұл заң немесе салық кеңесі емес: салық режимі мен қызмет түрін өзіңіз таңдайсыз. Тіркеуді мемлекеттік кірістер органы жүргізеді; нәтижеге кепілдік берілмейді."
sources:
  - {title: {ru: "Предпринимательский кодекс РК, ст. 35–36 (ИПС «Әділет»)", kk: "ҚР Кәсіпкерлік кодексі, 35–36-баптар (ӘАЖ «Әділет»)"}, url: "https://adilet.zan.kz/rus/docs/K1500000375", checked_on: 2026-09-28}
  - {title: {ru: "Налоговый кодекс РК, ст. 97 (ИПС «Әділет»)", kk: "ҚР Салық кодексі, 97-бап (ӘАЖ «Әділет»)"}, url: "https://adilet.zan.kz/rus/docs/K2500000214", checked_on: 2026-09-28}
  - {title: {ru: "egov.kz: уведомление о начале деятельности ИП", kk: "egov.kz: ЖК ретінде қызметті бастау туралы хабарлама"}, url: "https://egov.kz/cms/ru/services/business_registration/reg_ip", checked_on: 2026-09-28}
classification:
  keywords:
    ru: [открыть ип, зарегистрировать ип, регистрация ип, регистрацию ип, стать ип, оформить ип, открыть ип онлайн, уведомление о начале деятельности, регистрацией ип, регистрации ип]
    kk: [жк ашу, жк тіркеу, жеке кәсіпкер ретінде тіркелу]
  examples:
    ru:
      - Хочу открыть ИП, как зарегистрировать ИП через egov
      - Помогите с регистрацией ИП, что нужно подготовить
    kk:
      - ЖК ашқым келеді, қалай тіркеледі
intake:
  - business_name: {optional: true, label: {ru: "Наименование ИП", kk: "ЖК атауы"}, question: {ru: "Название ИП (если хотите указать). Нет — «Пропустить».", kk: "ЖК атауы (көрсеткіңіз келсе). Жоқ болса — «Өткізу»."}}
  - activity: {label: {ru: "Вид деятельности", kk: "Қызмет түрі"}, question: {ru: "Чем будете заниматься? Код ОКЭД, если уже знаете.", kk: "Немен айналысасыз? Білсеңіз, ЭҚЖЖ коды."}}
  - business_address: {label: {ru: "Адрес ведения деятельности", kk: "Қызмет жүргізу мекенжайы"}, question: {ru: "Адрес, который укажете при регистрации (место нахождения ИП)?", kk: "Тіркеу кезінде көрсететін мекенжай (ЖК орналасқан жері)?"}}
  - tax_regime: {optional: true, label: {ru: "Налоговый режим", kk: "Салық режимі"}, question: {ru: "Какой налоговый режим выбрали (если уже решили)? Нет — «Пропустить», решите до подачи.", kk: "Қандай салық режимін таңдадыңыз (шешсеңіз)? Жоқ болса — «Өткізу», тапсыруға дейін шешіңіз."}}
  - employees: {optional: true, label: {ru: "Наёмные работники", kk: "Жалдамалы қызметкерлер"}, question: {ru: "Будете нанимать работников на постоянной основе? Сколько. Нет — «Пропустить».", kk: "Тұрақты негізде қызметкер жалдайсыз ба? Қанша. Жоқ болса — «Өткізу»."}}
  - minor_consent: {optional: true, label: {ru: "Заявителю нет 18 лет", kk: "Өтініш берушіге 18 жас толмаған"}, question: {ru: "Вам ещё нет 18 лет? Если да — напишите «да, согласие родителей есть». Иначе — «Пропустить».", kk: "Сізге әлі 18 жас толмады ма? Иә болса — «иә, ата-ананың келісімі бар» деп жазыңыз. Әйтпесе — «Өткізу»."}}
  - applicant_name: {pii: person}
  - applicant_iin: {pii: id_number, pattern: '^\d{12}$'}
  - applicant_address: {pii: address}
  - applicant_phone: {type: phone, pii: phone}
parties:
  applicant: {kind: person, name_field: applicant_name, id_field: applicant_iin, address_field: applicant_address}
actions:
  - id: ip_package
    title: {ru: Пакет для регистрации ИП, kk: ЖК тіркеуге арналған топтама}
    template: kz/templates/services/package.docx
    channel: user_submits
    addressee:
      name: {ru: "Орган государственных доходов (через egov.kz / elicense.kz)", kk: "Мемлекеттік кірістер органы (egov.kz / elicense.kz арқылы)"}
      url: "https://egov.kz/cms/ru/services/business_registration/reg_ip"
    instructions:
      ru:
        - "Подайте уведомление о начале деятельности ИП в электронной форме через egov.kz (или иные цифровые объекты) и подпишите ЭЦП."
        - "Регистрация — в течение одного рабочего дня (ст. 36 п. 3 Предпринимательского кодекса). Других документов требовать не вправе."
        - "Нажмите «Документ подан» после отправки уведомления."
      kk:
        - "ЖК қызметін бастағаны туралы хабарламаны egov.kz (немесе өзге цифрлық объектілер) арқылы электрондық нысанда беріп, ЭЦҚ-мен қол қойыңыз."
        - "Тіркеу — бір жұмыс күні ішінде (Кәсіпкерлік кодекстің 36-бабы 3-тармағы). Өзге құжаттарды талап етуге құқығы жоқ."
        - "Хабарламаны жібергеннен кейін «Құжат тапсырылды» батырмасын басыңыз."
    package:
      - id: notice_data
        title: {ru: Данные для уведомления о начале деятельности, kk: Қызметті бастау туралы хабарламаға арналған деректер}
        text:
          - {ru: "Заявитель: {applicant_name}, ИИН {applicant_iin}, тел. {applicant_phone}.", kk: "Өтініш беруші: {applicant_name}, ЖСН {applicant_iin}, тел. {applicant_phone}."}
          - {ru: "Наименование ИП: {business_name}.", kk: "ЖК атауы: {business_name}.", if: business_name}
          - {ru: "Место нахождения (адрес деятельности): {business_address}.", kk: "Орналасқан жері (қызмет мекенжайы): {business_address}."}
          - {ru: "Вид деятельности (ОКЭД): {activity}.", kk: "Қызмет түрі (ЭҚЖЖ): {activity}."}
          - {ru: "Налоговый режим: {tax_regime}.", kk: "Салық режимі: {tax_regime}.", if: tax_regime}
          - {ru: "Налоговый режим: выберите до подачи (мы его не подбираем).", kk: "Салық режимі: тапсыруға дейін таңдаңыз (біз оны таңдамаймыз).", unless: tax_regime}
      - id: checklist
        title: {ru: Чек-лист, kk: Тізім}
        check:
          - {ru: "Действующая ЭЦП (или вход, который принимает сервис) — уведомление подписывается электронно.", kk: "Қолданыстағы ЭЦҚ (немесе сервис қабылдайтын кіру тәсілі) — хабарламаға электрондық қол қойылады."}
          - {ru: "Адрес места нахождения, вид деятельности (ОКЭД) и налоговый режим — для формы уведомления.", kk: "Орналасқан жерінің мекенжайы, қызмет түрі (ЭҚЖЖ) және салық режимі — хабарлама нысаны үшін."}
          - {ru: "Согласие законных представителей (или иной документ по ст. 36 п. 1 Предпринимательского кодекса).", kk: "Заңды өкілдердің келісімі (немесе Кәсіпкерлік кодекстің 36-бабы 1-тармағы бойынша өзге құжат).", if: minor_consent}
          - {ru: "Наёмные работники на постоянной основе ({employees}) — регистрация ИП обязательна (ст. 35 п. 2).", kk: "Тұрақты негіздегі жалдамалы қызметкерлер ({employees}) — ЖК тіркеу міндетті (35-баптың 2-тармағы).", if: employees}
          - {ru: "Регистрация обязательна также при доходе от предпринимательства свыше 360 МРП в год (ст. 35 п. 2).", kk: "Кәсіпкерліктен жылдық табыс 360 АЕК-тен асса да тіркеу міндетті (35-баптың 2-тармағы)."}
          - {ru: "Иных документов орган госдоходов требовать не вправе (ст. 36 п. 1).", kk: "Мемлекеттік кірістер органы өзге құжаттарды талап етуге құқылы емес (36-баптың 1-тармағы)."}
      - id: how_to_submit
        title: {ru: Где и как подать, kk: Қайда және қалай тапсыру керек}
        check:
          - {ru: "Откройте услугу «Уведомление о начале деятельности в качестве индивидуального предпринимателя» на egov.kz (раздел бизнеса) — она ведёт на elicense.kz.", kk: "egov.kz сайтында (бизнес бөлімі) «Жеке кәсіпкер ретінде қызметті бастағаны туралы хабарлама» қызметін ашыңыз — ол elicense.kz сайтына апарады."}
          - {ru: "Заполните адрес, наименование, ОКЭД, налоговый режим; подпишите ЭЦП.", kk: "Мекенжайды, атауды, ЭҚЖЖ-ны, салық режимін толтырып, ЭЦҚ-мен қол қойыңыз."}
          - {ru: "Регистрация — в течение одного рабочего дня; при изменении данных — сообщить в налоговый орган не позднее 10 рабочих дней (ст. 97 Налогового кодекса).", kk: "Тіркеу — бір жұмыс күні ішінде; деректер өзгерсе — 10 жұмыс күнінен кешіктірмей салық органына хабарлау (Салық кодексінің 97-бабы)."}
          - {ru: "Стоимость услуги — уточните на egov.kz.", kk: "Қызмет құнын egov.kz сайтынан нақтылаңыз."}
pricing: {model: fixed, amount: 2990, currency: KZT}
