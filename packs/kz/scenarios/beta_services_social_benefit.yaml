# БЕТА (EXPERIMENTAL_SCENARIOS=true). Помощь в оформлении пособия или социальной выплаты в РК — не спор.
# Черновик: официальные тексты для этого сценария НЕ открывались. В тексте нет ни одной статьи, суммы и срока —
# только общий порядок (где подать, какие документы обычно спрашивают) с пометкой «сверьте со стандартом госуслуги».
# TODO(lawyer) перед публикацией (см. docs/lawyer/new-topics.md):
#   - Социальный кодекс РК (2023) — нормы о видах пособий и выплат, кто назначает, основания отказа; ссылки на
#     статьи — только после сверки с ИПС «Әділет»;
#   - правила назначения каждой выплаты и стандарты госуслуг (перечень документов, сроки оказания) —
#     единовременное пособие на рождение, пособие по уходу за ребёнком до полутора лет, пособие по инвалидности,
#     по случаю потери кормильца, социальная выплата на случай потери работы (ГФСС), адресная социальная помощь;
#   - куда подаётся каждая выплата: Госкорпорация «Правительство для граждан», egov.kz, отдел занятости и
#     социальных программ акимата (АСП), проактивный формат (SMS после регистрации рождения);
#   - размеры (МРП, прожиточный минимум) и сроки подачи — не указываем вовсе, пока не подтверждены.
id: kz.social.benefit_application
version: 0.1.0
ontology: SERVICES.SOCIAL.BENEFIT_APPLICATION
taxonomy: social.benefit_application
jurisdiction: KZ
languages: [ru, kk]
owner: lawyer:kz-01
reviewed_at: null
published: false  # beta: offered only with EXPERIMENTAL_SCENARIOS=true
beta: true
kind: service
title:
  ru: Оформление пособия или социальной выплаты
  kk: Жәрдемақыны не әлеуметтік төлемді рәсімдеу
summary:
  ru: "Помощь в оформлении пособия: заявление с вашими данными, личный чек-лист документов, опись и пошаговая подача — через egov.kz, отделение Госкорпорации (ЦОН) или акимат (АСП)."
  kk: "Жәрдемақыны рәсімдеуге көмек: деректеріңіз толтырылған өтініш, құжаттардың жеке тізімі, тізімдеме және кезең-кезеңімен тапсыру — egov.kz, Мемлекеттік корпорация бөлімшесі (ХҚКО) немесе әкімдік (АӘК) арқылы."
disclaimer:
  ru: "Бета. Konsiliér AI — IT-сервис: помогаем подготовить документы по вашим данным. Это не юридическая помощь. Назначение выплаты не гарантируется: решение принимает уполномоченный орган. Перечень документов, размер и сроки сверьте со стандартом госуслуги на egov.kz."
  kk: "Бета. Konsiliér AI — IT-сервис: сіздің деректеріңіз бойынша құжаттарды дайындауға көмектесеміз. Бұл заң көмегі емес. Төлем тағайындалатынына кепілдік берілмейді: шешімді уәкілетті орган қабылдайды. Құжаттар тізбесін, мөлшері мен мерзімдерін egov.kz-тегі мемлекеттік көрсетілетін қызмет стандартымен салыстырыңыз."
sources:
  - {title: {ru: "Портал электронного правительства (стандарты госуслуг)", kk: "Электрондық үкімет порталы (мемлекеттік көрсетілетін қызметтер стандарттары)"}, url: "https://egov.kz"}
classification:
  keywords:
    ru: [пособи, оформить пособие, получить пособие, соцвыплат, социальную выплату, адресную социальную помощь, адресная социальная помощь, адресной социальной помощи, потере кормильца, потерей кормильца, по уходу за ребенком, по уходу за ребёнком, при рождении ребенка, при рождении ребёнка, декретные]
    kk: [жәрдемақы, әлеуметтік төлем, атаулы әлеуметтік көмек, асыраушысынан айырыл]
  examples:
    ru:
      - Как оформить пособие при рождении ребёнка, какие документы нужны
      - Хочу получить пособие по уходу за ребёнком до полутора лет, куда подавать
      - Как подать на адресную социальную помощь для семьи
    kk:
      - Бала туғанда берілетін жәрдемақыны қалай рәсімдеуге болады
  not_when:
    ru:
      - "В пособии уже отказали или выплату прекратили, человек хочет обжаловать → обжалование отказа в пособии"
    kk:
      - "Жәрдемақыдан бас тартылған, адам шағымданғысы келеді → бас тартуға шағым"
intake:
  - benefit_type: {label: {ru: "Какая выплата", kk: "Қандай төлем"}, question: {ru: "Какое пособие или выплату хотите оформить? Например: пособие при рождении ребёнка, по уходу за ребёнком до полутора лет, по инвалидности, по случаю потери кормильца, адресная социальная помощь (АСП), выплата при потере работы.", kk: "Қандай жәрдемақыны не төлемді рәсімдегіңіз келеді? Мысалы: бала туғандағы, бір жарым жасқа дейінгі баланы күтуге арналған, мүгедектік бойынша, асыраушысынан айырылу жағдайы бойынша жәрдемақы, атаулы әлеуметтік көмек (АӘК), жұмысынан айырылғандағы төлем."}}
  - authority_name: {label: {ru: "Куда подаёте", kk: "Қайда тапсырасыз"}, question: {ru: "Куда будете подавать? Обычно — отделение Госкорпорации «Правительство для граждан» (ЦОН) или портал egov.kz; адресную социальную помощь — отдел занятости и социальных программ акимата. Не знаете — напишите «ЦОН».", kk: "Қайда тапсырасыз? Әдетте — «Азаматтарға арналған үкімет» Мемлекеттік корпорациясының бөлімшесі (ХҚКО) немесе egov.kz порталы; атаулы әлеуметтік көмек — әкімдіктің жұмыспен қамту және әлеуметтік бағдарламалар бөлімі. Білмесеңіз — «ХҚКО» деп жазыңыз."}}
  - problem_description: {type: longtext, label: {ru: "Ситуация", kk: "Жағдай"}, question: {ru: "Кратко своими словами: кто получатель, почему положена выплата, какие документы уже на руках.", kk: "Өз сөзіңізбен қысқаша: алушы кім, төлем неге тиесілі, қолыңызда қандай құжаттар бар."}}
  - child_info: {optional: true, label: {ru: "Ребёнок", kk: "Бала"}, question: {ru: "Выплата связана с ребёнком (рождение, уход)? Дата рождения и где зарегистрировано рождение — в Казахстане или за рубежом. Нет — «Пропустить».", kk: "Төлем баламен байланысты ма (туу, күтім)? Туған күні және туу қай жерде тіркелді — Қазақстанда ма, шетелде ме. Жоқ болса — «Өткізу»."}}
  - disability_info: {optional: true, label: {ru: "Инвалидность", kk: "Мүгедектік"}, question: {ru: "Выплата по инвалидности: группа и дата заключения медико-социальной экспертизы (МСЭ)? Нет — «Пропустить».", kk: "Мүгедектік бойынша төлем: тобы және медициналық-әлеуметтік сараптама (МӘС) қорытындысының күні? Жоқ болса — «Өткізу»."}}
  - breadwinner_info: {optional: true, label: {ru: "Потеря кормильца", kk: "Асыраушысынан айырылу"}, question: {ru: "Выплата по потере кормильца: кем вам приходился умерший и когда он умер? Нет — «Пропустить».", kk: "Асыраушысынан айырылу бойынша төлем: қайтыс болған адам сізге кім болып келеді және қашан қайтыс болды? Жоқ болса — «Өткізу»."}}
  - household_info: {type: longtext, optional: true, label: {ru: "Семья и доходы", kk: "Отбасы және табыс"}, question: {ru: "Адресная социальная помощь: сколько человек в семье и какие у каждого доходы (кратко)? Нет — «Пропустить».", kk: "Атаулы әлеуметтік көмек: отбасында неше адам және әрқайсысының табысы қандай (қысқаша)? Жоқ болса — «Өткізу»."}}
  - job_loss_info: {optional: true, label: {ru: "Потеря работы", kk: "Жұмыстан айырылу"}, question: {ru: "Выплата при потере работы: дата увольнения и основание, как в приказе? Нет — «Пропустить».", kk: "Жұмыстан айырылғандағы төлем: жұмыстан шыққан күн және бұйрықтағы негіз? Жоқ болса — «Өткізу»."}}
  - bank_account: {optional: true, pii: account, label: {ru: "Банковский счёт", kk: "Банк шоты"}, question: {ru: "Номер счёта (IBAN) для зачисления выплаты? Нет счёта или не знаете — «Пропустить».", kk: "Төлем аударылатын шот нөмірі (IBAN)? Шот жоқ не білмесеңіз — «Өткізу»."}}
  - applicant_name: {pii: person}
  - applicant_iin: {pii: id_number, pattern: '^\d{12}$'}
  - applicant_address: {pii: address}
  - applicant_phone: {type: phone, pii: phone}
  - applicant_email: {type: email, pii: email, optional: true, label: {ru: "E-mail", kk: "E-mail"}, question: {ru: "E-mail для связи (или «Пропустить»)?", kk: "Байланыс e-mail (немесе «Өткізу»)?"}}
parties:
  applicant: {kind: person, name_field: applicant_name, id_field: applicant_iin, address_field: applicant_address, email_field: applicant_email}
  authority: {kind: authority, name_field: authority_name}
actions:
  - id: benefit_package
    title: {ru: Пакет документов для оформления выплаты, kk: Төлемді рәсімдеуге арналған құжаттар топтамасы}
    template: kz/templates/services/package.docx
    channel: user_submits
    addressee: {party: authority}
    instructions:
      ru:
        - "Найдите на egov.kz госуслугу по названию выплаты и сверьте чек-лист с её стандартом: перечень документов и сроки указаны там."
        - "Подайте заявление онлайн (egov.kz, eGov Mobile) или лично в {addressee}; сохраните расписку или уведомление о приёме."
        - "Нажмите «Документ подан», когда заявление примут. Если придёт отказ — сохраните его: Konsiliér AI поможет подготовить жалобу."
      kk:
        - "egov.kz-тен төлем атауы бойынша мемлекеттік көрсетілетін қызметті тауып, тізімді оның стандартымен салыстырыңыз: құжаттар тізбесі мен мерзімдер сонда көрсетілген."
        - "Өтінішті онлайн (egov.kz, eGov Mobile) немесе {addressee} мекемесіне өзіңіз тапсырыңыз; қабылдағаны туралы қолхатты не хабарламаны сақтаңыз."
        - "Өтініш қабылданғанда «Құжат тапсырылды» батырмасын басыңыз. Бас тартса — оны сақтаңыз: Konsiliér AI шағым дайындауға көмектеседі."
    package:
      - id: application
        title: {ru: Заявление о назначении выплаты (ваши данные для формы госуслуги), kk: Төлем тағайындау туралы өтініш (мемлекеттік көрсетілетін қызмет нысанына арналған деректеріңіз)}
        signature: true
        text:
          - {ru: "В {addressee}", kk: "{addressee}"}
          - {ru: "от {applicant_name}, ИИН {applicant_iin}, адрес: {applicant_address}, тел.: {applicant_phone}", kk: "{applicant_name}, ЖСН {applicant_iin}, мекенжайы: {applicant_address}, тел.: {applicant_phone}"}
          - {ru: "ЗАЯВЛЕНИЕ", kk: "ӨТІНІШ"}
          - {ru: "Прошу назначить мне выплату: {benefit_type}.", kk: "Маған төлем тағайындауыңызды сұраймын: {benefit_type}."}
          - {ru: "{narrative}", kk: "{narrative}"}
          - {ru: "Сведения о ребёнке: {child_info}.", kk: "Бала туралы мәліметтер: {child_info}.", if: child_info}
          - {ru: "Сведения об инвалидности: {disability_info}.", kk: "Мүгедектік туралы мәліметтер: {disability_info}.", if: disability_info}
          - {ru: "Сведения о потере кормильца: {breadwinner_info}.", kk: "Асыраушысынан айырылу туралы мәліметтер: {breadwinner_info}.", if: breadwinner_info}
          - {ru: "Состав семьи и доходы: {household_info}", kk: "Отбасы құрамы және табыс: {household_info}", if: household_info}
          - {ru: "Сведения о прекращении работы: {job_loss_info}.", kk: "Жұмысты тоқтату туралы мәліметтер: {job_loss_info}.", if: job_loss_info}
          - {ru: "Выплату прошу перечислять на счёт {bank_account}.", kk: "Төлемді {bank_account} шотына аударуыңызды сұраймын.", if: bank_account}
          - {ru: "Документы прилагаю согласно описи. Даю согласие на сбор и обработку моих персональных данных для назначения выплаты.", kk: "Құжаттарды тізімдемеге сәйкес қоса беремін. Төлем тағайындау үшін дербес деректерімді жинауға және өңдеуге келісім беремін."}
          - ru: "Примечание: в ЦОН и на egov.kz заявление оформляется по форме госуслуги. Этот текст — ваши данные в одном месте, чтобы перенести их в форму без ошибок."
            kk: "Ескертпе: ХҚКО-да және egov.kz-те өтініш мемлекеттік көрсетілетін қызмет нысаны бойынша ресімделеді. Бұл мәтін — нысанға қатесіз көшіру үшін бір жерге жиналған деректеріңіз."
      - id: checklist
        title: {ru: Чек-лист документов, kk: Құжаттар тізімі}
        text:
          - ru: "Окончательный перечень — в стандарте госуслуги на egov.kz для вашей выплаты. Многие сведения орган получает сам из государственных баз — бумажные копии нужны не всегда; уточните при подаче."
            kk: "Түпкілікті тізбе — egov.kz-тегі төлеміңізге арналған мемлекеттік көрсетілетін қызмет стандартында. Көп мәліметті орган мемлекеттік базалардан өзі алады — қағаз көшірмелер әрдайым керек емес; тапсырғанда нақтылаңыз."
        check:
          - {ru: "Удостоверение личности или цифровой документ в eGov Mobile — для идентификации.", kk: "Жеке куәлік немесе eGov Mobile-дағы цифрлық құжат — сәйкестендіру үшін."}
          - {ru: "Заявление по форме госуслуги (ваши данные для неё — в этом пакете).", kk: "Мемлекеттік көрсетілетін қызмет нысаны бойынша өтініш (оған арналған деректеріңіз — осы топтамада)."}
          - {ru: "Банковский счёт для зачисления: {bank_account}.", kk: "Төлем аударылатын банк шоты: {bank_account}.", if: bank_account}
          - {ru: "Реквизиты банковского счёта для зачисления — если счёта нет, откройте его заранее.", kk: "Төлем аударылатын банк шотының деректемелері — шот болмаса, алдын ала ашыңыз.", unless: bank_account}
          - {ru: "Ребёнок ({child_info}): свидетельство о рождении — особенно если рождение зарегистрировано за рубежом; нужен ли перевод и легализация — уточните по стандарту госуслуги.", kk: "Бала ({child_info}): туу туралы куәлік — әсіресе туу шетелде тіркелсе; аударма мен заңдастыру керек пе — стандарт бойынша нақтылаңыз.", if: child_info}
          - {ru: "Инвалидность ({disability_info}): заключение медико-социальной экспертизы (МСЭ); уточните, нужна ли бумажная выписка или сведения уже есть в системе.", kk: "Мүгедектік ({disability_info}): медициналық-әлеуметтік сараптама (МӘС) қорытындысы; қағаз үзінді керек пе, әлде мәлімет жүйеде бар ма — нақтылаңыз.", if: disability_info}
          - {ru: "Потеря кормильца ({breadwinner_info}): свидетельство о смерти, документы о родстве и о том, что вы были на иждивении умершего — перечень уточните по стандарту госуслуги.", kk: "Асыраушысынан айырылу ({breadwinner_info}): қайтыс болу туралы куәлік, туыстық және қайтыс болған адамның асырауында болғаныңыз туралы құжаттар — тізбені стандарт бойынша нақтылаңыз.", if: breadwinner_info}
          - {ru: "Адресная социальная помощь: сведения о составе семьи и доходах всех её членов за период из правил АСП; период и пороговый доход уточните в отделе занятости и социальных программ.", kk: "Атаулы әлеуметтік көмек: АӘК қағидаларындағы кезеңге отбасы құрамы мен барлық мүшелерінің табысы туралы мәліметтер; кезең мен шекті табысты жұмыспен қамту және әлеуметтік бағдарламалар бөлімінен нақтылаңыз.", if: household_info}
