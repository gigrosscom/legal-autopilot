# Опубликован 28.09.2026 по решению владельца. reviewed_at: null → на каждом документе нейтральная пометка compliance.draft_disclaimer.
# Нормы проверены 28.09.2026 по официальному тексту ИПС «Әділет» (страница акта открыта, номер статьи — как в тексте):
#   - Закон РК «О платежах и платежных системах», ст. 56 (несанкционированные платежи; п. 4 — банк обеспечивает
#     выполнение процедур безопасности от несанкционированных платежей) — https://adilet.zan.kz/rus/docs/Z1600000011
# TODO(lawyer): ст. 57 (возврат денег) — применимость. В жалобе в АРРФР указана та же ст. 56 (нарушение, на которое
# жалуются); срок ответа банка — Закон о банках, ст. 31 (ниже).
# Кредит на ваше имя без вашего ведома — это другой сценарий (kz.money.credit_fraud).
#   - АППК РК, ст. 63 (реквизиты обращения: ФИО, ИИН, почтовый адрес заявителя; наименование органа; суть; дата; подпись),
#     ст. 76, ч. 1 (обращение рассматривается 15 рабочих дней со дня регистрации, если иное не предусмотрено законами) —
#     https://adilet.zan.kz/rus/docs/K2000000350, открыт 28.09.2026 (срок жалобы в госорган — deadline по ст. 76).
#   - Закон РК «О банках и банковской деятельности в РК», ст. 31, п. 2, пп. 7) (обращение клиента банк рассматривает
#     не более 15 рабочих дней со дня поступления) — https://adilet.zan.kz/rus/docs/Z950002444_, открыт 28.09.2026.
id: kz.finance.unauthorized_debit
version: 0.1.0
ontology: FINANCE.CARD.UNAUTHORIZED_DEBIT
taxonomy: finance.bank_dispute
jurisdiction: KZ
languages: [ru, kk]
owner: lawyer:kz-01
reviewed_at: null
published: true
title:
  ru: Списание денег с карты или счёта без согласия
  kk: Картадан не шоттан келісімсіз ақша есептен шығару
summary:
  ru: С вашей карты или счёта списали деньги, а вы этот платёж или перевод не совершали и не подтверждали. Вы хотите, чтобы банк провёл проверку и вернул деньги.
  kk: Картаңыздан не шотыңыздан ақша есептен шығарылды, бірақ сіз бұл төлемді не аударымды жасамадыңыз және растамадыңыз. Банктің тексеру жүргізіп, ақшаны қайтаруын қалайсыз.
classification:
  keywords:
    ru: [списали, списание, с карты, со счёта, со счета, без моего согласия, не делал перевод, неизвестный платёж, неизвестный платеж, украли с карты]
    kk: [есептен шығарды, картадан, шоттан, келісімімсіз, аударым жасамадым]
  examples:
    ru:
      - Банк списал деньги с карты без моего согласия
      - Ночью с карты ушло 150 тысяч тремя переводами, я их не делал
    kk:
      - Банк келісімімсіз картамнан ақша есептен шығарды
claim:
  type: refund
  amount_field: amount
intake:
  - respondent_name: {label: {ru: Банк, kk: Банк}, question: {ru: "В каком банке карта или счёт?", kk: "Карта не шот қай банкте?"}}
  - respondent_bin: {optional: true, pattern: '^\d{12}$'}
  - respondent_address: {optional: true}
  - event_date: {type: date, label: {ru: Дата списания, kk: Есептен шығару күні}, question: {ru: "Когда списали деньги? (ДД.ММ.ГГГГ)", kk: "Ақша қашан есептен шығарылды? (КК.АА.ЖЖЖЖ)"}}
  - amount: {type: money, currency: KZT, question: {ru: "Какую сумму списали без вашего согласия, в тенге?", kk: "Келісіміңізсіз қанша сома есептен шығарылды, теңгемен?"}}
  - problem_description: {type: longtext}
  - applicant_name: {pii: person}
  - applicant_iin: {optional: true, pii: id_number, pattern: '^\d{12}$'}
  - applicant_address: {pii: address}
  - applicant_phone: {type: phone, pii: phone}
  - evidence: [bank_statement, police_report, correspondence]
parties:
  applicant: {kind: person, name_field: applicant_name, id_field: applicant_iin, address_field: applicant_address}
  respondent: {kind: business, name_field: respondent_name, id_field: respondent_bin, address_field: respondent_address}
actions:
  - id: statement_to_bank
    title: {ru: Заявление в банк о несанкционированном списании, kk: Банкке рұқсатсыз есептен шығару туралы арыз}
    template: kz/templates/generic/statement.docx
    channel: user_submits
    addressee: {party: respondent}
    deadline: {business_days: 15, norm_ref: "Закон Республики Казахстан «О банках и банковской деятельности в Республике Казахстан», статья 31"}
    norm_refs:
      - "Закон Республики Казахстан «О банках и банковской деятельности в Республике Казахстан», статья 31"
      - "Закон Республики Казахстан «О платежах и платежных системах», статья 56"
    demands:
      ru: "признать платёж (перевод) на сумму {amount} {currency} несанкционированным, так как я его не совершал(а) и не подтверждал(а); провести проверку, в том числе соблюдения процедур безопасности; вернуть мне списанные деньги; сообщить о результатах письменно с приложением данных о способе подтверждения операции."
    instructions:
      ru:
        - "Сразу заблокируйте карту через приложение или по телефону банка."
        - "Если деньги похитили мошенники — подайте заявление в полицию (102) и сохраните талон."
        - "Подайте заявление в банк через отделение (с отметкой о принятии) или официальную форму обращений и сохраните входящий номер."
        - "Нажмите «Документ подан». Срок ответа уточнит юрист."
      kk:
        - "Картаны қосымша арқылы не банк телефоны бойынша дереу бұғаттаңыз."
        - "Ақшаны алаяқтар ұрласа — полицияға (102) арыз беріп, талонды сақтаңыз."
        - "Арызды банкке бөлімше арқылы (қабылдау белгісімен) не ресми өтініш формасы арқылы беріп, кіріс нөмірін сақтаңыз."
        - "«Құжат тапсырылды» батырмасын басыңыз. Жауап мерзімін заңгер нақтылайды."
  - id: complaint_arrf
    when: statement_to_bank.response in [none, refusal, partial]
    title: {ru: Жалоба в АРРФР, kk: ҚНРДА-ға шағым}
    template: kz/templates/generic/complaint.docx
    channel: user_submits
    addressee: {authority: arrf}
    deadline: {business_days: 15, norm_ref: "Административный процедурно-процессуальный кодекс Республики Казахстан, статья 76"}
    norm_refs:
      - "Закон Республики Казахстан «О платежах и платежных системах», статья 56"
    demands:
      ru: "провести проверку действий банка при проведении несанкционированного платежа с моей карты (счёта) и при рассмотрении моего заявления, принять меры реагирования, о результатах сообщить мне."
    instructions:
      ru:
        - "Зайдите на {submit_url} (ЭЦП или SMS-код) и выберите получателя — {addressee}."
        - "Приложите выписку, заявление в банк, ответ банка (если был) и талон из полиции."
        - "Сохраните регистрационный номер и нажмите «Документ подан»."
      kk:
        - "{submit_url} сайтына кіріңіз (ЭЦҚ не SMS-код) және алушыны таңдаңыз — {addressee}."
        - "Үзінді көшірмені, банкке берілген арызды, банктің жауабын (болса) және полиция талонын тіркеңіз."
        - "Тіркеу нөмірін сақтап, «Құжат тапсырылды» батырмасын басыңыз."
  - id: handoff_lawyer
    kind: handoff
    when: complaint_arrf.response in [none, refusal, partial]
    title: {ru: Передача дела юристу, kk: Істі заңгерге беру}
pricing: {model: fixed, amount: 1990, currency: KZT}
