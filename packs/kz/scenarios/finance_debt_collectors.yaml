# Опубликован 28.09.2026 по решению владельца. reviewed_at: null → на каждом документе пометка «ЧЕРНОВИК».
# Нормы проверены 28.09.2026 по официальному тексту ИПС «Әділет» (страница акта открыта, номер статьи — как в тексте):
#   - Закон РК «О коллекторской деятельности» — https://adilet.zan.kz/rus/docs/Z1700000062
#     ст. 5 (правила взаимодействия: сообщать наименование агентства, ФИО работника и кредитора; время 8.00–21.00 в будние
#     дни; не более трёх телефонных переговоров; по требованию должника — документ о размере задолженности и копии
#     документов о полномочиях; п. 5 — запрещённые недобросовестные действия);
#     ст. 16, п. 1 (права должника, подп. 5) — жалоба в уполномоченный орган на действия коллекторского агентства).
# Уполномоченный орган = АРРФР — по данным пакета (authorities.arrf), не подтверждено юристом. Срок ответа — TODO.
# Угрозы жизни и насилие → экстренные номера (routing.yaml, emergency), это не предмет сценария.
id: kz.finance.debt_collectors
version: 0.1.0
ontology: FINANCE.COLLECTORS.MISCONDUCT
taxonomy: finance.debt_collectors
jurisdiction: KZ
languages: [ru, kk]
owner: lawyer:kz-01
reviewed_at: null
published: true
title:
  ru: Жалоба на действия коллекторов
  kk: Коллекторлардың әрекеттеріне шағым
summary:
  ru: Коллекторское агентство звонит слишком часто, ночью или в выходные, звонит родственникам и коллегам, не называет себя, давит или требует чужой долг.
  kk: Коллекторлық агенттік тым жиі, түнде не демалыс күндері қоңырау шалады, туыстарыңызға және әріптестеріңізге хабарласады, өзін таныстырмайды, қысым жасайды не басқаның қарызын талап етеді.
classification:
  keywords:
    ru: [коллектор, коллекторск, звонят по долгу, звонят родственникам, требуют долг, чужой долг, угрожают из-за долга]
    kk: [коллектор, қарыз үшін қоңырау, басқаның қарызы]
  examples:
    ru:
      - Коллекторы звонят по 10 раз в день и пишут моей маме
      - Коллекторы звонят и требуют чужой долг, я никогда не брал кредит
    kk:
      - Коллекторлар басқа біреудің қарызы үшін қоңырау шалып, қорқытады
intake:
  - respondent_name: {label: {ru: Коллекторское агентство, kk: Коллекторлық агенттік}, question: {ru: "Как называется коллекторское агентство? Если не знаете — с какого номера звонят и от какого кредитора.", kk: "Коллекторлық агенттіктің атауы қандай? Білмесеңіз — қай нөмірден және қай кредитордың атынан қоңырау шалады."}}
  - event_date: {type: date, optional: true, label: {ru: Дата последнего звонка, kk: Соңғы қоңырау күні}, question: {ru: "Когда был последний звонок или сообщение? (ДД.ММ.ГГГГ) Или «пропустить».", kk: "Соңғы қоңырау не хабарлама қашан болды? (КК.АА.ЖЖЖЖ) Не «өткізу»."}}
  - problem_description: {type: longtext}
  - applicant_name: {pii: person}
  - applicant_iin: {optional: true, pii: id_number, pattern: '^\d{12}$'}
  - applicant_address: {pii: address}
  - applicant_phone: {type: phone, pii: phone}
  - evidence: [collector_messages, loan_contract, correspondence]
parties:
  applicant: {kind: person, name_field: applicant_name, id_field: applicant_iin, address_field: applicant_address}
  respondent: {kind: business, name_field: respondent_name}
actions:
  - id: statement_to_collector
    title: {ru: Требование коллекторскому агентству, kk: Коллекторлық агенттікке талап}
    template: kz/templates/generic/statement.docx
    channel: user_submits
    addressee: {party: respondent}
    norm_refs:
      - "Закон Республики Казахстан «О коллекторской деятельности», статья 5"
      - "Закон Республики Казахстан «О коллекторской деятельности», статья 16"
    demands:
      ru: "прекратить взаимодействие с нарушением правил, установленных законом (время, частота звонков, контакты с третьими лицами); представить мне документ, подтверждающий размер задолженности, и копии документов, подтверждающих полномочия агентства в отношении задолженности; сообщить наименование кредитора. Если задолженность мне не принадлежит — прекратить требования ко мне."
    instructions:
      ru:
        - "Записывайте звонки и сохраняйте SMS и сообщения — закон разрешает должнику самостоятельно фиксировать взаимодействие с коллекторами."
        - "Отправьте требование на официальный адрес или e-mail агентства и сохраните подтверждение, либо заказным письмом с уведомлением о вручении."
        - "Если угрожают жизни или здоровью — звоните 102 или 112."
        - "Нажмите «Документ подан»."
      kk:
        - "Қоңырауларды жазып алып, SMS пен хабарламаларды сақтаңыз — заң борышкерге коллекторлармен өзара әрекетті өз бетінше тіркеуге рұқсат береді."
        - "Талапты агенттіктің ресми мекенжайына не e-mail-ына жіберіп, растауын сақтаңыз, не табыс етілгені туралы хабарламасы бар тапсырыс хатпен жіберіңіз."
        - "Өміріңізге не денсаулығыңызға қауіп төндірсе — 102 не 112 нөміріне қоңырау шалыңыз."
        - "«Құжат тапсырылды» батырмасын басыңыз."
  - id: complaint_arrf
    when: statement_to_collector.response in [none, refusal, partial]
    title: {ru: Жалоба в АРРФР на коллекторское агентство, kk: Коллекторлық агенттіктің әрекеттеріне ҚНРДА-ға шағым}
    template: kz/templates/generic/complaint.docx
    channel: user_submits
    addressee: {authority: arrf}
    norm_refs:
      - "Закон Республики Казахстан «О коллекторской деятельности», статья 16"
    demands:
      ru: "провести проверку действий коллекторского агентства на соответствие статье 5 Закона Республики Казахстан «О коллекторской деятельности», принять меры воздействия, о результатах сообщить мне."
    instructions:
      ru:
        - "Зайдите на {submit_url} (ЭЦП или SMS-код) и выберите получателя — {addressee}."
        - "Приложите записи звонков, скриншоты сообщений и требование агентству."
        - "Сохраните регистрационный номер и нажмите «Документ подан»."
      kk:
        - "{submit_url} сайтына кіріңіз (ЭЦҚ не SMS-код) және алушыны таңдаңыз — {addressee}."
        - "Қоңырау жазбаларын, хабарлама скриншоттарын және агенттікке жіберілген талапты тіркеңіз."
        - "Тіркеу нөмірін сақтап, «Құжат тапсырылды» батырмасын басыңыз."
  - id: handoff_lawyer
    kind: handoff
    when: complaint_arrf.response in [none, refusal, partial]
    title: {ru: Передача дела юристу, kk: Істі заңгерге беру}
pricing: {model: fixed, amount: 1990, currency: KZT}
