# Нормы и сроки проверены 28.09.2026 по официальному тексту ИПС «Әділет» (old.adilet.zan.kz, страница акта открыта):
#   - Закон РК «О защите прав потребителей» — https://adilet.zan.kz/rus/docs/Z100000274_
#     ст. 30 (обмен и возврат товара надлежащего и ненадлежащего качества), ст. 42-4 (претензия: вручается нарочно,
#     заказным письмом с уведомлением или на e-mail продавца; мотивированный ответ — 10 календарных дней со дня получения),
#     ст. 42-5 (обращение в госорган: не позднее двух месяцев; п. 3 — прилагается копия претензии и ответа; п. 4 — ФИО, ИИН,
#     почтовый адрес потребителя; наименование, почтовый адрес, БИН продавца; требование и обстоятельства).
#   - АППК РК, ст. 63, ст. 76, ч. 1 (15 рабочих дней со дня регистрации обращения, если иное не предусмотрено законами;
#     ЗПП ст. 42-7 своего общего срока не устанавливает) — https://adilet.zan.kz/rus/docs/K2000000350
#   - Адресат: «Департамент торговли и защиты прав потребителей Министерства торговли и интеграции РК по <городу/области>»
#     — приказ Министра торговли и интеграции РК от 29.12.2022 № 508-НҚ (https://adilet.zan.kz/rus/docs/G22TI000508).
id: kz.consumer.refund
version: 0.1.0
ontology: CONSUMER.GOODS.REFUND
taxonomy: consumer.refund
jurisdiction: KZ
languages: [ru, kk]
owner: lawyer:kz-01
reviewed_at: null          # no lawyer sign-off yet → compliance.draft_disclaimer note on every document
published: true
title:
  ru: Возврат денег за товар или услугу
  kk: Тауар немесе қызмет үшін ақшаны қайтару
summary:
  ru: Человек хочет вернуть или обменять купленный товар и получить деньги назад — товар сломался, бракованный, не подошёл или просто не понравился, не доставлен; услуга не оказана или оказана плохо; ремонт по гарантии не помог; продавец, магазин или маркетплейс отказывает или тянет.
  kk: Адам сатып алған тауарды қайтарғысы не ауыстырғысы және ақшасын қайтарып алғысы келеді — тауар бұзылды, сапасыз, сәйкес келмеді не жай ғана ұнамады, жеткізілмеді; қызмет көрсетілмеді не сапасыз көрсетілді; кепілдік бойынша жөндеу көмектеспеді; сатушы, дүкен не маркетплейс бас тартады не созбалаңға салады.
classification:
  keywords:
    ru: [вернуть деньги, возврат, вернуть товар, вернуть, сдать обратно, обменять, обмен, не понравил, не подош, не зашл, гаранти, некачественн, брак, сломал, не работает, не доставил, не привез, маркетплейс, магазин, продавец, интернет-магазин, купил, покупк, услуг, заказ, товар, чек, technodom, технодом, sulpak, сулпак, mechta, kaspi, каспи, wildberries, вайлдберриз, ozon, озон, alser, алсер]
    kk: [ақшаны қайтар, қайтару, қайтарғым, ауыстыр, ұнамады, сапасыз, сынды, тауар, дүкен, сатушы, тапсырыс, сатып алдым, кепілдік]
  examples:
    ru:
      - Купил телефон в интернет-магазине, через неделю сломался, деньги не возвращают
      - Заказал шкаф на маркетплейсе, прошло два месяца — не доставили
      - купил макбук в технодоме, не понравилось, хочу вернуть — как это сделать?
      - взял айфон на каспи, через 3 дня экран глючит, в сервисе отказали по гарантии
      - кроссы с вб не подошли, хочу сдать обратно, а бабки не возвращают
      - оплатил курсы, а занятия так и не начались, деньги не отдают
    kk:
      - Sulpak-тан теледидар сатып алдым, бір аптадан кейін сынды, ақшаны қайтармайды
claim:
  type: refund
  amount_field: amount
intake:
  - seller_name
  - seller_bin: {optional: true, pattern: '^\d{12}$'}
  - seller_address
  - goods_description
  - purchase_date: {type: date}
  - amount: {type: money, currency: KZT}
  - problem_description: {type: longtext}
  - applicant_name: {pii: person}
  - applicant_address: {pii: address}
  - applicant_phone: {type: phone, pii: phone}
  - applicant_iin: {optional: true, pii: id_number, pattern: '^\d{12}$'}
  - seller_email: {type: email, optional: true}
  - evidence: [receipt, order_screenshot, correspondence]
  - identity_document: [id_document]
parties:
  applicant: {kind: person, name_field: applicant_name, id_field: applicant_iin, address_field: applicant_address}
  respondent: {kind: business, name_field: seller_name, id_field: seller_bin, email_field: seller_email, address_field: seller_address}
actions:
  - id: claim_to_seller
    title: {ru: Претензия продавцу о возврате денег, kk: Сатушыға ақшаны қайтару туралы талап-арыз}
    template: kz/templates/consumer/claim_seller.docx
    channel: email_or_user_submits
    addressee: {party: respondent}
    deadline: {calendar_days: 10, norm_ref: "Закон Республики Казахстан «О защите прав потребителей», статья 42-4"}
    # TODO(lawyer, 01.10): ст. 30 — о товаре. Для услуги и цифрового контента (подписка, токены, доступ к сервису)
    # нужна норма об услугах вместо ст. 30 и формулировка «услуга не оказана / оказана ненадлежащим образом».
    # Норму вносит только юрист после сверки на adilet (вопрос: team/zann/lawyer/notes/2026-10-01-services-vs-goods.md).
    # Пока текст «Изложения» не называет услугу товаром и не пишет «брак» (правило в core/ai.write_narrative).
    norm_refs:
      - "Закон Республики Казахстан «О защите прав потребителей», статья 30"
      - "Закон Республики Казахстан «О защите прав потребителей», статья 42-4"
    demands:
      ru: "вернуть уплаченную мной денежную сумму в размере {amount} {currency} за «{goods_description}» в установленный законом срок и сообщить о принятом решении письменно."
    instructions:
      ru:
        - "Распечатайте претензию в двух экземплярах и подпишите оба."
        - "Вручите один экземпляр продавцу ({addressee}) и попросите поставить на втором отметку о принятии: дата, ФИО, подпись. Либо отправьте заказным письмом с уведомлением о вручении."
        - "Если продавец работает только онлайн — отправьте претензию на e-mail, который продавец сам указал (в договоре-оферте, чеке или на сайте), сохраните подтверждение отправки. Чат поддержки — только дополнительно (такого способа нет в ЗПП ст. 42-4 п. 1), со скриншотами."
        - "Нажмите «Документ подан» — мы начнём отсчёт срока ответа ({deadline_days} дн.) и напомним за 2 дня."
      kk:
        - "Талап-арызды екі данада басып шығарып, екеуіне де қол қойыңыз."
        - "Бір данасын сатушыға ({addressee}) беріп, екіншісіне қабылдағаны туралы белгі қоюын сұраңыз: күні, аты-жөні, қолы. Немесе табыс етілгені туралы хабарламасы бар тапсырыс хатпен жіберіңіз."
        - "Сатушы тек онлайн жұмыс істесе — талап-арызды сатушының өзі көрсеткен e-mail мекенжайына (шарт-офертада, чекте не сайтта) жіберіп, жөнелтілгенін растайтын дәлелді сақтаңыз. Қолдау чаты — тек қосымша (ТҚҚ туралы заңның 42-4-бабы 1-тармағында мұндай тәсіл жоқ), скриншоттармен."
        - "«Құжат тапсырылды» батырмасын басыңыз — жауап мерзімін ({deadline_days} күн) санай бастаймыз және 2 күн бұрын еске саламыз."
  - id: complaint_consumer_authority
    when: claim_to_seller.response in [none, refusal, partial]
    title: {ru: Жалоба в орган по защите прав потребителей, kk: Тұтынушылардың құқықтарын қорғау органына шағым}
    template: kz/templates/consumer/complaint_authority.docx
    channel: user_submits          # the user files it on eOtinish
    addressee: {authority: consumer_protection}
    # срок рассмотрения не задан: 15 рабочих дней в ЗПП не найдены (юрист, 01.10.2026) — вносит только юрист
    norm_refs:
      - "Закон Республики Казахстан «О защите прав потребителей», статья 42-5"
    demands:
      ru: "провести проверку по изложенным фактам и принять меры в отношении продавца для восстановления моих прав потребителя, о результатах сообщить мне."
    instructions:
      ru:
        - "Жалобу в орган по защите прав потребителей можно подать не позднее двух месяцев с момента обращения к продавцу с претензией (ЗПП, ст. 42-5 п. 2) — не откладывайте."
        - "Зайдите на {submit_url} (вход по ЭЦП или через SMS-код)."
        - "Выберите «Подать обращение» → категория «Жалоба», получатель — {addressee}."
        - "Вставьте текст жалобы из документа и приложите PDF, претензию продавцу и доказательства (чек, скриншоты, переписку)."
        - "Сохраните регистрационный номер обращения и нажмите «Документ подан»."
      kk:
        - "Тұтынушылардың құқықтарын қорғау органына шағымды сатушыға талап-арызбен жүгінген сәттен бастап екі айдан кешіктірмей беруге болады (ТҚҚ туралы заң, 42-5-бап 2-тармақ) — кейінге қалдырмаңыз."
        - "{submit_url} сайтына кіріңіз (ЭЦҚ не SMS-код арқылы)."
        - "«Өтініш беру» → «Шағым» санатын таңдаңыз, алушы — {addressee}."
        - "Құжаттағы шағым мәтінін қойып, PDF-ті, сатушыға берілген талап-арызды және дәлелдерді (чек, скриншоттар, хат алмасу) тіркеңіз."
        - "Өтініштің тіркеу нөмірін сақтап, «Құжат тапсырылды» батырмасын басыңыз."
  - id: handoff_lawyer
    kind: handoff
    when: complaint_consumer_authority.response in [none, refusal]
    title: {ru: Передача дела юристу, kk: Істі заңгерге беру}
pricing: {model: fixed, amount: 1990, currency: KZT}
