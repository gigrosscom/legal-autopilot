# БЕТА (EXPERIMENTAL_SCENARIOS=true). Прекращение деятельности (закрытие) ИП — заявление, чек-лист, инструкция.
# Источники, открытые 28.09.2026 в ИПС «Әділет» (old.adilet.zan.kz):
#   - Предпринимательский кодекс РК, ст. 38 п. 1 (добровольное прекращение — заявление в орган госдоходов), п. 4 (деятельность
#     прекращена с момента снятия с регистрационного учёта) — https://adilet.zan.kz/rus/docs/K1500000375
#   - Налоговый кодекс РК от 18 июля 2025 года № 214-VIII, ст. 76 п. 1 (не позднее 30 календарных дней со дня решения —
#     заявление о прекращении и ликвидационная налоговая отчётность), п. 3 (условия снятия: нет налоговой задолженности и
#     задолженности по социальным платежам, нет излишне уплаченных сумм к возврату), п. 4 (иначе — отказ),
#     ст. 98 — https://adilet.zan.kz/rus/docs/K2500000214
#   - Новость egov.kz о услуге «Прекращение деятельности ИП» в приложении eGov Business —
#     https://egov.kz/cms/ru/news/IE_liquidation (адрес подтверждён поиском по домену egov.kz 28.09.2026; перепроверять).
id: kz.services.ip_closure
version: 0.1.0
ontology: SERVICES.BUSINESS.IP_CLOSURE
jurisdiction: KZ
languages: [ru, kk]
owner: lawyer:kz-01
reviewed_at: null
published: false  # beta: offered only with EXPERIMENTAL_SCENARIOS=true
beta: true
kind: service
title:
  ru: Закрытие ИП
  kk: ЖК-ны жабу
summary:
  ru: Заявление о прекращении деятельности ИП, чек-лист (налоги, ликвидационная отчётность, сроки) и где подать — по Предпринимательскому и Налоговому кодексам.
  kk: ЖК қызметін тоқтату туралы өтініш, тізім (салықтар, таратылу есептілігі, мерзімдер) және қайда тапсыру керек — Кәсіпкерлік және Салық кодекстері бойынша.
disclaimer:
  ru: "Бета. Konsiliér AI — IT-сервис: помогаем подготовить документы по вашим данным и официальным требованиям. Это не юридическая и не налоговая консультация. Снять с учёта или отказать решает орган государственных доходов; результат не гарантируется."
  kk: "Бета. Konsiliér AI — IT-сервис: сіздің деректеріңіз бен ресми талаптар бойынша құжаттарды дайындауға көмектесеміз. Бұл заң немесе салық кеңесі емес. Тіркеуден шығаруды не бас тартуды мемлекеттік кірістер органы шешеді; нәтижеге кепілдік берілмейді."
sources:
  - {title: {ru: "Предпринимательский кодекс РК, ст. 38 (ИПС «Әділет»)", kk: "ҚР Кәсіпкерлік кодексі, 38-бап (ӘАЖ «Әділет»)"}, url: "https://adilet.zan.kz/rus/docs/K1500000375", checked_on: 2026-09-28}
  - {title: {ru: "Налоговый кодекс РК, ст. 76, 98 (ИПС «Әділет»)", kk: "ҚР Салық кодексі, 76, 98-баптар (ӘАЖ «Әділет»)"}, url: "https://adilet.zan.kz/rus/docs/K2500000214", checked_on: 2026-09-28}
  - {title: {ru: "egov.kz: прекращение деятельности ИП в eGov Business", kk: "egov.kz: eGov Business-те ЖК қызметін тоқтату"}, url: "https://egov.kz/cms/ru/news/IE_liquidation", checked_on: 2026-09-28}
classification:
  keywords:
    ru: [закрыть ип, закрытие ип, ликвидировать ип, ликвидация ип, прекращение деятельности ип, прекратить деятельность ип, снять ип с учета, снять ип с учёта, прекращения деятельности, прекращении деятельности]
    kk: [жк жабу, жк-ны жабу, жк қызметін тоқтату]
  examples:
    ru:
      - Хочу закрыть ИП, что нужно для прекращения деятельности ИП
      - Как ликвидировать ИП через egov
    kk:
      - ЖК-ны жапқым келеді
intake:
  - business_name: {label: {ru: "Наименование ИП", kk: "ЖК атауы"}, question: {ru: "Наименование ИП (как при регистрации)?", kk: "ЖК атауы (тіркелгендегідей)?"}}
  - decision_date: {type: date, label: {ru: "Дата решения о прекращении", kk: "Тоқтату туралы шешім күні"}, question: {ru: "С какой даты вы решили прекратить деятельность (ДД.ММ.ГГГГ)? От неё считается 30-дневный срок.", kk: "Қай күннен бастап қызметті тоқтатуды шештіңіз (КК.АА.ЖЖЖЖ)? 30 күндік мерзім содан бастап есептеледі."}}
  - tax_office: {label: {ru: "Налоговый орган", kk: "Салық органы"}, question: {ru: "Налоговый орган по месту нахождения ИП (например, УГД по району)?", kk: "ЖК орналасқан жері бойынша салық органы (мысалы, аудан бойынша МКБ)?"}}
  - has_employees: {optional: true, label: {ru: "Работники", kk: "Қызметкерлер"}, question: {ru: "Есть работники по трудовым договорам? Сколько. Нет — «Пропустить».", kk: "Еңбек шарты бойынша қызметкерлер бар ма? Қанша. Жоқ болса — «Өткізу»."}}
  - applicant_name: {pii: person}
  - applicant_iin: {pii: id_number, pattern: '^\d{12}$'}
  - applicant_address: {pii: address}
  - applicant_phone: {type: phone, pii: phone}
parties:
  applicant: {kind: person, name_field: applicant_name, id_field: applicant_iin, address_field: applicant_address}
  tax: {kind: authority, name_field: tax_office}
actions:
  - id: closure_package
    title: {ru: Пакет для закрытия ИП, kk: ЖК-ны жабуға арналған топтама}
    template: kz/templates/services/package.docx
    channel: user_submits
    addressee: {party: tax}
    instructions:
      ru:
        - "Не позднее 30 календарных дней со дня решения подайте одновременно заявление о прекращении и ликвидационную налоговую отчётность (ст. 76 п. 1 Налогового кодекса)."
        - "Сначала погасите налоговую задолженность и задолженность по социальным платежам — иначе будет отказ (ст. 76 п. 3–4)."
        - "Нажмите «Документ подан» после подачи заявления."
      kk:
        - "Шешім қабылданған күннен бастап 30 күнтізбелік күннен кешіктірмей тоқтату туралы өтінішті және таратылу салық есептілігін бір мезгілде тапсырыңыз (Салық кодексінің 76-бабы 1-тармағы)."
        - "Алдымен салық берешегі мен әлеуметтік төлемдер бойынша берешекті өтеңіз — әйтпесе бас тартылады (76-баптың 3–4-тармақтары)."
        - "Өтінішті тапсырғаннан кейін «Құжат тапсырылды» батырмасын басыңыз."
    package:
      - id: application
        title: {ru: Заявление о прекращении деятельности ИП, kk: ЖК қызметін тоқтату туралы өтініш}
        signature: true
        text:
          - {ru: "В {tax_office}", kk: "{tax_office}"}
          - {ru: "от индивидуального предпринимателя {applicant_name} ({business_name}), ИИН {applicant_iin}, адрес: {applicant_address}, тел.: {applicant_phone}", kk: "жеке кәсіпкер {applicant_name} ({business_name}), ЖСН {applicant_iin}, мекенжайы: {applicant_address}, тел.: {applicant_phone}"}
          - {ru: "ЗАЯВЛЕНИЕ о прекращении предпринимательской деятельности", kk: "Кәсіпкерлік қызметті тоқтату туралы ӨТІНІШ"}
          - {ru: "На основании пункта 1 статьи 38 Предпринимательского кодекса Республики Казахстан сообщаю о решении прекратить деятельность в качестве индивидуального предпринимателя с {decision_date} и прошу снять меня с регистрационного учёта.", kk: "Қазақстан Республикасы Кәсіпкерлік кодексінің 38-бабының 1-тармағы негізінде {decision_date} бастап жеке кәсіпкер ретіндегі қызметті тоқтату туралы шешімді хабарлаймын және мені тіркеу есебінен шығаруды сұраймын."}
          - {ru: "Ликвидационная налоговая отчётность представляется одновременно с заявлением (статья 76 Налогового кодекса Республики Казахстан).", kk: "Таратылу салық есептілігі өтінішпен бір мезгілде ұсынылады (Қазақстан Республикасы Салық кодексінің 76-бабы)."}
          - {ru: "Форму заявления в электронном сервисе заполните по образцу сервиса; этот текст — для бумажной подачи и для сверки данных.", kk: "Электрондық сервистегі өтініш нысанын сервис үлгісі бойынша толтырыңыз; бұл мәтін — қағаз түрінде тапсыру және деректерді салыстыру үшін."}
      - id: checklist
        title: {ru: Чек-лист, kk: Тізім}
        check:
          - {ru: "Решение о прекращении принято {decision_date}: срок подачи заявления и ликвидационной отчётности — 30 календарных дней (ст. 76 п. 1 НК).", kk: "Тоқтату туралы шешім {decision_date} қабылданды: өтініш пен таратылу есептілігін тапсыру мерзімі — 30 күнтізбелік күн (СК 76-бабының 1-тармағы)."}
          - {ru: "Ликвидационная налоговая отчётность (ст. 74 п. 2 НК — состав уточните в налоговом органе или кабинете налогоплательщика).", kk: "Таратылу салық есептілігі (СК 74-бабының 2-тармағы — құрамын салық органынан не салық төлеушінің кабинетінен нақтылаңыз)."}
          - {ru: "Нет налоговой задолженности и задолженности по социальным платежам (ст. 76 п. 3 НК) — проверьте на egov.kz.", kk: "Салық берешегі мен әлеуметтік төлемдер бойынша берешек жоқ (СК 76-бабының 3-тармағы) — egov.kz сайтында тексеріңіз."}
          - {ru: "Нет излишне уплаченных сумм налогов, пеней и штрафов к возврату (ст. 76 п. 3 НК) — их нужно вернуть или зачесть до снятия.", kk: "Қайтарылуға тиіс артық төленген салық, өсімпұл және айыппұл сомалары жоқ (СК 76-бабының 3-тармағы) — оларды тіркеуден шығарғанға дейін қайтару не есепке жатқызу керек."}
          - {ru: "Работники ({has_employees}): трудовые договоры прекратите по Трудовому кодексу до закрытия: приказ о прекращении, окончательный расчёт не позднее трёх рабочих дней после прекращения договора.", kk: "Қызметкерлер ({has_employees}): еңбек шарттарын жабуға дейін Еңбек кодексі бойынша тоқтатыңыз: тоқтату туралы бұйрық, шарт тоқтатылғаннан кейін үш жұмыс күнінен кешіктірмей түпкілікті есеп айырысу.", if: has_employees}
          - {ru: "ИП считается закрытым с момента снятия с учёта; сведения публикуются на сайте уполномоченного органа (ст. 38 п. 4 ПК, ст. 76 п. 5 НК).", kk: "ЖК тіркеуден шығарылған сәттен бастап жабылды деп есептеледі; мәліметтер уәкілетті органның сайтында жарияланады (КК 38-бабының 4-тармағы, СК 76-бабының 5-тармағы)."}
      - id: how_to_submit
        title: {ru: Где и как подать, kk: Қайда және қалай тапсыру керек}
        check:
          - {ru: "Онлайн: приложение eGov Business — услуга «Прекращение деятельности ИП» (по данным egov.kz; перед подачей проверьте в приложении).", kk: "Онлайн: eGov Business қосымшасы — «ЖК қызметін тоқтату» қызметі (egov.kz деректері бойынша; тапсыру алдында қосымшадан тексеріңіз)."}
          - {ru: "Или в налоговый орган по месту нахождения: {tax_office}.", kk: "Немесе орналасқан жері бойынша салық органына: {tax_office}."}
          - {ru: "Подтверждение о снятии (или отказе) можно получить в налоговом органе или через его информационные системы (ст. 98 п. 2 НК).", kk: "Тіркеуден шығару (немесе бас тарту) туралы растауды салық органынан не оның ақпараттық жүйелері арқылы алуға болады (СК 98-бабының 2-тармағы)."}
pricing: {model: fixed, amount: 2990, currency: KZT}
