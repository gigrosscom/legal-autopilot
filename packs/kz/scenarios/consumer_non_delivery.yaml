# Опубликован 28.09.2026 по решению владельца. reviewed_at: null → на каждом документе нейтральная пометка compliance.draft_disclaimer.
# Нормы проверены 28.09.2026 по официальному тексту ИПС «Әділет» (страница акта открыта, номер статьи — как в тексте):
#   - ГК РК (Особенная часть), ст. 440 «Предварительная оплата товара», п. 3 — https://adilet.zan.kz/rus/docs/K990000409_
#   - Закон РК «О защите прав потребителей», ст. 42-4, п. 2 (ответ продавца — 10 календарных дней со дня получения претензии),
#     ст. 42-5 (обращение в госорган не позднее двух месяцев с момента обращения к продавцу) — https://adilet.zan.kz/rus/docs/Z100000274_
# TODO(lawyer): кто адресат при покупке на маркетплейсе (продавец, площадка или оба); наименование органа и канал подачи.
#   - АППК РК, ст. 63 (реквизиты обращения: ФИО, ИИН, почтовый адрес заявителя; наименование органа; суть; дата; подпись),
#     ст. 76, ч. 1 (обращение рассматривается 15 рабочих дней со дня регистрации, если иное не предусмотрено законами) —
#     https://adilet.zan.kz/rus/docs/K2000000350, открыт 28.09.2026 (срок жалобы в госорган — deadline по ст. 76).
id: kz.consumer.non_delivery
version: 0.1.0
ontology: CONSUMER.GOODS.NON_DELIVERY
taxonomy: consumer.refund
jurisdiction: KZ
languages: [ru, kk]
owner: lawyer:kz-01
reviewed_at: null
published: true
title:
  ru: Не доставили оплаченный заказ
  kk: Төленген тапсырыс жеткізілмеді
summary:
  ru: Вы заранее оплатили товар в интернет-магазине или на маркетплейсе, а его не доставили в срок или не доставили совсем, и деньги не возвращают.
  kk: Интернет-дүкенде не маркетплейсте тауарды алдын ала төлегенсіз, бірақ ол мерзімінде жеткізілмеді не мүлдем жеткізілмеді, ақша қайтарылмайды.
classification:
  keywords:
    ru: [не доставили, не привезли, не пришёл заказ, не пришел заказ, заказ не пришёл, заказ не пришел, посылка не пришла, предоплат, доставк]
    kk: [жеткізілмеді, әкелмеді, тапсырыс келмеді, алдын ала төле]
  examples:
    ru:
      - Заказ с маркетплейса не доставили, деньги не возвращают
      - Оплатил диван в интернет-магазине, прошёл месяц — ни дивана, ни денег
    kk:
      - Маркетплейстегі тапсырыс жеткізілмеді, ақша қайтарылмайды
claim:
  type: refund
  amount_field: amount
intake:
  - respondent_name: {label: {ru: Продавец, kk: Сатушы}, question: {ru: "Как называется продавец или интернет-магазин? Если покупали на маркетплейсе — продавец и площадка.", kk: "Сатушының не интернет-дүкеннің атауы қандай? Маркетплейстен алсаңыз — сатушы мен алаң."}}
  - respondent_bin: {optional: true, pattern: '^\d{12}$'}
  - respondent_address
  - event_date: {type: date, label: {ru: Дата оплаты, kk: Төлем күні}, question: {ru: "Когда вы оплатили заказ? (ДД.ММ.ГГГГ)", kk: "Тапсырысты қашан төледіңіз? (КК.АА.ЖЖЖЖ)"}}
  - amount: {type: money, currency: KZT, question: {ru: "Сколько вы заплатили, в тенге?", kk: "Қанша төледіңіз, теңгемен?"}}
  - problem_description: {type: longtext}
  - applicant_name: {pii: person}
  - applicant_iin: {optional: true, pii: id_number, pattern: '^\d{12}$'}
  - applicant_address: {pii: address}
  - applicant_phone: {type: phone, pii: phone}
  - evidence: [receipt, order_screenshot, correspondence]
parties:
  applicant: {kind: person, name_field: applicant_name, id_field: applicant_iin, address_field: applicant_address}
  respondent: {kind: business, name_field: respondent_name, id_field: respondent_bin, address_field: respondent_address}
actions:
  - id: claim_to_seller
    title: {ru: Претензия продавцу о возврате предоплаты, kk: Сатушыға алдын ала төлемді қайтару туралы наразылық}
    template: kz/templates/generic/claim_letter.docx
    channel: user_submits
    addressee: {party: respondent}
    deadline: {calendar_days: 10, norm_ref: "Закон Республики Казахстан «О защите прав потребителей», статья 42-4"}
    norm_refs:
      - "Гражданский кодекс Республики Казахстан (Особенная часть), статья 440"
      - "Закон Республики Казахстан «О защите прав потребителей», статья 42-4"
    demands:
      ru: "вернуть уплаченную мной сумму предварительной оплаты в размере {amount} {currency} за не переданный мне товар и сообщить о принятом решении письменно."
    instructions:
      ru:
        - "Распечатайте претензию в двух экземплярах и подпишите оба."
        - "Вручите один экземпляр продавцу ({addressee}) и попросите отметку о принятии на втором, либо отправьте заказным письмом с уведомлением о вручении, либо на e-mail продавца, если он его указывал."
        - "Если покупали на маркетплейсе — продублируйте претензию в чат поддержки площадки и сохраните скриншоты."
        - "Нажмите «Документ подан». Продавец должен ответить в течение {deadline_days} календарных дней со дня получения претензии — мы напомним."
      kk:
        - "Наразылықты екі данада басып шығарып, екеуіне де қол қойыңыз."
        - "Бір данасын сатушыға ({addressee}) беріп, екіншісіне қабылдағаны туралы белгі сұраңыз, не табыс етілгені туралы хабарламасы бар тапсырыс хатпен, не сатушы көрсеткен e-mail мекенжайына жіберіңіз."
        - "Маркетплейстен алсаңыз — наразылықты алаңның қолдау чатына да жіберіп, скриншоттарды сақтаңыз."
        - "«Құжат тапсырылды» батырмасын басыңыз. Сатушы наразылықты алған күннен бастап {deadline_days} күнтізбелік күн ішінде жауап беруге тиіс — біз еске саламыз."
  - id: complaint_consumer_authority
    when: claim_to_seller.response in [none, refusal, partial]
    title: {ru: Жалоба в орган по защите прав потребителей, kk: Тұтынушылардың құқықтарын қорғау органына шағым}
    template: kz/templates/generic/complaint.docx
    channel: user_submits
    addressee: {authority: consumer_protection}
    deadline: {business_days: 15, norm_ref: "Административный процедурно-процессуальный кодекс Республики Казахстан, статья 76"}
    norm_refs:
      - "Закон Республики Казахстан «О защите прав потребителей», статья 42-5"
    demands:
      ru: "рассмотреть мою жалобу, принять меры к продавцу для возврата мне предварительной оплаты в размере {amount} {currency}, о результатах сообщить мне."
    instructions:
      ru:
        - "Обратиться в госорган можно не позднее двух месяцев с момента претензии продавцу."
        - "Подайте жалобу через {submit_url} (вход по ЭЦП или SMS-код), получатель — {addressee}. Точный канал подачи уточнит юрист."
        - "Приложите претензию продавцу, его ответ (если был), чек и скриншоты заказа."
        - "Сохраните регистрационный номер и нажмите «Документ подан»."
      kk:
        - "Мемлекеттік органға сатушыға наразылық берген сәттен бастап екі айдан кешіктірмей жүгінуге болады."
        - "Шағымды {submit_url} арқылы беріңіз (ЭЦҚ не SMS-код), алушы — {addressee}. Нақты беру арнасын заңгер нақтылайды."
        - "Сатушыға берілген наразылықты, оның жауабын (болса), чекті және тапсырыс скриншоттарын тіркеңіз."
        - "Тіркеу нөмірін сақтап, «Құжат тапсырылды» батырмасын басыңыз."
  - id: handoff_lawyer
    kind: handoff
    when: complaint_consumer_authority.response in [none, refusal, partial]
    title: {ru: Передача дела юристу (иск в суд), kk: Істі заңгерге беру (сотқа талап қою)}
pricing: {model: fixed, amount: 1990, currency: KZT}
