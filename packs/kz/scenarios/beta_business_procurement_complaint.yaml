# БЕТА (EXPERIMENTAL_SCENARIOS=true). Для бизнеса: жалоба потенциального поставщика на действия (решения) заказчика,
# организатора в госзакупках (итоги конкурса, аукциона).
# Нормы проверены 28.09.2026 по официальному тексту ИПС «Әділет» (old.adilet.zan.kz):
#   - Закон РК «О государственных закупках» от 1 июля 2024 года № 106-VIII — https://adilet.zan.kz/rus/docs/Z2400000106
#       ст. 25 п. 1 (через веб-портал, 3 рабочих дня со дня размещения протокола об итогах конкурса, аукциона; срок
#       заключения договора приостанавливается), п. 2 (решение — 3 рабочих дня после истечения срока подачи жалоб),
#       п. 3 (далее — суд), п. 6 (досудебный порядок обязателен), п. 7 (итоги, определённые порталом автоматически,
#       так не обжалуются).
#   - Правила осуществления госзакупок (приказ МФ РК № 687) — https://adilet.zan.kz/rus/docs/V2400035238
#       п. 588–599 (глава 19): п. 589 (адресат — заказчик/организатор, принявший протокол), п. 596 (содержание),
#       п. 597 (подпись; доверенность представителя), п. 598 (возврат в 2 рабочих дня), п. 599 (поданная с пропуском срока
#       не рассматривается).
# Закон о госзакупках не отмечен как ключевой акт в packs/kz/pack.yaml — ссылки в тексте жалобы (package), не в norm_refs.
id: kz.business.procurement_complaint
version: 0.1.0
ontology: BUSINESS.PROCUREMENT.COMPLAINT
jurisdiction: KZ
languages: [ru, kk]
owner: lawyer:kz-01
reviewed_at: null
published: true
beta: true
kind: dispute
title:
  ru: "Для бизнеса: обжалование итогов госзакупок"
  kk: "Бизнес үшін: мемлекеттік сатып алу қорытындыларына шағымдану"
summary:
  ru: Заказчик или организатор неправомерно отклонил вашу заявку или подвёл итоги конкурса (аукциона) с нарушением — жалоба через портал в течение 3 рабочих дней, затем юрист (суд).
  kk: Тапсырыс беруші не ұйымдастырушы өтініміңізді негізсіз қабылдамады немесе конкурс (аукцион) қорытындысын бұзушылықпен шығарды — 3 жұмыс күні ішінде портал арқылы шағым, содан кейін заңгер (сот).
disclaimer:
  ru: "Бета. Konsiliér AI — IT-сервис подготовки документов, не юридическая помощь. Результат не гарантируется. Срок очень короткий — три рабочих дня."
  kk: "Бета. Konsiliér AI — құжаттарды дайындайтын IT-сервис, заң көмегі емес. Нәтижеге кепілдік берілмейді. Мерзім өте қысқа — үш жұмыс күні."
classification:
  keywords:
    ru: [обжаловать итоги, обжалование итогов, протокол итогов, протокол об итогах, итоги конкурса, итоги аукциона, итоги госзакуп, отклонил заявку, отклонили заявку, отклонили нашу заявку, жалоба на заказчика, жалобу на заказчика, жалоба на организатора]
    kk: [қорытындысына шағым, өтінімді қабылдамады, қорытынды хаттама]
  examples:
    ru:
      - Хотим обжаловать итоги конкурса по госзакупкам, заказчик отклонил заявку без оснований
      - Организатор разместил протокол итогов аукциона с нарушениями, нужна жалоба на заказчика
    kk:
      - Мемлекеттік сатып алу конкурсының қорытындысына шағым беру керек, өтінімді қабылдамады
intake:
  - respondent_name: {label: {ru: "Заказчик (организатор)", kk: "Тапсырыс беруші (ұйымдастырушы)"}, question: {ru: "Заказчик или организатор, разместивший протокол (наименование)?", kk: "Хаттаманы орналастырған тапсырыс беруші не ұйымдастырушы (атауы)?"}}
  - respondent_address: {label: {ru: "Место нахождения заказчика", kk: "Тапсырыс берушінің орналасқан жері"}, question: {ru: "Место нахождения заказчика (организатора) — адрес из объявления?", kk: "Тапсырыс берушінің (ұйымдастырушының) орналасқан жері — хабарландырудағы мекенжай?"}}
  - tender_number: {label: {ru: "Номер закупки", kk: "Сатып алу нөмірі"}, question: {ru: "Номер объявления (закупки) и лота на goszakup.gov.kz?", kk: "goszakup.gov.kz порталындағы хабарландырудың (сатып алудың) және лоттың нөмірі?"}}
  - event_date: {type: date, label: {ru: "Дата размещения протокола", kk: "Хаттама орналастырылған күн"}, question: {ru: "Когда размещён протокол об итогах (ДД.ММ.ГГГГ)? На жалобу — три рабочих дня.", kk: "Қорытынды хаттама қашан орналастырылды (КК.АА.ЖЖЖЖ)? Шағымға — үш жұмыс күні."}}
  - act_description: {label: {ru: "Что обжалуете", kk: "Неге шағымданасыз"}, question: {ru: "Какое решение или действие обжалуете (например, отклонение заявки, признание победителем)?", kk: "Қандай шешімге не әрекетке шағымданасыз (мысалы, өтінімді қабылдамау, жеңімпаз деп тану)?"}}
  - problem_description: {type: longtext, label: {ru: "Факты нарушений", kk: "Бұзушылық фактілері"}, question: {ru: "Конкретные факты нарушений законодательства о госзакупках и чем подтверждаются.", kk: "Мемлекеттік сатып алу туралы заңнаманы бұзудың нақты фактілері және олар немен расталады."}}
  - applicant_name: {pii: person, label: {ru: "Потенциальный поставщик (ТОО или ИП)", kk: "Әлеуетті өнім беруші (ЖШС немесе ЖК)"}, question: {ru: "Полное наименование вашей компании?", kk: "Компанияңыздың толық атауы?"}}
  - applicant_bin: {pii: id_number, pattern: '^\d{12}$', label: {ru: "БИН/ИИН", kk: "БСН/ЖСН"}, question: {ru: "БИН (или ИИН для ИП) — 12 цифр?", kk: "БСН (ЖК үшін ЖСН) — 12 цифр?"}}
  - representative: {pii: person, label: {ru: "Кто подписывает", kk: "Кім қол қояды"}, question: {ru: "ФИО и должность подписанта (для представителя — нужна доверенность)?", kk: "Қол қоюшының аты-жөні және лауазымы (өкіл үшін — сенімхат керек)?"}}
  - applicant_address: {pii: address, label: {ru: "Место нахождения", kk: "Орналасқан жері"}, question: {ru: "Место нахождения (юридический адрес) вашей компании?", kk: "Компанияңыздың орналасқан жері (заңды мекенжайы)?"}}
  - applicant_phone: {type: phone, pii: phone}
  - evidence: [procurement_protocol, correspondence, other]
parties:
  applicant: {kind: business, name_field: applicant_name, id_field: applicant_bin, address_field: applicant_address}
  respondent: {kind: authority, name_field: respondent_name, address_field: respondent_address}
actions:
  - id: complaint_customer
    title: {ru: Жалоба на действия (решения) заказчика (организатора) в госзакупках, kk: Мемлекеттік сатып алудағы тапсырыс берушінің (ұйымдастырушының) әрекеттеріне (шешімдеріне) шағым}
    template: kz/templates/business/complaint_b2b.docx
    channel: user_submits
    addressee: {party: respondent}
    demands:
      ru: "отменить обжалуемое решение (действие) — {act_description} — по закупке № {tender_number} и пересмотреть итоги конкурса (аукциона)."
      kk: "№ {tender_number} сатып алу бойынша шағымданылатын шешімнің (әрекеттің) — {act_description} — күшін жойып, конкурстың (аукционның) қорытындыларын қайта қарау."
    package:
      - id: legal_basis
        title: {ru: Правовое основание, kk: Құқықтық негіз}
        text:
          - ru: "Сведения о закупке: объявление № {tender_number}; протокол об итогах размещён {event_date}. Правовое основание: статья 25 Закона Республики Казахстан «О государственных закупках»; пункты 588, 589, 596 Правил осуществления государственных закупок (приказ Министра финансов РК от 9 октября 2024 года № 687)."
            kk: "Сатып алу туралы мәліметтер: № {tender_number} хабарландыру; қорытынды хаттама {event_date} орналастырылды. Құқықтық негіз: «Мемлекеттік сатып алу туралы» Қазақстан Республикасы Заңының 25-бабы; Мемлекеттік сатып алуды жүзеге асыру қағидаларының 588, 589, 596-тармақтары (ҚР Қаржы министрінің 2024 жылғы 9 қазандағы № 687 бұйрығы)."
    instructions:
      ru:
        - "Срок — три рабочих дня со дня размещения протокола об итогах; поданная позже жалоба не рассматривается (ст. 25 п. 1 Закона, п. 599 Правил)."
        - "Подайте жалобу через веб-портал goszakup.gov.kz в адрес заказчика (организатора), принявшего протокол; подпишите ЭЦП, для представителя приложите доверенность (п. 597)."
        - "Нажмите «Документ подан». Решение — в течение трёх рабочих дней после истечения срока подачи жалоб (ст. 25 п. 2). При отказе — юрист и суд; досудебная жалоба обязательна (ст. 25 п. 6)."
      kk:
        - "Мерзімі — қорытынды хаттама орналастырылған күннен бастап үш жұмыс күні; кейін берілген шағым қаралмайды (Заңның 25-бабының 1-тармағы, Қағидалардың 599-тармағы)."
        - "Шағымды goszakup.gov.kz веб-порталы арқылы хаттаманы қабылдаған тапсырыс берушінің (ұйымдастырушының) атына беріңіз; ЭЦҚ-мен қол қойыңыз, өкіл үшін сенімхатты қоса беріңіз (597-тармақ)."
        - "«Құжат тапсырылды» батырмасын басыңыз. Шешім — шағым беру мерзімі өткеннен кейін үш жұмыс күні ішінде (25-баптың 2-тармағы). Бас тартылса — заңгер және сот; сотқа дейінгі шағым міндетті (25-баптың 6-тармағы)."
  - id: handoff_lawyer
    kind: handoff
    when: complaint_customer.response in [none, refusal, partial]
    title: {ru: Передача дела юристу (иск в суд), kk: Істі заңгерге беру (сотқа талап қою)}
pricing: {model: fixed, amount: 1990, currency: KZT}
