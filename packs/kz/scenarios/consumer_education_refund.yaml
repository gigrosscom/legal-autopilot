# Опубликован 28.09.2026 по решению владельца. reviewed_at: null → на каждом документе пометка «ЧЕРНОВИК».
# Нормы проверены 28.09.2026 по официальному тексту ИПС «Әділет» (страница акта открыта, номер статьи — как в тексте):
#   - ГК РК (Особенная часть), ст. 683, п. 2 (услуги по обучению), ст. 686, п. 1 («Заказчик вправе отказаться от
#     исполнения договора возмездного оказания услуг при условии оплаты исполнителю фактически понесенных им расходов»)
#     — https://adilet.zan.kz/rus/docs/K990000409_
#   - Закон РК «О защите прав потребителей», ст. 42-4 (ответ — 10 календарных дней), ст. 42-5 —
#     https://adilet.zan.kz/rus/docs/Z100000274_
# TODO(lawyer): образовательные организации с лицензией — особый порядок? адресат жалобы.
id: kz.consumer.education_refund
version: 0.1.0
ontology: CONSUMER.SERVICE.EDUCATION_REFUND
taxonomy: consumer.refund
jurisdiction: KZ
languages: [ru, kk]
owner: lawyer:kz-01
reviewed_at: null
published: true
title:
  ru: Возврат денег за обучение или курсы
  kk: Оқу не курс үшін ақшаны қайтару
summary:
  ru: Вы оплатили курсы, тренинг, обучение (в том числе онлайн), занятия не начались, прошли не так, как обещали, или вы решили отказаться — а деньги не возвращают.
  kk: Курсқа, тренингке, оқуға (онлайн да) төледіңіз, сабақ басталмады, уәде еткендей өтпеді не сіз бас тартуды шештіңіз — ақша қайтарылмайды.
classification:
  keywords:
    ru: [курсы, курсов, на курс, обучени, тренинг, онлайн-школ, онлайн школ, репетитор, учебн центр, занятия, марафон]
    kk: [курс, оқу орталығы, тренинг, сабақ, онлайн мектеп]
  examples:
    ru:
      - Оплатил курсы, а занятия так и не начались, деньги не отдают
      - Хочу отказаться от онлайн-курса, прошёл два урока, школа не возвращает остаток
    kk:
      - Курсқа төледім, сабақ басталмады, ақшаны қайтармайды
claim:
  type: refund
  amount_field: amount
intake:
  - respondent_name: {label: {ru: Организатор обучения, kk: Оқуды ұйымдастырушы}, question: {ru: "Как называется школа, учебный центр или организатор курса?", kk: "Мектептің, оқу орталығының не курс ұйымдастырушысының атауы қандай?"}}
  - event_date: {type: date, label: {ru: Дата оплаты, kk: Төлем күні}, question: {ru: "Когда вы оплатили обучение? (ДД.ММ.ГГГГ)", kk: "Оқуды қашан төледіңіз? (КК.АА.ЖЖЖЖ)"}}
  - amount: {type: money, currency: KZT, question: {ru: "Какую сумму вы хотите вернуть, в тенге?", kk: "Қандай соманы қайтарғыңыз келеді, теңгемен?"}}
  - problem_description: {type: longtext}
  - applicant_name: {pii: person}
  - applicant_iin: {optional: true, pii: id_number, pattern: '^\d{12}$'}
  - applicant_address: {pii: address}
  - applicant_phone: {type: phone, pii: phone}
  - evidence: [service_contract, receipt, correspondence]
parties:
  applicant: {kind: person, name_field: applicant_name, id_field: applicant_iin, address_field: applicant_address}
  respondent: {kind: business, name_field: respondent_name}
actions:
  - id: claim_to_school
    title: {ru: Заявление об отказе от договора и претензия о возврате денег, kk: Шарттан бас тарту туралы арыз және ақшаны қайтару туралы талап-арыз}
    template: kz/templates/generic/claim_letter.docx
    channel: user_submits
    addressee: {party: respondent}
    deadline: {calendar_days: 10, norm_ref: "Закон Республики Казахстан «О защите прав потребителей», статья 42-4"}
    norm_refs:
      - "Гражданский кодекс Республики Казахстан (Особенная часть), статья 686"
      - "Закон Республики Казахстан «О защите прав потребителей», статья 42-4"
    demands:
      ru: "принять мой отказ от исполнения договора об оказании услуг по обучению и вернуть мне уплаченные деньги в размере {amount} {currency} за вычетом фактически понесённых вами расходов, подтверждённых документами; о принятом решении сообщить письменно."
    instructions:
      ru:
        - "Отправьте претензию на официальный e-mail или через форму обращений школы и сохраните подтверждение, либо вручите лично с отметкой о принятии на втором экземпляре."
        - "Приложите договор (оферту) и чек."
        - "Нажмите «Документ подан». Срок ответа — {deadline_days} календарных дней со дня получения претензии; мы напомним."
      kk:
        - "Талап-арызды мектептің ресми e-mail мекенжайына не өтініш формасы арқылы жіберіп, растауын сақтаңыз, не екінші данаға қабылдау белгісін қойғызып, өзіңіз тапсырыңыз."
        - "Шартты (офертаны) және чекті тіркеңіз."
        - "«Құжат тапсырылды» батырмасын басыңыз. Жауап мерзімі — талап-арыз алынған күннен бастап {deadline_days} күнтізбелік күн; біз еске саламыз."
  - id: complaint_consumer_authority
    when: claim_to_school.response in [none, refusal, partial]
    title: {ru: Жалоба в орган по защите прав потребителей, kk: Тұтынушылардың құқықтарын қорғау органына шағым}
    template: kz/templates/generic/complaint.docx
    channel: user_submits
    addressee: {authority: consumer_protection}
    norm_refs:
      - "Закон Республики Казахстан «О защите прав потребителей», статья 42-5"
    demands:
      ru: "рассмотреть мою жалобу и принять меры для возврата мне денег, уплаченных за обучение, о результатах сообщить мне."
    instructions:
      ru:
        - "Обратиться в госорган можно не позднее двух месяцев с момента претензии."
        - "Подайте жалобу через {submit_url} (вход по ЭЦП или SMS-код), получатель — {addressee}. Точный канал подачи уточнит юрист."
        - "Приложите договор, чек, претензию и ответ на неё (если был)."
        - "Сохраните регистрационный номер и нажмите «Документ подан»."
      kk:
        - "Мемлекеттік органға талап-арыз берген сәттен бастап екі айдан кешіктірмей жүгінуге болады."
        - "Шағымды {submit_url} арқылы беріңіз (ЭЦҚ не SMS-код), алушы — {addressee}. Нақты беру арнасын заңгер нақтылайды."
        - "Шартты, чекті, талап-арызды және оған жауапты (болса) тіркеңіз."
        - "Тіркеу нөмірін сақтап, «Құжат тапсырылды» батырмасын басыңыз."
  - id: handoff_lawyer
    kind: handoff
    when: complaint_consumer_authority.response in [none, refusal, partial]
    title: {ru: Передача дела юристу (иск в суд), kk: Істі заңгерге беру (сотқа талап қою)}
pricing: {model: fixed, amount: 1990, currency: KZT}
