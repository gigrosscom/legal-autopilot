# БЕТА (EXPERIMENTAL_SCENARIOS=true). Жалоба на отказ в назначении (прекращение) пособия или социальной выплаты.
# Общий порядок обжалования административного акта — АППК РК, https://adilet.zan.kz/rus/docs/K2000000350 (ключевой
# акт пакета, открыт 28.09.2026; тексты статей сверены там же для сценария kz.business.inspection_complaint):
#   ст. 91 п. 4 (жалоба подаётся через орган, чьё решение обжалуется; он в течение трёх рабочих дней передаёт её
#   в орган, рассматривающий жалобу), ст. 92 п. 1 (не позднее трёх месяцев со дня, когда стало известно о решении).
# TODO(lawyer) перед публикацией (см. docs/lawyer/new-topics.md):
#   - нет ли в Социальном кодексе РК (2023) или правилах назначения конкретной выплаты особого порядка/срока
#     обжалования, который вытесняет общие статьи АППК; какой орган рассматривает жалобу (вышестоящий орган,
#     уполномоченный орган по оценке качества госуслуг, МТСЗН) — для каждой выплаты;
#   - срок рассмотрения жалобы (АППК ст. 99 — двадцать рабочих дней — подтвердить для этих жалоб) → deadline;
#   - порядок административного иска в суд после жалобы (досудебный порядок, сроки) → handoff.
id: kz.social.benefit_refusal_appeal
version: 0.1.0
ontology: SOCIAL.BENEFIT.REFUSAL_APPEAL
taxonomy: social.benefit_refusal
jurisdiction: KZ
languages: [ru, kk]
owner: lawyer:kz-01
reviewed_at: null
published: false  # beta: offered only with EXPERIMENTAL_SCENARIOS=true
beta: true
kind: dispute
title:
  ru: Жалоба на отказ в пособии или выплате
  kk: Жәрдемақыдан не төлемнен бас тартуға шағым
summary:
  ru: Вам отказали в назначении пособия (социальной выплаты, АСП) или прекратили выплату — жалоба в вышестоящий орган по АППК, затем юрист (суд).
  kk: Сізге жәрдемақы (әлеуметтік төлем, АӘК) тағайындаудан бас тартты немесе төлемді тоқтатты — ӘРПК бойынша жоғары тұрған органға шағым, содан кейін заңгер (сот).
disclaimer:
  ru: "Бета. Konsiliér AI — IT-сервис подготовки документов, не юридическая помощь. Результат не гарантируется."
  kk: "Бета. Konsiliér AI — құжаттарды дайындайтын IT-сервис, заң көмегі емес. Нәтижеге кепілдік берілмейді."
classification:
  keywords:
    ru: [отказали в назначении, отказ в назначении, отказали в пособии, отказ в пособии, отказали в выплате пособия, прекратили выплату, прекратили выплату пособия, перестали выплачивать, приостановили выплату, обжаловать отказ, решение об отказе, жалоба на отказ, жалобу на отказ]
    kk: [жәрдемақы тағайындаудан бас тарт, жәрдемақыдан бас тарт, бас тартуға шағым]
  examples:
    ru:
      - Отказали в назначении пособия, хочу обжаловать отказ
      - Прекратили выплату пособия без объяснений, нужна жалоба на решение об отказе
    kk:
      - Жәрдемақы тағайындаудан бас тартты, бас тартуға шағым жазғым келеді
intake:
  - respondent_name: {label: {ru: "Кто отказал", kk: "Кім бас тартты"}, question: {ru: "Какой орган отказал или прекратил выплату — точное название, как в решении (уведомлении)?", kk: "Қай орган бас тартты не төлемді тоқтатты — шешімдегідей (хабарламадағыдай) нақты атауы?"}}
  - higher_authority: {label: {ru: "Вышестоящий орган", kk: "Жоғары тұрған орган"}, question: {ru: "Кому подчиняется этот орган (вышестоящий орган)? Если в решении указано, куда обжаловать, — напишите это. Не знаете — напишите «не знаю», уточним у юриста.", kk: "Бұл орган кімге бағынады (жоғары тұрған орган)? Шешімде қайда шағымдану керегі көрсетілсе — соны жазыңыз. Білмесеңіз — «білмеймін» деп жазыңыз, заңгерден нақтылаймыз."}}
  - benefit_type: {label: {ru: "Выплата", kk: "Төлем"}, question: {ru: "В какой выплате отказали (например, пособие по инвалидности, по уходу за ребёнком, АСП)?", kk: "Қай төлемнен бас тартты (мысалы, мүгедектік бойынша, бала күтіміне арналған жәрдемақы, АӘК)?"}}
  - decision_number: {optional: true, label: {ru: "Решение об отказе", kk: "Бас тарту туралы шешім"}, question: {ru: "Номер и дата решения (уведомления) об отказе? Нет номера — «Пропустить».", kk: "Бас тарту туралы шешімнің (хабарламаның) нөмірі мен күні? Нөмірі жоқ болса — «Өткізу»."}}
  - event_date: {type: date, label: {ru: "Когда узнали об отказе", kk: "Бас тартуды қашан білдіңіз"}, question: {ru: "Когда вы получили отказ или узнали о нём (ДД.ММ.ГГГГ)?", kk: "Бас тартуды қашан алдыңыз не ол туралы қашан білдіңіз (КК.АА.ЖЖЖЖ)?"}}
  - problem_description: {type: longtext, label: {ru: "Почему не согласны", kk: "Неге келіспейсіз"}, question: {ru: "Какую причину отказа указали и почему вы не согласны — чем подтверждается право на выплату? Только факты.", kk: "Бас тартудың қандай себебі көрсетілді және неге келіспейсіз — төлемге құқығыңыз немен расталады? Тек фактілер."}}
  - desired_outcome: {label: {ru: "Чего просите", kk: "Не сұрайсыз"}, question: {ru: "Чего просите: отменить решение об отказе и назначить выплату, возобновить выплату, пересмотреть расчёт?", kk: "Не сұрайсыз: бас тарту туралы шешімнің күшін жойып, төлем тағайындау, төлемді қайта бастау, есептеуді қайта қарау?"}}
  - applicant_name: {pii: person}
  - applicant_iin: {pii: id_number, pattern: '^\d{12}$'}
  - applicant_address: {pii: address}
  - applicant_phone: {type: phone, pii: phone}
  - applicant_email: {type: email, pii: email, optional: true, label: {ru: "E-mail", kk: "E-mail"}, question: {ru: "E-mail для ответа (или «Пропустить»)?", kk: "Жауап үшін e-mail (немесе «Өткізу»)?"}}
  - evidence: [benefit_decision, id_document, gov_certificate, medical_documents, correspondence, other]
parties:
  applicant: {kind: person, name_field: applicant_name, id_field: applicant_iin, address_field: applicant_address, email_field: applicant_email}
  respondent: {kind: authority, name_field: respondent_name}
  higher: {kind: authority, name_field: higher_authority}
actions:
  - id: complaint_benefit_refusal
    title: {ru: Жалоба на решение об отказе в назначении выплаты, kk: Төлем тағайындаудан бас тарту туралы шешімге шағым}
    template: kz/templates/generic/complaint.docx
    channel: user_submits
    addressee: {party: higher}
    norm_refs:
      - "Административный процедурно-процессуальный кодекс Республики Казахстан, статья 91"
      - "Административный процедурно-процессуальный кодекс Республики Казахстан, статья 92"
      - "TODO"
    demands:
      ru: "{desired_outcome} (выплата: {benefit_type}); о результатах рассмотрения жалобы сообщить мне письменно."
      kk: "{desired_outcome} (төлем: {benefit_type}); шағымды қарау нәтижелері туралы маған жазбаша хабарлауыңызды сұраймын."
    instructions:
      ru:
        - "Жалоба подаётся через орган, который отказал ({respondent_name}): он передаёт её в орган, рассматривающий жалобу (АППК, ст. 91). Общий срок — не позднее трёх месяцев со дня, когда вы узнали об отказе (АППК, ст. 92)."
        - "Если в решении об отказе указан другой порядок обжалования — следуйте ему. Подайте жалобу через портал обращений eotinish.kz или лично (способ уточните в органе); приложите решение об отказе и документы, подтверждающие право на выплату; сохраните номер регистрации."
        - "Нажмите «Документ подан». Если снова откажут или не ответят — передадим дело юристу (иск в суд)."
      kk:
        - "Шағым бас тартқан орган ({respondent_name}) арқылы беріледі: ол оны шағымды қарайтын органға жібереді (ӘРПК, 91-бап). Жалпы мерзім — бас тарту туралы білген күннен бастап үш айдан кешіктірмей (ӘРПК, 92-бап)."
        - "Бас тарту туралы шешімде шағымданудың басқа тәртібі көрсетілсе — соны ұстаныңыз. Шағымды eotinish.kz өтініштер порталы арқылы не өзіңіз тапсырыңыз (тәсілін органнан нақтылаңыз); бас тарту туралы шешімді және төлемге құқығыңызды растайтын құжаттарды қоса беріңіз; тіркеу нөмірін сақтаңыз."
        - "«Құжат тапсырылды» батырмасын басыңыз. Тағы бас тартса не жауап бермесе — істі заңгерге береміз (сотқа талап)."
  - id: handoff_lawyer
    kind: handoff
    when: complaint_benefit_refusal.response in [none, refusal, partial]
    title: {ru: Передача дела юристу (административный иск в суд), kk: Істі заңгерге беру (сотқа әкімшілік талап)}
pricing: {model: fixed, amount: 2990, currency: KZT}
