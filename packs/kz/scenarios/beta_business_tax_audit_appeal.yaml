# БЕТА (EXPERIMENTAL_SCENARIOS=true). Для бизнеса: жалоба на уведомление о результатах налоговой проверки.
# Нормы проверены 28.09.2026 по официальному тексту ИПС «Әділет» (old.adilet.zan.kz):
#   Налоговый кодекс РК от 18 июля 2025 года № 214-VIII — https://adilet.zan.kz/rus/docs/K2500000214
#     ст. 3 пп. 19) (уполномоченный орган — госорган, руководящий обеспечением поступлений налогов),
#     ст. 191 п. 1–3 (обжалование в уполномоченном органе или в суде по АППК; подача жалобы приостанавливает исполнение
#     уведомления в обжалуемой части), ст. 192 п. 1 (30 рабочих дней со дня вручения уведомления; копия жалобы — в налоговый
#     орган, проводивший проверку), ст. 193 (форма и содержание), ст. 194 (отказ в рассмотрении),
#     ст. 195 п. 1 (решение — не более 30 рабочих дней, для налогового мониторинга — 45).
# Налоговый кодекс пока не отмечен как проверенный «ключевой акт» в packs/kz/pack.yaml, поэтому ссылки на него стоят в тексте
# жалобы (package), а не в norm_refs. TODO(lawyer): точное подразделение Министерства финансов и адрес подачи; после
# слияния ветки с pack.yaml — добавить НК в key_acts и перенести ссылки в norm_refs, включить напоминание (30 рабочих дней).
id: kz.business.tax_audit_appeal
version: 0.1.0
ontology: BUSINESS.TAX.AUDIT_NOTICE_APPEAL
jurisdiction: KZ
languages: [ru, kk]
owner: lawyer:kz-01
reviewed_at: null
published: false  # beta: offered only with EXPERIMENTAL_SCENARIOS=true
beta: true
kind: dispute
title:
  ru: "Для бизнеса: обжалование результатов налоговой проверки"
  kk: "Бизнес үшін: салық тексерісінің нәтижелеріне шағымдану"
summary:
  ru: Не согласны с уведомлением о результатах налоговой проверки — жалоба в уполномоченный орган в течение 30 рабочих дней по Налоговому кодексу, затем юрист (суд).
  kk: Салық тексерісінің нәтижелері туралы хабарламамен келіспейсіз — Салық кодексі бойынша 30 жұмыс күні ішінде уәкілетті органға шағым, содан кейін заңгер (сот).
disclaimer:
  ru: "Бета. Konsiliér AI — IT-сервис подготовки документов, не юридическая и не налоговая консультация. Результат не гарантируется; сложные налоговые споры лучше сразу показать юристу."
  kk: "Бета. Konsiliér AI — құжаттарды дайындайтын IT-сервис, заң немесе салық кеңесі емес. Нәтижеге кепілдік берілмейді; күрделі салық дауларын бірден заңгерге көрсеткен жөн."
classification:
  keywords:
    ru: [налоговой проверки, налоговая проверка, налоговую проверку, уведомление о результатах, доначисл, кгд, органы госдоходов, органа госдоходов, угд, налоговый орган доначислил]
    kk: [салық тексерісі, салықтық тексеру, мкд, қосымша есептелді]
  examples:
    ru:
      - Пришло уведомление о результатах налоговой проверки, доначислили налоги, хотим обжаловать
      - УГД по итогам налоговой проверки доначислил КПН и пени, не согласны
    kk:
      - Салық тексерісінің нәтижелері туралы хабарлама келді, шағымданғымыз келеді
claim:
  type: tax
  amount_field: amount
intake:
  - respondent_name: {label: {ru: "Налоговый орган, проводивший проверку", kk: "Тексеру жүргізген салық органы"}, question: {ru: "Какой налоговый орган проводил проверку (например, УГД по району)?", kk: "Тексеруді қай салық органы жүргізді (мысалы, аудан бойынша МКБ)?"}}
  - notice_number: {label: {ru: "Номер уведомления", kk: "Хабарлама нөмірі"}, question: {ru: "Номер уведомления о результатах проверки?", kk: "Тексеру нәтижелері туралы хабарламаның нөмірі?"}}
  - event_date: {type: date, label: {ru: "Дата вручения уведомления", kk: "Хабарлама табыс етілген күн"}, question: {ru: "Когда уведомление вручено (ДД.ММ.ГГГГ)? От этой даты — 30 рабочих дней на жалобу.", kk: "Хабарлама қашан табыс етілді (КК.АА.ЖЖЖЖ)? Осы күннен бастап шағымға 30 жұмыс күні."}}
  - amount: {type: money, currency: KZT, label: {ru: "Обжалуемая сумма", kk: "Шағымданылатын сома"}, question: {ru: "Какую сумму (налоги, пени, штрафы) обжалуете, в тенге?", kk: "Қандай соманы (салықтар, өсімпұл, айыппұлдар) шағымданасыз, теңгемен?"}}
  - problem_description: {type: longtext, label: {ru: "Доводы", kk: "Дәлелдер"}, question: {ru: "С чем не согласны и почему — по каждому пункту уведомления, со ссылкой на ваши документы.", kk: "Немен келіспейсіз және неге — хабарламаның әр тармағы бойынша, құжаттарыңызға сілтеме жасап."}}
  - applicant_name: {pii: person, label: {ru: "Налогоплательщик (ТОО или ИП)", kk: "Салық төлеуші (ЖШС немесе ЖК)"}, question: {ru: "Полное наименование налогоплательщика (ТОО или ИП)?", kk: "Салық төлеушінің толық атауы (ЖШС немесе ЖК)?"}}
  - applicant_bin: {pii: id_number, pattern: '^\d{12}$', label: {ru: "БИН/ИИН", kk: "БСН/ЖСН"}, question: {ru: "БИН (или ИИН для ИП) — 12 цифр?", kk: "БСН (ЖК үшін ЖСН) — 12 цифр?"}}
  - representative: {pii: person, label: {ru: "Кто подписывает", kk: "Кім қол қояды"}, question: {ru: "ФИО и должность подписанта (для представителя — нужна доверенность)?", kk: "Қол қоюшының аты-жөні және лауазымы (өкіл үшін — сенімхат керек)?"}}
  - applicant_address: {pii: address, label: {ru: "Место нахождения", kk: "Орналасқан жері"}, question: {ru: "Место нахождения (юридический адрес) налогоплательщика?", kk: "Салық төлеушінің орналасқан жері (заңды мекенжайы)?"}}
  - applicant_phone: {type: phone, pii: phone}
  - evidence: [audit_notice, business_contract, invoice_act, correspondence]
parties:
  applicant: {kind: business, name_field: applicant_name, id_field: applicant_bin, address_field: applicant_address}
  respondent: {kind: authority, name_field: respondent_name}
actions:
  - id: complaint_ministry
    title: {ru: Жалоба на уведомление о результатах налоговой проверки, kk: Салық тексерісінің нәтижелері туралы хабарламаға шағым}
    template: kz/templates/business/complaint_b2b.docx
    channel: user_submits
    addressee:
      name: {ru: "Министерство финансов Республики Казахстан (уполномоченный орган по рассмотрению жалоб на уведомления о результатах налоговых проверок)", kk: "Қазақстан Республикасы Қаржы министрлігі (салық тексерістерінің нәтижелері туралы хабарламаларға шағымдарды қарайтын уәкілетті орган)"}
    demands:
      ru: "отменить уведомление о результатах налоговой проверки № {notice_number} (вручено {event_date}) в обжалуемой части на сумму {amount} {currency}."
      kk: "№ {notice_number} салық тексерісінің нәтижелері туралы хабарламаның ({event_date} табыс етілді) шағымданылатын бөлігін {amount} {currency} сомасына күшін жою."
    package:
      - id: legal_basis
        title: {ru: Правовое основание, kk: Құқықтық негіз}
        text:
          - ru: "Правовое основание: статьи 191–193 Налогового кодекса Республики Казахстан. Жалоба подана в течение тридцати рабочих дней со дня вручения уведомления; её копия направлена в налоговый орган, проводивший проверку (пункт 1 статьи 192). Подача жалобы приостанавливает исполнение уведомления в обжалуемой части (пункт 3 статьи 191)."
            kk: "Құқықтық негіз: Қазақстан Республикасы Салық кодексінің 191–193-баптары. Шағым хабарлама табыс етілген күннен бастап отыз жұмыс күні ішінде берілді; оның көшірмесі тексеру жүргізген салық органына жіберілді (192-баптың 1-тармағы). Шағым беру хабарламаның шағымданылатын бөлігінде орындалуын тоқтата тұрады (191-баптың 3-тармағы)."
    instructions:
      ru:
        - "Срок — 30 рабочих дней со дня вручения уведомления (ст. 192 п. 1 НК); пропуск — основание для отказа в рассмотрении (ст. 194)."
        - "Подайте жалобу в уполномоченный орган (лично, почтой или электронно через веб-портал) и одновременно направьте копию в налоговый орган, проводивший проверку. Укажите в приложениях все документы (ст. 193); для представителя — доверенность."
        - "Нажмите «Документ подан». Решение — не более 30 рабочих дней со дня регистрации жалобы (ст. 195). При отказе — юрист и суд по АППК."
      kk:
        - "Мерзімі — хабарлама табыс етілген күннен бастап 30 жұмыс күні (СК 192-бабының 1-тармағы); мерзімді өткізу — қараудан бас тарту негізі (194-бап)."
        - "Шағымды уәкілетті органға (жеке өзі, пошта арқылы немесе веб-портал арқылы электрондық түрде) беріп, бір мезгілде көшірмесін тексеру жүргізген салық органына жіберіңіз. Қосымшаларда барлық құжаттарды көрсетіңіз (193-бап); өкіл үшін — сенімхат."
        - "«Құжат тапсырылды» батырмасын басыңыз. Шешім — шағым тіркелген күннен бастап 30 жұмыс күнінен аспайды (195-бап). Бас тартылса — заңгер және ӘРПК бойынша сот."
  - id: handoff_lawyer
    kind: handoff
    when: complaint_ministry.response in [none, refusal, partial]
    title: {ru: Передача дела юристу (административный иск), kk: Істі заңгерге беру (әкімшілік талап)}
pricing: {model: fixed, amount: 1990, currency: KZT}
