# Опубликован 28.09.2026 по решению владельца. reviewed_at: null → на каждом документе нейтральная пометка compliance.draft_disclaimer.
# Нормы проверены 28.09.2026 по официальному тексту ИПС «Әділет» (страница акта открыта, номер статьи — как в тексте):
#   - ГК РК (Общая часть), ст. 338-5 (обеспечительная плата), ст. 338-6, п. 2 (при прекращении обеспеченного
#     обязательства обеспечительная плата подлежит возврату, если иное не предусмотрено договором) —
#     https://adilet.zan.kz/rus/docs/K940001000_
#   - ГК РК (Особенная часть), ст. 953 (обязанность возвратить неосновательное обогащение) —
#     https://adilet.zan.kz/rus/docs/K990000409_
# Срок ответа наймодателя в законе не найден — deadline не задан.
# TODO(lawyer): квалификация «депозита» (обеспечительная плата, задаток, аванс) по типовым договорам; иск — через юриста.
id: kz.housing.deposit_return
version: 0.1.0
ontology: HOUSING.TENANCY.DEPOSIT_RETURN
taxonomy: housing.tenancy
jurisdiction: KZ
languages: [ru, kk]
owner: lawyer:kz-01
reviewed_at: null
published: true
title:
  ru: Возврат депозита за аренду жилья
  kk: Тұрғын үйді жалдау депозитін қайтару
summary:
  ru: Вы съехали со съёмной квартиры (дома), а хозяин не возвращает депозит (залог, обеспечительный платёж) или удерживает его без оснований.
  kk: Жалға алған пәтерден (үйден) көштіңіз, ал иесі депозитті (кепіл ақшаны, қамтамасыз ету төлемін) қайтармайды не негізсіз ұстап қалады.
classification:
  keywords:
    ru: [депозит, залог за квартиру, залог за аренду, хозяин квартиры, арендодатель, съехал, съёмн, съемн, аренд]
    kk: [депозит, кепіл ақша, пәтер иесі, жалға беруші, жалдау]
  examples:
    ru:
      - Арендодатель не возвращает залог за квартиру
      - Съехал с квартиры, хозяйка не отдаёт депозит, говорит — на ремонт
    kk:
      - Жалға беруші пәтердің кепіл ақшасын қайтармайды
claim:
  type: refund
  amount_field: amount
intake:
  - respondent_name: {label: {ru: Наймодатель, kk: Жалға беруші}, question: {ru: "ФИО хозяина жилья (наймодателя) или название агентства, как в договоре?", kk: "Тұрғын үй иесінің (жалға берушінің) аты-жөні не агенттіктің атауы, шарттағыдай?"}}
  - respondent_address: {optional: true, pii: address}
  - event_date: {type: date, label: {ru: Дата выезда, kk: Көшкен күн}, question: {ru: "Когда вы вернули жильё (съехали)? (ДД.ММ.ГГГГ)", kk: "Тұрғын үйді қашан қайтардыңыз (көштіңіз)? (КК.АА.ЖЖЖЖ)"}}
  - amount: {type: money, currency: KZT, question: {ru: "Какой депозит не вернули, в тенге?", kk: "Қандай депозит қайтарылмады, теңгемен?"}}
  - problem_description: {type: longtext}
  - applicant_name: {pii: person}
  - applicant_iin: {optional: true, pii: id_number, pattern: '^\d{12}$'}
  - applicant_address: {pii: address}
  - applicant_phone: {type: phone, pii: phone}
  - evidence: [rental_contract, receipt, photo, correspondence]
parties:
  applicant: {kind: person, name_field: applicant_name, id_field: applicant_iin, address_field: applicant_address}
  respondent: {kind: person, name_field: respondent_name, address_field: respondent_address}
actions:
  - id: claim_to_landlord
    title: {ru: Претензия наймодателю о возврате депозита, kk: Жалға берушіге депозитті қайтару туралы наразылық}
    template: kz/templates/generic/claim_letter.docx
    channel: user_submits
    addressee: {party: respondent}
    norm_refs:
      - "Гражданский кодекс Республики Казахстан (Общая часть), статья 338-6"
      - "Гражданский кодекс Республики Казахстан (Особенная часть), статья 953"
    demands:
      ru: "вернуть мне внесённый по договору найма депозит (обеспечительный платёж) в размере {amount} {currency}; если вы считаете, что вправе удержать часть суммы, — письменно указать основание и приложить подтверждающие документы."
    instructions:
      ru:
        - "Отправьте претензию так, чтобы было подтверждение получения: вручите лично с отметкой на втором экземпляре, заказным письмом с уведомлением или в мессенджер, которым вы общались, — и сохраните скриншот."
        - "Приложите договор, расписку или перевод депозита и фото состояния квартиры при выезде."
        - "Нажмите «Документ подан». Когда придёт ответ или станет ясно, что его не будет, — отметьте это в деле, и мы подскажем следующий шаг."
      kk:
        - "Наразылықты алғанын растайтындай етіп жіберіңіз: екінші данаға белгі қойғызып өзіңіз тапсырыңыз, хабарламасы бар тапсырыс хатпен не хат алысқан мессенджер арқылы жіберіп, скриншотын сақтаңыз."
        - "Шартты, депозит туралы қолхатты не аударымды және көшкен кездегі пәтердің фотосын тіркеңіз."
        - "«Құжат тапсырылды» батырмасын басыңыз. Жауап келгенде не оның болмайтыны анық болғанда — мұны істе белгілеңіз, біз келесі қадамды айтамыз."
  - id: handoff_lawyer
    kind: handoff
    when: claim_to_landlord.response in [none, refusal, partial]
    title: {ru: Передача дела юристу (иск в суд), kk: Істі заңгерге беру (сотқа талап қою)}
pricing: {model: fixed, amount: 2990, currency: KZT}
