# БЕТА (EXPERIMENTAL_SCENARIOS=true). Помощь в подготовке заявки на государственный грант (безвозмездное
# финансирование) для малого бизнеса — не спор.
# Черновик: правила программ грантов НЕ открывались. Условия (кто может участвовать, сумма гранта, доля
# собственного вклада, сроки приёма, форма бизнес-плана, обязательное обучение) задаёт конкретная программа и
# объявление о конкурсе — поэтому в тексте нет ни одной суммы, срока или статьи, только «смотрите условия конкурса».
# TODO(lawyer) перед публикацией (см. docs/lawyer/new-topics.md):
#   - какие программы действуют сейчас (гранты на новые бизнес-идеи через АО «Фонд развития предпринимательства
#     «Даму»» и местные исполнительные органы, гранты по линии занятости и т. п.), их правила (НПА, ИПС «Әділет»);
#   - кто принимает заявки и через какой канал (портал, электронная почта, лично), формы заявки и бизнес-плана;
#   - обязательные документы (регистрация, отсутствие налоговой задолженности, софинансирование, сертификат
#     обучения, документы целевой группы) — подтвердить или убрать строки чек-листа;
#   - суммы, доля собственного вклада, сроки приёма и рассмотрения — добавить только со ссылкой на норму.
id: kz.business.state_grant
version: 0.1.0
ontology: SERVICES.BUSINESS.STATE_GRANT
taxonomy: business.state_grant
jurisdiction: KZ
languages: [ru, kk]
owner: lawyer:kz-01
reviewed_at: null
published: false  # beta: offered only with EXPERIMENTAL_SCENARIOS=true
beta: true
kind: service
title:
  ru: Заявка на государственный грант для бизнеса
  kk: Бизнеске мемлекеттік грантқа өтінім
summary:
  ru: Сопроводительное письмо, структура бизнес-плана, смета расходов гранта, чек-лист и опись документов, пошаговая подача заявки на конкурс грантов («Даму», акимат и другие программы).
  kk: Ілеспе хат, бизнес-жоспар құрылымы, грант шығыстарының сметасы, құжаттар тізімі мен тізімдемесі, гранттар конкурсына өтінімді кезең-кезеңімен тапсыру («Даму», әкімдік және басқа бағдарламалар).
disclaimer:
  ru: "Бета. Konsiliér AI — IT-сервис: помогаем подготовить документы по вашим данным. Это не юридическая и не консалтинговая помощь. Грант не гарантируется: решение принимает конкурсная комиссия. Условия, суммы и сроки сверьте с объявлением о конкурсе и правилами программы."
  kk: "Бета. Konsiliér AI — IT-сервис: сіздің деректеріңіз бойынша құжаттарды дайындауға көмектесеміз. Бұл заң немесе консалтинг көмегі емес. Грантқа кепілдік берілмейді: шешімді конкурстық комиссия қабылдайды. Шарттарды, сомалар мен мерзімдерді конкурс туралы хабарландырумен және бағдарлама қағидаларымен салыстырыңыз."
sources:
  - {title: {ru: "Фонд развития предпринимательства «Даму»", kk: "«Даму» кәсіпкерлікті дамыту қоры"}, url: "https://damu.kz"}
  - {title: {ru: "Портал электронного правительства (справки для заявки)", kk: "Электрондық үкімет порталы (өтінімге арналған анықтамалар)"}, url: "https://egov.kz"}
classification:
  keywords:
    ru: [грант на бизнес, грант для бизнеса, грант на открытие, грант на развитие бизнеса, грант на новую бизнес, бизнес-иде, бизнес иде, безвозмездное финансирование, безвозмездного финансирования, фонд даму, фонда даму, через даму, господдержк, бизнес-план для гранта, бизнес-план на грант]
    kk: [бизнеске грант, бизнес-идея, қайтарымсыз қаржыландыру]
  examples:
    ru:
      - Хочу получить грант на новую бизнес-идею, какие документы и бизнес-план нужны
      - Как подготовить документы на безвозмездное финансирование для бизнеса через фонд Даму
      - Нужен бизнес-план для гранта на открытие кафе в районе
      - Как получить господдержку для малого бизнеса — грант на развитие бизнеса
    kk:
      - Жаңа бизнес-идеяға грант алу үшін қандай құжаттар керек
intake:
  - programme_name: {label: {ru: "Программа (конкурс)", kk: "Бағдарлама (конкурс)"}, question: {ru: "Как называется программа или конкурс грантов — как в объявлении? Не знаете — напишите «не знаю».", kk: "Гранттар бағдарламасы не конкурсы қалай аталады — хабарландырудағыдай? Білмесеңіз — «білмеймін» деп жазыңыз."}}
  - organizer_name: {label: {ru: "Организатор", kk: "Ұйымдастырушы"}, question: {ru: "Кто принимает заявки: фонд «Даму», акимат (управление предпринимательства), центр занятости или другой организатор?", kk: "Өтінімдерді кім қабылдайды: «Даму» қоры, әкімдік (кәсіпкерлік басқармасы), жұмыспен қамту орталығы немесе басқа ұйымдастырушы?"}}
  - project_title: {label: {ru: "Название проекта", kk: "Бизнес-идея атауы"}, question: {ru: "Короткое название проекта (например, «Пекарня в микрорайоне Самал»)?", kk: "Бизнес-идеяның қысқа атауы (мысалы, «Самал шағынауданындағы наубайхана»)?"}}
  - activity: {label: {ru: "Вид деятельности и место", kk: "Қызмет түрі және орны"}, question: {ru: "Вид деятельности и где будете работать (город, район, село)?", kk: "Қызмет түрі және қай жерде жұмыс істейсіз (қала, аудан, ауыл)?"}}
  - problem_description: {type: longtext, label: {ru: "Суть проекта", kk: "Бизнес-идеяның мәні"}, question: {ru: "Суть проекта своими словами: что будете делать, для кого, на что нужны деньги и почему это будет работать.", kk: "Бизнес-идеяның мәні өз сөзіңізбен: не істейсіз, кім үшін, ақша не үшін керек және неге бұл жұмыс істейді."}}
  - requested_amount: {type: money, currency: KZT, optional: true, label: {ru: "Сумма гранта", kk: "Грант сомасы"}, question: {ru: "Какую сумму гранта просите, в тенге? Предельную сумму смотрите в условиях конкурса. Не знаете — «Пропустить».", kk: "Қандай грант сомасын сұрайсыз, теңгемен? Шекті соманы конкурс шарттарынан қараңыз. Білмесеңіз — «Өткізу»."}}
  - own_contribution: {type: money, currency: KZT, optional: true, label: {ru: "Собственный вклад", kk: "Өз салымы"}, question: {ru: "Сколько вкладываете своих средств или имущества, в тенге? Нет — «Пропустить».", kk: "Өз қаражатыңыздан не мүлкіңізден қанша саласыз, теңгемен? Жоқ болса — «Өткізу»."}}
  - jobs_planned: {type: number, optional: true, label: {ru: "Новые рабочие места", kk: "Жаңа жұмыс орындары"}, question: {ru: "Сколько рабочих мест создаст проект? Не планируете — «Пропустить».", kk: "Қанша жұмыс орнын ашасыз? Жоспарламасаңыз — «Өткізу»."}}
  - applicant_name: {pii: person, label: {ru: "Заявитель (ИП или ТОО)", kk: "Өтініш беруші (ЖК немесе ЖШС)"}, question: {ru: "Полное наименование вашего ИП или ТОО?", kk: "ЖК-ңыздың не ЖШС-ңыздың толық атауы?"}}
  - applicant_bin: {pii: id_number, pattern: '^\d{12}$', label: {ru: "БИН/ИИН", kk: "БСН/ЖСН"}, question: {ru: "БИН (для ТОО) или ИИН (для ИП) — 12 цифр?", kk: "БСН (ЖШС үшін) немесе ЖСН (ЖК үшін) — 12 цифр?"}}
  - representative: {pii: person, label: {ru: "Руководитель", kk: "Басшы"}, question: {ru: "ФИО и должность того, кто подписывает заявку?", kk: "Өтінімге қол қоятын адамның аты-жөні және лауазымы?"}}
  - applicant_address: {pii: address, label: {ru: "Адрес", kk: "Мекенжай"}, question: {ru: "Юридический адрес (для ИП — адрес регистрации)?", kk: "Заңды мекенжай (ЖК үшін — тіркелген мекенжайы)?"}}
  - applicant_phone: {type: phone, pii: phone}
  - applicant_email: {type: email, pii: email, optional: true, label: {ru: "E-mail", kk: "E-mail"}, question: {ru: "E-mail для связи с организатором (или «Пропустить»)?", kk: "Ұйымдастырушымен байланысқа арналған e-mail (немесе «Өткізу»)?"}}
parties:
  applicant: {kind: business, name_field: applicant_name, id_field: applicant_bin, address_field: applicant_address, email_field: applicant_email}
  organizer: {kind: authority, name_field: organizer_name}
actions:
  - id: grant_package
    title: {ru: Пакет документов к заявке на грант, kk: Грантқа өтінімнің құжаттар топтамасы}
    template: kz/templates/services/package.docx
    channel: user_submits
    addressee: {party: organizer}
    instructions:
      ru:
        - "Откройте объявление о конкурсе у организатора ({addressee}) и сверьте каждый пункт чек-листа и структуру бизнес-плана с его условиями: форма, суммы и сроки приёма заданы там."
        - "Подайте заявку каналом из объявления (портал, e-mail или лично) до окончания срока приёма; сохраните подтверждение о приёме."
        - "Нажмите «Документ подан», когда заявку примут. Решение принимает конкурсная комиссия, грант не гарантируется."
      kk:
        - "Ұйымдастырушыда ({addressee}) конкурс туралы хабарландыруды ашып, тізімнің әр тармағын және бизнес-жоспар құрылымын оның шарттарымен салыстырыңыз: нысан, сомалар мен қабылдау мерзімдері сонда берілген."
        - "Өтінімді хабарландырудағы арна арқылы (портал, e-mail не өзіңіз) қабылдау мерзімі біткенге дейін тапсырыңыз; қабылданғаны туралы растауды сақтаңыз."
        - "Өтінім қабылданғанда «Құжат тапсырылды» батырмасын басыңыз. Шешімді конкурстық комиссия қабылдайды, грантқа кепілдік берілмейді."
    package:
      - id: cover_letter
        title: {ru: Сопроводительное письмо к заявке, kk: Өтінімге ілеспе хат}
        signature: true
        text:
          - ru: "{applicant_name} (БИН/ИИН {applicant_bin}) в лице {representative} направляет заявку на участие в конкурсе «{programme_name}» с проектом «{project_title}». Вид деятельности и место реализации: {activity}."
            kk: "{applicant_name} (БСН/ЖСН {applicant_bin}) {representative} атынан «{programme_name}» конкурсына «{project_title}» бизнес-идеясымен қатысуға өтінім жібереді. Қызмет түрі және іске асыру орны: {activity}."
          - {ru: "{narrative}", kk: "{narrative}"}
          - {ru: "Запрашиваемая сумма гранта: {requested_amount} тенге.", kk: "Сұралатын грант сомасы: {requested_amount} теңге.", if: requested_amount}
          - {ru: "Собственный вклад: {own_contribution} тенге.", kk: "Өз салымы: {own_contribution} теңге.", if: own_contribution}
          - {ru: "Проект создаст рабочих мест: {jobs_planned}.", kk: "Ашылатын жұмыс орындары: {jobs_planned}.", if: jobs_planned}
          - {ru: "Бизнес-план, смета и документы прилагаются согласно описи. Подтверждаю достоверность сведений и готовность представить подтверждающие документы по запросу.", kk: "Бизнес-жоспар, смета және құжаттар тізімдемеге сәйкес қоса беріледі. Мәліметтердің дұрыстығын және сұрау бойынша растайтын құжаттарды ұсынуға дайын екенімді растаймын."}
      - id: business_plan
        title: {ru: Бизнес-план — структура для заполнения, kk: Бизнес-жоспар — толтыруға арналған құрылым}
        text:
          - ru: "Проект: «{project_title}». Если организатор дал свою форму бизнес-плана — заполняйте её; эти разделы помогут ничего не упустить."
            kk: "Бизнес-идея: «{project_title}». Ұйымдастырушы бизнес-жоспардың өз нысанын берсе — соны толтырыңыз; бұл бөлімдер ештеңені жіберіп алмауға көмектеседі."
        check:
          - {ru: "Резюме проекта: цель, продукт, сумма гранта и собственный вклад, срок окупаемости: ____________", kk: "Бизнес-идея түйіндемесі: мақсат, өнім, грант сомасы және өз салымы, өтелу мерзімі: ____________"}
          - {ru: "Продукт или услуга: что продаёте и чем отличаетесь от конкурентов: ____________", kk: "Өнім не қызмет: не сатасыз және бәсекелестерден немен ерекшеленесіз: ____________"}
          - {ru: "Рынок: кто покупатели, спрос в вашем городе (районе), конкуренты и их цены: ____________", kk: "Нарық: сатып алушылар кім, қалаңыздағы (ауданыңыздағы) сұраныс, бәсекелестер және олардың бағалары: ____________"}
          - {ru: "Маркетинг и продажи: каналы, цена, план продаж по месяцам на первый год: ____________", kk: "Маркетинг және сату: арналар, баға, бірінші жылға айлар бойынша сату жоспары: ____________"}
          - {ru: "Производственный план: помещение, оборудование, поставщики, нужные разрешения или уведомления: ____________", kk: "Өндірістік жоспар: үй-жай, жабдық, жеткізушілер, қажетті рұқсаттар не хабарламалар: ____________"}
          - {ru: "Команда и персонал: кто за что отвечает, сколько рабочих мест создаёте ({jobs_planned}): ____________", kk: "Команда және персонал: кім неге жауапты, қанша жұмыс орнын ашасыз ({jobs_planned}): ____________", if: jobs_planned}
          - {ru: "Команда и персонал: кто за что отвечает, нанимаете ли сотрудников: ____________", kk: "Команда және персонал: кім неге жауапты, қызметкер жалдайсыз ба: ____________", unless: jobs_planned}
          - {ru: "Финансовый план: прогноз доходов и расходов, движение денег, точка безубыточности: ____________", kk: "Қаржы жоспары: кірістер мен шығыстар болжамы, ақша қозғалысы, шығынсыздық нүктесі: ____________"}
          - {ru: "Риски и как вы их снижаете: ____________", kk: "Тәуекелдер және оларды қалай азайтасыз: ____________"}
          - {ru: "Эффект проекта: рабочие места, налоги, польза для района — если это учитывается при оценке: ____________", kk: "Бизнес-идеяның әсері: жұмыс орындары, салықтар, аудан үшін пайдасы — бағалауда ескерілсе: ____________"}
      - id: budget
        title: {ru: Смета использования средств гранта, kk: Грант қаражатын пайдалану сметасы}
        text:
          - {ru: "Запрашиваемая сумма гранта: {requested_amount} тенге.", kk: "Сұралатын грант сомасы: {requested_amount} теңге.", if: requested_amount}
          - {ru: "Собственный вклад: {own_contribution} тенге.", kk: "Өз салымы: {own_contribution} теңге.", if: own_contribution}
          - ru: "Указывайте только статьи, на которые по условиям конкурса можно тратить грант; к крупным покупкам приложите коммерческие предложения или прайс-листы, если их требует организатор."
            kk: "Конкурс шарттары бойынша грант жұмсауға болатын баптарды ғана көрсетіңіз; ұйымдастырушы талап етсе, ірі сатып алуларға коммерциялық ұсыныстарды не баға парақтарын қоса беріңіз."
        check:
          - {ru: "Статья расходов — сумма — источник (грант / свои средства) — обоснование: ____________", kk: "Шығыс бабы — сома — көзі (грант / өз қаражаты) — негіздеме: ____________"}
          - {ru: "Статья расходов — сумма — источник (грант / свои средства) — обоснование: ____________", kk: "Шығыс бабы — сома — көзі (грант / өз қаражаты) — негіздеме: ____________"}
          - {ru: "Статья расходов — сумма — источник (грант / свои средства) — обоснование: ____________", kk: "Шығыс бабы — сома — көзі (грант / өз қаражаты) — негіздеме: ____________"}
          - {ru: "Итого: грант ____________ тенге; свои средства ____________ тенге.", kk: "Барлығы: грант ____________ теңге; өз қаражаты ____________ теңге."}
      - id: checklist
        title: {ru: Чек-лист документов, kk: Құжаттар тізімі}
        text:
          - ru: "Окончательный перечень — в объявлении о конкурсе и правилах программы «{programme_name}». Отметьте то, что требует ваш конкурс, и уберите лишнее."
            kk: "Түпкілікті тізбе — конкурс туралы хабарландыруда және «{programme_name}» бағдарламасының қағидаларында. Конкурсыңыз талап ететінін белгілеп, артығын алып тастаңыз."
        check:
