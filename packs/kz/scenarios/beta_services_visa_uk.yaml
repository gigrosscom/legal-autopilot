# БЕТА (EXPERIMENTAL_SCENARIOS=true). Гостевая виза Великобритании (Standard Visitor) — пакет документов.
# Источники — gov.uk (страницы открыты 28.09.2026):
#   - https://www.gov.uk/standard-visitor — до 6 месяцев; «A Standard Visitor visa costs £135 for up to 6 months. The earliest
#     you can apply is 3 months before you travel.»
#   - https://www.gov.uk/standard-visitor/apply-standard-visitor-visa — подача онлайн, запись в визовый центр (биометрия,
#     документы), сведения для анкеты, заверенный перевод документов не на английском/валлийском, решение обычно за 3 недели.
#   - https://www.gov.uk/guidance/immigration-rules/immigration-rules-appendix-visitor-visa-national-list — Kazakhstan в списке
#     VN 1.1 (виза нужна заранее).
id: kz.services.visa_uk
version: 0.1.0
ontology: SERVICES.VISA.UK_STANDARD_VISITOR
jurisdiction: KZ
languages: [ru, kk]
owner: lawyer:kz-01
reviewed_at: null
published: false  # beta: offered only with EXPERIMENTAL_SCENARIOS=true
beta: true
kind: service
title:
  ru: "Виза в Великобританию (Standard Visitor)"
  kk: "Ұлыбритания визасы (Standard Visitor)"
summary:
  ru: Сопроводительное письмо, план поездки, письмо о финансировании (если платит другой человек) и чек-лист по требованиям gov.uk.
  kk: Ілеспе хат, сапар жоспары, қаржыландыру туралы хат (басқа адам төлесе) және gov.uk талаптары бойынша тізім.
disclaimer:
  ru: "Бета. Konsiliér AI — IT-сервис: помогаем подготовить документы по вашим данным и официальным требованиям. Это не юридическая помощь. Решение принимает UK Visas and Immigration; гарантии выдачи визы нет, сбор при отказе не возвращается. Сверьтесь с gov.uk перед подачей."
  kk: "Бета. Konsiliér AI — IT-сервис: сіздің деректеріңіз бен ресми талаптар бойынша құжаттарды дайындауға көмектесеміз. Бұл заң көмегі емес. Шешімді UK Visas and Immigration қабылдайды; виза берілетініне кепілдік жоқ, бас тартылса алым қайтарылмайды. Тапсыру алдында gov.uk сайтымен салыстырыңыз."
sources:
  - {title: {ru: "Standard Visitor visa (gov.uk)", kk: "Standard Visitor visa (gov.uk)"}, url: "https://www.gov.uk/standard-visitor", checked_on: 2026-09-28}
  - {title: {ru: "Как подать на Standard Visitor visa (gov.uk)", kk: "Standard Visitor visa-ға қалай өтініш беру керек (gov.uk)"}, url: "https://www.gov.uk/standard-visitor/apply-standard-visitor-visa", checked_on: 2026-09-28}
  - {title: {ru: "Список стран, гражданам которых нужна виза (Appendix Visitor: Visa national list)", kk: "Азаматтарына виза қажет елдер тізімі (Appendix Visitor: Visa national list)"}, url: "https://www.gov.uk/guidance/immigration-rules/immigration-rules-appendix-visitor-visa-national-list", checked_on: 2026-09-28}
classification:
  keywords:
    ru: [великобритани, британск, в англию, английская виза, uk visa, standard visitor, в лондон, лондон, виза, визу, визы]
    kk: [ұлыбритания, британия визасы, лондон]
  examples:
    ru:
      - Нужна виза в Великобританию, еду в Лондон туристом
      - Какие документы на британскую гостевую визу Standard Visitor
    kk:
      - Ұлыбританияға туристік виза керек
intake:
  - trip_dates: {label: {ru: "Даты поездки", kk: "Сапар күндері"}, question: {ru: "Планируемые даты поездки?", kk: "Жоспарланған сапар күндері?"}}
  - uk_address: {label: {ru: "Где остановитесь", kk: "Қайда тоқтайсыз"}, question: {ru: "Где будете жить в Великобритании (отель, адрес)?", kk: "Ұлыбританияда қайда тұрасыз (қонақүй, мекенжай)?"}}
  - trip_cost: {type: money, currency: KZT, label: {ru: "Примерная стоимость поездки", kk: "Сапардың шамамен құны"}, question: {ru: "Сколько, по вашей оценке, будет стоить поездка, в тенге? (это спрашивают в анкете)", kk: "Сіздің бағалауыңыз бойынша сапар қанша тұрады, теңгемен? (мұны сауалнамада сұрайды)"}}
  - trip_purpose: {type: longtext, label: {ru: "Цель поездки и связь с Казахстаном", kk: "Сапар мақсаты және Қазақстанмен байланыс"}, question: {ru: "Цель поездки, работа или учёба в Казахстане, семья — почему вернётесь. Только правда.", kk: "Сапар мақсаты, Қазақстандағы жұмыс не оқу, отбасы — неге қайтасыз. Тек шындық."}}
  - employer_name: {optional: true, label: {ru: "Работодатель", kk: "Жұмыс беруші"}, question: {ru: "Работодатель: название, адрес и телефон (их спрашивают в анкете)? Нет — «Пропустить».", kk: "Жұмыс беруші: атауы, мекенжайы және телефоны (сауалнамада сұралады)? Жоқ болса — «Өткізу»."}}
  - sponsor_name: {optional: true, label: {ru: "Кто оплачивает поездку (если не вы)", kk: "Сапарды кім төлейді (сіз болмасаңыз)"}, question: {ru: "Поездку оплачивает другой человек? ФИО и адрес. Платите сами — «Пропустить».", kk: "Сапарды басқа адам төлей ме? Аты-жөні және мекенжайы. Өзіңіз төлесеңіз — «Өткізу»."}}
  - applicant_name: {pii: person}
  - passport_number: {pii: id_number, label: {ru: "Номер загранпаспорта", kk: "Шетелдік паспорт нөмірі"}, question: {ru: "Номер загранпаспорта?", kk: "Шетелдік паспорт нөмірі?"}}
  - applicant_address: {pii: address}
  - applicant_phone: {type: phone, pii: phone}
  - applicant_email: {type: email, pii: email, label: {ru: "E-mail", kk: "E-mail"}, question: {ru: "E-mail (на него придёт решение)?", kk: "E-mail (шешім соған келеді)?"}}
parties:
  applicant: {kind: person, name_field: applicant_name, id_field: passport_number, address_field: applicant_address, email_field: applicant_email}
actions:
  - id: visa_package
    title: {ru: Пакет документов на визу Великобритании, kk: Ұлыбритания визасына арналған құжаттар топтамасы}
    template: kz/templates/services/package.docx
    channel: user_submits
    addressee:
      name: {ru: "UK Visas and Immigration (через онлайн-заявку на gov.uk и визовый центр)", kk: "UK Visas and Immigration (gov.uk сайтындағы онлайн өтінім және визалық орталық арқылы)"}
      url: "https://www.gov.uk/standard-visitor/apply-standard-visitor-visa"
    instructions:
      ru:
        - "Подайте заявку онлайн на gov.uk не раньше чем за 3 месяца до поездки и запишитесь в визовый центр."
        - "Документы не на английском — с заверенным переводом. Оплатите сбор при подаче онлайн."
        - "Нажмите «Документ подан» после визита в визовый центр. Гарантии выдачи визы нет."
      kk:
        - "Өтінімді gov.uk сайтында сапарға дейін 3 айдан ерте емес онлайн беріп, визалық орталыққа жазылыңыз."
        - "Ағылшын тілінде емес құжаттар — куәландырылған аудармасымен. Алымды онлайн өтінім бергенде төлеңіз."
        - "Визалық орталыққа барғаннан кейін «Құжат тапсырылды» батырмасын басыңыз. Виза берілетініне кепілдік жоқ."
    package:
      - id: cover_letter
        title: {ru: Сопроводительное письмо, kk: Ілеспе хат}
        signature: true
        text:
          - {ru: "Прошу рассмотреть моё заявление на гостевую визу (Standard Visitor) для поездки в Великобританию: {trip_dates}.", kk: "Ұлыбританияға {trip_dates} сапарына қонақтық визаға (Standard Visitor) өтінішімді қарауыңызды сұраймын."}
          - {ru: "{narrative}", kk: "{narrative}"}
          - {ru: "Проживание: {uk_address}. Ориентировочная стоимость поездки: {trip_cost} тенге.", kk: "Тұру орны: {uk_address}. Сапардың шамамен құны: {trip_cost} теңге."}
          - {ru: "Место работы: {employer_name}.", kk: "Жұмыс орны: {employer_name}.", if: employer_name}
          - {ru: "Расходы оплачивает {sponsor_name}; письмо и подтверждающие документы прилагаются.", kk: "Шығыстарды {sponsor_name} төлейді; хат және растайтын құжаттар қоса беріледі.", if: sponsor_name}
          - {ru: "Расходы на поездку оплачиваю самостоятельно.", kk: "Сапар шығыстарын өзім төлеймін.", unless: sponsor_name}
          - {ru: "Паспорт № {passport_number}. Контакты: {applicant_phone}, {applicant_email}.", kk: "Паспорт № {passport_number}. Байланыс: {applicant_phone}, {applicant_email}."}
          - {ru: "Письмо составлено на русском языке — приложите заверенный перевод на английский (требование gov.uk).", kk: "Хат қазақ тілінде жасалған — ағылшын тіліне куәландырылған аудармасын қоса беріңіз (gov.uk талабы)."}
      - id: trip_plan
        title: {ru: План поездки, kk: Сапар жоспары}
        text:
          - {ru: "Даты: {trip_dates}. Проживание: {uk_address}.", kk: "Күндері: {trip_dates}. Тұру орны: {uk_address}."}
          - {ru: "Цель и программа: {trip_purpose}", kk: "Мақсаты мен бағдарламасы: {trip_purpose}"}
      - id: sponsor_letter
        title: {ru: Письмо о финансировании поездки, kk: Сапарды қаржыландыру туралы хат}
        if: sponsor_name
        signature: true
        text:
          - {ru: "Я, {sponsor_name}, подтверждаю, что оплачиваю расходы {applicant_name} (паспорт № {passport_number}) на поездку в Великобританию ({trip_dates}).", kk: "Мен, {sponsor_name}, {applicant_name} (паспорт № {passport_number}) Ұлыбританияға сапарының ({trip_dates}) шығыстарын төлейтінімді растаймын."}
          - {ru: "Прилагаю подтверждение моих доходов (накоплений).", kk: "Менің табысымды (жинақтарымды) растайтын құжатты қоса беремін."}
      - id: checklist
        title: {ru: Чек-лист (gov.uk), kk: Тізім (gov.uk)}
        check:
          - {ru: "Паспорт, действующий на весь срок пребывания.", kk: "Болатын бүкіл мерзімге жарамды паспорт."}
          - {ru: "Для анкеты: даты поездки, где будете жить, стоимость поездки, домашний адрес и сколько там живёте, имена и даты рождения родителей, годовой доход, сведения о правонарушениях.", kk: "Сауалнама үшін: сапар күндері, қайда тұрасыз, сапар құны, үй мекенжайы және онда қанша уақыт тұрасыз, ата-анаңыздың аты мен туған күндері, жылдық табыс, құқық бұзушылықтар туралы мәліметтер."}
          - {ru: "При необходимости: история поездок за 10 лет, адрес и телефон работодателя ({employer_name}).", kk: "Қажет болса: 10 жылдағы сапарлар тарихы, жұмыс берушінің мекенжайы мен телефоны ({employer_name}).", if: employer_name}
          - {ru: "Имя и адрес того, кто оплачивает поездку ({sponsor_name}).", kk: "Сапарды төлейтін адамның аты мен мекенжайы ({sponsor_name}).", if: sponsor_name}
          - {ru: "Документы, подтверждающие право на визу (цель поездки, средства, связь с Казахстаном) — в визовый центр.", kk: "Визаға құқықты растайтын құжаттар (сапар мақсаты, қаражат, Қазақстанмен байланыс) — визалық орталыққа."}
          - {ru: "Заверенные переводы всех документов не на английском или валлийском языке.", kk: "Ағылшын немесе уэльс тілінде емес барлық құжаттардың куәландырылған аудармалары."}
      - id: how_to_submit
        title: {ru: Где и как подать, kk: Қайда және қалай тапсыру керек}
        check:
          - {ru: "Гражданам Казахстана виза нужна заранее (Казахстан в списке Appendix Visitor: Visa national list).", kk: "Қазақстан азаматтарына виза алдын ала керек (Қазақстан Appendix Visitor: Visa national list тізімінде)."}
          - {ru: "Заявка — онлайн на gov.uk, не раньше чем за 3 месяца до поездки; затем запись в визовый центр: паспорт, отпечатки пальцев и фото, документы.", kk: "Өтінім — gov.uk сайтында онлайн, сапарға дейін 3 айдан ерте емес; содан кейін визалық орталыққа жазылу: паспорт, саусақ іздері мен фото, құжаттар."}
          - {ru: "Сбор: £135 за визу до 6 месяцев (gov.uk, проверено 28.09.2026); долгосрочные визы дороже — см. gov.uk. При отказе сбор не возвращается.", kk: "Алым: 6 айға дейінгі визаға £135 (gov.uk, 28.09.2026 тексерілді); ұзақ мерзімді визалар қымбатырақ — gov.uk қараңыз. Бас тартылса алым қайтарылмайды."}
          - {ru: "Решение обычно — в течение 3 недель после визита в визовый центр; придёт на e-mail.", kk: "Шешім әдетте визалық орталыққа барғаннан кейін 3 апта ішінде; e-mail-ге келеді."}
pricing: {model: fixed, amount: 2990, currency: KZT}
