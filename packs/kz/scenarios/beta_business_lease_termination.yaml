# БЕТА (EXPERIMENTAL_SCENARIOS=true). Для бизнеса: расторжение договора аренды коммерческого помещения и возврат
# обеспечительного платежа (арендатор — ИП/ТОО).
# Нормы проверены 28.09.2026 по официальному тексту ИПС «Әділет» (old.adilet.zan.kz):
#   ГК РК (Общая часть) — https://adilet.zan.kz/rus/docs/K940001000_
#     ст. 338-5, 338-6 п. 2 (обеспечительная плата возвращается, если обстоятельства не наступили или обязательство
#     прекратилось, если договором не предусмотрено иное), ст. 401 (расторжение по соглашению или по решению суда),
#     ст. 402 п. 2 (в суд — только после отказа или без ответа в срок из предложения / договора, а при его отсутствии —
#     в тридцатидневный срок).
#   ГК РК (Особенная часть) — https://adilet.zan.kz/rus/docs/K990000409_
#     ст. 545 п. 2 (договор без срока — отказ с предупреждением за три месяца при найме недвижимости), ст. 556 п. 3
#     (основания досрочного расторжения по требованию нанимателя).
# TODO(lawyer): договоры аренды нежилых помещений с госрегистрацией, удержания из обеспечительного платежа.
id: kz.business.lease_termination
version: 0.1.0
ontology: BUSINESS.LEASE.COMMERCIAL_TERMINATION
jurisdiction: KZ
languages: [ru, kk]
owner: lawyer:kz-01
reviewed_at: null
published: true
beta: true
kind: dispute
title:
  ru: "Для бизнеса: расторжение аренды помещения и возврат обеспечительного платежа"
  kk: "Бизнес үшін: үй-жай жалдауды бұзу және кепілдік төлемді қайтару"
summary:
  ru: Арендатор-компания хочет расторгнуть договор аренды офиса, склада или магазина и вернуть обеспечительный платёж — предложение о расторжении и требование о возврате, затем юрист.
  kk: Жалға алушы компания кеңсе, қойма не дүкен жалдау шартын бұзып, кепілдік төлемді қайтарғысы келеді — шартты бұзу туралы ұсыныс және қайтару талабы, содан кейін заңгер.
disclaimer:
  ru: "Бета. Konsiliér AI — IT-сервис подготовки документов, не юридическая помощь. Результат не гарантируется."
  kk: "Бета. Konsiliér AI — құжаттарды дайындайтын IT-сервис, заң көмегі емес. Нәтижеге кепілдік берілмейді."
classification:
  keywords:
    ru: [обеспечительн, обеспечительный платёж, обеспечительный платеж, гарантийн, гарантийный взнос, помещени, коммерческ, расторжения договора аренды, аренды офиса, аренду офиса, аренды помещения, аренду помещения, аренды склада, аренды магазина, нежилого помещения, расторгнуть договор аренды, расторжение договора аренды]
    kk: [кепілдік төлем, кеңсені жалдау, үй-жайды жалдау]
  examples:
    ru:
      - Хотим расторгнуть договор аренды офиса и вернуть обеспечительный платёж
      - Арендодатель не возвращает гарантийный взнос за коммерческое помещение после расторжения договора аренды
    kk:
      - Кеңсені жалдау шартын бұзып, кепілдік төлемді қайтарғымыз келеді
claim:
  type: lease_deposit
  amount_field: amount
intake:
  - respondent_name: {label: {ru: "Арендодатель", kk: "Жалға беруші"}, question: {ru: "Арендодатель: наименование компании или ФИО?", kk: "Жалға беруші: компания атауы немесе аты-жөні?"}}
  - respondent_bin: {optional: true, pattern: '^\d{12}$', label: {ru: "БИН/ИИН арендодателя", kk: "Жалға берушінің БСН/ЖСН"}, question: {ru: "БИН или ИИН арендодателя — или «Пропустить».", kk: "Жалға берушінің БСН не ЖСН — немесе «Өткізу»."}}
  - contract_number: {label: {ru: "Номер договора аренды", kk: "Жалдау шартының нөмірі"}, question: {ru: "Номер договора аренды?", kk: "Жалдау шартының нөмірі?"}}
  - contract_date: {type: date, label: {ru: "Дата договора", kk: "Шарт күні"}, question: {ru: "Дата договора (ДД.ММ.ГГГГ)?", kk: "Шарт күні (КК.АА.ЖЖЖЖ)?"}}
  - premises_address: {label: {ru: "Адрес помещения", kk: "Үй-жайдың мекенжайы"}, question: {ru: "Адрес арендуемого помещения?", kk: "Жалға алынған үй-жайдың мекенжайы?"}}
  - termination_date: {label: {ru: "С какой даты расторгнуть", kk: "Қай күннен бастап бұзу"}, question: {ru: "С какой даты хотите расторгнуть договор (дата или «по соглашению сторон»)?", kk: "Шартты қай күннен бастап бұзғыңыз келеді (күні немесе «тараптардың келісімі бойынша»)?"}}
  - amount: {type: money, currency: KZT, label: {ru: "Обеспечительный платёж", kk: "Кепілдік төлем"}, question: {ru: "Сумма обеспечительного (гарантийного) платежа, в тенге?", kk: "Кепілдік төлемнің сомасы, теңгемен?"}}
  - problem_description: {type: longtext}
  - applicant_name: {pii: person, label: {ru: "Ваша компания (ТОО или ИП)", kk: "Сіздің компанияңыз (ЖШС немесе ЖК)"}, question: {ru: "Полное наименование вашей компании (арендатора)?", kk: "Компанияңыздың (жалға алушының) толық атауы?"}}
  - applicant_bin: {pii: id_number, pattern: '^\d{12}$', label: {ru: "БИН/ИИН", kk: "БСН/ЖСН"}, question: {ru: "БИН вашей компании (или ИИН для ИП) — 12 цифр?", kk: "Компанияңыздың БСН-і (ЖК үшін ЖСН) — 12 цифр?"}}
  - representative: {pii: person, label: {ru: "Кто подписывает", kk: "Кім қол қояды"}, question: {ru: "ФИО и должность того, кто подписывает?", kk: "Қол қоятын адамның аты-жөні және лауазымы?"}}
  - applicant_address: {pii: address, label: {ru: "Юридический адрес", kk: "Заңды мекенжай"}, question: {ru: "Юридический адрес вашей компании?", kk: "Компанияңыздың заңды мекенжайы?"}}
  - applicant_phone: {type: phone, pii: phone}
  - evidence: [business_contract, bank_statement, correspondence, photo]
parties:
  applicant: {kind: business, name_field: applicant_name, id_field: applicant_bin, address_field: applicant_address}
  respondent: {kind: business, name_field: respondent_name, id_field: respondent_bin}
actions:
  - id: termination_notice
    title: {ru: Предложение о расторжении договора аренды и возврате обеспечительного платежа, kk: Жалдау шартын бұзу және кепілдік төлемді қайтару туралы ұсыныс}
    template: kz/templates/business/claim_b2b.docx
    channel: user_submits
    addressee: {party: respondent}
    deadline: {calendar_days: 30, norm_ref: "Гражданский кодекс Республики Казахстан (Общая часть), статья 402"}
    norm_refs:
      - "Гражданский кодекс Республики Казахстан (Общая часть), статья 401"
      - "Гражданский кодекс Республики Казахстан (Общая часть), статья 402"
      - "Гражданский кодекс Республики Казахстан (Общая часть), статья 338-6"
      - "Гражданский кодекс Республики Казахстан (Особенная часть), статья 556"
    demands:
      ru: "1) расторгнуть договор аренды № {contract_number} от {contract_date} (помещение: {premises_address}) с {termination_date}; 2) вернуть обеспечительный платёж {amount} {currency}, если договором не предусмотрено иное; 3) дать письменный ответ в течение 30 дней."
      kk: "1) {contract_date} № {contract_number} жалдау шартын (үй-жай: {premises_address}) {termination_date} бастап бұзу; 2) шартта өзгеше көзделмесе, {amount} {currency} кепілдік төлемді қайтару; 3) 30 күн ішінде жазбаша жауап беру."
    instructions:
      ru:
        - "Сверьте с договором: срок уведомления о расторжении, основания досрочного расторжения и условия возврата обеспечительного платежа. Для договора без срока — предупреждение за три месяца (ст. 545 п. 2 ГК)."
        - "Отправьте предложение способом из договора и сохраните подтверждение; составьте акт возврата помещения."
        - "Нажмите «Документ подан». Суд — только после отказа или без ответа в течение {deadline_days} дней (ст. 402 п. 2 ГК); тогда передадим дело юристу."
      kk:
        - "Шартпен салыстырыңыз: бұзу туралы хабарлау мерзімі, мерзімінен бұрын бұзу негіздері және кепілдік төлемді қайтару шарттары. Мерзімсіз шарт үшін — үш ай бұрын ескерту (АК 545-бабының 2-тармағы)."
        - "Ұсынысты шартта көрсетілген тәсілмен жіберіп, растауын сақтаңыз; үй-жайды қайтару актісін жасаңыз."
        - "«Құжат тапсырылды» батырмасын басыңыз. Сотқа — бас тартқаннан кейін немесе {deadline_days} күн ішінде жауап болмаса ғана (АК 402-бабының 2-тармағы); сонда істі заңгерге береміз."
  - id: handoff_lawyer
    kind: handoff
    when: termination_notice.response in [none, refusal, partial]
    title: {ru: Передача дела юристу (иск), kk: Істі заңгерге беру (талап қою)}
pricing: {model: fixed, amount: 1990, currency: KZT}
