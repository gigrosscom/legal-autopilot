# Опубликован 28.09.2026 по решению владельца. reviewed_at: null → на каждом документе нейтральная пометка compliance.draft_disclaimer.
# Только ДТП без пострадавших (вред имуществу). Вред здоровью или жизни → юрист (TODO(lawyer)).
# Нормы проверены 28.09.2026 по официальному тексту ИПС «Әділет» (страница акта открыта, номер статьи — как в тексте):
#   - Закон РК «Об обязательном страховании гражданско-правовой ответственности владельцев транспортных средств» —
#     https://adilet.zan.kz/rus/docs/Z030000446_
#     ст. 25 (требование о страховой выплате, документы; ВНИМАНИЕ: примечание ИЗПИ — в п. 1 предусмотрены изменения
#     Законом РК от 23.07.2026 № 352-VIII, вводятся через 60 календарных дней после опубликования — перепроверить);
#     ст. 26, п. 1 (страховая выплата — в течение пятнадцати рабочих дней со дня получения документов по ст. 25),
#     п. 4 (неустойка при несвоевременной выплате).
#   - ГК РК (Особенная часть), ст. 924 (застраховавший ответственность возмещает разницу между страховой суммой и
#     фактическим ущербом) — https://adilet.zan.kz/rus/docs/K990000409_
# TODO(lawyer): норма для жалобы в АРРФР; оценка ущерба; европротокол.
#   - АППК РК, ст. 63 (реквизиты обращения: ФИО, ИИН, почтовый адрес заявителя; наименование органа; суть; дата; подпись),
#     ст. 76, ч. 1 (обращение рассматривается 15 рабочих дней со дня регистрации, если иное не предусмотрено законами) —
#     https://adilet.zan.kz/rus/docs/K2000000350, открыт 28.09.2026 (срок жалобы в госорган — deadline по ст. 76).
id: kz.civil.road_accident
version: 0.1.0
ontology: CIVIL.DAMAGES.ROAD_ACCIDENT
taxonomy: civil.damages
jurisdiction: KZ
languages: [ru, kk]
owner: lawyer:kz-01
reviewed_at: null
published: true
title:
  ru: ДТП без пострадавших — страховая выплата
  kk: Зардап шеккендері жоқ жол-көлік оқиғасы — сақтандыру төлемі
summary:
  ru: В ДТП без пострадавших повредили вашу машину. Виновник застрахован, а его страховая компания не платит, тянет или занижает выплату; или ущерб больше страховой суммы.
  kk: Зардап шеккендері жоқ жол-көлік оқиғасында көлігіңіз зақымдалды. Кінәлі сақтандырылған, бірақ оның сақтандыру компаниясы төлемейді, созады не төлемді азайтады; не залал сақтандыру сомасынан көп.
classification:
  keywords:
    ru: [дтп, авари, врезался, въехал в меня, въехали в мою машину, виновник, страховая не платит, страховая выплата, огпо, поцарапал машину]
    kk: [жол-көлік оқиғасы, апат, кінәлі, сақтандыру төлемі, көлікті соқты]
  examples:
    ru:
      - Попал в ДТП, виновник признал вину, а его страховая месяц не платит
      - В меня въехали на парковке, страховая насчитала копейки
    kk:
      - Жол апатына түстім, кінәлінің сақтандыру компаниясы төлемейді
claim:
  type: damages
  amount_field: amount
intake:
  - respondent_name: {label: {ru: Страховая компания виновника, kk: Кінәлінің сақтандыру компаниясы}, question: {ru: "В какой страховой компании застрахован виновник ДТП?", kk: "Жол-көлік оқиғасының кінәлісі қай сақтандыру компаниясында сақтандырылған?"}}
  - respondent_bin: {optional: true, pattern: '^\d{12}$'}
  - respondent_address: {optional: true}
  - event_date: {type: date, label: {ru: Дата ДТП, kk: Оқиға күні}, question: {ru: "Когда произошло ДТП? (ДД.ММ.ГГГГ)", kk: "Жол-көлік оқиғасы қашан болды? (КК.АА.ЖЖЖЖ)"}}
  - amount: {type: money, currency: KZT, question: {ru: "Какой ущерб по оценке или смете ремонта, в тенге?", kk: "Бағалау не жөндеу сметасы бойынша залал қанша, теңгемен?"}}
  - problem_description: {type: longtext}
  - applicant_name: {pii: person}
  - applicant_iin: {optional: true, pii: id_number, pattern: '^\d{12}$'}
  - applicant_address: {pii: address}
  - applicant_phone: {type: phone, pii: phone}
  - evidence: [accident_docs, insurance_policy, photo, correspondence]
parties:
  applicant: {kind: person, name_field: applicant_name, id_field: applicant_iin, address_field: applicant_address}
  respondent: {kind: business, name_field: respondent_name, id_field: respondent_bin, address_field: respondent_address}
actions:
  - id: statement_to_insurer
    title: {ru: Заявление в страховую компанию о страховой выплате, kk: Сақтандыру компаниясына сақтандыру төлемі туралы арыз}
    template: kz/templates/generic/statement.docx
    channel: user_submits
    addressee: {party: respondent}
    deadline: {business_days: 15, norm_ref: "Закон Республики Казахстан «Об обязательном страховании гражданско-правовой ответственности владельцев транспортных средств», статья 26"}
    norm_refs:
      - "Закон Республики Казахстан «Об обязательном страховании гражданско-правовой ответственности владельцев транспортных средств», статья 25"
      - "Закон Республики Казахстан «Об обязательном страховании гражданско-правовой ответственности владельцев транспортных средств», статья 26"
    demands:
      ru: "осуществить страховую выплату в возмещение вреда, причинённого моему имуществу в результате ДТП, в размере {amount} {currency} в установленный законом срок; выдать мне справку с перечнем принятых документов и датой их принятия; о принятом решении сообщить письменно."
    instructions:
      ru:
        - "Подайте заявление в офис страховой компании виновника или через её сайт и приложите документы о ДТП, оценку ущерба, копию удостоверения личности и реквизиты для выплаты."
        - "Страховщик обязан выдать справку с перечнем принятых документов и датой — возьмите её: срок выплаты считается со дня получения документов."
        - "Нажмите «Документ подан». Выплата — в течение {deadline_days} рабочих дней со дня получения документов; мы напомним."
      kk:
        - "Арызды кінәлінің сақтандыру компаниясының кеңсесіне не сайты арқылы беріп, оқиға туралы құжаттарды, залал бағалауын, жеке куәліктің көшірмесін және төлем деректемелерін тіркеңіз."
        - "Сақтандырушы қабылданған құжаттар тізбесі мен күні көрсетілген анықтама беруге міндетті — оны алыңыз: төлем мерзімі құжаттар алынған күннен бастап есептеледі."
        - "«Құжат тапсырылды» батырмасын басыңыз. Төлем — құжаттар алынған күннен бастап {deadline_days} жұмыс күні ішінде; біз еске саламыз."
  - id: complaint_arrf
    when: statement_to_insurer.response in [none, refusal, partial]
    title: {ru: Жалоба в АРРФР на страховую компанию, kk: Сақтандыру компаниясының әрекеттеріне ҚНРДА-ға шағым}
    template: kz/templates/generic/complaint.docx
    channel: user_submits
    addressee: {authority: arrf}
    deadline: {business_days: 15, norm_ref: "Административный процедурно-процессуальный кодекс Республики Казахстан, статья 76"}
    norm_refs:
      - "Закон Республики Казахстан «Об обязательном страховании гражданско-правовой ответственности владельцев транспортных средств», статья 26"
    demands:
      ru: "провести проверку действий страховой организации при рассмотрении моего требования о страховой выплате, принять меры реагирования, о результатах сообщить мне."
    instructions:
      ru:
        - "Зайдите на {submit_url} (ЭЦП или SMS-код) и выберите получателя — {addressee}."
        - "Приложите заявление страховщику, справку о принятых документах, ответ страховой (если был) и документы о ДТП."
        - "Сохраните регистрационный номер и нажмите «Документ подан»."
      kk:
        - "{submit_url} сайтына кіріңіз (ЭЦҚ не SMS-код) және алушыны таңдаңыз — {addressee}."
        - "Сақтандырушыға берілген арызды, қабылданған құжаттар туралы анықтаманы, сақтандыру компаниясының жауабын (болса) және оқиға құжаттарын тіркеңіз."
        - "Тіркеу нөмірін сақтап, «Құжат тапсырылды» батырмасын басыңыз."
  - id: handoff_lawyer
    kind: handoff
    when: complaint_arrf.response in [none, refusal, partial]
    title: {ru: Передача дела юристу (иск к страховой или виновнику), kk: Істі заңгерге беру (сақтандыру компаниясына не кінәліге талап қою)}
pricing: {model: fixed, amount: 2990, currency: KZT}
