# Опубликован 28.09.2026 по решению владельца. reviewed_at: null → на каждом документе нейтральная пометка compliance.draft_disclaimer.
# Нормы проверены 28.09.2026 по официальному тексту ИПС «Әділет» (страница акта открыта, номер статьи — как в тексте):
#   - Закон РК «О защите прав потребителей» — https://adilet.zan.kz/rus/docs/Z100000274_
#     ст. 35 (права потребителя при недостатках работы/услуги; п. 4 — устранение недостатков в течение десяти
#     календарных дней, если иной срок не установлен договором), ст. 42-4 (ответ на претензию — 10 календарных дней),
#     ст. 42-5 (обращение в госорган).
# TODO(lawyer): неустойка по ст. 35 п. 5 — добавлять ли расчёт в требование (формула только в YAML); орган и канал подачи.
#   - АППК РК, ст. 63 (реквизиты обращения: ФИО, ИИН, почтовый адрес заявителя; наименование органа; суть; дата; подпись),
#     ст. 76, ч. 1 (обращение рассматривается 15 рабочих дней со дня регистрации, если иное не предусмотрено законами) —
#     https://adilet.zan.kz/rus/docs/K2000000350, открыт 28.09.2026 (срок жалобы в госорган — deadline по ст. 76).
id: kz.consumer.poor_service
version: 0.1.0
ontology: CONSUMER.SERVICE.POOR_QUALITY
taxonomy: consumer.poor_service
jurisdiction: KZ
languages: [ru, kk]
owner: lawyer:kz-01
reviewed_at: null
published: true
title:
  ru: Некачественный ремонт или услуга
  kk: Сапасыз жөндеу не қызмет
summary:
  ru: Вам плохо сделали ремонт (техники, авто, квартиры) или оказали платную услугу с недостатками, и исполнитель отказывается исправить или вернуть деньги.
  kk: Сізге жөндеуді (техника, көлік, пәтер) сапасыз жасады не ақылы қызметті кемшілікпен көрсетті, орындаушы түзетуден не ақшаны қайтарудан бас тартады.
classification:
  keywords:
    ru: [ремонт, отремонтир, химчистк, ателье, автосервис, сервисный центр, плохо сделали, некачественно сделали, мастер, исполнитель]
    kk: [жөндеу, жөндеді, шебер, орындаушы, сапасыз жасады]
  examples:
    ru:
      - Сделали ремонт в ванной, через месяц плитка отвалилась, мастер не отвечает
      - Отдал машину в автосервис, после ремонта стало хуже, деньги не возвращают
    kk:
      - Автосервис көлікті жөндегеннен кейін нашарлап кетті, ақшаны қайтармайды
claim:
  type: refund
  amount_field: amount
intake:
  - respondent_name: {label: {ru: Исполнитель, kk: Орындаушы}, question: {ru: "Кто делал ремонт или оказывал услугу? Название организации или ФИО мастера.", kk: "Жөндеуді не қызметті кім жасады? Ұйымның атауы не шебердің аты-жөні."}}
  - respondent_bin: {optional: true, pattern: '^\d{12}$'}
  - respondent_address
  - event_date: {type: date, label: {ru: Дата работы, kk: Жұмыс күні}, question: {ru: "Когда приняли работу или оказали услугу? (ДД.ММ.ГГГГ)", kk: "Жұмысты қашан қабылдадыңыз не қызмет қашан көрсетілді? (КК.АА.ЖЖЖЖ)"}}
  - amount: {type: money, currency: KZT, question: {ru: "Сколько вы заплатили за работу или услугу, в тенге?", kk: "Жұмыс не қызмет үшін қанша төледіңіз, теңгемен?"}}
  - problem_description: {type: longtext}
  - applicant_name: {pii: person}
  - applicant_iin: {optional: true, pii: id_number, pattern: '^\d{12}$'}
  - applicant_address: {pii: address}
  - applicant_phone: {type: phone, pii: phone}
  - evidence: [receipt, service_contract, photo, correspondence]
parties:
  applicant: {kind: person, name_field: applicant_name, id_field: applicant_iin, address_field: applicant_address}
  respondent: {kind: business, name_field: respondent_name, id_field: respondent_bin, address_field: respondent_address}
actions:
  - id: claim_to_contractor
    title: {ru: Претензия исполнителю о недостатках работы или услуги, kk: Орындаушыға жұмыстың не қызметтің кемшіліктері туралы наразылық}
    template: kz/templates/generic/claim_letter.docx
    channel: user_submits
    addressee: {party: respondent}
    deadline: {calendar_days: 10, norm_ref: "Закон Республики Казахстан «О защите прав потребителей», статья 42-4"}
    norm_refs:
      - "Закон Республики Казахстан «О защите прав потребителей», статья 35"
      - "Закон Республики Казахстан «О защите прав потребителей», статья 42-4"
    demands:
      ru: "безвозмездно устранить недостатки выполненной работы (оказанной услуги), а если это невозможно — вернуть уплаченную сумму {amount} {currency} либо соразмерно уменьшить цену; о принятом решении сообщить мне письменно."
    instructions:
      ru:
        - "Распечатайте претензию в двух экземплярах и подпишите оба."
        - "Вручите один экземпляр исполнителю ({addressee}) и попросите отметку о принятии на втором, либо отправьте заказным письмом с уведомлением о вручении."
        - "Сфотографируйте недостатки до того, как их кто-то исправит."
        - "Нажмите «Документ подан». Исполнитель должен ответить в течение {deadline_days} календарных дней со дня получения претензии — мы напомним."
      kk:
        - "Наразылықты екі данада басып шығарып, екеуіне де қол қойыңыз."
        - "Бір данасын орындаушыға ({addressee}) беріп, екіншісіне қабылдағаны туралы белгі сұраңыз, не табыс етілгені туралы хабарламасы бар тапсырыс хатпен жіберіңіз."
        - "Кемшіліктерді біреу түзетпес бұрын суретке түсіріп алыңыз."
        - "«Құжат тапсырылды» батырмасын басыңыз. Орындаушы наразылықты алған күннен бастап {deadline_days} күнтізбелік күн ішінде жауап беруге тиіс — біз еске саламыз."
  - id: complaint_consumer_authority
    when: claim_to_contractor.response in [none, refusal, partial]
    title: {ru: Жалоба в орган по защите прав потребителей, kk: Тұтынушылардың құқықтарын қорғау органына шағым}
    template: kz/templates/generic/complaint.docx
    channel: user_submits
    addressee: {authority: consumer_protection}
    deadline: {business_days: 15, norm_ref: "Административный процедурно-процессуальный кодекс Республики Казахстан, статья 76"}
    norm_refs:
      - "Закон Республики Казахстан «О защите прав потребителей», статья 42-5"
    demands:
      ru: "рассмотреть мою жалобу на исполнителя, принять меры для устранения недостатков работы (услуги) или возврата мне уплаченной суммы, о результатах сообщить мне."
    instructions:
      ru:
        - "Обратиться в госорган можно не позднее двух месяцев с момента претензии исполнителю."
        - "Подайте жалобу через {submit_url} (вход по ЭЦП или SMS-код), получатель — {addressee}. Точный канал подачи уточнит юрист."
        - "Приложите претензию, ответ исполнителя (если был), договор или чек и фото недостатков."
        - "Сохраните регистрационный номер и нажмите «Документ подан»."
      kk:
        - "Мемлекеттік органға орындаушыға наразылық берген сәттен бастап екі айдан кешіктірмей жүгінуге болады."
        - "Шағымды {submit_url} арқылы беріңіз (ЭЦҚ не SMS-код), алушы — {addressee}. Нақты беру арнасын заңгер нақтылайды."
        - "Наразылықты, орындаушының жауабын (болса), шартты не чекті және кемшіліктердің фотосын тіркеңіз."
        - "Тіркеу нөмірін сақтап, «Құжат тапсырылды» батырмасын басыңыз."
  - id: handoff_lawyer
    kind: handoff
    when: complaint_consumer_authority.response in [none, refusal, partial]
    title: {ru: Передача дела юристу (иск в суд), kk: Істі заңгерге беру (сотқа талап қою)}
pricing: {model: fixed, amount: 2990, currency: KZT}
