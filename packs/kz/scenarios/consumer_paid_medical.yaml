# Опубликован 28.09.2026 по решению владельца. reviewed_at: null → на каждом документе нейтральная пометка compliance.draft_disclaimer.
# Только платные медицинские услуги и возврат денег/устранение недостатков. Вред здоровью → сразу юрист (TODO(lawyer)).
# Нормы проверены 28.09.2026 по официальному тексту ИПС «Әділет» (страница акта открыта, номер статьи — как в тексте):
#   - ГК РК (Особенная часть), ст. 683, п. 2 (правила о возмездном оказании услуг применяются к медицинским услугам) —
#     https://adilet.zan.kz/rus/docs/K990000409_
#   - Кодекс РК «О здоровье народа и системе здравоохранения», ст. 202 (платные медицинские услуги — на договорной
#     основе) — https://adilet.zan.kz/rus/docs/K2000000360
#   - Закон РК «О защите прав потребителей», ст. 35, ст. 42-4 (ответ — 10 календарных дней), ст. 42-5 —
#     https://adilet.zan.kz/rus/docs/Z100000274_
# TODO(lawyer): адресат жалобы (орган контроля качества медицинских услуг или орган по защите прав потребителей).
#   - АППК РК, ст. 63 (реквизиты обращения: ФИО, ИИН, почтовый адрес заявителя; наименование органа; суть; дата; подпись),
#     ст. 76, ч. 1 (обращение рассматривается 15 рабочих дней со дня регистрации, если иное не предусмотрено законами) —
#     https://adilet.zan.kz/rus/docs/K2000000350, открыт 28.09.2026 (срок жалобы в госорган — deadline по ст. 76).
id: kz.consumer.paid_medical
version: 0.1.0
ontology: CONSUMER.SERVICE.PAID_MEDICAL
taxonomy: consumer.poor_service
jurisdiction: KZ
languages: [ru, kk]
owner: lawyer:kz-01
reviewed_at: null
published: true
title:
  ru: Жалоба на платную медицинскую услугу
  kk: Ақылы медициналық қызметке шағым
summary:
  ru: Платная клиника (стоматология, косметология, диагностика) оказала услугу плохо или не полностью, и вы хотите вернуть деньги или бесплатного исправления. Если пострадало здоровье — дело передаётся юристу.
  kk: Ақылы клиника (стоматология, косметология, диагностика) қызметті сапасыз не толық емес көрсетті, сіз ақшаны қайтаруды не тегін түзетуді қалайсыз. Денсаулыққа зиян келсе — іс заңгерге беріледі.
classification:
  keywords:
    ru: [клиник, стоматолог, зуб, коронк, имплант, косметолог, медцентр, медицинский центр, платн медицин, врач, лечени]
    kk: [клиника, стоматолог, тіс емдеу, дәрігер, емдеу]
  examples:
    ru:
      - Поставили коронку в платной стоматологии, через две недели выпала, деньги возвращать отказываются
    kk:
      - Ақылы стоматологияда тіс коронкасы екі аптадан кейін түсіп қалды, ақшаны қайтармайды
claim:
  type: refund
  amount_field: amount
intake:
  - respondent_name: {label: {ru: Клиника, kk: Клиника}, question: {ru: "Как называется клиника или медицинский центр?", kk: "Клиниканың не медициналық орталықтың атауы қандай?"}}
  - respondent_bin: {optional: true, pattern: '^\d{12}$'}
  - respondent_address
  - event_date: {type: date, label: {ru: Дата услуги, kk: Қызмет күні}, question: {ru: "Когда оказали услугу? (ДД.ММ.ГГГГ)", kk: "Қызмет қашан көрсетілді? (КК.АА.ЖЖЖЖ)"}}
  - amount: {type: money, currency: KZT, question: {ru: "Сколько вы заплатили, в тенге?", kk: "Қанша төледіңіз, теңгемен?"}}
  - problem_description: {type: longtext}
  - applicant_name: {pii: person}
  - applicant_iin: {optional: true, pii: id_number, pattern: '^\d{12}$'}
  - applicant_address: {pii: address}
  - applicant_phone: {type: phone, pii: phone}
  - evidence: [receipt, service_contract, medical_documents, correspondence]
parties:
  applicant: {kind: person, name_field: applicant_name, id_field: applicant_iin, address_field: applicant_address}
  respondent: {kind: business, name_field: respondent_name, id_field: respondent_bin, address_field: respondent_address}
actions:
  - id: claim_to_clinic
    title: {ru: Претензия клинике, kk: Клиникаға наразылық}
    template: kz/templates/generic/claim_letter.docx
    channel: user_submits
    addressee: {party: respondent}
    deadline: {calendar_days: 10, norm_ref: "Закон Республики Казахстан «О защите прав потребителей», статья 42-4"}
    norm_refs:
      - "Гражданский кодекс Республики Казахстан (Особенная часть), статья 683"
      - "Кодекс Республики Казахстан «О здоровье народа и системе здравоохранения», статья 202"
      - "Закон Республики Казахстан «О защите прав потребителей», статья 35"
    demands:
      ru: "безвозмездно устранить недостатки оказанной платной медицинской услуги либо вернуть уплаченную сумму {amount} {currency}; выдать мне копии медицинских документов по оказанной услуге; о принятом решении сообщить письменно."
    instructions:
      ru:
        - "Если после услуги ухудшилось здоровье — сначала обратитесь к врачу; при угрозе жизни звоните 103 или 112."
        - "Распечатайте претензию в двух экземплярах, вручите один в регистратуру или администрации клиники ({addressee}) и попросите отметку о принятии на втором."
        - "Нажмите «Документ подан». Срок ответа — {deadline_days} календарных дней со дня получения претензии; мы напомним."
      kk:
        - "Қызметтен кейін денсаулығыңыз нашарласа — алдымен дәрігерге қаралыңыз; өмірге қауіп төнсе, 103 не 112 нөміріне қоңырау шалыңыз."
        - "Наразылықты екі данада басып шығарып, бірін клиниканың тіркеу бөліміне не әкімшілігіне ({addressee}) беріңіз де, екіншісіне қабылдау белгісін сұраңыз."
        - "«Құжат тапсырылды» батырмасын басыңыз. Жауап мерзімі — наразылық алынған күннен бастап {deadline_days} күнтізбелік күн; біз еске саламыз."
  - id: complaint_consumer_authority
    when: claim_to_clinic.response in [none, refusal, partial]
    title: {ru: Жалоба в уполномоченный орган, kk: Уәкілетті органға шағым}
    template: kz/templates/generic/complaint.docx
    channel: user_submits
    addressee: {authority: consumer_protection}
    deadline: {business_days: 15, norm_ref: "Административный процедурно-процессуальный кодекс Республики Казахстан, статья 76"}
    norm_refs:
      - "Закон Республики Казахстан «О защите прав потребителей», статья 42-5"
    demands:
      ru: "рассмотреть мою жалобу на качество платной медицинской услуги, принять меры для устранения недостатков или возврата мне уплаченной суммы, о результатах сообщить мне."
    instructions:
      ru:
        - "Подайте жалобу через {submit_url} (вход по ЭЦП или SMS-код), получатель — {addressee}. Точный орган и канал подачи уточнит юрист."
        - "Приложите договор или чек, претензию и ответ клиники (если был)."
        - "Сохраните регистрационный номер и нажмите «Документ подан»."
      kk:
        - "Шағымды {submit_url} арқылы беріңіз (ЭЦҚ не SMS-код), алушы — {addressee}. Нақты орган мен беру арнасын заңгер нақтылайды."
        - "Шартты не чекті, наразылықты және клиниканың жауабын (болса) тіркеңіз."
        - "Тіркеу нөмірін сақтап, «Құжат тапсырылды» батырмасын басыңыз."
  - id: handoff_lawyer
    kind: handoff
    when: complaint_consumer_authority.response in [none, refusal, partial]
    title: {ru: Передача дела юристу, kk: Істі заңгерге беру}
pricing: {model: fixed, amount: 2990, currency: KZT}
