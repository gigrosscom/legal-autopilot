# БЕТА (EXPERIMENTAL_SCENARIOS=true). Туристическая шенгенская виза в Германию для жителей Казахстана — пакет документов.
# Все требования — с официального сайта представительств Германии в Казахстане (страницы открыты 28.09.2026):
#   - «Шенгенская виза» (шаги, запись в TLS, 6 месяцев / 15 дней, 15 календарных дней рассмотрения, округа Астана/Алматы) —
#     https://kasachstan.diplo.de/kz-ru/service/2066314-2066314
#   - Памятка «Туристическая виза» (перечень документов, страховка от 30 000 евро, банковская справка не старше двух недель
#     + выписки за три месяца, справка с работы, для ИП/учредителей ТОО — справки egov и налоговые документы) —
#     https://kasachstan.diplo.de/kz-ru/service/2723336-2723336
#   - «Визовые сборы» (90 евро с 11.06.2024; дети 6–12 лет — 45 евро; до 6 лет — бесплатно) —
#     https://kasachstan.diplo.de/kz-ru/service/2723326-2723326
#   - Частые вопросы (оплата в тенге; сбор не возвращается при отказе; «гарантии, что виза будет выдана, нет») —
#     https://kasachstan.diplo.de/kz-ru/service/2291088-2291088
#   - Визовый центр TLScontact (запись, сервисный сбор — размер на сайте TLS) — https://visas-de.tlscontact.com/ru-ru/country/kz
#   - Анкета VIDEX — https://videx.diplo.de/videx/visum-erfassung/videx-kurzfristiger-aufenthalt
# Сервисный сбор TLS не указываем (меняется) — «уточните на сайте TLS».
id: kz.services.visa_schengen_de
version: 0.1.0
ontology: SERVICES.VISA.SCHENGEN_DE_TOURIST
jurisdiction: KZ
languages: [ru, kk]
owner: lawyer:kz-01
reviewed_at: null
published: true
beta: true
kind: service
title:
  ru: "Шенгенская виза в Германию (туризм)"
  kk: "Германияға шенген визасы (туризм)"
summary:
  ru: Сопроводительное письмо, план поездки, письмо о финансировании (если платит родственник) и чек-лист документов по памятке посольства Германии в Казахстане.
  kk: Ілеспе хат, сапар жоспары, қаржыландыру туралы хат (туысы төлесе) және Германияның Қазақстандағы елшілігінің жадынамасы бойынша құжаттар тізімі.
disclaimer:
  ru: "Бета. Konsiliér AI — IT-сервис: помогаем подготовить документы по вашим данным и официальным требованиям. Это не юридическая помощь. Решение о визе принимает посольство (генконсульство) Германии; гарантии выдачи визы нет. Перед подачей сверьтесь с памятками на kasachstan.diplo.de."
  kk: "Бета. Konsiliér AI — IT-сервис: сіздің деректеріңіз бен ресми талаптар бойынша құжаттарды дайындауға көмектесеміз. Бұл заң көмегі емес. Виза туралы шешімді Германия елшілігі (бас консулдығы) қабылдайды; виза берілетініне кепілдік жоқ. Тапсыру алдында kasachstan.diplo.de сайтындағы жадынамалармен салыстырыңыз."
sources:
  - {title: {ru: "Шенгенская виза — представительства Германии в Казахстане", kk: "Шенген визасы — Германияның Қазақстандағы өкілдіктері"}, url: "https://kasachstan.diplo.de/kz-ru/service/2066314-2066314", checked_on: 2026-09-28}
  - {title: {ru: "Памятка: туристическая виза", kk: "Жадынама: туристік виза"}, url: "https://kasachstan.diplo.de/kz-ru/service/2723336-2723336", checked_on: 2026-09-28}
  - {title: {ru: "Визовые сборы", kk: "Виза алымдары"}, url: "https://kasachstan.diplo.de/kz-ru/service/2723326-2723326", checked_on: 2026-09-28}
  - {title: {ru: "Частые вопросы о шенгенской визе", kk: "Шенген визасы туралы жиі қойылатын сұрақтар"}, url: "https://kasachstan.diplo.de/kz-ru/service/2291088-2291088", checked_on: 2026-09-28}
  - {title: {ru: "Визовый центр TLScontact (запись)", kk: "TLScontact визалық орталығы (жазылу)"}, url: "https://visas-de.tlscontact.com/ru-ru/country/kz", checked_on: 2026-09-28}
classification:
  keywords:
    ru: [шенген, виза в германию, визу в германию, германи, немецкая виза, немецкую визу, tlscontact, videx, виза, визу, визы]
    kk: [шенген, германия визасы, германияға виза]
  examples:
    ru:
      - Нужна шенгенская виза в Германию для туристической поездки, какие документы собрать
      - Едем в Германию отдыхать, помогите с документами на визу
    kk:
      - Германияға туристік сапарға шенген визасы керек
intake:
  - trip_dates: {label: {ru: "Даты поездки", kk: "Сапар күндері"}, question: {ru: "Даты поездки: с какого по какое число (например, 10.11.2026 — 20.11.2026)?", kk: "Сапар күндері: қай күннен қай күнге дейін (мысалы, 10.11.2026 — 20.11.2026)?"}}
  - itinerary: {type: longtext, label: {ru: "Маршрут", kk: "Бағыт"}, question: {ru: "Маршрут по дням: какие города, где ночуете? Германия должна быть основной целью поездки.", kk: "Күн бойынша бағыт: қандай қалалар, қайда түнейсіз? Германия сапардың негізгі мақсаты болуы керек."}}
  - accommodation: {label: {ru: "Проживание", kk: "Тұру орны"}, question: {ru: "Где будете жить (отель, адрес, бронь)?", kk: "Қайда тұрасыз (қонақүй, мекенжай, бронь)?"}}
  - trip_purpose: {type: longtext, label: {ru: "Цель поездки и связь с Казахстаном", kk: "Сапар мақсаты және Қазақстанмен байланыс"}, question: {ru: "Кратко: цель поездки, кем работаете или учитесь, что вас держит в Казахстане (работа, семья, имущество). Только правда — это основа письма.", kk: "Қысқаша: сапар мақсаты, кім болып жұмыс істейсіз не оқисыз, сізді Қазақстанда не ұстап тұр (жұмыс, отбасы, мүлік). Тек шындық — бұл хаттың негізі."}}
  - employer_name: {optional: true, label: {ru: "Работодатель", kk: "Жұмыс беруші"}, question: {ru: "Где работаете (название и должность)? Не работаете по найму — «Пропустить».", kk: "Қайда жұмыс істейсіз (атауы және лауазымы)? Жалдамалы жұмыс істемесеңіз — «Өткізу»."}}
  - business_name: {optional: true, label: {ru: "ИП или ТОО", kk: "ЖК немесе ЖШС"}, question: {ru: "Вы ИП или учредитель ТОО? Укажите название. Нет — «Пропустить».", kk: "Сіз ЖК немесе ЖШС құрылтайшысысыз ба? Атауын жазыңыз. Жоқ болса — «Өткізу»."}}
  - study_place: {optional: true, label: {ru: "Место учёбы", kk: "Оқу орны"}, question: {ru: "Учитесь (вуз, колледж, школа)? Укажите где. Нет — «Пропустить».", kk: "Оқисыз ба (ЖОО, колледж, мектеп)? Қайда екенін жазыңыз. Жоқ болса — «Өткізу»."}}
  - sponsor_name: {optional: true, label: {ru: "Кто оплачивает поездку (если не вы)", kk: "Сапарды кім төлейді (сіз болмасаңыз)"}, question: {ru: "Поездку оплачивает супруг(а) или родитель? Укажите ФИО и кем приходится. Платите сами — «Пропустить».", kk: "Сапарды жұбайыңыз не ата-анаңыз төлей ме? Аты-жөнін және кім болатынын жазыңыз. Өзіңіз төлесеңіз — «Өткізу»."}}
  - previous_visas: {optional: true, label: {ru: "Шенгенские визы за 3 года", kk: "Соңғы 3 жылдағы шенген визалары"}, question: {ru: "Были шенгенские визы за последние 3 года? Какие. Нет — «Пропустить».", kk: "Соңғы 3 жылда шенген визалары болды ма? Қандай. Жоқ болса — «Өткізу»."}}
  - applicant_name: {pii: person}
  - passport_number: {pii: id_number, label: {ru: "Номер загранпаспорта", kk: "Шетелдік паспорт нөмірі"}, question: {ru: "Номер загранпаспорта?", kk: "Шетелдік паспорт нөмірі?"}}
  - applicant_address: {pii: address}
  - applicant_phone: {type: phone, pii: phone}
  - applicant_email: {type: email, pii: email, optional: true, label: {ru: "E-mail", kk: "E-mail"}, question: {ru: "E-mail (или «Пропустить»)?", kk: "E-mail (немесе «Өткізу»)?"}}
parties:
  applicant: {kind: person, name_field: applicant_name, id_field: passport_number, address_field: applicant_address, email_field: applicant_email}
actions:
  - id: visa_package
    title: {ru: Пакет документов на шенгенскую визу в Германию, kk: Германияға шенген визасына арналған құжаттар топтамасы}
    template: kz/templates/services/package.docx
    channel: user_submits
    addressee:
      name: {ru: "Посольство (Генеральное консульство) Федеративной Республики Германия в Казахстане — через визовый центр TLScontact", kk: "Германия Федеративтік Республикасының Қазақстандағы елшілігі (Бас консулдығы) — TLScontact визалық орталығы арқылы"}
      url: "https://visas-de.tlscontact.com/ru-ru/country/kz"
    instructions:
      ru:
        - "Заполните анкету VIDEX, распечатайте все страницы и подпишите; запишитесь в визовый центр TLS своего округа (Астана или Алматы)."
        - "Подать можно не раньше чем за 6 месяцев и не позже чем за 15 дней до начала поездки; рассмотрение — как правило, 15 календарных дней."
        - "Нажмите «Документ подан» после сдачи документов в TLS. Гарантии выдачи визы нет."
      kk:
        - "VIDEX сауалнамасын толтырып, барлық беттерін басып шығарып, қол қойыңыз; өз округіңіздің (Астана немесе Алматы) TLS визалық орталығына жазылыңыз."
        - "Сапар басталғанға дейін 6 айдан ерте емес және 15 күннен кешіктірмей тапсыруға болады; қарау — әдетте 15 күнтізбелік күн."
        - "Құжаттарды TLS-ке тапсырғаннан кейін «Құжат тапсырылды» батырмасын басыңыз. Виза берілетініне кепілдік жоқ."
    package:
      - id: cover_letter
        title: {ru: Сопроводительное письмо, kk: Ілеспе хат}
        signature: true
        text:
          - {ru: "Прошу рассмотреть моё заявление на выдачу шенгенской визы (туризм) для поездки в Германию с датами: {trip_dates}.", kk: "Германияға {trip_dates} күндеріндегі сапарға шенген визасын (туризм) беру туралы өтінішімді қарауыңызды сұраймын."}
          - {ru: "{narrative}", kk: "{narrative}"}
          - {ru: "Проживание: {accommodation}. Маршрут: {itinerary}", kk: "Тұру орны: {accommodation}. Бағыт: {itinerary}"}
          - {ru: "Место работы: {employer_name}.", kk: "Жұмыс орны: {employer_name}.", if: employer_name}
          - {ru: "Предпринимательская деятельность: {business_name}.", kk: "Кәсіпкерлік қызмет: {business_name}.", if: business_name}
          - {ru: "Место учёбы: {study_place}.", kk: "Оқу орны: {study_place}.", if: study_place}
          - {ru: "Расходы на поездку оплачивает {sponsor_name}; письмо о финансировании и подтверждающие документы прилагаются.", kk: "Сапар шығыстарын {sponsor_name} төлейді; қаржыландыру туралы хат және растайтын құжаттар қоса беріледі.", if: sponsor_name}
          - {ru: "Расходы на поездку оплачиваю самостоятельно; банковская справка и выписки прилагаются.", kk: "Сапар шығыстарын өзім төлеймін; банк анықтамасы мен үзінділер қоса беріледі.", unless: sponsor_name}
          - {ru: "Обязуюсь покинуть Шенгенскую зону до окончания срока действия визы. Документы прилагаю согласно перечню.", kk: "Виза мерзімі аяқталғанға дейін Шенген аймағынан шығуға міндеттенемін. Құжаттарды тізбеге сәйкес қоса беремін."}
          - {ru: "Паспорт № {passport_number}. Контакты: {applicant_phone}, {applicant_email}.", kk: "Паспорт № {passport_number}. Байланыс: {applicant_phone}, {applicant_email}."}
      - id: trip_plan
        title: {ru: "План поездки (для официального бланка)", kk: "Сапар жоспары (ресми бланкі үшін)"}
        text:
          - {ru: "Даты: {trip_dates}.", kk: "Күндері: {trip_dates}."}
          - {ru: "Маршрут и ночёвки по дням: {itinerary}", kk: "Күн бойынша бағыт және түнеу орындары: {itinerary}"}
          - {ru: "Проживание: {accommodation}.", kk: "Тұру орны: {accommodation}."}
          - ru: "Посольство требует от каждого заявителя заполненное и подписанное дополнительное заявление «План поездки» на официальном бланке (он бесплатный: сайт посольства, визовый центр). Перенесите в него эти данные."
            kk: "Елшілік әр өтініш берушіден ресми бланкідегі толтырылған және қол қойылған «Сапар жоспары» қосымша өтінішін талап етеді (ол тегін: елшілік сайты, визалық орталық). Осы деректерді соған көшіріңіз."
      - id: sponsor_letter
        title: {ru: Письмо о финансировании поездки, kk: Сапарды қаржыландыру туралы хат}
        if: sponsor_name
        signature: true
        text:
          - {ru: "Я, {sponsor_name}, подтверждаю, что оплачиваю расходы {applicant_name} (паспорт № {passport_number}) на поездку в Германию ({trip_dates}): проезд, проживание, медицинскую страховку и расходы на время пребывания.", kk: "Мен, {sponsor_name}, {applicant_name} (паспорт № {passport_number}) Германияға сапарының ({trip_dates}) шығыстарын: жол жүруді, тұруды, медициналық сақтандыруды және болу кезіндегі шығыстарды төлейтінімді растаймын."}
          - {ru: "Прилагаю: банковскую справку и выписки по моему счёту, документ о родстве (свидетельство о браке или о рождении — оригинал и копию).", kk: "Қоса беремін: менің шотым бойынша банк анықтамасы мен үзінділер, туыстықты растайтын құжат (неке не туу туралы куәлік — түпнұсқасы мен көшірмесі)."}
          - {ru: "Подпись спонсора: ______________ / {sponsor_name}", kk: "Демеушінің қолы: ______________ / {sponsor_name}"}
      - id: checklist
        title: {ru: Чек-лист документов (памятка посольства «Туристическая виза»), kk: Құжаттар тізімі (елшіліктің «Туристік виза» жадынамасы)}
        check:
          - {ru: "Анкета на шенгенскую визу (VIDEX): заполнена полностью, распечатана и лично подписана.", kk: "Шенген визасына сауалнама (VIDEX): толық толтырылған, басып шығарылған және жеке қол қойылған."}
          - {ru: "2 цветные биометрические фотографии 3,5 × 4,5 см, не старше 6 месяцев (одну наклеить на анкету).", kk: "3,5 × 4,5 см 2 түрлі түсті биометриялық фотосурет, 6 айдан ескі емес (біреуін сауалнамаға жапсыру)."}
          - {ru: "Загранпаспорт с подписью владельца + копия первой страницы.", kk: "Иесінің қолы қойылған шетелдік паспорт + бірінші бетінің көшірмесі."}
          - {ru: "Копии шенгенских виз за последние 3 года со штампами въезда/выезда: {previous_visas}.", kk: "Кіру/шығу мөртабандары бар соңғы 3 жылдағы шенген визаларының көшірмелері: {previous_visas}.", if: previous_visas}
          - {ru: "Медицинская страховка на все страны Шенгена, покрытие не менее 30 000 евро, со сроком действия — копия.", kk: "Шенгеннің барлық елдеріне медициналық сақтандыру, өтеу сомасы кемінде 30 000 евро, қолданылу мерзімімен — көшірмесі."}
          - {ru: "Бронь гостиницы на весь период пребывания.", kk: "Болатын бүкіл кезеңге қонақүй броньы."}
          - {ru: "Забронированный, но не выкупленный авиабилет (посольство не советует покупать билет до получения визы).", kk: "Брондалған, бірақ сатып алынбаған авиабилет (елшілік виза алғанға дейін билет сатып алуға кеңес бермейді)."}
          - {ru: "Дополнительное заявление «План поездки» — заполнено и подписано.", kk: "«Сапар жоспары» қосымша өтініші — толтырылған және қол қойылған."}
          - {ru: "Оригинал банковской справки о состоянии счёта (не старше двух недель) и выписки за последние три месяца.", kk: "Шоттың жай-күйі туралы банк анықтамасының түпнұсқасы (екі аптадан ескі емес) және соңғы үш айдағы үзінділер.", unless: sponsor_name}
