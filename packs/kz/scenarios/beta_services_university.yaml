# БЕТА (EXPERIMENTAL_SCENARIOS=true). Помощь в подготовке документов для поступления в вуз РК — не спор.
# Источник — только официальный текст, открытый 28.09.2026 в ИПС «Әділет» (old.adilet.zan.kz, текущая редакция):
#   Типовые правила приема на обучение в организации образования, реализующие образовательные программы высшего и
#   послевузовского образования (приказ МОН РК от 31 октября 2018 года № 600) — https://adilet.zan.kz/rus/docs/V1800017650
#     п. 4 (пороговые баллы ЕНТ), п. 5 (вуз утверждает свои правила приема), п. 16 (творческий экзамен: заявления
#     с 20 июня по 10 августа), п. 33 (пакет документов через приемную комиссию или egov.kz; оригиналы — с 20 июня
#     по 25 августа), п. 33-3 (зачисление с 20 июня по 25 августа),
#     приложение 3 «Перечень основных требований к оказанию государственной услуги…»: п. 4 (способы — вуз или egov.kz),
#     п. 8 (услуга бесплатная), п. 10 (перечень документов).
#   Даты ЕНТ и конкурса грантов не указаны: только на https://testcenter.kz (НЦТ, открыт 28.09.2026) — «уточните».
# TODO(lawyer): Правила присуждения образовательного гранта — не открывались; квоты (п. 8) не раскрыты.
id: kz.services.university_admission
version: 0.1.0
ontology: SERVICES.EDUCATION.UNIVERSITY_ADMISSION_KZ
taxonomy: education.grant
jurisdiction: KZ
languages: [ru, kk]
owner: lawyer:kz-01
reviewed_at: null
published: false  # beta: offered only with EXPERIMENTAL_SCENARIOS=true
beta: true
kind: service
title:
  ru: Документы для поступления в вуз Казахстана
  kk: Қазақстан ЖОО-на түсуге арналған құжаттар
summary:
  ru: Заявление на имя руководителя вуза, мотивационное письмо, чек-лист и опись документов по Типовым правилам приёма, сроки подачи и где подать (приёмная комиссия или egov.kz).
  kk: ЖОО басшысының атына өтініш, уәждемелік хат, Үлгілік қабылдау қағидалары бойынша құжаттар тізімі мен тізімдемесі, тапсыру мерзімдері және қайда тапсыру керектігі (қабылдау комиссиясы немесе egov.kz).
disclaimer:
  ru: "Бета. Konsilier AI — IT-сервис: помогаем подготовить документы по вашим данным и официальным требованиям. Это не юридическая помощь. Решение о зачислении принимает вуз, результат не гарантируется. Правила приёма конкретного вуза смотрите на его официальном сайте."
  kk: "Бета. Konsilier AI — IT-сервис: сіздің деректеріңіз бен ресми талаптар бойынша құжаттарды дайындауға көмектесеміз. Бұл заң көмегі емес. Оқуға қабылдау туралы шешімді ЖОО қабылдайды, нәтижеге кепілдік берілмейді. Нақты ЖОО-ның қабылдау қағидаларын оның ресми сайтынан қараңыз."
sources:
  - {title: {ru: "Типовые правила приёма в организации высшего и послевузовского образования (ИПС «Әділет»)", kk: "Жоғары және жоғары оқу орнынан кейінгі білім беру ұйымдарына қабылдаудың үлгілік қағидалары (ӘАЖ «Әділет»)"}, url: "https://adilet.zan.kz/rus/docs/V1800017650", checked_on: 2026-09-28}
  - {title: {ru: "Национальный центр тестирования (ЕНТ, гранты)", kk: "Ұлттық тестілеу орталығы (ҰБТ, гранттар)"}, url: "https://testcenter.kz", checked_on: 2026-09-28}
  - {title: {ru: "Портал электронного правительства", kk: "Электрондық үкімет порталы"}, url: "https://egov.kz", checked_on: 2026-09-28}
classification:
  keywords:
    ru: [поступить в вуз, поступить в университет, поступление в вуз, поступаю в, абитуриент, приемную комиссию, приёмную комиссию, приемная комиссия, приёмная комиссия, сдал ент, сдала ент, баллов ент, сертификат ент, грант на обучение, образовательный грант, для поступления]
    kk: [жоо-ға түсу, университетке түсу, талапкер, қабылдау комиссиясы, ұбт тапсырдым]
  examples:
    ru:
      - Хочу поступить в университет в Алматы, помогите подготовить документы в приемную комиссию
      - Сдал ЕНТ, нужно заявление и мотивационное письмо для поступления в вуз
    kk:
      - ҰБТ тапсырдым, университетке түсуге құжат дайындау керек
intake:
  - university_name: {label: {ru: "Вуз", kk: "ЖОО"}, question: {ru: "В какой вуз поступаете (полное название)?", kk: "Қай ЖОО-ға түсесіз (толық атауы)?"}}
  - program_name: {label: {ru: "Образовательная программа", kk: "Білім беру бағдарламасы"}, question: {ru: "Группа образовательных программ или специальность?", kk: "Білім беру бағдарламаларының тобы немесе мамандық?"}}
  - ent_score: {optional: true, label: {ru: "Баллы ЕНТ", kk: "ҰБТ балдары"}, question: {ru: "Сколько баллов ЕНТ (как в сертификате)? Если ещё не сдавали — «Пропустить».", kk: "ҰБТ-дан қанша балл (сертификаттағыдай)? Әлі тапсырмасаңыз — «Өткізу»."}}
  - grant_certificate: {optional: true, label: {ru: "Свидетельство о гранте", kk: "Грант туралы куәлік"}, question: {ru: "Есть свидетельство о присуждении образовательного гранта? Укажите номер. Нет — «Пропустить».", kk: "Білім беру грантын беру туралы куәлік бар ма? Нөмірін жазыңыз. Жоқ болса — «Өткізу»."}}
  - creative_exam: {optional: true, label: {ru: "Творческий или специальный экзамен", kk: "Шығармашылық немесе арнайы емтихан"}, question: {ru: "Программа требует творческого или специального экзамена (например, «Педагогические науки», «Здравоохранение», искусство)? Если да — какого. Нет — «Пропустить».", kk: "Бағдарлама шығармашылық не арнайы емтиханды талап ете ме (мысалы, «Педагогикалық ғылымдар», «Денсаулық сақтау», өнер)? Иә болса — қандай. Жоқ болса — «Өткізу»."}}
  - motivation: {type: longtext, label: {ru: "Почему эта программа", kk: "Неге осы бағдарлама"}, question: {ru: "Почему вы выбрали эту программу и вуз, чем хотите заниматься после учёбы? Пишите своими словами — это основа мотивационного письма.", kk: "Неге осы бағдарлама мен ЖОО-ны таңдадыңыз, оқудан кейін немен айналысқыңыз келеді? Өз сөзіңізбен жазыңыз — бұл уәждемелік хаттың негізі."}}
  - achievements: {type: longtext, optional: true, label: {ru: "Достижения", kk: "Жетістіктер"}, question: {ru: "Олимпиады, проекты, волонтёрство, кружки — только то, что можно подтвердить. Нет — «Пропустить».", kk: "Олимпиадалар, жобалар, волонтерлік, үйірмелер — тек растауға болатындары. Жоқ болса — «Өткізу»."}}
  - applicant_name: {pii: person}
  - applicant_iin: {pii: id_number, pattern: '^\d{12}$'}
  - applicant_address: {pii: address}
  - applicant_phone: {type: phone, pii: phone}
  - applicant_email: {type: email, pii: email, optional: true, label: {ru: "E-mail", kk: "E-mail"}, question: {ru: "E-mail для связи (или «Пропустить»)?", kk: "Байланыс e-mail (немесе «Өткізу»)?"}}
parties:
  applicant: {kind: person, name_field: applicant_name, id_field: applicant_iin, address_field: applicant_address, email_field: applicant_email}
  university: {kind: business, name_field: university_name}
actions:
  - id: admission_package
    title: {ru: Пакет документов для поступления в вуз, kk: ЖОО-ға түсуге арналған құжаттар топтамасы}
    template: kz/templates/services/package.docx
    channel: user_submits
    addressee: {party: university}
    instructions:
      ru:
        - "Подайте документы в приёмную комиссию вуза или через egov.kz — с 20 июня по 25 августа (п. 33, 33-3 Типовых правил)."
        - "Сверьте чек-лист с правилами приёма вашего вуза на его официальном сайте; даты ЕНТ и конкурса грантов — только на testcenter.kz."
        - "Нажмите «Документ подан», когда получите расписку или уведомление о приёме документов. Зачисление не гарантируется."
      kk:
        - "Құжаттарды ЖОО-ның қабылдау комиссиясына немесе egov.kz арқылы 20 маусымнан 25 тамызға дейін тапсырыңыз (Үлгілік қағидалардың 33, 33-3-тармақтары)."
        - "Тізімді өз ЖОО-ңыздың ресми сайтындағы қабылдау қағидаларымен салыстырыңыз; ҰБТ мен грант конкурсының күндері — тек testcenter.kz сайтында."
        - "Құжаттарды қабылдағаны туралы қолхат не хабарлама алғанда «Құжат тапсырылды» батырмасын басыңыз. Оқуға қабылдауға кепілдік берілмейді."
    package:
      - id: application
        title: {ru: Заявление о приёме, kk: Қабылдау туралы өтініш}
        signature: true
        text:
          - {ru: "Руководителю {university_name}", kk: "{university_name} басшысына"}
          - {ru: "от {applicant_name}, ИИН {applicant_iin}, адрес: {applicant_address}, тел.: {applicant_phone}", kk: "{applicant_name}, ЖСН {applicant_iin}, мекенжайы: {applicant_address}, тел.: {applicant_phone}"}
          - {ru: "ЗАЯВЛЕНИЕ", kk: "ӨТІНІШ"}
          - {ru: "Прошу принять мои документы для участия в конкурсе и зачисления на обучение по образовательной программе (группе образовательных программ) «{program_name}».", kk: "Менің құжаттарымды конкурсқа қатысу және «{program_name}» білім беру бағдарламасы (білім беру бағдарламаларының тобы) бойынша оқуға қабылдау үшін қабылдауыңызды сұраймын."}
          - {ru: "Результат ЕНТ: {ent_score} баллов.", kk: "ҰБТ нәтижесі: {ent_score} балл.", if: ent_score}
          - {ru: "Имею свидетельство о присуждении образовательного гранта № {grant_certificate}.", kk: "Білім беру грантын беру туралы № {grant_certificate} куәлігім бар.", if: grant_certificate}
          - {ru: "Документы прилагаю согласно описи.", kk: "Құжаттарды тізімдемеге сәйкес қоса беремін."}
      - id: motivation_letter
        title: {ru: Мотивационное письмо, kk: Уәждемелік хат}
        signature: true
        text:
          - {ru: "Приёмной комиссии {university_name}", kk: "{university_name} қабылдау комиссиясына"}
          - {ru: "{narrative}", kk: "{narrative}"}
          - {ru: "Мои достижения: {achievements}", kk: "Менің жетістіктерім: {achievements}", if: achievements}
          - {ru: "Благодарю за рассмотрение моей кандидатуры.", kk: "Кандидатурамды қарағаныңыз үшін алғыс білдіремін."}
      - id: checklist
        title: {ru: Чек-лист документов, kk: Құжаттар тізімі}
        text:
          - ru: "Перечень — пункт 10 приложения 3 к Типовым правилам приёма. Вуз вправе утвердить свои правила приёма (п. 5) — сверьтесь с ними."
            kk: "Тізбе — Үлгілік қабылдау қағидаларына 3-қосымшаның 10-тармағы. ЖОО өз қабылдау қағидаларын бекітуге құқылы (5-тармақ) — олармен салыстырыңыз."
        check:
          - {ru: "Заявление на имя руководителя вуза (в произвольной форме) — готово в этом пакете.", kk: "ЖОО басшысының атына өтініш (еркін нысанда) — осы топтамада дайын."}
          - {ru: "Документ об общем среднем, техническом и профессиональном, послесреднем или высшем образовании — подлинник.", kk: "Жалпы орта, техникалық және кәсіптік, орта білімнен кейінгі немесе жоғары білім туралы құжат — түпнұсқа."}
          - {ru: "Удостоверение личности или электронный документ из сервиса цифровых документов (для идентификации).", kk: "Жеке куәлік немесе цифрлық құжаттар сервисінен электрондық құжат (сәйкестендіру үшін)."}
          - {ru: "6 фотографий 3 × 4 см.", kk: "3 × 4 см 6 фотосурет."}
          - {ru: "Медицинская справка по форме 075/у.", kk: "075/е нысанындағы медициналық анықтама."}
          - {ru: "Сертификат ЕНТ.", kk: "ҰБТ сертификаты."}
          - {ru: "Выписка из ведомости творческого (специального) экзамена: {creative_exam}.", kk: "Шығармашылық (арнайы) емтихан ведомосінен үзінді: {creative_exam}.", if: creative_exam}
          - {ru: "Свидетельство о присуждении образовательного гранта № {grant_certificate}.", kk: "Білім беру грантын беру туралы № {grant_certificate} куәлік.", if: grant_certificate}
          - ru: "Пороговые баллы ЕНТ — п. 4 Типовых правил (например, в национальные вузы — не менее 65, в другие — не менее 50; «Педагогические науки» и «Право» — не менее 75, «Здравоохранение» — не менее 70). Сверьте актуальную редакцию."
            kk: "ҰБТ шекті балдары — Үлгілік қағидалардың 4-тармағы (мысалы, ұлттық ЖОО-ларға — кемінде 65, басқаларына — кемінде 50; «Педагогикалық ғылымдар» мен «Құқық» — кемінде 75, «Денсаулық сақтау» — кемінде 70). Өзекті редакциясымен салыстырыңыз."
      - id: inventory
        title: {ru: Опись документов, kk: Құжаттар тізімдемесі}
        signature: true
        text:
          - {ru: "Поступающий: {applicant_name}. Вуз: {university_name}. Программа: {program_name}.", kk: "Түсуші: {applicant_name}. ЖОО: {university_name}. Бағдарлама: {program_name}."}
        check:
          - {ru: "Заявление о приёме", kk: "Қабылдау туралы өтініш"}
          - {ru: "Мотивационное письмо (если вуз его принимает)", kk: "Уәждемелік хат (ЖОО қабылдаса)"}
          - {ru: "Документ об образовании (подлинник)", kk: "Білімі туралы құжат (түпнұсқа)"}
          - {ru: "Копия удостоверения личности", kk: "Жеке куәліктің көшірмесі"}
          - {ru: "Фотографии 3 × 4 см — 6 шт.", kk: "3 × 4 см фотосуреттер — 6 дана"}
          - {ru: "Медицинская справка 075/у", kk: "075/е медициналық анықтамасы"}
          - {ru: "Сертификат ЕНТ", kk: "ҰБТ сертификаты"}
          - {ru: "Выписка из ведомости экзамена", kk: "Емтихан ведомосінен үзінді", if: creative_exam}
          - {ru: "Свидетельство о гранте", kk: "Грант туралы куәлік", if: grant_certificate}
      - id: how_to_submit
        title: {ru: "Где, когда и как подать", kk: "Қайда, қашан және қалай тапсыру керек"}
        check:
          - {ru: "Где: в приёмную комиссию вуза лично или через egov.kz (госуслуга «Приём документов и зачисление в организации высшего и (или) послевузовского образования…»). Через портал: заявление с ЭЦП, цифровое фото 3 × 4, сертификат ЕНТ, электронное свидетельство о гранте (если есть).", kk: "Қайда: ЖОО-ның қабылдау комиссиясына жеке өзі немесе egov.kz арқылы («Жоғары және (немесе) жоғары оқу орнынан кейінгі білім беру ұйымдарына құжаттар қабылдау және оқуға қабылдау…» мемлекеттік көрсетілетін қызметі). Портал арқылы: ЭЦҚ қойылған өтініш, 3 × 4 цифрлық фото, ҰБТ сертификаты, грант туралы электрондық куәлік (бар болса)."}
          - {ru: "Когда: приём документов и зачисление — с 20 июня по 25 августа; после уведомления о приёме документов оригиналы нужно представить в эти же сроки (п. 33, 33-3).", kk: "Қашан: құжаттарды қабылдау және оқуға қабылдау — 20 маусымнан 25 тамызға дейін; құжаттарды қабылдау туралы хабарламадан кейін түпнұсқаларды осы мерзімде ұсыну керек (33, 33-3-тармақтар)."}
          - {ru: "Творческий экзамен: заявления принимает вуз с 20 июня по 10 августа (п. 16).", kk: "Шығармашылық емтихан: өтініштерді ЖОО 20 маусымнан 10 тамызға дейін қабылдайды (16-тармақ).", if: creative_exam}
