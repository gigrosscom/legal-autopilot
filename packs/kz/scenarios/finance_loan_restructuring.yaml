# Опубликован 28.09.2026 по решению владельца. reviewed_at: null → на каждом документе нейтральная пометка compliance.draft_disclaimer.
# Нормы проверены 28.09.2026 по официальному тексту ИПС «Әділет» (страница акта открыта, номер статьи — как в тексте):
#   - Закон РК «О банках и банковской деятельности в Республике Казахстан», ст. 61 п. 3 (банк — 15 календарных дней), ст. 132 п. 5 (омбудсман) — https://adilet.zan.kz/rus/docs/Z2600000258 (закон 2026 г., сверено 02.10.2026)
#     п. 1-1: в течение тридцати календарных дней с даты наступления просрочки заёмщик — физическое лицо вправе подать
#       заявление о внесении изменений в условия договора банковского займа (снижение ставки, платежа, отсрочка и др.);
#     п. 1-2: банк в течение пятнадцати календарных дней после получения заявления сообщает о согласии, встречном
#       предложении или мотивированном отказе; в период рассмотрения не вправе требовать досрочного погашения;
#     п. 1-3: в течение пятнадцати календарных дней с даты получения отказа — обращение к банковскому омбудсману.
# Только банки. TODO(lawyer): МФО (закон о микрофинансовой деятельности), ипотека, срок рассмотрения омбудсманом.
id: kz.finance.loan_restructuring
version: 0.1.0
ontology: FINANCE.LOAN.RESTRUCTURING
taxonomy: finance.bank_dispute
jurisdiction: KZ
languages: [ru, kk]
owner: lawyer:kz-01
reviewed_at: null
published: true
title:
  ru: Изменение условий кредита (реструктуризация)
  kk: Несие талаптарын өзгерту (қайта құрылымдау)
summary:
  ru: У вас просрочка по банковскому кредиту из-за снижения дохода, болезни или других обстоятельств. Вы хотите попросить банк снизить платёж, дать отсрочку или изменить условия, либо банк уже отказал.
  kk: Табыстың азаюына, науқасқа не басқа жағдайларға байланысты банк несиесі бойынша мерзімі өткен берешегіңіз бар. Банктен төлемді азайтуды, кейінге қалдыруды не талаптарды өзгертуді сұрағыңыз келеді, не банк бас тартып қойды.
classification:
  keywords:
    ru: [реструктуризац, отсрочк, кредитные каникулы, снизить платёж, снизить платеж, нечем платить кредит, просрочк, изменить условия кредита, рефинанс, не тяну платёж, не тяну платеж, потерял работу, не могу платить кредит]
    kk: [қайта құрылымдау, кейінге қалдыру, несие төлей алмаймын, мерзімі өткен, жұмыстан айырылдым]
  examples:
    ru:
      - Как получить отсрочку по кредиту, банк отказал в реструктуризации
      - "Потерял работу, не тяну платёж по кредиту, хочу официально попросить реструктуризацию"
    kk:
      - Несие бойынша кейінге қалдыруды қалай алуға болады, банк қайта құрылымдаудан бас тартты
intake:
  - respondent_name: {label: {ru: Банк, kk: Банк}, question: {ru: "В каком банке кредит?", kk: "Несие қай банкте?"}}
  - respondent_bin: {optional: true, pattern: '^\d{12}$'}
  - respondent_address: {optional: true}
  - event_date: {type: date, label: {ru: Дата просрочки, kk: Мерзімі өткен күн}, question: {ru: "С какой даты у вас просрочка платежа? (ДД.ММ.ГГГГ)", kk: "Төлем қай күннен бастап мерзімі өтті? (КК.АА.ЖЖЖЖ)"}}
  - amount: {type: money, currency: KZT, optional: true, question: {ru: "Какой сейчас ежемесячный платёж, в тенге? Или «пропустить».", kk: "Қазір ай сайынғы төлем қанша, теңгемен? Не «өткізу»."}}
  - problem_description: {type: longtext}
  - applicant_name: {pii: person}
  - applicant_iin: {pii: id_number, pattern: '^\d{12}$'}
  - applicant_address: {pii: address}
  - applicant_phone: {type: phone, pii: phone}
  - evidence: [loan_contract, pay_slip, gov_certificate, correspondence]
parties:
  applicant: {kind: person, name_field: applicant_name, id_field: applicant_iin, address_field: applicant_address}
  respondent: {kind: business, name_field: respondent_name, id_field: respondent_bin, address_field: respondent_address}
actions:
  - id: statement_to_bank
    title: {ru: Заявление в банк об изменении условий займа, kk: Банкке қарыз шартының талаптарын өзгерту туралы арыз}
    template: kz/templates/generic/statement.docx
    channel: user_submits
    addressee: {party: respondent}
    deadline: {calendar_days: 15, norm_ref: "Закон Республики Казахстан «О банках и банковской деятельности в Республике Казахстан», статья 61"}
    norm_refs:
      - "Закон Республики Казахстан «О банках и банковской деятельности в Республике Казахстан», статья 61"
    demands:
      ru: "рассмотреть моё заявление о внесении изменений в условия договора банковского займа (уменьшение ежемесячного платежа и (или) отсрочка платежа по основному долгу и вознаграждению) с учётом изложенных причин просрочки и моих доходов и в установленный законом срок письменно сообщить мне о принятом решении."
    instructions:
      ru:
        - "Заявление подаётся в течение тридцати календарных дней с даты наступления просрочки."
        - "Приложите справку о доходах или о их снижении, документы о причинах (больничный, приказ о сокращении и т. п.)."
        - "Подайте заявление в отделении банка с отметкой о принятии или через приложение/сайт банка и сохраните входящий номер."
        - "Нажмите «Документ подан». Банк должен ответить в течение {deadline_days} календарных дней; пока заявление рассматривается, он не вправе требовать досрочного погашения."
      kk:
        - "Арыз мерзімі өткен күннен бастап отыз күнтізбелік күн ішінде беріледі."
        - "Табыс туралы не оның азайғаны туралы анықтаманы, себептерін растайтын құжаттарды (еңбекке жарамсыздық парағы, қысқарту туралы бұйрық және т.б.) тіркеңіз."
        - "Арызды банк бөлімшесінде қабылдау белгісін қойғызып не банктің қосымшасы/сайты арқылы беріп, кіріс нөмірін сақтаңыз."
        - "«Құжат тапсырылды» батырмасын басыңыз. Банк {deadline_days} күнтізбелік күн ішінде жауап беруге тиіс; арыз қаралып жатқанда мерзімінен бұрын өтеуді талап етуге құқығы жоқ."
  - id: appeal_bank_ombudsman
    when: statement_to_bank.response in [none, refusal, partial]
    title: {ru: Обращение к банковскому омбудсману, kk: Банк омбудсманына өтініш}
    template: kz/templates/generic/complaint.docx
    channel: user_submits
    addressee: {authority: bank_ombudsman}
    norm_refs:
      - "Закон Республики Казахстан «О банках и банковской деятельности в Республике Казахстан», статья 132"
    demands:
      ru: "рассмотреть моё обращение об изменении условий договора банковского займа, по которому с банком не достигнуто взаимоприемлемое решение, и содействовать урегулированию разногласий, о результатах сообщить мне."
    instructions:
      ru:
        - "Обратиться к омбудсману можно в течение пятнадцати календарных дней с даты получения отказа банка; одновременно уведомите банк."
        - "Приложите заявление в банк с отметкой о принятии и ответ банка — без доказательства обращения в банк омбудсман обращение не рассматривает."
        - "К банковскому омбудсману обращаются после отказа банка (Закон о банках 2026, ст. 132 п. 5). Сохраните номер обращения и нажмите «Документ подан»."
      kk:
        - "Омбудсманға банктің бас тартуын алған күннен бастап он бес күнтізбелік күн ішінде жүгінуге болады; бір мезгілде банкті хабардар етіңіз."
        - "Банкке берілген, қабылдау белгісі бар арызды және банктің жауабын тіркеңіз — банкке жүгінгеніңіздің дәлелінсіз омбудсман өтінішті қарамайды."
        - "Банк омбудсманына банк бас тартқаннан кейін жүгінеді (2026 жылғы Банктер туралы заң, 132-бап 5-тармақ). Өтініш нөмірін сақтап, «Құжат тапсырылды» батырмасын басыңыз."
  - id: handoff_lawyer
    kind: handoff
    when: appeal_bank_ombudsman.response in [none, refusal, partial]
    title: {ru: Передача дела юристу, kk: Істі заңгерге беру}
pricing: {model: fixed, amount: 2990, currency: KZT}
