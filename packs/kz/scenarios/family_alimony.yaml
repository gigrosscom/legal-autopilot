# ПИЛОТНЫЙ ЧЕРНОВИК (этап 5 ADR-0001). Не опубликован. Дела с детьми по правилам маршрутизации
# идут юристу (уровень 3); этот сценарий — заготовка для юриста, а не автопилот.
# Размер алиментов, нормы и подсудность вносит только юрист (TODO(lawyer)).
id: kz.family.alimony
version: 0.0.1
ontology: FAMILY.ALIMONY.CHILD
taxonomy: family.alimony
jurisdiction: KZ
languages: [ru, kk]
owner: lawyer:kz-01
reviewed_at: null
published: false
title:
  ru: Взыскание алиментов на ребёнка
  kk: Балаға алимент өндіру
summary:
  ru: Второй родитель не участвует в содержании ребёнка. Документ готовит и проверяет юрист.
  kk: Екінші ата-ана баланы асырауға қатыспайды. Құжатты заңгер дайындайды және тексереді.
classification:
  keywords:
    ru: [алимент, содержание ребёнка, не платит на ребёнка]
    kk: [алимент, баланы асырау]
intake:
  - respondent_name
  - problem_description: {type: longtext}
  - desired_outcome: {type: longtext}
  - applicant_name: {pii: person}
  - applicant_iin: {optional: true, pii: id_number, pattern: '^\d{12}$'}
  - applicant_address: {pii: address}
  - applicant_phone: {type: phone, pii: phone}
  - evidence: [birth_certificate, correspondence, other]
parties:
  applicant: {kind: person, name_field: applicant_name, id_field: applicant_iin, address_field: applicant_address}
  respondent: {kind: person, name_field: respondent_name}
actions:
  - id: lawsuit_alimony
    title: {ru: Исковое заявление о взыскании алиментов, kk: Алимент өндіру туралы талап арыз}
    template: kz/templates/generic/lawsuit.docx
    channel: user_submits
    addressee: {forum: kz.court.district}
    norm_refs: [TODO]
    demands:
      ru: "взыскать с ответчика алименты на содержание несовершеннолетнего ребёнка в размере, определённом законом. [размер и порядок: уточнит юрист]"
    instructions:
      ru:
        - "Перед подачей документ проверит юрист: размер алиментов, подсудность и приложения."
      kk:
        - "Беру алдында құжатты заңгер тексереді: алимент мөлшері, соттылық және қосымшалар."
  - id: handoff_lawyer
    kind: handoff
    when: lawsuit_alimony.response in [none, refusal, partial]
    title: {ru: Передача дела юристу, kk: Істі заңгерге беру}
pricing: {model: free}
