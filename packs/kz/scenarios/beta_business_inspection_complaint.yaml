# БЕТА (EXPERIMENTAL_SCENARIOS=true). Для бизнеса: жалоба на проверку / действия (решение) контролирующего органа.
# Нормы проверены 28.09.2026 по официальному тексту ИПС «Әділет» (old.adilet.zan.kz):
#   - Предпринимательский кодекс РК — https://adilet.zan.kz/rus/docs/K1500000375
#       ст. 157 п. 1 (обжалование решений, действий органов контроля и надзора — в вышестоящий орган по главе 29 или в суд),
#       ст. 318 (жалоба подлежит обязательному приёму и рассмотрению), ст. 319 (подаётся в орган, в компетенцию которого
#       входит её рассмотрение).
#   - АППК РК — https://adilet.zan.kz/rus/docs/K2000000350
#       ст. 91 п. 4 (жалоба подаётся через орган, чьё действие обжалуется; он в 3 рабочих дня передаёт её в вышестоящий
#       орган), ст. 92 п. 1 (не позднее трёх месяцев со дня, когда стало известно), ст. 93 (форма и содержание),
#       ст. 99 (рассмотрение — двадцать рабочих дней со дня регистрации).
# ПК и АППК пока не отмечены как проверенные «ключевые акты» в packs/kz/pack.yaml — ссылки в тексте жалобы (package), не в
# norm_refs; напоминание о сроке ответа не включено. TODO(lawyer): отметить акты в pack.yaml, включить напоминание (20 р. д.).
id: kz.business.inspection_complaint
version: 0.1.0
ontology: BUSINESS.STATE_CONTROL.INSPECTION_COMPLAINT
jurisdiction: KZ
languages: [ru, kk]
owner: lawyer:kz-01
reviewed_at: null
published: false  # beta: offered only with EXPERIMENTAL_SCENARIOS=true
beta: true
kind: dispute
title:
  ru: "Для бизнеса: жалоба на проверку контролирующего органа"
  kk: "Бизнес үшін: бақылаушы органның тексерісіне шағым"
summary:
  ru: Проверка или решение органа контроля и надзора нарушили права вашей компании — жалоба в вышестоящий орган по Предпринимательскому кодексу и АППК, затем юрист (суд).
  kk: Бақылау және қадағалау органының тексерісі не шешімі компанияңыздың құқықтарын бұзды — Кәсіпкерлік кодекс пен ӘРПК бойынша жоғары тұрған органға шағым, содан кейін заңгер (сот).
disclaimer:
  ru: "Бета. Konsilier AI — IT-сервис подготовки документов, не юридическая помощь. Результат не гарантируется."
  kk: "Бета. Konsilier AI — құжаттарды дайындайтын IT-сервис, заң көмегі емес. Нәтижеге кепілдік берілмейді."
classification:
  keywords:
    ru: [контролирующ, проверяющ, органа контроля, орган контроля, проверка акимата, внеплановая проверка, внеплановую проверку, незаконная проверка, незаконную проверку, акт проверки, предписани, санэпид, госинспекц]
    kk: [бақылаушы орган, жоспардан тыс тексеру, тексеру актісі, нұсқама]
  examples:
    ru:
      - Внеплановая проверка контролирующего органа нарушила наши права, выдали предписание
      - Проверяющие из акимата провели проверку без оснований, хотим подать жалобу на акт проверки
    kk:
      - Бақылаушы органның жоспардан тыс тексеруіне шағым беру керек
intake:
  - respondent_name: {label: {ru: "Орган, проводивший проверку", kk: "Тексеру жүргізген орган"}, question: {ru: "Какой орган провёл проверку или принял решение (точное название)?", kk: "Тексеруді қай орган жүргізді не шешім қабылдады (нақты атауы)?"}}
  - higher_authority: {label: {ru: "Вышестоящий орган", kk: "Жоғары тұрған орган"}, question: {ru: "Кому подчиняется этот орган (вышестоящий орган или должностное лицо)? Если не знаете — напишите «не знаю», уточним у юриста.", kk: "Бұл орган кімге бағынады (жоғары тұрған орган не лауазымды тұлға)? Білмесеңіз — «білмеймін» деп жазыңыз, заңгерден нақтылаймыз."}}
  - act_description: {label: {ru: "Что обжалуете", kk: "Неге шағымданасыз"}, question: {ru: "Что именно обжалуете: акт проверки, предписание, решение, действия — номер и дата документа?", kk: "Нақты неге шағымданасыз: тексеру актісі, нұсқама, шешім, әрекеттер — құжаттың нөмірі мен күні?"}}
  - event_date: {type: date, label: {ru: "Когда узнали", kk: "Қашан білдіңіз"}, question: {ru: "Когда вы узнали о решении или действиях (ДД.ММ.ГГГГ)? На жалобу — три месяца.", kk: "Шешім не әрекеттер туралы қашан білдіңіз (КК.АА.ЖЖЖЖ)? Шағымға — үш ай."}}
  - problem_description: {type: longtext, label: {ru: "Нарушения", kk: "Бұзушылықтар"}, question: {ru: "Какие права нарушены и чем это подтверждается — только факты.", kk: "Қандай құқықтар бұзылды және бұл немен расталады — тек фактілер."}}
  - desired_outcome: {label: {ru: "Чего просите", kk: "Не сұрайсыз"}, question: {ru: "Чего просите: отменить акт или предписание, признать действия незаконными?", kk: "Не сұрайсыз: актінің не нұсқаманың күшін жою, әрекеттерді заңсыз деп тану?"}}
  - applicant_name: {pii: person, label: {ru: "Ваша компания (ТОО или ИП)", kk: "Сіздің компанияңыз (ЖШС немесе ЖК)"}, question: {ru: "Полное наименование вашей компании (ТОО или ИП)?", kk: "Компанияңыздың толық атауы (ЖШС немесе ЖК)?"}}
  - applicant_bin: {pii: id_number, pattern: '^\d{12}$', label: {ru: "БИН/ИИН", kk: "БСН/ЖСН"}, question: {ru: "БИН (или ИИН для ИП) — 12 цифр?", kk: "БСН (ЖК үшін ЖСН) — 12 цифр?"}}
  - representative: {pii: person, label: {ru: "Кто подписывает", kk: "Кім қол қояды"}, question: {ru: "ФИО и должность подписанта?", kk: "Қол қоюшының аты-жөні және лауазымы?"}}
  - applicant_address: {pii: address, label: {ru: "Место нахождения", kk: "Орналасқан жері"}, question: {ru: "Место нахождения (юридический адрес) компании?", kk: "Компанияның орналасқан жері (заңды мекенжайы)?"}}
  - applicant_phone: {type: phone, pii: phone}
  - evidence: [audit_notice, correspondence, photo, other]
parties:
  applicant: {kind: business, name_field: applicant_name, id_field: applicant_bin, address_field: applicant_address}
  higher: {kind: authority, name_field: higher_authority}
actions:
  - id: complaint_higher_authority
    title: {ru: Жалоба на решение (действия) органа контроля и надзора, kk: Бақылау және қадағалау органының шешіміне (әрекеттеріне) шағым}
    template: kz/templates/business/complaint_b2b.docx
    channel: user_submits
    addressee: {party: higher}
    demands:
      ru: "{desired_outcome} (обжалуется: {act_description})."
      kk: "{desired_outcome} (шағымданылады: {act_description})."
    package:
      - id: legal_basis
        title: {ru: Правовое основание, kk: Құқықтық негіз}
        text:
          - ru: "Правовое основание: пункт 1 статьи 157, статьи 318, 319 Предпринимательского кодекса Республики Казахстан; статьи 91–93 Административного процедурно-процессуального кодекса Республики Казахстан. Жалоба подана не позднее трёх месяцев со дня, когда заявителю стало известно о решении (действии)."
            kk: "Құқықтық негіз: Қазақстан Республикасы Кәсіпкерлік кодексінің 157-бабының 1-тармағы, 318, 319-баптары; Қазақстан Республикасы Әкімшілік рәсімдік-процестік кодексінің 91–93-баптары. Шағым өтініш берушіге шешім (әрекет) туралы белгілі болған күннен бастап үш айдан кешіктірілмей берілді."
    instructions:
      ru:
        - "Жалоба подаётся через орган, чьё решение обжалуется ({respondent_name}); он в течение трёх рабочих дней передаёт её в вышестоящий орган (ст. 91 п. 4 АППК). Срок — три месяца со дня, когда узнали (ст. 92)."
        - "Подпишите (можно ЭЦП), приложите акт, предписание и доказательства; сохраните отметку о регистрации."
        - "Нажмите «Документ подан». Рассмотрение — двадцать рабочих дней со дня регистрации (ст. 99 АППК). При отказе — юрист и суд."
      kk:
        - "Шағым шешіміне шағымданылатын орган ({respondent_name}) арқылы беріледі; ол үш жұмыс күні ішінде оны жоғары тұрған органға жібереді (ӘРПК 91-бабының 4-тармағы). Мерзімі — білген күннен бастап үш ай (92-бап)."
        - "Қол қойыңыз (ЭЦҚ-мен болады), актіні, нұсқаманы және дәлелдерді қоса беріңіз; тіркеу белгісін сақтаңыз."
        - "«Құжат тапсырылды» батырмасын басыңыз. Қарау — тіркелген күннен бастап жиырма жұмыс күні (ӘРПК 99-бабы). Бас тартылса — заңгер және сот."
  - id: handoff_lawyer
    kind: handoff
    when: complaint_higher_authority.response in [none, refusal, partial]
    title: {ru: Передача дела юристу (административный иск), kk: Істі заңгерге беру (әкімшілік талап)}
pricing: {model: fixed, amount: 2990, currency: KZT}
