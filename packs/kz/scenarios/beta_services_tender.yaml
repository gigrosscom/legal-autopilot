# БЕТА (EXPERIMENTAL_SCENARIOS=true). Помощь в подготовке пакета документов к заявке на госзакупки РК — не спор.
# Требования взяты только из официальных текстов, открытых 28.09.2026 в ИПС «Әділет» (old.adilet.zan.kz, текущая редакция):
#   - Закон РК от 1 июля 2024 года № 106-VIII «О государственных закупках» — https://adilet.zan.kz/rus/docs/Z2400000106
#       ст. 7 (ограничения), ст. 11 п. 1 пп. 1)–5), п. 4 (квалификационные требования и их подтверждение),
#       ст. 25 п. 1 (обжалование — 3 рабочих дня со дня размещения протокола об итогах).
#   - Правила осуществления государственных закупок, приказ Министра финансов РК от 9 октября 2024 года № 687 —
#     https://adilet.zan.kz/rus/docs/V2400035238
#       п. 104 (обеспечение: 1 % — конкурс, аукцион; 3 % — запрос ценовых предложений и конкурс «под ключ»),
#       п. 105 (формы обеспечения: деньги в электронном кошельке, электронная банковская гарантия), п. 106 (округление),
#       п. 189 (заявка — электронный документ через веб-портал), п. 190, п. 191 (момент принятия), п. 193 (автоотклонение;
#       срок действия заявки — не менее 60 календарных дней), п. 195 (изменение/отзыв до окончательного срока);
#       приложение 4 (форма конкурсной документации), п. 18 — состав заявки на участие в конкурсе.
#   - Веб-портал государственных закупок — https://goszakup.gov.kz (открыт 28.09.2026).
# TODO(lawyer): состав заявки на аукцион и запрос ценовых предложений (главы 12–13 Правил) — сверить отдельно;
# особый порядок (ст. 26 Закона) не покрыт.
id: kz.services.tender_application
version: 0.1.0
ontology: SERVICES.PROCUREMENT.TENDER_APPLICATION
taxonomy: procurement.bid
jurisdiction: KZ
languages: [ru, kk]
owner: lawyer:kz-01
reviewed_at: null
published: false  # beta: offered only with EXPERIMENTAL_SCENARIOS=true
beta: true
kind: service
title:
  ru: Заявка на участие в госзакупках
  kk: Мемлекеттік сатып алуға қатысуға өтінім
summary:
  ru: Помощь в подготовке пакета к тендеру на goszakup.gov.kz — сопроводительное письмо, чек-лист квалификационных документов, опись, шаблон технической спецификации и пояснение про обеспечение заявки.
  kk: goszakup.gov.kz порталындағы тендерге топтама дайындауға көмек — ілеспе хат, біліктілік құжаттарының тізімі, тізімдеме, техникалық ерекшелік үлгісі және өтінімді қамтамасыз ету туралы түсіндірме.
disclaimer:
  ru: "Бета. Konsiliér AI — IT-сервис: помогаем подготовить документы по вашим данным и официальным требованиям. Это не юридическая помощь. Победу в закупке мы не обещаем, результат не гарантируется: итоги определяют комиссия и веб-портал. Сверьте требования с документацией вашей закупки."
  kk: "Бета. Konsiliér AI — IT-сервис: сіздің деректеріңіз бен ресми талаптар бойынша құжаттарды дайындауға көмектесеміз. Бұл заң көмегі емес. Сатып алуда жеңіске уәде бермейміз, нәтижеге кепілдік берілмейді: қорытындыны комиссия мен веб-портал анықтайды. Талаптарды өз сатып алуыңыздың құжаттамасымен салыстырыңыз."
sources:
  - {title: {ru: "Закон РК «О государственных закупках» (ИПС «Әділет»)", kk: "ҚР «Мемлекеттік сатып алу туралы» Заңы (ӘАЖ «Әділет»)"}, url: "https://adilet.zan.kz/rus/docs/Z2400000106", checked_on: 2026-09-28}
  - {title: {ru: "Правила осуществления государственных закупок, приказ МФ РК № 687 (ИПС «Әділет»)", kk: "Мемлекеттік сатып алуды жүзеге асыру қағидалары, ҚР ҚМ № 687 бұйрығы (ӘАЖ «Әділет»)"}, url: "https://adilet.zan.kz/rus/docs/V2400035238", checked_on: 2026-09-28}
  - {title: {ru: "Веб-портал государственных закупок", kk: "Мемлекеттік сатып алу веб-порталы"}, url: "https://goszakup.gov.kz", checked_on: 2026-09-28}
classification:
  keywords:
    ru: [тендер, госзакуп, гос закуп, goszakup, госзакупк, конкурсная документация, конкурсную документацию, аукцион на портале, запрос ценовых предложений, потенциальный поставщик, заявку на участие в конкурсе]
    kk: [тендер, мемлекеттік сатып алу, конкурстық құжаттама]
  examples:
    ru:
      - Хочу подать заявку на тендер на goszakup, помогите собрать документы
      - Наше ТОО участвует в госзакупках, нужна заявка на конкурс и опись документов
    kk:
      - Мемлекеттік сатып алуға тендерлік өтінім дайындау керек
  not_when:
    ru:
      - "Заявку уже отклонили или итоги закупки уже подведены, человек хочет обжаловать → жалоба на итоги госзакупок"
    kk:
      - "Өтінім қабылданбаған не қорытынды шыққан, шағым керек → сатып алу қорытындысына шағым"
intake:
  - tender_number: {label: {ru: Номер объявления о закупке, kk: Сатып алу хабарландыруының нөмірі}, question: {ru: "Номер объявления о закупке на портале goszakup.gov.kz (и номер лота, если есть)?", kk: "goszakup.gov.kz порталындағы сатып алу хабарландыруының нөмірі (бар болса, лот нөмірі)?"}}
  - customer_name: {label: {ru: Заказчик (организатор), kk: Тапсырыс беруші (ұйымдастырушы)}, question: {ru: "Кто заказчик или организатор закупки (название из объявления)?", kk: "Сатып алудың тапсырыс берушісі немесе ұйымдастырушысы кім (хабарландырудағы атауы)?"}}
  - lot_subject: {label: {ru: Предмет закупки, kk: Сатып алу нысанасы}, question: {ru: "Что закупают: товар, работа или услуга — кратко, как в объявлении?", kk: "Не сатып алынады: тауар, жұмыс не көрсетілетін қызмет — хабарландырудағыдай қысқаша?"}}
  - procurement_method: {label: {ru: Способ закупки, kk: Сатып алу тәсілі}, question: {ru: "Способ закупки: конкурс, аукцион или запрос ценовых предложений?", kk: "Сатып алу тәсілі: конкурс, аукцион немесе баға ұсыныстарын сұрату?"}}
  - allocated_amount: {type: money, currency: KZT, label: {ru: "Сумма, выделенная на лот", kk: "Лотқа бөлінген сома"}, question: {ru: "Какая сумма выделена на лот, в тенге (из объявления)?", kk: "Лотқа қанша сома бөлінген, теңгемен (хабарландырудан)?"}}
  - experience_description: {type: longtext, label: {ru: Опыт и ресурсы, kk: Тәжірибе және ресурстар}, question: {ru: "Кратко: ваш опыт аналогичных поставок или работ, сотрудники и оборудование. Пишите только то, что можете подтвердить документами.", kk: "Қысқаша: ұқсас жеткізілімдер не жұмыстар бойынша тәжірибеңіз, қызметкерлер мен жабдықтар. Құжатпен растай алатыныңызды ғана жазыңыз."}}
  - permit_name: {optional: true, label: {ru: Разрешение (лицензия) или уведомление, kk: Рұқсат (лицензия) немесе хабарлама}, question: {ru: "Нужна ли для этого вида деятельности лицензия или уведомление? Если да — какая и её номер. Если нет — нажмите «Пропустить».", kk: "Бұл қызмет түріне лицензия не хабарлама керек пе? Керек болса — қандай және нөмірі. Керек болмаса — «Өткізу» батырмасын басыңыз."}}
  - subcontractors: {optional: true, label: {ru: Субподрядчики (соисполнители), kk: Қосалқы мердігерлер (бірлесіп орындаушылар)}, question: {ru: "Будете привлекать субподрядчиков или соисполнителей? Если да — кого и на какие работы. Если нет — «Пропустить».", kk: "Қосалқы мердігерлерді не бірлесіп орындаушыларды тартасыз ба? Иә болса — кімді және қандай жұмысқа. Жоқ болса — «Өткізу»."}}
  - applicant_name: {pii: person, label: {ru: Участник (ИП или ТОО), kk: Қатысушы (ЖК немесе ЖШС)}, question: {ru: "Полное наименование участника (ТОО или ИП)?", kk: "Қатысушының толық атауы (ЖШС немесе ЖК)?"}}
  - applicant_bin: {pii: id_number, pattern: '^\d{12}$', label: {ru: БИН/ИИН участника, kk: Қатысушының БСН/ЖСН}, question: {ru: "БИН (для ТОО) или ИИН (для ИП) — 12 цифр?", kk: "БСН (ЖШС үшін) немесе ЖСН (ЖК үшін) — 12 цифр?"}}
  - representative: {pii: person, label: {ru: Руководитель, kk: Басшы}, question: {ru: "ФИО и должность руководителя, который подписывает документы ЭЦП?", kk: "Құжаттарға ЭЦҚ-мен қол қоятын басшының аты-жөні және лауазымы?"}}
  - applicant_address: {pii: address, label: {ru: Юридический адрес, kk: Заңды мекенжай}, question: {ru: "Юридический адрес участника?", kk: "Қатысушының заңды мекенжайы?"}}
  - applicant_phone: {type: phone, pii: phone}
  - applicant_email: {type: email, pii: email, optional: true, label: {ru: E-mail, kk: E-mail}, question: {ru: "E-mail для связи (или «Пропустить»)?", kk: "Байланыс e-mail (немесе «Өткізу»)?"}}
parties:
  applicant: {kind: business, name_field: applicant_name, id_field: applicant_bin, address_field: applicant_address, email_field: applicant_email}
  customer: {kind: authority, name_field: customer_name}
actions:
  - id: tender_package
    title: {ru: Пакет документов к заявке на госзакупки, kk: Мемлекеттік сатып алуға өтінімнің құжаттар топтамасы}
    template: kz/templates/services/package.docx
    channel: user_submits
    addressee: {party: customer}
    instructions:
      ru:
        - "Заявка подаётся только в электронном виде на портале goszakup.gov.kz и подписывается ЭЦП участника до окончательного срока, указанного в объявлении."
        - "Проверьте каждый пункт чек-листа по конкурсной (аукционной) документации вашей закупки: у заказчика могут быть дополнительные требования."
        - "Нажмите «Документ подан», когда портал пришлёт уведомление о принятии заявки. Победу мы не гарантируем."
      kk:
        - "Өтінім тек электрондық түрде goszakup.gov.kz порталында беріледі және хабарландыруда көрсетілген түпкілікті мерзімге дейін қатысушының ЭЦҚ-сымен қол қойылады."
        - "Тізімнің әр тармағын өз сатып алуыңыздың конкурстық (аукциондық) құжаттамасымен тексеріңіз: тапсырыс берушінің қосымша талаптары болуы мүмкін."
        - "Портал өтінімнің қабылданғаны туралы хабарлама жібергенде «Құжат тапсырылды» батырмасын басыңыз. Жеңіске кепілдік бермейміз."
    package:
      - id: cover_letter
        title: {ru: Сопроводительное письмо к заявке, kk: Өтінімге ілеспе хат}
        signature: true
        text:
          - ru: "{applicant_name} (БИН/ИИН {applicant_bin}) в лице {representative} направляет заявку на участие в государственных закупках по объявлению № {tender_number} ({procurement_method}). Предмет закупки: {lot_subject}. Сумма, выделенная на лот: {allocated_amount} тенге."
            kk: "{applicant_name} (БСН/ЖСН {applicant_bin}) {representative} атынан № {tender_number} хабарландыру бойынша ({procurement_method}) мемлекеттік сатып алуға қатысуға өтінім жібереді. Сатып алу нысанасы: {lot_subject}. Лотқа бөлінген сома: {allocated_amount} теңге."
          - {ru: "{narrative}", kk: "{narrative}"}
          - ru: "Заявка представлена в форме электронного документа посредством веб-портала государственных закупок и подписана электронной цифровой подписью. Настоящее письмо является сопроводительным и не заменяет электронную заявку."
            kk: "Өтінім мемлекеттік сатып алу веб-порталы арқылы электрондық құжат нысанында ұсынылды және электрондық цифрлық қолтаңбамен қол қойылды. Осы хат ілеспе хат болып табылады және электрондық өтінімді алмастырмайды."
      - id: qualification_checklist
        title: {ru: Чек-лист квалификационных документов, kk: Біліктілік құжаттарының тізімі}
        text:
          - ru: "Квалификационные требования — статья 11 Закона РК «О государственных закупках»; состав заявки на конкурс — пункт 18 формы конкурсной документации (приложение 4 к Правилам осуществления государственных закупок). Окончательный перечень — в документации вашей закупки."
            kk: "Біліктілік талаптары — ҚР «Мемлекеттік сатып алу туралы» Заңының 11-бабы; конкурсқа өтінімнің құрамы — конкурстық құжаттама нысанының 18-тармағы (Мемлекеттік сатып алуды жүзеге асыру қағидаларына 4-қосымша). Түпкілікті тізбе — өз сатып алуыңыздың құжаттамасында."
        check:
          - ru: "Правоспособность: сведения о государственной регистрации (для ТОО — справка о регистрации, устав, если он не типовой; для ИП — уведомление о начале деятельности)."
            kk: "Құқық қабілеттілігі: мемлекеттік тіркеу туралы мәліметтер (ЖШС үшін — тіркеу туралы анықтама, үлгілік болмаса — жарғы; ЖК үшін — қызметті бастағаны туралы хабарлама)."
          - ru: "Разрешение (лицензия) или уведомление: {permit_name}. Если сведений нет в государственных цифровых системах — электронная или нотариальная копия (ст. 11 п. 4 Закона)."
            kk: "Рұқсат (лицензия) немесе хабарлама: {permit_name}. Мемлекеттік цифрлық жүйелерде мәлімет болмаса — электрондық немесе нотариат куәландырған көшірме (Заңның 11-бабы 4-тармағы)."
            if: permit_name
          - ru: "Нет налоговой задолженности больше шестикратного МРП; финансовую устойчивость портал определяет автоматически (ст. 11 п. 1 пп. 2 Закона). Проверить задолженность можно на egov.kz."
            kk: "Алты еселенген АЕК-тен асатын салық берешегі жоқ; қаржылық тұрақтылықты портал автоматты түрде анықтайды (Заңның 11-бабы 1-тармағының 2-тармақшасы). Берешекті egov.kz-те тексеруге болады."
          - ru: "Участник не находится в процедуре банкротства или ликвидации (ст. 11 п. 1 пп. 3 Закона)."
            kk: "Қатысушыға қатысты банкроттық не тарату рәсімі жүргізілмейді (Заңның 11-бабы 1-тармағының 3-тармақшасы)."
          - ru: "Материальные, трудовые и финансовые ресурсы для исполнения договора; нет просроченной задолженности по зарплате (ст. 11 п. 1 пп. 4 Закона)."
            kk: "Шартты орындауға жеткілікті материалдық, еңбек және қаржы ресурстары; жалақы бойынша мерзімі өткен берешек жоқ (Заңның 11-бабы 1-тармағының 4-тармақшасы)."
          - ru: "Опыт работы: учитываются только договоры госзакупок и иные договоры, сведения о которых есть в цифровых системах госорганов (ст. 11 п. 1 пп. 5 Закона)."
            kk: "Жұмыс тәжірибесі: тек мемлекеттік сатып алу шарттары және мәліметтері мемлекеттік органдардың цифрлық жүйелерінде бар өзге шарттар ескеріледі (Заңның 11-бабы 1-тармағының 5-тармақшасы)."
          - ru: "Субподрядчики (соисполнители): {subcontractors} — сведения по форме документации и документы об их соответствии квалификационным требованиям; на субподряд — не более 30 % объёма (п. 18 формы конкурсной документации)."
            kk: "Қосалқы мердігерлер (бірлесіп орындаушылар): {subcontractors} — құжаттама нысаны бойынша мәліметтер және олардың біліктілік талаптарына сәйкестігін растайтын құжаттар; қосалқы мердігерлікке — көлемнің 30 %-ынан аспайды (конкурстық құжаттама нысанының 18-тармағы)."
            if: subcontractors
          - {ru: "Техническая спецификация по форме документации — на каждый лот отдельно.", kk: "Құжаттама нысаны бойынша техникалық ерекшелік — әр лотқа жеке."}
          - {ru: "Обеспечение заявки (см. раздел «Гарантийное обеспечение»).", kk: "Өтінімді қамтамасыз ету («Кепілдік қамтамасыз ету» бөлімін қараңыз)."}
          - {ru: "Ценовое предложение в форме электронного документа — по форме документации.", kk: "Электрондық құжат нысанындағы баға ұсынысы — құжаттама нысаны бойынша."}
          - {ru: "Информация о бенефициарном владении — по форме конкурсной документации.", kk: "Бенефициарлық иелену туралы ақпарат — конкурстық құжаттама нысаны бойынша."}
          - {ru: "Действующая ЭЦП руководителя (юридического лица) и регистрация на веб-портале госзакупок.", kk: "Басшының (заңды тұлғаның) қолданыстағы ЭЦҚ-сы және мемлекеттік сатып алу веб-порталында тіркелу."}
          - {ru: "Срок действия заявки — не менее 60 календарных дней с даты вскрытия заявок (п. 193 Правил).", kk: "Өтінімнің қолданылу мерзімі — өтінімдер ашылған күннен бастап кемінде 60 күнтізбелік күн (Қағидалардың 193-тармағы)."}
      - id: inventory
        title: {ru: Опись документов заявки, kk: Өтінім құжаттарының тізімдемесі}
        signature: true
        text:
          - {ru: "Закупка № {tender_number}. Заказчик (организатор): {customer_name}. Участник: {applicant_name}.", kk: "№ {tender_number} сатып алу. Тапсырыс беруші (ұйымдастырушы): {customer_name}. Қатысушы: {applicant_name}."}
        check:
          - {ru: "Сопроводительное письмо", kk: "Ілеспе хат"}
          - {ru: "Документы о правоспособности (регистрация, устав при необходимости)", kk: "Құқық қабілеттілігі туралы құжаттар (тіркеу, қажет болса — жарғы)"}
          - {ru: "Разрешение (лицензия) или уведомление: {permit_name}", kk: "Рұқсат (лицензия) немесе хабарлама: {permit_name}", if: permit_name}
          - {ru: "Сведения о квалификации и опыте работы по формам документации", kk: "Құжаттама нысандары бойынша біліктілік және жұмыс тәжірибесі туралы мәліметтер"}
          - {ru: "Сведения о субподрядчиках (соисполнителях) и их документы", kk: "Қосалқы мердігерлер (бірлесіп орындаушылар) туралы мәліметтер және олардың құжаттары", if: subcontractors}
          - {ru: "Техническая спецификация", kk: "Техникалық ерекшелік"}
          - {ru: "Обеспечение заявки (электронная банковская гарантия или деньги в электронном кошельке)", kk: "Өтінімді қамтамасыз ету (электрондық банк кепілдігі немесе электрондық әмияндағы ақша)"}
          - {ru: "Ценовое предложение", kk: "Баға ұсынысы"}
          - {ru: "Информация о бенефициарном владении", kk: "Бенефициарлық иелену туралы ақпарат"}
          - {ru: "Иные документы по документации закупки: ____________", kk: "Сатып алу құжаттамасы бойынша өзге құжаттар: ____________"}
      - id: tech_spec
        title: {ru: Техническая спецификация — шаблон заполнения, kk: Техникалық ерекшелік — толтыру үлгісі}
        text:
          - {ru: "Лот: {lot_subject}. Заполняйте по форме технической спецификации из документации вашей закупки, на каждый лот отдельно.", kk: "Лот: {lot_subject}. Өз сатып алуыңыздың құжаттамасындағы техникалық ерекшелік нысаны бойынша, әр лотқа жеке толтырыңыз."}
        check:
          - {ru: "Наименование и описание товара (работы, услуги) — как в спецификации заказчика: ____________", kk: "Тауардың (жұмыстың, қызметтің) атауы мен сипаттамасы — тапсырыс берушінің ерекшелігіндегідей: ____________"}
          - {ru: "Национальные стандарты, при их отсутствии — межгосударственные; если стандартов нет — функциональные, технические, качественные и эксплуатационные характеристики: ____________", kk: "Ұлттық стандарттар, олар болмаса — мемлекетаралық; стандарттар болмаса — функционалдық, техникалық, сапалық және пайдалану сипаттамалары: ____________"}
          - {ru: "Количество (объём) и единица измерения: ____________", kk: "Саны (көлемі) және өлшем бірлігі: ____________"}
          - {ru: "Срок и место поставки (выполнения работ, оказания услуг): ____________", kk: "Жеткізу (жұмыстарды орындау, қызмет көрсету) мерзімі мен орны: ____________"}
          - {ru: "Документы о соответствии (сертификаты, паспорта), если их требует спецификация: ____________", kk: "Ерекшелік талап етсе, сәйкестік құжаттары (сертификаттар, паспорттар): ____________"}
          - {ru: "Каждый комплектующий товар — отдельно, если этого требует заказчик.", kk: "Тапсырыс беруші талап етсе, әр жинақтауыш тауар — жеке."}
      - id: security
        title: {ru: Гарантийное обеспечение заявки — пояснение, kk: Өтінімді кепілдік қамтамасыз ету — түсіндірме}
        text:
          - ru: "Размер (п. 104 Правил): 1 % от суммы, выделенной на лот, — при конкурсе и аукционе; 3 % — при запросе ценовых предложений и конкурсе по строительству «под ключ». По нескольким лотам обеспечение вносится на каждый лот отдельно. Сумма в тиынах округляется: меньше 50 тиын — до нуля, от 50 тиын — до одного тенге (п. 106)."
            kk: "Мөлшері (Қағидалардың 104-тармағы): конкурс пен аукционда — лотқа бөлінген соманың 1 %-ы; баға ұсыныстарын сұратуда және «бәрі дайын» құрылыс конкурсында — 3 %. Бірнеше лот бойынша қамтамасыз ету әр лотқа жеке енгізіледі. Тиынмен есептелген сома дөңгелектенеді: 50 тиыннан аз — нөлге дейін, 50 тиыннан бастап — бір теңгеге дейін (106-тармақ)."
          - ru: "Формы (п. 105 Правил): деньги в электронном кошельке участника или банковская гарантия в форме электронного документа. Соответствие обеспечения портал проверяет автоматически при подаче заявки."
            kk: "Нысандары (Қағидалардың 105-тармағы): қатысушының электрондық әмиянындағы ақша немесе электрондық құжат нысанындағы банк кепілдігі. Қамтамасыз етудің сәйкестігін портал өтінім берілгенде автоматты түрде тексереді."
          - ru: "Когда обеспечение удерживается и возвращается — глава 7 Правил и документация закупки; сверьтесь с текстом перед подачей."
            kk: "Қамтамасыз ету қашан ұсталады және қайтарылады — Қағидалардың 7-тарауы және сатып алу құжаттамасы; тапсыру алдында мәтінмен салыстырыңыз."
      - id: how_to_submit
        title: {ru: Где и как подать, kk: Қайда және қалай тапсыру керек}
        check:
          - {ru: "Войдите на портал goszakup.gov.kz с ЭЦП (нужна регистрация участника на портале).", kk: "goszakup.gov.kz порталына ЭЦҚ-мен кіріңіз (порталда қатысушы ретінде тіркелу керек)."}
          - {ru: "Откройте объявление № {tender_number} и создайте заявку по нужному лоту.", kk: "№ {tender_number} хабарландыруды ашып, қажетті лот бойынша өтінім жасаңыз."}
          - {ru: "Внесите обеспечение и загрузите документы по чек-листу; подпишите заявку ЭЦП до окончательного срока.", kk: "Қамтамасыз етуді енгізіп, тізім бойынша құжаттарды жүктеңіз; өтінімге түпкілікті мерзімге дейін ЭЦҚ-мен қол қойыңыз."}
          - {ru: "Заявка считается принятой в момент автоматического уведомления портала (п. 191 Правил). До окончательного срока её можно изменить или отозвать без потери обеспечения (п. 195).", kk: "Өтінім порталдың автоматты хабарламасы жіберілген сәтте қабылданды деп есептеледі (Қағидалардың 191-тармағы). Түпкілікті мерзімге дейін оны қамтамасыз етуді жоғалтпай өзгертуге немесе кері қайтарып алуға болады (195-тармақ)."}
          - {ru: "Не согласны с итогами — жалоба через портал в течение трёх рабочих дней со дня размещения протокола об итогах (ст. 25 Закона). Итоги, которые портал определяет автоматически, так не обжалуются.", kk: "Қорытындымен келіспесеңіз — қорытынды хаттама орналастырылған күннен бастап үш жұмыс күні ішінде портал арқылы шағым (Заңның 25-бабы). Портал автоматты түрде анықтаған қорытындылар бұл тәртіппен шағымданылмайды."}
