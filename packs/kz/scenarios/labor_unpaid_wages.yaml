# Опубликован 28.09.2026 по решению владельца. reviewed_at: null → на каждом документе нейтральная пометка compliance.draft_disclaimer.
# Сроки ответа не заданы — в законе не найдены; вносит только юрист (TODO(lawyer)), LLM их не генерирует.
# Нормы проверены 28.09.2026 по официальному тексту ИПС «Әділет» (страница акта открыта, номер статьи — как в тексте):
#   - Трудовой кодекс РК — https://adilet.zan.kz/rus/docs/K1500000414
#     ст. 113, п. 1 (зарплата — не реже одного раза в месяц не позже первой декады следующего месяца), п. 3 (задолженность
#     и пеня за период задержки); ст. 191, 193 (государственные инспекторы труда, предписания).
#     01.10.2026 (юрист, team/zann/lawyer/notes/02-labor.md §9; сверено там же): ст. 113 п. 3 (пеня), ст. 159
#     (согласительная комиссия), ст. 160 (сроки; примечание ИЗПИ о НП КС от 08.06.2026 № 81-НП — зарплату можно
#     взыскать в пределах трёхлетнего срока исковой давности, ГК ст. 178), ст. 195 п. 1 пп. 1) (предписание о выплате
#     работодателем заработной платы), ст. 198 п. 3; НК 2025 — https://adilet.zan.kz/rus/docs/K2500000214, ст. 668
#     пп. 1) (истцы по искам о взыскании оплаты труда освобождены от госпошлины).
# Расчёт при увольнении — отдельный сценарий kz.labor.final_settlement.
#   - АППК РК, ст. 63 (реквизиты обращения: ФИО, ИИН, почтовый адрес заявителя; наименование органа; суть; дата; подпись),
#     ст. 76, ч. 1 (обращение рассматривается 15 рабочих дней со дня регистрации, если иное не предусмотрено законами) —
#     https://adilet.zan.kz/rus/docs/K2000000350, открыт 28.09.2026 (срок жалобы в госорган — deadline по ст. 76).
id: kz.labor.unpaid_wages
version: 0.1.0
ontology: LABOR.WAGES.UNPAID
taxonomy: labor.unpaid_wages
jurisdiction: KZ
languages: [ru, kk]
owner: lawyer:kz-01
reviewed_at: null
published: true
title:
  ru: Невыплата зарплаты
  kk: Жалақының төленбеуі
summary:
  ru: Вы работаете, а работодатель задерживает или не выплачивает заработную плату.
  kk: Сіз жұмыс істейсіз, ал жұмыс беруші жалақыны кешіктіреді немесе төлемейді.
classification:
  keywords:
    ru: [зарплат, заработн, не платят, задерживают, работодател]
    kk: [жалақы, төлемейді, жұмыс беруші]
  examples:
    ru:
      - Третий месяц не платят зарплату, работодатель обещает, но не платит
claim:
  type: wages
  amount_field: amount
intake:
  - respondent_name
  - respondent_bin: {optional: true, pattern: '^\d{12}$'}
  - respondent_address: {optional: true}
  - event_date: {type: date}
  - amount: {type: money, currency: KZT, question: {ru: "Какую сумму вам не выплатили, в тенге?", kk: "Сізге қанша сома төленбеді, теңгемен?"}}
  - problem_description: {type: longtext}
  - applicant_name: {pii: person}
  - applicant_iin: {optional: true, pii: id_number, pattern: '^\d{12}$'}
  - applicant_address: {pii: address}
  - applicant_phone: {type: phone, pii: phone}
  - evidence: [employment_contract, pay_slip, correspondence]
parties:
  applicant: {kind: person, name_field: applicant_name, id_field: applicant_iin, address_field: applicant_address}
  respondent: {kind: business, name_field: respondent_name, id_field: respondent_bin, address_field: respondent_address}
actions:
  - id: statement_to_employer
    title: {ru: Письменное требование работодателю о выплате, kk: Жұмыс берушіге төлем туралы жазбаша талап}
    template: kz/templates/generic/statement.docx
    channel: user_submits
    addressee: {party: respondent}
    norm_refs:
      - "Трудовой кодекс Республики Казахстан, статья 113"
    demands:
      ru: "выплатить мне задолженность по заработной плате в размере {amount} {currency} и пеню за период задержки платежа и сообщить о принятом решении письменно."
    instructions:
      ru:
        - "По закону зарплата выплачивается не реже одного раза в месяц, не позже первой декады следующего месяца; за задержку работодатель выплачивает долг и пеню (ТК, ст. 113 п. 3)."
        - "Если в организации есть согласительная комиссия, спор о зарплате можно подать и туда (ТК, ст. 159); её нет, например, у микропредприятий и некоммерческих организаций с численностью до 15 работников."
        - "Распечатайте требование в двух экземплярах и подпишите оба."
        - "Вручите один экземпляр работодателю ({addressee}) и попросите поставить на втором отметку о принятии: дата, ФИО, подпись."
        - "Нажмите «Документ подан». Срок ответа работодателя в законе не указан — его уточнит юрист."
      kk:
        - "Заң бойынша жалақы айына кемінде бір рет, келесі айдың бірінші онкүндігінен кешіктірілмей төленеді; кешіктіргені үшін жұмыс беруші берешекті және өсімпұлды төлейді (ЕК, 113-бап 3-тармақ)."
        - "Ұйымда келісім комиссиясы болса, жалақы туралы дауды сонда да беруге болады (ЕК, 159-бап); мысалы, шағын кәсіпкерлік субъектілерінде және қызметкерлері 15-тен аспайтын коммерциялық емес ұйымдарда ол жоқ."
        - "Талапты екі данада басып шығарып, екеуіне де қол қойыңыз."
        - "Бір данасын жұмыс берушіге ({addressee}) беріп, екіншісіне қабылдағаны туралы белгі қоюын сұраңыз: күні, аты-жөні, қолы."
        - "«Құжат тапсырылды» батырмасын басыңыз. Жауап мерзімін заңгер нақтылайды."
  - id: complaint_labor_inspection
    when: statement_to_employer.response in [none, refusal, partial]
    title: {ru: Жалоба в инспекцию труда, kk: Еңбек инспекциясына шағым}
    template: kz/templates/generic/complaint.docx
    channel: user_submits
    addressee: {forum: kz.labor_inspection}
    deadline: {business_days: 15, norm_ref: "Административный процедурно-процессуальный кодекс Республики Казахстан, статья 76"}
    norm_refs:
      - "Трудовой кодекс Республики Казахстан, статья 113"
      - "Трудовой кодекс Республики Казахстан, статья 193"
      - "Трудовой кодекс Республики Казахстан, статья 195"
    demands:
      ru: "провести проверку соблюдения трудового законодательства работодателем и принять меры для выплаты мне задолженности по заработной плате, в том числе вынести работодателю предписание о выплате заработной платы (ТК, ст. 195 п. 1 пп. 1)); о результатах сообщить мне."
    instructions:
      ru:
        - "Подайте жалобу через портал обращений или лично. Точный канал подачи уточнит юрист."
        - "Приложите требование работодателю с отметкой о принятии и доказательства."
        - "Сохраните регистрационный номер и нажмите «Документ подан»."
        - "Если не поможет — иск в суд: по искам о взыскании оплаты труда госпошлина не платится (Налоговый кодекс 2025, ст. 668 пп. 1)); зарплату можно взыскать в пределах трёх лет (ТК, ст. 160 с учётом НП Конституционного Суда от 08.06.2026 № 81-НП)."
      kk:
        - "Шағымды өтініштер порталы арқылы не өзіңіз беріңіз. Нақты беру арнасын заңгер нақтылайды."
        - "Жұмыс берушіге берілген, қабылданғаны туралы белгісі бар талапты және дәлелдерді тіркеңіз."
        - "Тіркеу нөмірін сақтап, «Құжат тапсырылды» батырмасын басыңыз."
        - "Көмектеспесе — сотқа талап: еңбекақыны өндіріп алу туралы талаптар бойынша мемлекеттік баж төленбейді (2025 жылғы Салық кодексі, 668-бап 1) тармақша); жалақыны үш жыл ішінде өндіріп алуға болады (ЕК, 160-бап, Конституциялық Соттың 08.06.2026 № 81-НҚ ескерілген)."
  - id: handoff_lawyer
    kind: handoff
    when: complaint_labor_inspection.response in [none, refusal, partial]
    title: {ru: Передача дела юристу (иск в суд), kk: Істі заңгерге беру (сотқа талап қою)}
pricing: {model: fixed, amount: 1990, currency: KZT}
