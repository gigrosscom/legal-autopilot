# Срок ответа: согласительная комиссия — 15 рабочих дней (ТК ст. 159; ZANN, old.adilet 02.10.2026). Срок обращения — ТК ст. 160.
# Нормы проверены 28.09.2026 по официальному тексту ИПС «Әділет» (страница акта открыта, номер статьи — как в тексте):
#   - Трудовой кодекс РК — https://adilet.zan.kz/rus/docs/K1500000414
#     ст. 113, п. 1 (зарплата — не реже одного раза в месяц не позже первой декады следующего месяца), п. 3 (задолженность
#     и пеня за период задержки); ст. 191, 193 (государственные инспекторы труда, предписания).
#     01.10.2026 (юрист, team/zann/lawyer/notes/02-labor.md §9; сверено там же): ст. 113 п. 3 (пеня), ст. 159
#     (согласительная комиссия), ст. 160 (сроки; примечание ИЗПИ о НП КС от 08.06.2026 № 81-НП — зарплату можно
#     взыскать в пределах трёхлетнего срока исковой давности, ГК ст. 178), ст. 195 п. 1 пп. 1) (предписание о выплате
#     работодателем заработной платы), ст. 198 п. 3; НК 2025 — https://adilet.zan.kz/rus/docs/K2500000214, ст. 668
#     пп. 1) (истцы по искам о взыскании оплаты труда освобождены от госпошлины).
# Расчёт при увольнении — отдельный сценарий kz.labor.final_settlement.
#   - АППК РК, ст. 63 (реквизиты обращения: ФИО, ИИН, почтовый адрес заявителя; наименование органа; суть; дата; подпись),
#     ст. 76, ч. 1 (обращение рассматривается 15 рабочих дней со дня регистрации, если иное не предусмотрено законами) —
#     https://adilet.zan.kz/rus/docs/K2000000350, открыт 28.09.2026 (срок жалобы в госорган — deadline по ст. 76).
id: kz.labor.unpaid_wages
version: 0.1.0
ontology: LABOR.WAGES.UNPAID
taxonomy: labor.unpaid_wages
jurisdiction: KZ
languages: [ru, kk]
owner: lawyer:kz-01
reviewed_at: null
published: true
title:
  ru: Невыплата зарплаты
  kk: Жалақының төленбеуі
summary:
  ru: Вы работаете, а работодатель задерживает или не выплачивает заработную плату.
  kk: Сіз жұмыс істейсіз, ал жұмыс беруші жалақыны кешіктіреді немесе төлемейді.
classification:
  keywords:
    ru: [зарплат, заработн, не платят, задерживают, работодател, не выплатили, бригад, устной договор, без договора работал, за объект]
    kk: [жалақы, төлемейді, жұмыс беруші, жалақы бермеді, ауызша келісім]
  examples:
    kk:
      - "Жұмыс беруші үш ай бойы жалақы төлемейді"
    ru:
      - Третий месяц не платят зарплату, работодатель обещает, но не платит
      - "Бригаде строителей не выплатили за объект, работали по устной договорённости с ТОО"
  not_when:
    ru:
      - "Человека уволили или вынуждают уволиться и он хочет восстановиться → незаконное увольнение"
claim:
  type: wages
  amount_field: amount
intake:
  - respondent_name
  - respondent_bin: {optional: true, pattern: '^\d{12}$'}
  - respondent_address: {optional: true}
  - event_date: {type: date}
  - amount: {type: money, currency: KZT, question: {ru: "Какую сумму вам не выплатили, в тенге?", kk: "Сізге қанша сома төленбеді, теңгемен?"}}
  - problem_description: {type: longtext}
  - applicant_name: {pii: person}
  - applicant_iin: {optional: true, pii: id_number, pattern: '^\d{12}$'}
  - applicant_address: {pii: address}
  - applicant_phone: {type: phone, pii: phone}
  - evidence: [employment_contract, pay_slip, correspondence]
parties:
  applicant: {kind: person, name_field: applicant_name, id_field: applicant_iin, address_field: applicant_address}
  respondent: {kind: business, name_field: respondent_name, id_field: respondent_bin, address_field: respondent_address}
actions:
  - id: statement_to_employer
    title: {ru: Письменное требование работодателю о выплате, kk: Жұмыс берушіге төлем туралы жазбаша талап}
    template: kz/templates/generic/statement.docx
    channel: user_submits
    addressee: {party: respondent}
    deadline: {business_days: 15, norm_ref: "Трудовой кодекс Республики Казахстан, статья 159"}
    filing:
      deadline: {calendar_days: 365, from_field: event_date, from_text: {ru: "со дня, когда вы узнали о нарушении (зарплату суд взыщет и за 3 года)", kk: "бұзушылық туралы білген күннен бастап (жалақыны сот 3 жыл үшін де өндіреді)"}, norm_ref: "Трудовой кодекс Республики Казахстан, статья 160", verified: true}
      signature: either
    norm_refs:
      - "Трудовой кодекс Республики Казахстан, статья 113"
      - "Трудовой кодекс Республики Казахстан, статья 159"
    demands:
      ru: "выплатить мне задолженность по заработной плате в размере {amount} {currency} и пеню за период задержки платежа и сообщить о принятом решении письменно."
    instructions:
      ru:
        - "**Проверьте, куда подавать.** Если в организации есть согласительная комиссия — требование подают в неё: без этого суд не примет иск; комиссия рассматривает спор 15 рабочих дней (ТК, ст. 159). Её нет у микропредприятий, НКО и филиалов иностранных компаний до 15 работников — тогда требование вручают работодателю."
        - "**Распечатайте и подпишите.** Два экземпляра, подпись на обоих."
        - "**Вручите работодателю ({addressee}).** Один экземпляр отдайте, на втором попросите отметку о принятии: дата, ФИО, подпись. Или отправьте заказным письмом с уведомлением о вручении."
        - "**Нажмите «Документ подан».** Отсчитаем 15 рабочих дней и напомним. Не выплатят — следующий шаг: жалоба в инспекцию труда."
        - "**Что говорит закон.** Зарплата выплачивается не реже раза в месяц, не позже первой декады следующего месяца; за задержку работодатель платит долг и пеню (ТК, ст. 113 п. 3)."
      kk:
        - "**Қайда беру керегін тексеріңіз.** Ұйымда келісім комиссиясы болса — талап соған беріледі: онсыз сот талап арызды қабылдамайды; комиссия дауды 15 жұмыс күнінде қарайды (ЕК, 159-бап). Шағын кәсіпкерлік субъектілерінде, ҚЕҰ-да және қызметкерлері 15-тен аспайтын шетелдік компания филиалдарында ол жоқ — онда талап жұмыс берушіге беріледі."
        - "**Басып шығарып, қол қойыңыз.** Екі дана, екеуіне де қол қойыңыз."
        - "**Жұмыс берушіге ({addressee}) табыс етіңіз.** Бір данасын беріп, екіншісіне қабылдау белгісін сұраңыз: күні, аты-жөні, қолы. Не табыс етілгені туралы хабарламасы бар тапсырыс хатпен жіберіңіз."
        - "**«Құжат тапсырылды» батырмасын басыңыз.** 15 жұмыс күнін есептеп, еске саламыз. Төлемесе — келесі қадам: еңбек инспекциясына шағым."
        - "**Заң не дейді.** Жалақы айына кемінде бір рет, келесі айдың бірінші онкүндігінен кешіктірілмей төленеді; кешіктіргені үшін жұмыс беруші берешек пен өсімпұл төлейді (ЕК, 113-бап 3-тармақ)."
  - id: complaint_labor_inspection
    when: statement_to_employer.response in [none, refusal, partial]
    title: {ru: Жалоба в инспекцию труда, kk: Еңбек инспекциясына шағым}
    template: kz/templates/generic/complaint.docx
    channel: user_submits
    addressee: {forum: kz.labor_inspection}
    deadline: {business_days: 15, norm_ref: "Административный процедурно-процессуальный кодекс Республики Казахстан, статья 76"}
    norm_refs:
      - "Трудовой кодекс Республики Казахстан, статья 113"
      - "Трудовой кодекс Республики Казахстан, статья 193"
      - "Трудовой кодекс Республики Казахстан, статья 195"
    demands:
      ru: "провести проверку соблюдения трудового законодательства работодателем и принять меры для выплаты мне задолженности по заработной плате, в том числе вынести работодателю предписание о выплате заработной платы (ТК, ст. 195 п. 1 пп. 1)); о результатах сообщить мне."
    instructions:
      ru:
        - "**Подайте жалобу в инспекцию труда.** Через портал обращений eotinish.kz (вход по ЭЦП или SMS) или лично в инспекции труда вашего города."
        - "**Приложите доказательства.** Требование работодателю с отметкой о принятии, трудовой договор, расчётные листы, переписку."
        - "**Сохраните номер и нажмите «Документ подан».** Инспекция отвечает за 15 рабочих дней (АППК, ст. 76) — мы напомним."
        - "**Если не поможет — иск в суд.** По искам о взыскании оплаты труда госпошлина не платится (НК 2025, ст. 668 пп. 1)); зарплату можно взыскать за три года (ТК, ст. 160; НП КС от 08.06.2026 № 81-НП)."
      kk:
        - "**Еңбек инспекциясына шағым беріңіз.** eotinish.kz өтініштер порталы арқылы (ЭЦҚ не SMS арқылы кіру) немесе қалаңыздағы еңбек инспекциясына өзіңіз."
        - "**Дәлелдерді тіркеңіз.** Қабылдау белгісі бар жұмыс берушіге талап, еңбек шарты, есеп парақтары, хат алмасу."
        - "**Нөмірді сақтап, «Құжат тапсырылды» батырмасын басыңыз.** Инспекция 15 жұмыс күнінде жауап береді (ӘРПК, 76-бап) — біз еске саламыз."
        - "**Көмектеспесе — сотқа талап арыз.** Еңбекақыны өндіріп алу туралы талаптар бойынша мемлекеттік баж төленбейді (2025 СК, 668-бап 1) тармақша); жалақыны үш жыл үшін өндіруге болады (ЕК, 160-бап; ҚС 08.06.2026 № 81-НҚ)."
  - id: handoff_lawyer
    kind: handoff
    when: complaint_labor_inspection.response in [none, refusal, partial]
    title: {ru: Передача дела юристу (иск в суд), kk: Істі заңгерге беру (сотқа талап қою)}
pricing: {model: fixed, amount: 2990, currency: KZT}
