# Опубликован 28.09.2026 по решению владельца. reviewed_at: null → на каждом документе нейтральная пометка compliance.draft_disclaimer.
# Нормы по коммунальным начислениям НЕ проверены: отраслевые акты (естественные монополии, правила предоставления
# коммунальных услуг, учёт по приборам) — TODO(lawyer). Документ печатает «[норма: уточнит юрист]».
# Адресат жалобы — запись реестра kz.regulator.consumer (принимает housing.utilities), не проверена юристом.
#   - АППК РК, ст. 63 (реквизиты обращения: ФИО, ИИН, почтовый адрес заявителя; наименование органа; суть; дата; подпись),
#     ст. 76, ч. 1 (обращение рассматривается 15 рабочих дней со дня регистрации, если иное не предусмотрено законами) —
#     https://adilet.zan.kz/rus/docs/K2000000350, открыт 28.09.2026 (срок жалобы в госорган — deadline по ст. 76).
id: kz.housing.utility_billing
version: 0.1.0
ontology: HOUSING.UTILITIES.BILLING
taxonomy: housing.utilities
jurisdiction: KZ
languages: [ru, kk]
owner: lawyer:kz-01
reviewed_at: null
published: true
title:
  ru: Неверные начисления за коммунальные услуги
  kk: Коммуналдық қызметтер үшін қате есептеу
summary:
  ru: Поставщик воды, тепла, электроэнергии, газа или вывоза мусора начислил лишнее — не по счётчику, за услугу, которой не было, или долг, который вы уже оплатили. Вы хотите перерасчёт.
  kk: Су, жылу, электр, газ не қоқыс шығару жеткізушісі артық есептеді — есептегіш бойынша емес, болмаған қызмет үшін не төленген қарызды. Сіз қайта есептеуді қалайсыз.
classification:
  keywords:
    ru: [коммунал, начислили, перерасчёт, перерасчет, квитанци, счётчик, счетчик, отоплени, электроэнерги, газоснабжени, водоснабжени, вывоз мусора, алсеко]
    kk: [коммуналдық, қайта есептеу, есептегіш, түбіртек, жылу, электр]
  examples:
    ru:
      - Начислили за отопление в два раза больше, чем обычно, хотя счётчик стоит
      - В квитанции долг за воду, который я уже оплатил
    kk:
      - Есептегіш тұрса да, жылу үшін екі есе көп есептеді
claim:
  type: recalculation
  amount_field: amount
intake:
  - respondent_name: {label: {ru: Поставщик услуги, kk: Қызмет жеткізушісі}, question: {ru: "Какая организация выставила неверный счёт (поставщик услуги или расчётный центр)?", kk: "Қате шотты қай ұйым шығарды (қызмет жеткізушісі не есеп айырысу орталығы)?"}}
  - respondent_bin: {optional: true, pattern: '^\d{12}$'}
  - respondent_address: {optional: true}
  - event_date: {type: date, optional: true, label: {ru: Дата счёта, kk: Шот күні}, question: {ru: "За какой месяц или от какой даты неверный счёт? (ДД.ММ.ГГГГ) Или «пропустить».", kk: "Қате шот қай айға не қай күнге? (КК.АА.ЖЖЖЖ) Не «өткізу»."}}
  - amount: {type: money, currency: KZT, optional: true, question: {ru: "Какая сумма, по-вашему, начислена лишне, в тенге? Или «пропустить».", kk: "Сіздің ойыңызша, қанша сома артық есептелді, теңгемен? Не «өткізу»."}}
  - problem_description: {type: longtext}
  - applicant_name: {pii: person}
  - applicant_iin: {optional: true, pii: id_number, pattern: '^\d{12}$'}
  - applicant_address: {pii: address}
  - applicant_phone: {type: phone, pii: phone}
  - evidence: [utility_bill, receipt, photo, correspondence]
parties:
  applicant: {kind: person, name_field: applicant_name, id_field: applicant_iin, address_field: applicant_address}
  respondent: {kind: business, name_field: respondent_name, id_field: respondent_bin, address_field: respondent_address}
actions:
  - id: statement_to_supplier
    title: {ru: Заявление поставщику о перерасчёте, kk: Жеткізушіге қайта есептеу туралы арыз}
    template: kz/templates/generic/statement.docx
    channel: user_submits
    addressee: {party: respondent}
    norm_refs: [TODO]
    demands:
      ru: "провести перерасчёт платы за коммунальную услугу по моему лицевому счёту, исключить необоснованно начисленные суммы, представить мне письменный расчёт начислений; о принятом решении сообщить мне письменно."
    instructions:
      ru:
        - "Сфотографируйте показания счётчика с датой и сохраните квитанции об оплате."
        - "Подайте заявление в абонентский отдел поставщика ({addressee}) лично с отметкой о принятии на втором экземпляре или через официальный сайт/приложение и сохраните номер обращения."
        - "Нажмите «Документ подан». Срок ответа уточнит юрист."
      kk:
        - "Есептегіш көрсеткішін күнімен суретке түсіріп, төлем түбіртектерін сақтаңыз."
        - "Арызды жеткізушінің абоненттік бөліміне ({addressee}) екінші данаға қабылдау белгісін қойғызып өзіңіз не ресми сайт/қосымша арқылы беріп, өтініш нөмірін сақтаңыз."
        - "«Құжат тапсырылды» батырмасын басыңыз. Жауап мерзімін заңгер нақтылайды."
  - id: complaint_regulator
    when: statement_to_supplier.response in [none, refusal, partial]
    title: {ru: Жалоба в уполномоченный орган, kk: Уәкілетті органға шағым}
    template: kz/templates/generic/complaint.docx
    channel: user_submits
    addressee: {forum: kz.regulator.consumer}
    deadline: {business_days: 15, norm_ref: "Административный процедурно-процессуальный кодекс Республики Казахстан, статья 76"}
    norm_refs: [TODO]
    demands:
      ru: "проверить правильность начислений поставщика по моему лицевому счёту и принять меры для перерасчёта, о результатах сообщить мне."
    instructions:
      ru:
        - "Подайте жалобу через портал обращений. Точный орган (регулятор естественных монополий или орган по защите прав потребителей) уточнит юрист."
        - "Приложите заявление поставщику с отметкой о принятии, его ответ, квитанции и фото счётчика."
        - "Сохраните регистрационный номер и нажмите «Документ подан»."
      kk:
        - "Шағымды өтініштер порталы арқылы беріңіз. Нақты органды (табиғи монополияларды реттейтін орган не тұтынушылар құқығын қорғау органы) заңгер нақтылайды."
        - "Жеткізушіге берілген, қабылдау белгісі бар арызды, оның жауабын, түбіртектерді және есептегіштің фотосын тіркеңіз."
        - "Тіркеу нөмірін сақтап, «Құжат тапсырылды» батырмасын басыңыз."
  - id: handoff_lawyer
    kind: handoff
    when: complaint_regulator.response in [none, refusal, partial]
    title: {ru: Передача дела юристу, kk: Істі заңгерге беру}
pricing: {model: fixed, amount: 2990, currency: KZT}
