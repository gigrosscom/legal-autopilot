# Нормы проверены 28.09.2026 по официальному тексту ИПС «Әділет» (страница акта открыта, номер статьи — как в тексте):
#   - Закон РК «О защите прав потребителей» — https://adilet.zan.kz/rus/docs/Z100000274_
#     ст. 8 («Не допускается принуждение потребителя на заключение договоров на приобретение товаров (выполнение работ и
#     оказание услуг)»); ст. 8-1, п. 2, подп. 3) (условие о навязанных дополнительно возмездных услугах нарушает права
#     потребителя), п. 3 (убытки от таких условий возмещаются в полном объёме).
# TODO(lawyer): специальные нормы банковского и страхового законодательства (отказ от страхования, возврат премии,
# период охлаждения); для МФО срок ответа — Закон о МФО, ст. 17 (тоже 15 рабочих дней). В жалобе в АРРФР указаны
# те же ст. 8, 8-1 ЗПП (нарушение, на которое жалуются).
#   - АППК РК, ст. 63 (реквизиты обращения: ФИО, ИИН, почтовый адрес заявителя; наименование органа; суть; дата; подпись),
#     ст. 76, ч. 1 (обращение рассматривается 15 рабочих дней со дня регистрации, если иное не предусмотрено законами) —
#     https://adilet.zan.kz/rus/docs/K2000000350, открыт 28.09.2026 (срок жалобы в госорган — deadline по ст. 76).
#   - Закон РК «О банках и банковской деятельности в РК», ст. 31, п. 2, пп. 7) (обращение клиента банк рассматривает
#     не более 15 рабочих дней со дня поступления) — https://adilet.zan.kz/rus/docs/Z950002444_, открыт 28.09.2026.
id: kz.finance.imposed_insurance
version: 0.1.0
ontology: FINANCE.LOAN.IMPOSED_INSURANCE
taxonomy: finance.bank_dispute
jurisdiction: KZ
languages: [ru, kk]
owner: lawyer:kz-01
reviewed_at: null
published: true
title:
  ru: Навязанная страховка при кредите
  kk: Несие кезінде таңылған сақтандыру
summary:
  ru: При оформлении кредита или покупки в рассрочку вам добавили страховку или другую платную услугу без вашего согласия или сказали, что без неё не выдадут кредит. Вы хотите отказаться и вернуть деньги.
  kk: Несие не бөліп төлеу рәсімдегенде келісіміңізсіз сақтандыру не басқа ақылы қызмет қосылды не онсыз несие берілмейтінін айтты. Сіз бас тартып, ақшаны қайтарғыңыз келеді.
classification:
  keywords:
    ru: [страховк, страхование жизни, навязали, навязанн, включили в кредит, добавили услугу, без моего согласия страх]
    kk: [сақтандыру, таңып, қосып қойды]
  examples:
    ru:
      - Взял кредит, а в сумму включили страховку на 200 тысяч, мне никто не сказал
      - При рассрочке на телефон навязали страхование, хочу вернуть деньги
    kk:
      - Несиеге менің келісімімсіз сақтандыру қосылған, ақшаны қайтарғым келеді
claim:
  type: refund
  amount_field: amount
intake:
  - respondent_name: {label: {ru: Банк или организация, kk: Банк не ұйым}, question: {ru: "Какой банк (МФО) оформил кредит со страховкой? Если знаете — и страховая компания.", kk: "Сақтандыруы бар несиені қай банк (МҚҰ) рәсімдеді? Білсеңіз — сақтандыру компаниясы да."}}
  - respondent_bin: {optional: true, pattern: '^\d{12}$'}
  - respondent_address: {optional: true}
  - event_date: {type: date, label: {ru: Дата договора, kk: Шарт күні}, question: {ru: "Когда оформили кредит? (ДД.ММ.ГГГГ)", kk: "Несие қашан рәсімделді? (КК.АА.ЖЖЖЖ)"}}
  - amount: {type: money, currency: KZT, question: {ru: "Сколько стоит навязанная страховка (услуга), в тенге?", kk: "Таңылған сақтандыру (қызмет) қанша тұрады, теңгемен?"}}
  - problem_description: {type: longtext}
  - applicant_name: {pii: person}
  - applicant_iin: {optional: true, pii: id_number, pattern: '^\d{12}$'}
  - applicant_address: {pii: address}
  - applicant_phone: {type: phone, pii: phone}
  - evidence: [loan_contract, insurance_policy, bank_statement, correspondence]
parties:
  applicant: {kind: person, name_field: applicant_name, id_field: applicant_iin, address_field: applicant_address}
  respondent: {kind: business, name_field: respondent_name, id_field: respondent_bin, address_field: respondent_address}
actions:
  - id: statement_to_bank
    title: {ru: Заявление об отказе от навязанной страховки и возврате денег, kk: Таңылған сақтандырудан бас тарту және ақшаны қайтару туралы арыз}
    template: kz/templates/generic/statement.docx
    channel: user_submits
    addressee: {party: respondent}
    deadline: {business_days: 15, norm_ref: "Закон Республики Казахстан «О банках и банковской деятельности в Республике Казахстан», статья 31"}
    norm_refs:
      - "Закон Республики Казахстан «О банках и банковской деятельности в Республике Казахстан», статья 31"
      - "Закон Республики Казахстан «О защите прав потребителей», статья 8"
      - "Закон Республики Казахстан «О защите прав потребителей», статья 8-1"
    demands:
      ru: "признать, что договор страхования (дополнительная платная услуга) был мне навязан при оформлении займа; прекратить договор страхования и вернуть мне уплаченную за него сумму {amount} {currency} либо уменьшить на неё сумму задолженности; о принятом решении сообщить мне письменно."
    instructions:
      ru:
        - "Подайте заявление в отделении банка с отметкой о принятии на втором экземпляре или через официальную форму обращений в приложении/на сайте и сохраните входящий номер."
        - "Если страховка оформлена в отдельной страховой компании — направьте копию заявления и ей."
        - "Нажмите «Документ подан». Срок ответа уточнит юрист."
      kk:
        - "Арызды банк бөлімшесінде екінші данаға қабылдау белгісін қойғызып не қосымшадағы/сайттағы ресми өтініш формасы арқылы беріп, кіріс нөмірін сақтаңыз."
        - "Сақтандыру жеке сақтандыру компаниясында рәсімделсе — арыздың көшірмесін оған да жіберіңіз."
        - "«Құжат тапсырылды» батырмасын басыңыз. Жауап мерзімін заңгер нақтылайды."
  - id: complaint_arrf
    when: statement_to_bank.response in [none, refusal, partial]
    title: {ru: Жалоба в АРРФР, kk: ҚНРДА-ға шағым}
    template: kz/templates/generic/complaint.docx
    channel: user_submits
    addressee: {authority: arrf}
    deadline: {business_days: 15, norm_ref: "Административный процедурно-процессуальный кодекс Республики Казахстан, статья 76"}
    norm_refs:
      - "Закон Республики Казахстан «О защите прав потребителей», статья 8"
      - "Закон Республики Казахстан «О защите прав потребителей», статья 8-1"
    demands:
      ru: "провести проверку действий финансовой организации при оформлении мне займа с навязанным договором страхования и при рассмотрении моего заявления, принять меры реагирования, о результатах сообщить мне."
    instructions:
      ru:
        - "Зайдите на {submit_url} (ЭЦП или SMS-код) и выберите получателя — {addressee}."
        - "Приложите договор займа, полис, заявление в банк и ответ банка (если был)."
        - "Сохраните регистрационный номер и нажмите «Документ подан»."
      kk:
        - "{submit_url} сайтына кіріңіз (ЭЦҚ не SMS-код) және алушыны таңдаңыз — {addressee}."
        - "Қарыз шартын, полисті, банкке берілген арызды және банктің жауабын (болса) тіркеңіз."
        - "Тіркеу нөмірін сақтап, «Құжат тапсырылды» батырмасын басыңыз."
  - id: handoff_lawyer
    kind: handoff
    when: complaint_arrf.response in [none, refusal, partial]
    title: {ru: Передача дела юристу, kk: Істі заңгерге беру}
pricing: {model: fixed, amount: 1990, currency: KZT}
