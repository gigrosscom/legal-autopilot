# Жалоба гражданина на действие (бездействие) госоргана или должностного лица: не ответили на обращение в срок,
# не совершили действие, нарушили порядок. Нормы сверены 01.10.2026 по тексту АППК РК на adilet.zan.kz
# (https://adilet.zan.kz/rus/docs/K2000000350):
#   ст. 91 ч. 1 — обжалование административного действия (бездействия) в административном (досудебном) порядке;
#   ст. 91 ч. 2 — не совершили действие в срок → с даты истечения срока считается отказом;
#   ст. 91 ч. 3 — жалобу рассматривает вышестоящий административный орган (должностное лицо);
#   ст. 91 ч. 4 — жалоба подаётся в орган (должностному лицу), чьё бездействие обжалуется; он не позднее трёх рабочих
#                 дней направляет её в орган, рассматривающий жалобу;
#   ст. 92 ч. 1 — срок подачи: не позднее трёх месяцев со дня, когда стало известно о бездействии;
#   ст. 99      — срок рассмотрения жалобы: двадцать рабочих дней со дня регистрации.
# TODO(lawyer): особые порядки для отдельных органов (налоговые, таможня, полиция — КоАП/УПК), прокуратура как
# второй шаг; административный иск в суд после жалобы → handoff.
id: kz.gov.inaction_complaint
version: 0.1.0
ontology: PUBLIC.ADMIN.INACTION_COMPLAINT
taxonomy: administrative.state_body_inaction
jurisdiction: KZ
languages: [ru, kk]
owner: lawyer:kz-01
reviewed_at: null          # no lawyer sign-off yet → compliance.draft_disclaimer note on every document
published: true            # PM 01.10 (owner's KPI): the third launch scenario
kind: dispute
title:
  ru: Жалоба на бездействие госоргана
  kk: Мемлекеттік органның әрекетсіздігіне шағым
summary:
  ru: Госорган, акимат или должностное лицо не ответили на обращение в срок или не сделали то, что обязаны, — жалоба по АППК (ст. 91), её передают в вышестоящий орган.
  kk: Мемлекеттік орган, әкімдік не лауазымды адам өтінішке мерзімінде жауап бермеді не міндетін орындамады — ӘРПК бойынша шағым (91-бап), ол жоғары тұрған органға жіберіледі.
disclaimer:
  ru: "Konsiliér AI — IT-сервис подготовки документов, не юридическая помощь. Результат не гарантируется."
  kk: "Konsiliér AI — құжаттарды дайындайтын IT-сервис, заң көмегі емес. Нәтижеге кепілдік берілмейді."
classification:
  keywords:
    ru: [акимат, акимата, акимат района, аким, госорган, государственный орган, акимат не отвечает, акимат не ответил, не ответили на обращение, не отвечают на обращение, не ответил на заявление, не ответили на заявление, бездействие, бездействие госоргана, жалоба на акимат, пожаловаться на акимат, жалоба на госорган, пожаловаться на госорган, жалоба на чиновника, пожаловаться на чиновника, eotinish, еотиниш, е-отиниш, госорган не отвечает, госорган не реагирует, игнорируют обращение, не рассмотрели обращение, жалоба на бездействие]
    kk: [әкімдік жауап бермеді, өтінішке жауап бермеді, әрекетсіздік, әкімдікке шағым, мемлекеттік органға шағым, шенеунікке шағым]
  examples:
    ru:
      - Акимат района уже 2 месяца не отвечает на моё заявление о ремонте дороги, подал через eOtinish, хочу пожаловаться
      - Госорган не рассмотрел моё обращение в срок, нужна жалоба на бездействие
      - Чиновник игнорирует моё заявление, хочу пожаловаться в вышестоящий орган
    kk:
      - Әкімдік екі ай бойы өтінішіме жауап бермей жатыр, шағым жазғым келеді
intake:
  - respondent_name: {label: {ru: "Орган или должностное лицо", kk: "Орган не лауазымды адам"}, question: {ru: "Какой орган или чиновник не ответил (точное название, например «Аппарат акима Алмалинского района г. Алматы»)?", kk: "Қай орган не шенеунік жауап бермеді (нақты атауы, мысалы «Алматы қ. Алмалы ауданы әкімінің аппараты»)?"}}
  - appeal_date: {type: date, label: {ru: "Дата обращения", kk: "Өтініш күні"}, question: {ru: "Когда вы подали обращение (ДД.ММ.ГГГГ)?", kk: "Өтінішті қашан бердіңіз (КК.АА.ЖЖЖЖ)?"}}
  - appeal_number: {optional: true, label: {ru: "Номер обращения", kk: "Өтініш нөмірі"}, question: {ru: "Номер регистрации обращения (в eOtinish или на штампе)? Нет — «Пропустить».", kk: "Өтініштің тіркеу нөмірі (eOtinish-те не мөрде)? Жоқ болса — «Өткізу»."}}
  - appeal_subject: {label: {ru: "О чём было обращение", kk: "Өтініш не туралы"}, question: {ru: "О чём было ваше обращение (например, ремонт дороги, справка, разрешение)?", kk: "Өтінішіңіз не туралы болды (мысалы, жол жөндеу, анықтама, рұқсат)?"}}
  - problem_description: {type: longtext, label: {ru: "Что произошло", kk: "Не болды"}, question: {ru: "Что произошло после обращения: не ответили, ответили не по существу, не сделали обещанное? Только факты.", kk: "Өтініштен кейін не болды: жауап бермеді, мәні бойынша жауап бермеді, уәдені орындамады? Тек фактілер."}}
  - desired_outcome: {label: {ru: "Чего просите", kk: "Не сұрайсыз"}, question: {ru: "Чего просите: рассмотреть обращение по существу и дать ответ, сделать конкретное действие?", kk: "Не сұрайсыз: өтінішті мәні бойынша қарап, жауап беру, нақты әрекет жасау?"}}
  - higher_authority: {optional: true, label: {ru: "Вышестоящий орган", kk: "Жоғары тұрған орган"}, question: {ru: "Кому подчиняется этот орган (например, аким города, министерство)? Не знаете — «Пропустить»: жалобу передаст сам орган.", kk: "Бұл орган кімге бағынады (мысалы, қала әкімі, министрлік)? Білмесеңіз — «Өткізу»: шағымды органның өзі жібереді."}}
  - applicant_name: {pii: person}
  - applicant_iin: {pii: id_number, pattern: '^\d{12}$'}
  - applicant_address: {pii: address}
  - applicant_phone: {type: phone, pii: phone}
  - applicant_email: {type: email, pii: email, optional: true, label: {ru: "E-mail", kk: "E-mail"}, question: {ru: "E-mail для ответа (или «Пропустить»)?", kk: "Жауап үшін e-mail (немесе «Өткізу»)?"}}
  - evidence: [correspondence, gov_certificate, id_document, other]
parties:
  applicant: {kind: person, name_field: applicant_name, id_field: applicant_iin, address_field: applicant_address, email_field: applicant_email}
  respondent: {kind: authority, name_field: respondent_name}
actions:
  - id: complaint_gov_inaction
    title: {ru: Жалоба на бездействие, kk: Әрекетсіздікке шағым}
    template: kz/templates/generic/complaint.docx
    channel: user_submits
    addressee: {party: respondent}
    deadline: {business_days: 20, norm_ref: "Административный процедурно-процессуальный кодекс Республики Казахстан, статья 99"}
    norm_refs:
      - "Административный процедурно-процессуальный кодекс Республики Казахстан, статья 91"
      - "Административный процедурно-процессуальный кодекс Республики Казахстан, статья 92"
      - "Административный процедурно-процессуальный кодекс Республики Казахстан, статья 99"
    demands:
      ru: "Направить настоящую жалобу в орган, рассматривающий жалобу (АППК, ст. 91 ч. 4); признать бездействие по моему обращению от {appeal_date} ({appeal_subject}) незаконным; {desired_outcome}; о результатах рассмотрения сообщить мне письменно."
      kk: "Осы шағымды шағымды қарайтын органға жіберуді (ӘРПК, 91-бап 4-бөлігі); {appeal_date} күнгі өтінішім ({appeal_subject}) бойынша әрекетсіздікті заңсыз деп тануды; {desired_outcome}; қарау нәтижелері туралы маған жазбаша хабарлауды сұраймын."
    instructions:
      ru:
        - "Подайте жалобу в тот же орган ({respondent_name}): по закону он в течение трёх рабочих дней передаёт её в вышестоящий орган (АППК, ст. 91 ч. 4). Удобнее всего — через eotinish.kz (раздел «Жалоба») или лично с отметкой о приёме; сохраните номер регистрации."
        - "Срок подачи — не позднее трёх месяцев со дня, когда вы узнали о бездействии (АППК, ст. 92). Жалобу должны рассмотреть за двадцать рабочих дней со дня регистрации (АППК, ст. 99)."
        - "Приложите копию своего обращения и подтверждение его подачи (скриншот eOtinish, отметку о приёме). Нажмите «Документ подан» — напомним о сроке ответа. Если не ответят или откажут — подскажем следующий шаг (прокуратура, суд)."
      kk:
        - "Шағымды сол органға ({respondent_name}) беріңіз: заң бойынша ол үш жұмыс күні ішінде оны жоғары тұрған органға жібереді (ӘРПК, 91-бап 4-бөлігі). Ең ыңғайлысы — eotinish.kz арқылы («Шағым» бөлімі) не қабылданғаны туралы белгімен өзіңіз тапсыру; тіркеу нөмірін сақтаңыз."
        - "Беру мерзімі — әрекетсіздік туралы білген күннен бастап үш айдан кешіктірмей (ӘРПК, 92-бап). Шағым тіркелген күннен бастап жиырма жұмыс күні ішінде қаралуы тиіс (ӘРПК, 99-бап)."
        - "Өтінішіңіздің көшірмесін және берілгенін растайтын құжатты (eOtinish скриншоты, қабылдау белгісі) қоса беріңіз. «Құжат тапсырылды» батырмасын басыңыз — жауап мерзімін еске саламыз. Жауап бермесе не бас тартса — келесі қадамды айтамыз (прокуратура, сот)."
  - id: handoff_lawyer
    kind: handoff
    when: complaint_gov_inaction.response in [none, refusal, partial]
    title: {ru: Передача дела юристу (прокуратура или административный иск в суд), kk: Істі заңгерге беру (прокуратура не сотқа әкімшілік талап)}
pricing: {model: fixed, amount: 1990, currency: KZT}
