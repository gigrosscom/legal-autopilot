# Спор о восстановлении на работе — короткие сроки. Документы досудебные; иск и согласительная комиссия — через юриста.
# Нормы проверены 28.09.2026 по официальному тексту ИПС «Әділет» (страница акта открыта, номер статьи — как в тексте):
#   - Трудовой кодекс РК — https://adilet.zan.kz/rus/docs/K1500000414
#     ст. 52 (основания расторжения трудового договора по инициативе работодателя);
#     ст. 160, подп. 1) ч. 1 (по спорам о восстановлении на работе — один месяц со дня вручения копии акта работодателя
#     о прекращении трудового договора для обращения в согласительную комиссию); часть пятая статьи изменена
#     нормативным постановлением Конституционного Суда от 12.06.2026 № 88-НП — текст приведён в статье, толкование — юрист;
#     ст. 191, 193 (государственные инспекторы труда).
# Срок ответа: согласительная комиссия — 15 рабочих дней (ТК ст. 159; ZANN, old.adilet 02.10.2026). Срок обращения — ТК ст. 160.
# TODO(lawyer): когда вместо инспекции сразу согласительная комиссия / суд; формулировка требований.
#   - АППК РК, ст. 63 (реквизиты обращения: ФИО, ИИН, почтовый адрес заявителя; наименование органа; суть; дата; подпись),
#     ст. 76, ч. 1 (обращение рассматривается 15 рабочих дней со дня регистрации, если иное не предусмотрено законами) —
#     https://adilet.zan.kz/rus/docs/K2000000350, открыт 28.09.2026 (срок жалобы в госорган — deadline по ст. 76).
id: kz.labor.dismissal
version: 0.1.0
ontology: LABOR.DISMISSAL.UNLAWFUL
taxonomy: labor.dismissal
jurisdiction: KZ
languages: [ru, kk]
owner: lawyer:kz-01
reviewed_at: null
published: true
title:
  ru: Незаконное увольнение
  kk: Заңсыз жұмыстан шығару
summary:
  ru: Работодатель уволил вас без законного основания или с нарушением порядка, и вы хотите отмены приказа и восстановления на работе.
  kk: Жұмыс беруші сізді заңды негізсіз не тәртіпті бұзып жұмыстан шығарды, сіз бұйрықтың күшін жоюды және жұмысқа қайта алуды қалайсыз.
classification:
  keywords:
    ru: [уволили, увольнени, незаконно уволили, приказ об увольнении, восстановить на работе, сократили, заставили написать заявление, уволиться, вынуждают уволиться, заставляют уволиться, беремен, по соглашению сторон]
    kk: [жұмыстан шығарды, жұмыстан шығару, жұмысқа қайта алу, бұйрық, жүкті, жұмыстан кетуге мәжбүрлейді]
  examples:
    ru:
      - Уволили без законных оснований, хочу восстановиться на работе
      - Заставили написать заявление по собственному желанию, хочу оспорить
      - "Беременную сотрудницу вынуждают уволиться по соглашению, угрожают, хочу защитить права"
    kk:
      - Заңсыз жұмыстан шығарды, жұмысқа қайта алуды талап еткім келеді
claim:
  type: reinstatement
intake:
  - respondent_name: {label: {ru: Работодатель, kk: Жұмыс беруші}, question: {ru: "Как называется работодатель (организация или ИП)?", kk: "Жұмыс берушінің (ұйымның не ЖК-ның) атауы қандай?"}}
  - respondent_bin: {optional: true, pattern: '^\d{12}$'}
  - respondent_address: {optional: true}
  - event_date: {type: date, label: {ru: Дата получения приказа, kk: Бұйрықты алған күн}, question: {ru: "Когда вам вручили (или прислали) копию приказа об увольнении? (ДД.ММ.ГГГГ)", kk: "Жұмыстан шығару туралы бұйрықтың көшірмесі сізге қашан табыс етілді (не жіберілді)? (КК.АА.ЖЖЖЖ)"}}
  - problem_description: {type: longtext}
  - applicant_name: {pii: person}
  - applicant_iin: {optional: true, pii: id_number, pattern: '^\d{12}$'}
  - applicant_address: {pii: address}
  - applicant_phone: {type: phone, pii: phone}
  - evidence: [dismissal_order, employment_contract, correspondence]
parties:
  applicant: {kind: person, name_field: applicant_name, id_field: applicant_iin, address_field: applicant_address}
  respondent: {kind: business, name_field: respondent_name, id_field: respondent_bin, address_field: respondent_address}
actions:
  - id: statement_to_employer
    title: {ru: Заявление работодателю об отмене приказа об увольнении, kk: Жұмыс берушіге жұмыстан шығару туралы бұйрықтың күшін жою туралы арыз}
    template: kz/templates/generic/statement.docx
    channel: user_submits
    addressee: {party: respondent}
    deadline: {business_days: 15, norm_ref: "Трудовой кодекс Республики Казахстан, статья 159"}
    filing:
      deadline: {calendar_days: 28, from_field: event_date, from_text: {ru: "со дня вручения копии приказа (по закону — один месяц, считаем с запасом)", kk: "бұйрық көшірмесі табыс етілген күннен бастап (заң бойынша — бір ай, қормен есептейміз)"}, norm_ref: "Трудовой кодекс Республики Казахстан, статья 160", verified: true}
      signature: either
    norm_refs:
      - "Трудовой кодекс Республики Казахстан, статья 52"
      - "Трудовой кодекс Республики Казахстан, статья 159"
    demands:
      ru: "отменить приказ о прекращении со мной трудового договора, восстановить меня на работе в прежней должности, выплатить средний заработок за время вынужденного прогула; указать, по какому основанию и на каком документе основано увольнение; о принятом решении сообщить мне письменно."
    instructions:
      ru:
        - "**Не пропустите срок.** В согласительную комиссию — один месяц со дня вручения копии приказа; если комиссии нет — иск в суд в течение трёх месяцев (ТК, ст. 160). Осталось меньше двух недель — сразу обратитесь к юристу (кнопка «Выбрать юриста»)."
        - "**Проверьте, куда подавать.** Если в организации есть согласительная комиссия — заявление подают в неё: без этого суд не примет иск; комиссия рассматривает спор 15 рабочих дней (ТК, ст. 159). Её нет у микропредприятий, НКО и филиалов иностранных компаний до 15 работников — тогда заявление вручают работодателю."
        - "**Распечатайте и подпишите.** Два экземпляра, подпись на обоих."
        - "**Вручите работодателю ({addressee}).** Один экземпляр отдайте, на втором попросите отметку о принятии: дата, ФИО, подпись. Или отправьте заказным письмом с уведомлением о вручении."
        - "**Нажмите «Документ подан».** Комиссия обязана рассмотреть спор за 15 рабочих дней (ТК, ст. 159) — мы напомним."
      kk:
        - "**Мерзімді өткізіп алмаңыз.** Келісім комиссиясына — бұйрық көшірмесі табыс етілген күннен бастап бір ай; комиссия болмаса — үш ай ішінде сотқа талап арыз (ЕК, 160-бап). Екі аптадан аз қалса — бірден заңгерге жүгініңіз («Заңгер таңдау» батырмасы)."
        - "**Қайда беру керегін тексеріңіз.** Ұйымда келісім комиссиясы болса — арыз соған беріледі: онсыз сот арыз арызды қабылдамайды; комиссия дауды 15 жұмыс күнінде қарайды (ЕК, 159-бап). Шағын кәсіпкерлік субъектілерінде, ҚЕҰ-да және қызметкерлері 15-тен аспайтын шетелдік компания филиалдарында ол жоқ — онда арыз жұмыс берушіге беріледі."
        - "**Басып шығарып, қол қойыңыз.** Екі дана, екеуіне де қол қойыңыз."
        - "**Жұмыс берушіге ({addressee}) табыс етіңіз.** Бір данасын беріп, екіншісіне қабылдау белгісін сұраңыз: күні, аты-жөні, қолы. Не табыс етілгені туралы хабарламасы бар тапсырыс хатпен жіберіңіз."
        - "**«Құжат тапсырылды» батырмасын басыңыз.** Комиссия дауды 15 жұмыс күнінде қарауға міндетті (ЕК, 159-бап) — біз еске саламыз."
  - id: complaint_labor_inspection
    when: statement_to_employer.response in [none, refusal, partial]
    title: {ru: Жалоба в инспекцию труда, kk: Еңбек инспекциясына шағым}
    template: kz/templates/generic/complaint.docx
    channel: user_submits
    addressee: {forum: kz.labor_inspection}
    deadline: {business_days: 15, norm_ref: "Административный процедурно-процессуальный кодекс Республики Казахстан, статья 76"}
    norm_refs:
      - "Трудовой кодекс Республики Казахстан, статья 191"
      - "Трудовой кодекс Республики Казахстан, статья 193"
    demands:
      ru: "провести проверку соблюдения работодателем трудового законодательства при прекращении со мной трудового договора и принять меры реагирования, о результатах сообщить мне."
    instructions:
      ru:
        - "Жалоба в инспекцию не заменяет обращения в согласительную комиссию или суд и не останавливает срок по статье 160 Трудового кодекса."
        - "Подайте жалобу через портал обращений eotinish.kz (вход по ЭЦП или SMS) или лично в инспекции труда."
        - "Приложите приказ об увольнении, трудовой договор и заявление работодателю с отметкой о принятии."
        - "Сохраните регистрационный номер и нажмите «Документ подан»."
      kk:
        - "Инспекцияға шағым келісім комиссиясына не сотқа жүгінуді алмастырмайды және Еңбек кодексінің 160-бабындағы мерзімді тоқтатпайды."
        - "Шағымды eotinish.kz өтініштер порталы арқылы (ЭЦҚ не SMS) не еңбек инспекциясына өзіңіз беріңіз."
        - "Жұмыстан шығару туралы бұйрықты, еңбек шартын және жұмыс берушіге берілген, қабылданғаны туралы белгісі бар арызды тіркеңіз."
        - "Тіркеу нөмірін сақтап, «Құжат тапсырылды» батырмасын басыңыз."
  - id: handoff_lawyer
    kind: handoff
    when: complaint_labor_inspection.response in [none, refusal, partial]
    title: {ru: Передача дела юристу (согласительная комиссия или суд), kk: Істі заңгерге беру (келісім комиссиясы не сот)}
pricing: {model: fixed, amount: 2990, currency: KZT}
