# Опубликован 01.10.2026 по правилам юриста команды (team/legal-drafts/document-rules.md D-19, D-20;
# team/zann/lawyer/signing-and-filing.md § 4 — первый оплаченный документ, токены ИИ-сервиса). reviewed_at: null.
# Нормы сверены юристом 01.10.2026 на old.adilet.zan.kz (база на 28.09.2026):
#   - ГК РК (Особенная часть), ст. 683 п. 1–2 (возмездное оказание услуг, в т. ч. информационных), ст. 686 п. 1
#     (заказчик вправе отказаться от договора, оплатив исполнителю фактически понесённые расходы) — K990000409_
#   - Закон РК «О защите прав потребителей», ст. 1 пп. 6 (услуга — без материального выражения: онлайн-сервисы,
#     подписки, токены, курсы), ст. 8-1 п. 2 пп. 6 (условие о невозврате денег за непредоставленные услуги нарушает
#     права потребителя), ст. 42-4 п. 2 (ответ — 10 календарных дней со дня получения), ст. 42-5 п. 2 (госорган — не
#     позднее двух месяцев с претензии) — Z100000274_
#   - ЗПП ст. 30 и «неустойка 1 % по ст. 30 п. 6» к услугам НЕ применяются (D-19). За просрочку возврата —
#     ГК (Общая часть) ст. 353 п. 1 (пользование чужими деньгами); ставку и сумму не называем (юрист, R-13).
# Не подтверждено юристом: применимость ЗПП к иностранному онлайн-исполнителю и подсудность (§ 5 п. 7).
id: kz.consumer.service_refund
version: 0.1.0
ontology: CONSUMER.SERVICE.REFUND
taxonomy: consumer.refund
jurisdiction: KZ
languages: [ru, kk]
owner: lawyer:kz-01
reviewed_at: null
published: true
title:
  ru: Возврат денег за услугу, подписку или онлайн-сервис
  kk: Қызмет, жазылым не онлайн-сервис үшін ақшаны қайтару
summary:
  ru: Вы оплатили услугу, подписку, пакет токенов или доступ к онлайн-сервису (в том числе ИИ-сервису, приложению), услугу не оказали, оказали плохо или вы решили отказаться — а деньги не возвращают.
  kk: Қызметке, жазылымға, токендер пакетіне не онлайн-сервиске (ЖИ-сервис, қосымша) төледіңіз, қызмет көрсетілмеді, сапасыз көрсетілді не сіз бас тартуды шештіңіз — ақша қайтарылмайды.
classification:
  keywords:
    ru: [подписк, токен, кредиты сервиса, онлайн-сервис, онлайн сервис, интернет-сервис, интернет сервис, сервис ии, сервисе ии, ии-сервис, нейросет, chatgpt, приложени, доступ к сервису, тариф, списали за подписку, продлева, автопродлени, услуг, услуга не оказана, не оказали услугу]
    kk: [жазылым, токен, онлайн-сервис, қосымша, қызмет көрсетілмеді]
  examples:
    ru:
      - Купил токены в ИИ-сервисе, сервис не работает, деньги не возвращают
      - С карты списали за подписку, я её не продлевал, хочу вернуть деньги
      - Оплатил тариф в приложении, доступ так и не дали
    kk:
      - Жазылым үшін ақша алынды, мен оны ұзартпадым, ақшаны қайтарғым келеді
claim:
  type: refund
  amount_field: amount
intake:
  - respondent_name: {label: {ru: Исполнитель (сервис), kk: Орындаушы (сервис)}, question: {ru: "Как называется сервис или компания, которой вы платили?", kk: "Қай сервиске не компанияға төледіңіз?"}}
  - respondent_bin: {optional: true, pattern: '^\d{12}$'}
  - respondent_address: {optional: true}
  # D-09: только e-mail, который исполнитель сам опубликовал (сайт, оферта, чек)
  - respondent_email: {type: email, optional: true, label: {ru: E-mail исполнителя, kk: Орындаушының e-mail}, question: {ru: "E-mail сервиса, который он сам указал — на сайте, в оферте или в чеке? Если не нашли — «Пропустить».", kk: "Сервистің өзі көрсеткен e-mail — сайтта, офертада не чекте? Таппасаңыз — «Өткізу»."}}
  - event_date: {type: date, label: {ru: Дата оплаты, kk: Төлем күні}, question: {ru: "Когда вы оплатили услугу? (ДД.ММ.ГГГГ)", kk: "Қызметті қашан төледіңіз? (КК.АА.ЖЖЖЖ)"}}
  - amount: {type: money, currency: KZT, question: {ru: "Какую сумму вы хотите вернуть, в тенге? (за неиспользованную часть, если часть услуги уже получена)", kk: "Қандай соманы қайтарғыңыз келеді, теңгемен? (қызметтің бір бөлігін алсаңыз — пайдаланылмаған бөлігі үшін)"}}
  - problem_description: {type: longtext}
  - applicant_name: {pii: person}
  - applicant_address: {pii: address}
  - applicant_phone: {type: phone, pii: phone}
  - applicant_email: {type: email, optional: true, pii: email}
  - evidence: [receipt, order_screenshot, correspondence]
  # ИИН и копию удостоверения не запрашиваем: для претензии исполнителю избыточно (D-18; ЗПД ст. 7 п. 9–10)
parties:
  applicant: {kind: person, name_field: applicant_name, address_field: applicant_address, email_field: applicant_email}
  respondent: {kind: business, name_field: respondent_name, id_field: respondent_bin, address_field: respondent_address, email_field: respondent_email}
actions:
  - id: claim_to_provider
    title: {ru: Претензия о возврате денег за неоказанные услуги, kk: Көрсетілмеген қызмет үшін ақшаны қайтару туралы наразылық}
    template: kz/templates/generic/claim_letter.docx
    channel: email_or_user_submits
    addressee: {party: respondent}
    deadline: {calendar_days: 10, norm_ref: "Закон Республики Казахстан «О защите прав потребителей», статья 42-4"}
    norm_refs:
      - "Гражданский кодекс Республики Казахстан (Особенная часть), статья 683"
      - "Гражданский кодекс Республики Казахстан (Особенная часть), статья 686"
      - "Закон Республики Казахстан «О защите прав потребителей», статья 8-1"
      - "Закон Республики Казахстан «О защите прав потребителей», статья 42-4"
    demands:
      ru: "принять мой отказ от исполнения договора возмездного оказания услуг и вернуть мне {amount} {currency} за неоказанные (неиспользованные) услуги в течение 10 календарных дней со дня получения претензии; если вы не согласны — дать мотивированный письменный ответ с подтверждающими документами в тот же срок."
      kk: "менің ақылы қызмет көрсету шартын орындаудан бас тартуымды қабылдап, көрсетілмеген (пайдаланылмаған) қызметтер үшін {amount} {currency} наразылық алынған күннен бастап 10 күнтізбелік күн ішінде қайтаруды; келіспесеңіз — сол мерзімде растайтын құжаттармен дәлелді жазбаша жауап беруді."
    instructions:
      ru:
        - "Отправьте претензию на e-mail, который сервис сам указал (на сайте, в оферте или в чеке), и сохраните скриншот этой страницы с датой — без него e-mail не считается способом по закону. Чат поддержки — только дополнительно, со скриншотами."
        - "Если e-mail нет — вручите претензию лично с отметкой о принятии на втором экземпляре или отправьте заказным письмом с уведомлением."
        - "Приложите чек и скриншоты (баланс, списания, переписку)."
        - "Нажмите «Документ подан» — срок ответа {deadline_days} календарных дней со дня получения, мы напомним. В орган по защите прав потребителей — не позднее двух месяцев с претензии."
      kk:
        - "Наразылықты сервистің өзі көрсеткен e-mail мекенжайына (сайтта, офертада не чекте) жіберіп, сол беттің күні бар скриншотын сақтаңыз — онсыз e-mail заң бойынша тәсіл болып саналмайды. Қолдау чаты — тек қосымша, скриншоттармен."
        - "E-mail болмаса — наразылықты екінші данаға қабылдау белгісін қойғызып, өзіңіз тапсырыңыз не табыс етілгені туралы хабарламасы бар тапсырыс хатпен жіберіңіз."
        - "Чекті және скриншоттарды (баланс, есептен шығару, хат алмасу) тіркеңіз."
        - "«Құжат тапсырылды» батырмасын басыңыз — жауап мерзімі алынған күннен бастап {deadline_days} күнтізбелік күн, біз еске саламыз. Тұтынушылардың құқықтарын қорғау органына — наразылықтан бастап екі айдан кешіктірмей."
  - id: complaint_consumer_authority
    when: claim_to_provider.response in [none, refusal, partial]
    title: {ru: Жалоба в орган по защите прав потребителей, kk: Тұтынушылардың құқықтарын қорғау органына шағым}
    template: kz/templates/generic/complaint.docx
    channel: user_submits
    addressee: {authority: consumer_protection}
    norm_refs:
      - "Закон Республики Казахстан «О защите прав потребителей», статья 42-5"
    demands:
      ru: "рассмотреть мою жалобу и принять меры для возврата мне денег за неоказанные услуги, о результатах сообщить мне."
      kk: "шағымымды қарап, көрсетілмеген қызметтер үшін ақшаны маған қайтару шараларын қабылдауды, нәтижесі туралы маған хабарлауды."
    instructions:
      ru:
        - "Жалобу можно подать не позднее двух месяцев с момента претензии (ЗПП, ст. 42-5 п. 2)."
        - "Подайте жалобу через {submit_url} (вход по ЭЦП или SMS-код), получатель — {addressee}."
        - "Приложите чек, претензию и ответ на неё (если был)."
        - "Сохраните регистрационный номер и нажмите «Документ подан»."
      kk:
        - "Шағымды наразылықтан бастап екі айдан кешіктірмей беруге болады (ТҚҚ туралы заң, 42-5-бап 2-тармақ)."
        - "Шағымды {submit_url} арқылы беріңіз (ЭЦҚ не SMS-код), алушы — {addressee}."
        - "Чекті, наразылықты және оған жауапты (болса) тіркеңіз."
        - "Тіркеу нөмірін сақтап, «Құжат тапсырылды» батырмасын басыңыз."
  - id: handoff_lawyer
    kind: handoff
    when: complaint_consumer_authority.response in [none, refusal, partial]
    title: {ru: Передача дела юристу (иск в суд), kk: Істі заңгерге беру (сотқа талап қою)}
pricing: {model: fixed, amount: 2990, currency: KZT}
