# Опубликован 28.09.2026 по решению владельца. reviewed_at: null → на каждом документе пометка «ЧЕРНОВИК».
# Нормы проверены 28.09.2026 по официальному тексту ИПС «Әділет» (страница акта открыта, номер статьи — как в тексте):
#   - Закон РК «Об использовании воздушного пространства Республики Казахстан и деятельности авиации», ст. 78, п. 1
#     («Пассажир имеет право отказаться от полета и получить обратно внесенную за перевозку плату в размере,
#     установленном договором воздушной перевозки») — https://adilet.zan.kz/rus/docs/Z100000339_
#   - Закон РК «О защите прав потребителей», ст. 42-4 (ответ — 10 календарных дней), ст. 42-5 —
#     https://adilet.zan.kz/rus/docs/Z100000274_
# TODO(lawyer): применимость ст. 42-4 к авиаперевозчику; правила перевозок (сроки возврата, невозвратные тарифы);
# уполномоченный орган в сфере гражданской авиации как адресат жалобы вместо органа по защите прав потребителей.
id: kz.consumer.air_ticket
version: 0.1.0
ontology: CONSUMER.TRANSPORT.AIR_TICKET_REFUND
taxonomy: consumer.refund
jurisdiction: KZ
languages: [ru, kk]
owner: lawyer:kz-01
reviewed_at: null
published: true
title:
  ru: Возврат денег за авиабилет
  kk: Авиабилет үшін ақшаны қайтару
summary:
  ru: Авиакомпания или агентство отказывается вернуть деньги за билет — вы отказались от полёта, рейс отменили или перенесли.
  kk: Әуе компаниясы не агенттік билет үшін ақшаны қайтарудан бас тартады — сіз ұшудан бас тарттыңыз, рейс тоқтатылды не ауыстырылды.
classification:
  keywords:
    ru: [авиабилет, билет на самол, авиакомпани, рейс, перелёт, перелет, air astana, эйр астана, scat, fly arystan, флай арыстан, qazaq air]
    kk: [авиабилет, ұшақ, әуе компаниясы, рейс]
  examples:
    ru:
      - Рейс отменили, авиакомпания предлагает только ваучер, а я хочу деньги
      - Сдал билет за неделю до вылета, а деньги не вернули
    kk:
      - Рейс тоқтатылды, әуе компаниясы ақшаны қайтармайды
claim:
  type: refund
  amount_field: amount
intake:
  - respondent_name: {label: {ru: Авиакомпания или агентство, kk: Әуе компаниясы не агенттік}, question: {ru: "У кого куплен билет — авиакомпания или агентство (сайт)?", kk: "Билет кімнен сатып алынды — әуе компаниясынан не агенттіктен (сайттан)?"}}
  - event_date: {type: date, label: {ru: Дата рейса, kk: Рейс күні}, question: {ru: "Какая дата рейса по билету? (ДД.ММ.ГГГГ)", kk: "Билет бойынша рейс күні қандай? (КК.АА.ЖЖЖЖ)"}}
  - amount: {type: money, currency: KZT, question: {ru: "Сколько стоил билет, в тенге?", kk: "Билет қанша тұрды, теңгемен?"}}
  - problem_description: {type: longtext}
  - applicant_name: {pii: person}
  - applicant_iin: {optional: true, pii: id_number, pattern: '^\d{12}$'}
  - applicant_address: {pii: address}
  - applicant_phone: {type: phone, pii: phone}
  - evidence: [air_ticket, receipt, correspondence]
parties:
  applicant: {kind: person, name_field: applicant_name, id_field: applicant_iin, address_field: applicant_address}
  respondent: {kind: business, name_field: respondent_name}
actions:
  - id: claim_to_carrier
    title: {ru: Претензия о возврате платы за авиабилет, kk: Авиабилет ақысын қайтару туралы талап-арыз}
    template: kz/templates/generic/claim_letter.docx
    channel: user_submits
    addressee: {party: respondent}
    deadline: {calendar_days: 10, norm_ref: "Закон Республики Казахстан «О защите прав потребителей», статья 42-4"}
    norm_refs:
      - "Закон Республики Казахстан «Об использовании воздушного пространства Республики Казахстан и деятельности авиации», статья 78"
      - "Закон Республики Казахстан «О защите прав потребителей», статья 42-4"
    demands:
      ru: "вернуть внесённую мной плату за воздушную перевозку в размере, установленном договором воздушной перевозки (оплачено {amount} {currency}), и сообщить о принятом решении письменно."
    instructions:
      ru:
        - "Отправьте претензию через официальную форму обращений или e-mail авиакомпании (агентства) и сохраните подтверждение, либо отправьте заказным письмом с уведомлением о вручении."
        - "Если билет куплен через агентство — направьте претензию и агентству, и авиакомпании."
        - "Нажмите «Документ подан». Срок ответа — {deadline_days} календарных дней со дня получения претензии; мы напомним."
      kk:
        - "Талап-арызды әуе компаниясының (агенттіктің) ресми өтініш формасы не e-mail арқылы жіберіп, растауын сақтаңыз, не табыс етілгені туралы хабарламасы бар тапсырыс хатпен жіберіңіз."
        - "Билет агенттік арқылы алынса — талап-арызды агенттікке де, әуе компаниясына да жіберіңіз."
        - "«Құжат тапсырылды» батырмасын басыңыз. Жауап мерзімі — талап-арыз алынған күннен бастап {deadline_days} күнтізбелік күн; біз еске саламыз."
  - id: complaint_consumer_authority
    when: claim_to_carrier.response in [none, refusal, partial]
    title: {ru: Жалоба в орган по защите прав потребителей, kk: Тұтынушылардың құқықтарын қорғау органына шағым}
    template: kz/templates/generic/complaint.docx
    channel: user_submits
    addressee: {authority: consumer_protection}
    norm_refs:
      - "Закон Республики Казахстан «О защите прав потребителей», статья 42-5"
    demands:
      ru: "рассмотреть мою жалобу и принять меры для возврата мне платы за воздушную перевозку, о результатах сообщить мне."
    instructions:
      ru:
        - "Обратиться в госорган можно не позднее двух месяцев с момента претензии."
        - "Подайте жалобу через {submit_url} (вход по ЭЦП или SMS-код), получатель — {addressee}. Точный орган и канал подачи уточнит юрист."
        - "Приложите билет, чек, претензию и ответ на неё (если был)."
        - "Сохраните регистрационный номер и нажмите «Документ подан»."
      kk:
        - "Мемлекеттік органға талап-арыз берген сәттен бастап екі айдан кешіктірмей жүгінуге болады."
        - "Шағымды {submit_url} арқылы беріңіз (ЭЦҚ не SMS-код), алушы — {addressee}. Нақты орган мен беру арнасын заңгер нақтылайды."
        - "Билетті, чекті, талап-арызды және оған жауапты (болса) тіркеңіз."
        - "Тіркеу нөмірін сақтап, «Құжат тапсырылды» батырмасын басыңыз."
  - id: handoff_lawyer
    kind: handoff
    when: complaint_consumer_authority.response in [none, refusal, partial]
    title: {ru: Передача дела юристу (иск в суд), kk: Істі заңгерге беру (сотқа талап қою)}
pricing: {model: fixed, amount: 1990, currency: KZT}
