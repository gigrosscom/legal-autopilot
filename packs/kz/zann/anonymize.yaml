national_id:
  pattern: (?<![\d/-])\d{12}(?![\d/-])
  org_digit_position: 4
  org_digits: '456'
  org_keyword_before: (?:БИН|BIN|БСН)\s*:?\s*№?\s*$
  org_forms: (?:ТОО|АО|ГУ|КГУ|РГУ|РГП|ГКП|ГККП|КГП|ЖШС|АҚ|ООО|ОАО|ЗАО|ПК|ОО|ОЮЛ|НАО|КеАҚ|РМК|МКҚК|ЖММ|филиал\w*|банк\w*|товарищест\w*|акционерн\w*|учреждени\w*|предприяти\w*|организаци\w*|серіктест\w*|мекеме\w*|кәсіпорн\w*|компани\w*)
patterns:
  email: '[\w.+-]+@[\w-]+(?:\.[\w-]+)+'
  iban: \bKZ\d{2}\s?(?:[0-9A-Z]{4}\s?){3}[0-9A-Z]{4}\b
  account: (?i)(?:р/с|р\\с|расч[её]тн\w*\s+сч[её]т\w*|сч[её]т\w*|ИИК|ЖСК|IBAN|карт\w*|шот\w*)\s*(?:№|N|номер)?\s*(\d[\d\s-]{8,30}\d)
  card: (?<!\d)(?:\d{4}[\s-]?){3}\d{4}(?!\d)
  phone: (?<![\d\w])(?:\+?[78][\s(-]*\d{3}[\s)-]*\d{3}[\s-]*\d{2}[\s-]*\d{2}|\d{3}[\s-]\d{2}[\s-]\d{2}|8\s?\(\d{4,5}\)\s?\d{2}[\s-]?\d{2}[\s-]?\d{2})(?![\d])
  document: (?i)(?:удостоверени\w*\s+личности|уд\.\s?л\.|паспорт\w*|жеке\s+куәлі\w*|водительск\w*\s+удостоверени\w*|свидетельств\w*\s+о\s+(?:рождении|регистрации\s+транспорт\w*|браке)|туу\s+туралы\s+куәлі\w*|техпаспорт\w*|тех\.\s?паспорт\w*|вид\w*\s+на\s+жительство|доверенност\w*|сенімхат\w*)[^\n\d№]{0,30}?(?:сери[ия]\s*[A-ZА-Я]{1,3}\s*)?(?:№|N|номер\w*|нөмір\w*)?\s*([A-ZА-Я]{0,3}\s?\d[\d\s]{4,15}\d)
  case: (?i)(?<![\w-])\d{4}-\d{2}-\d{2}-\d{1,2}[а-яa-z]?/\d{1,6}(?:\(\d+\))?|(?:дел[оау]|іс)\s*№\s*(\d[\d\w/-]{3,30})
  plate: (?<!\w)(?:\d{3}\s?[A-ZА-Я]{2,3}\s?\d{2}|[A-ZА-Я]\s?\d{3}\s?[A-ZА-Я]{2,3}(?:\s?\d{2})?)(?!\w)
  plate_context: (?i)(?:г/н|г\.н\.|гос\.?\s*номер\w*|государственн\w*\s+(?:регистрационн\w*\s+)?(?:номер|знак)\w*|мемлекеттік\s+нөмір\w*|автомашин\w*|автомобил\w*|транспортн\w*\s+средств\w*|көлік\w*)
  birth: (?i)(?:\d{2}\.\d{2}\.\d{4}|\d{1,2}\s+[а-яё]+\s+\d{4})\s*(?:года?\s+)?(?:г\.\s?р\.|года\s+рождения|г\.р\.|жылы\s+туған|ж\.т\.)|(?:\d{4})\s+(?:года\s+рождения|г\.\s?р\.|жылы\s+туған)|(?:дата\s+рождения|родил\w*|туған\s+күні)\s*:?\s*\d{2}\.\d{2}\.\d{4}
  house_only: (?i)(?<![\w])(?:д\.|дом)\s*№?\s*\d+[\w/-]*(?:,?\s*(?:кв\.|квартир\w*)\s*№?\s*\d+[\w/-]*)|(?<![\w])\d+\s*үй,?\s*\d+\s*пәтер\w*
address:
  street_word: (?i:ул\.|улиц[аеыу]|пр\.|пр-т|проспект\w*|мкр\.?|микрорайон\w*|пер\.|переул\w*|бульвар\w*|б-р|шоссе|трасс\w*|ж/м|жилой\s+массив|наб\.|набережн\w*|пр-д|проезд\w*|туп\.|тупик\w*|с/т|садово\w*\s+товарищест\w*|дачн\w*\s+массив\w*|көш\.|көшесі\w*|даңғылы\w*|даңғ\.|шағын\s+аудан\w*|ш/а|ықшам\s?аудан\w*|тұрғын\s+алап\w*)
  street_name: '[«\"]?[\w\"«».-]+(?:\s(?!(?i:д\.|дом|кв\.)\s?\d)[\w«»\"-]+){0,3}'
  house_part: (?i:,?\s*\d+[\w/-]*\s*(?:үй|пәтер)\w*|,?\s*(?:д\.|дом\w*|уч\.|участ\w*|корп\.|корпус\w*|блок\w*|стр\.|кв\.|квартир\w*|оф\.|офис\w*|ком\.|комн\w*|үй\w*|пәтер\w*)\s*[№N]?\s*\d+[\w/-]*|,?\s*\d+[\w/-]*(?=\s*(?:[,;)]|$)))
