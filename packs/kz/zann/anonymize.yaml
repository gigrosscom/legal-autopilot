# Anonymisation rules for this country's court texts, loaded by country by konsilier/zann/anonymize.py.
# Owner 01.10.2026: before any training use and any transfer abroad (NVIDIA, Kaggle, Hugging Face) personal
# data in court texts becomes labels numbered within a document: [ФИО1], [ИИН1], [АДРЕС1], [ТЕЛ1] …
# labels: label of each kind. letters: alphabet (ru + kk). names: patronymic, surname and case endings, the
# role words that precede a name, words never taken for a surname. national_id: the 12-digit ИИН/БИН — an
# organisation's БИН (5th digit 4–6) is kept only after «БИН» with a legal form nearby; when unsure, masked.
# patterns / address: regular expressions, (?i) = case-insensitive. Recall: tests/test_zann_anonymize.py.
