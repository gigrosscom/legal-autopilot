# Ручной мост eOtinish (решение владельца 01.10.2026; docs/integrations-plan.md, 7.1, этап 1).
#
# Человек подаёт обращение на eotinish.kz сам, от своего имени и своей ЭЦП / eGov Mobile. Мы только подсказываем,
# что выбрать в форме портала, даём готовый текст и PDF, а после подачи ведём срок ответа по номеру и дате, которые
# человек ввёл. Открытого API подачи у eOtinish нет (integrations-plan.md, 3.2).
#
# Ключ записи — получатель шага дела: «forum:<id из forums/registry.yaml>» или «authority:<ключ из pack.yaml>».
#
# Поля:
#   appeal_type — вид обращения по АППК РК, ст. 4 (https://adilet.zan.kz/rus/docs/K2000000350):
#                 statement (заявление) · complaint (жалоба) · proposal (предложение) · request (запрос);
#   recipient   — что искать в поле «Получатель» на портале (название органа; регион человек выбирает сам);
#   category    — тема / категория вопроса, ближайшая к сути обращения;
#   verified_on — дата, когда пункт сверен с формой на eotinish.kz. Пусто → в интерфейсе пометка «названия в списке
#                 портала могут отличаться — выберите ближайшее». TODO(lawyer/ops): сверить с формой портала под ЭЦП.
name: eOtinish
channel: eotinish
portal: https://eotinish.kz
